var SZ = 25;
function canPlace(grid, word, row, col, dir, must) {
  var L = word.length;
  if (row < 0 || col < 0) return false;
  if (dir === "H" && col + L > SZ) return false;
  if (dir === "V" && row + L > SZ) return false;
  if (dir === "H") { if (col > 0 && grid[row][col-1] !== "") return false; if (col+L < SZ && grid[row][col+L] !== "") return false; }
  else { if (row > 0 && grid[row-1][col] !== "") return false; if (row+L < SZ && grid[row+L][col] !== "") return false; }
  var ix = false;
  for (var i = 0; i < L; i++) {
    var r = dir === "H" ? row : row + i, c = dir === "H" ? col + i : col, cell = grid[r][c];
    if (cell !== "") { if (cell.toLowerCase() !== word[i].toLowerCase()) return false; ix = true; }
    else {
      if (dir === "H") { if (r > 0 && grid[r-1][c] !== "") return false; if (r < SZ-1 && grid[r+1][c] !== "") return false; }
      else { if (c > 0 && grid[r][c-1] !== "") return false; if (c < SZ-1 && grid[r][c+1] !== "") return false; }
    }
  }
  return !must || ix;
}
function findSolCells(grid, rows, cols, phrase) {

    var cands = [];
    for (var r = 0; r < rows; r++) for (var c = 0; c < cols; c++)

    if (!cands.length) return null;
    var pick = cands[Math.floor((li/phrase.length)*cands.length)];
    used.add(pick.r+","+pick.c); cells.push({r:pick.r,c:pick.c,letter:grid[pick.r][pick.c],pos:li+1});
  }
  return cells;
}

  placed.push(Object.assign({}, fw, {row:r0,col:c0,dir:"H"}));
  for (var wi = 1; wi < sorted.length; wi++) {
    var wo = sorted[wi], found = false;
    for (var pi = placed.length-1; pi >= 0 && !found; pi--) {
      var pw = placed[pi];

          var row2 = pw.dir === "H" ? pw.row - wj : pw.row + pj;
          var col2 = pw.dir === "H" ? pw.col + pj : pw.col - wj;

// ── Quiz Utils ────────────────────────────────────────────────
function shuffleArr(arr) { return arr.slice().sort(function(){ return Math.random()-0.5; }); }

function makeQuizRound(allWords, usedWords) {
  // Pick 3 words not yet used
  var pool = allWords.filter(function(w){ return !usedWords.has(w.word); });
  if (pool.length < 3) pool = allWords; // fallback
  var picked = shuffleArr(pool).slice(0, 3);
  // Word type detection for matching distractors
  function wType(w) {
    var word = (w.word||'').toLowerCase().replace(/^to /, '');
    var clue = (w.clue||'').toLowerCase();
    // Verb: starts with "to " or German infinitive ends with "en"
    if((w.word||'').toLowerCase().startsWith('to ')) return 'verb';
    if(clue.match(/(en|eln|ern)$/) && !clue.match(/\s/)) return 'verb';
    // Adjective: German clue ends in typical adj endings
    if(clue.match(/(lich|ig|isch|sam|haft|los|voll|bar|reich|arm|frei)$/)) return 'adj';
    if(word.match(/(ful|less|ous|ive|ent|ant|al|ic|ble|tic|ary|ory)$/)) return 'adj';
    // Month = proper noun category
    if(['january','february','march','april','may','june','july','august','september','october','november','december'].indexOf(word)>=0) return 'month';
    return 'noun';
  }
  return picked.map(function(correct) {
    var cType = wType(correct);
    // 1st priority: same type
    var sameType = allWords.filter(function(w){ return w.word !== correct.word && wType(w)===cType; });
    // 2nd priority: any word
    var anyOther = allWords.filter(function(w){ return w.word !== correct.word; });
    var pool = sameType.length >= 3 ? sameType : anyOther;
    var distractors = shuffleArr(pool).slice(0,3);
    var answers = shuffleArr([correct].concat(distractors));
    // Quiz direction: always DE->EN (show German, pick English)  
    return { correct: correct, answers: answers, type: 'de2en' };
  });
}

function makeAllRounds(chapters) {
  var allWords = [];
  chapters.forEach(function(ch){ ch.words.forEach(function(w){ allWords.push(Object.assign({},w,{chapId:ch.id,chapTitle:ch.title,chapColor:ch.color,chapIcon:ch.icon})); }); });
  if (allWords.length < 4) return [];
  var rounds = [], used = new Set();
  for (var i = 0; i < 6; i++) {
    var round = makeQuizRound(allWords, used);
    round.forEach(function(q){ used.add(q.correct.word); });
    rounds.push(round);
  }
  return rounds;
}

    .replace(/[.,!?;:]/g, '')
    .replace(/\s*\([^)]*\)\s*/g, ' ')
    .replace(/[()]/g, '')
    .replace(/\s+/g, ' ')
    .trim();
}

  return core.length > 0 && core[0] === core[0].toUpperCase() && core[0] !== core[0].toLowerCase();
}
// Generate all variants from a word with parentheticals:

      base2.push('');
    } else { base2.push(p); }
  });
  function combo2(opts,idx,cur){
    if(idx>=opts.length){
      var v2=base2.slice();
      opts.forEach(function(o,i){v2[o.pos]=cur[i];});
      var joined=v2.join('').replace(/\s+/g,' ').trim();
      if(joined) variants.push(joined);
      return;
    }
    opts[idx].options.forEach(function(opt){combo2(opts,idx+1,cur.concat([opt]));});
  }
  if(optionals.length>0&&optionals.length<=3) combo2(optionals,0,[]);
  // Deduplicate preserving case
  var seen2={};
  return variants.filter(function(v){if(!v||seen2[v])return false;seen2[v]=1;return true;});
}
function checkAnswer(typed, correct) {
  if (!typed || !typed.trim()) return 'empty';
  var t = typed.trim();
  // Split by / or , and strip ALL whitespace (incl. leading spaces)
  var corrects = correct.split(/[\/]+/).map(function(s){ return s.trim(); }).filter(Boolean);
  // If no / found, also split by comma (but not if word itself contains commas like "erste(r,s)")
  if(corrects.length===1&&corrects[0].indexOf(',')>=0&&!/\([^)]*,[^)]*\)/.test(corrects[0])){
    corrects=corrects[0].split(',').map(function(s){return s.trim();}).filter(Boolean);
  }

  function isToVerb(c){ return /^to\s+/i.test(c.trim()); }
  function stripTo(c){ return c.replace(/^to\s+/i,'').trim(); }

  var allVariants = [];
  corrects.forEach(function(c){ allVariants = allVariants.concat(wordVariants(c)); });

  // CASE-SENSITIVE: exact match required for all words
  for (var i=0;i<allVariants.length;i++) {
    if (allVariants[i] === t) return 'correct';
  }

  // "to-verb" typed without "to" -> partial (e.g. typed "play" for "to play")
  for (var k=0;k<corrects.length;k++) {
    if (isToVerb(corrects[k])) {
      var baseV = stripTo(corrects[k]);
      if (baseV === t) return 'partial';
    }
  }

  // Wrong case: typed matches a variant but with different case -> still wrong
  // (no fallback to case-insensitive)
  return 'wrong';
}

// ── Word Progress (green/yellow/red) ─────────────────────────
function getWordColor(history) {
  if (!history || history.length===0) return 'new';
  var last = history.slice(-4);
  var correct = last.filter(Boolean).length;
  if (last.length>=4 && correct===4) return 'green';
  if (correct===0) return 'red';
  return 'yellow';
}
var COLOR_BG = { green:'#d1fae5', yellow:'#fef9c3', red:'#fee2e2', new:'#f1f5f9' };
var COLOR_FG = { green:'#065f46', yellow:'#92400e', red:'#991b1b', new:'#475569' };
var COLOR_DOT = { green:'#22c55e', yellow:'#f59e0b', red:'#ef4444', new:'#94a3b8' };

// Progress stored in window.storage: key "wp:{userId}:{word}"
var PROGRESS = {
  key: function(uid, word) { return 'wp:' + uid + ':' + word.toLowerCase(); },
  get: function(uid, word) {
    try {
      if (typeof window.storage === "undefined") return Promise.resolve(null);
      return window.storage.get(PROGRESS.key(uid, word))
        .then(function(r) { return r && r.value ? JSON.parse(r.value) : null; })
        .catch(function() { return null; });
    } catch(e) { return Promise.resolve(null); }
  },
  set: function(uid, word, clue, chapId, correct) {
    PROGRESS.get(uid, word).then(function(existing) {
      var data = existing || {history:[]};
      data.history = data.history.concat([correct]).slice(-10);
      data.word = word; data.clue = clue; data.chapId = chapId; data.lastSeen = Date.now();
      try {
        if (typeof window.storage !== "undefined") {
          window.storage.set(PROGRESS.key(uid, word), JSON.stringify(data)).catch(function(){});
        }
      } catch(e) {}
    });
  },
  getAll: function(uid) {
    try {
      if (typeof window.storage === "undefined") return Promise.resolve({});
      return window.storage.list('wp:' + uid + ':')
        .then(function(keys) {
          var promises = (keys.keys || []).map(function(k) {
            return window.storage.get(k).then(function(r) {
              if (r && r.value) { var d = JSON.parse(r.value); return [d.word, d.history]; }
              return null;
            }).catch(function() { return null; });
          });
          return Promise.all(promises).then(function(arr) {
            var map = {};
            arr.filter(Boolean).forEach(function(pair) { map[pair[0]] = pair[1]; });
            return map;
          });
        })
        .catch(function() { return {}; });
    } catch(e) { return Promise.resolve({}); }
  }
};

function selectWorkoutWords(allWords, progressMap, count) {
  var categorized={red:[],yellow:[],green:[],new:[]};
  allWords.forEach(function(w){
    var hist=progressMap[w.word]||[];
    categorized[getWordColor(hist)].push(w);
  });
  var red=shuffleArr(categorized.red.concat(categorized.new));
  var yellow=shuffleArr(categorized.yellow);
  var green=shuffleArr(categorized.green);
  var nRed=Math.min(Math.ceil(count*0.5), red.length);
  var nYellow=Math.min(Math.ceil(count*0.3), yellow.length);
  var nGreen=Math.min(count-nRed-nYellow, green.length);
  var pool=[].concat(red.slice(0,nRed), yellow.slice(0,nYellow), green.slice(0,nGreen));
  if (pool.length<count) {
    var used=new Set(pool.map(function(w){return w.word;}));
    var rest=shuffleArr(allWords.filter(function(w){return !used.has(w.word);}));
    pool=pool.concat(rest.slice(0,count-pool.length));
  }
  return shuffleArr(pool).slice(0,count);
}

function VokabelTrainer({ words, player, onDone, title }) {
  var shuffled = useMemo(function(){ return shuffleArr(words); }, []);
  var [idx, setIdx] = useState(0);
  var [input, setInput] = useState('');
  var [result, setResult] = useState(null); // null | {status, correct, typed}
  var [results, setResults] = useState([]);
  var [direction, setDirection] = useState('de2en'); // de2en or en2de
  var inputRef = useRef();

  useEffect(function(){ if(inputRef.current && !result) inputRef.current.focus(); }, [idx, result]);

  var current = shuffled[idx];
  var question = direction==='de2en' ? current.clue : current.word;
  var answer = direction==='de2en' ? current.word : current.clue;
  var qLabel = direction==='de2en' ? 'Englisch eingeben:' : 'Deutsch eingeben:';

  function submit() {
    if (!input.trim() && !result) return;
    if (result) { // next word
      var nextIdx = idx+1;
      if (nextIdx >= shuffled.length) { setResult(null); setIdx(shuffled.length); return; }
      setIdx(nextIdx); setInput(''); setResult(null);
      setTimeout(function(){ if(inputRef.current) inputRef.current.focus(); }, 50);
      return;
    }
    var status = checkAnswer(input, answer);
    var res = {status:status, correct:answer, typed:input, word:current.word, clue:current.clue, chapId:current.chapterId};
    setResult(res);
    setResults(function(prev){ return prev.concat([res]); });
    if (player && player.id) {
      PROGRESS.set(player.id, current.word, current.clue, current.chapterId, status==='correct');
    }
  }

  if (idx >= shuffled.length) {
    var corr=results.filter(function(r){return r.status==='correct';}).length;
    var part=results.filter(function(r){return r.status==='partial';}).length;
    var wrong=results.filter(function(r){return r.status==='wrong';}).length;
    return (
      <div style={{padding:8}}>
        <div style={{background:'linear-gradient(135deg,'+T+','+TD+')',borderRadius:14,padding:'20px',color:'white',textAlign:'center',marginBottom:14}}>
          <div style={{fontSize:36,marginBottom:6}}>{corr===shuffled.length?'🏆':corr>shuffled.length/2?'👍':'📚'}</div>

        </div>
        {results.map(function(r,i){
          var bg=r.status==='correct'?'#d1fae5':r.status==='partial'?'#fef9c3':'#fee2e2';
          var icon=r.status==='correct'?'✓':r.status==='partial'?'~':'✗';
          return (
            <div key={i} style={{display:'flex',alignItems:'center',gap:8,padding:'7px 10px',marginBottom:3,borderRadius:8,background:bg,fontSize:12}}>
              <span style={{fontSize:16,minWidth:20}}>{icon}</span>
              <span style={{color:G600,minWidth:120}}>{r.clue}</span>
              <span style={{fontWeight:'bold',color:G900,flex:1}}>{r.correct}</span>
              {r.status!=='correct'&&<span style={{color:RE,fontSize:11}}>→ {r.typed}</span>}
            </div>
          );
        })}
        <button onClick={onDone} style={BtnStyle(T,'#fff',{width:'100%',padding:'10px',marginTop:12})}>← Zurück</button>
      </div>
    );
  }

  var resultColor = result ? (result.status==='correct'?GR:result.status==='partial'?AM:RE) : T;
  var resultBg = result ? (result.status==='correct'?'#d1fae5':result.status==='partial'?'#fef9c3':'#fee2e2') : 'white';

  return (
    <div style={{padding:8}}>
      <div style={{display:'flex',alignItems:'center',gap:8,marginBottom:12}}>
        <div style={{flex:1,height:6,background:G200,borderRadius:3,overflow:'hidden'}}>
          <div style={{height:'100%',width:((idx/shuffled.length)*100)+'%',background:T,borderRadius:3}}/>
        </div>
        <span style={{fontSize:11,color:G400}}>{idx+1}/{shuffled.length}</span>
        <button onClick={function(){setDirection(direction==='de2en'?'en2de':'de2en');setInput('');setResult(null);}}
          style={{fontSize:10,padding:'3px 8px',borderRadius:6,border:'1px solid '+G200,background:G50,cursor:'pointer',color:G600}}>
          ⇄ Richtung
        </button>
      </div>
      <div style={{textAlign:'center',padding:'30px 20px',background:resultBg,borderRadius:16,marginBottom:12,border:'2px solid '+(result?resultColor:G200),transition:'all .3s'}}>
        <div style={{fontSize:11,color:G400,marginBottom:8,textTransform:'uppercase',letterSpacing:1}}>{qLabel}</div>
        <div style={{fontSize:28,fontWeight:'bold',color:G900,marginBottom:result?12:0}}>{question}</div>
        {result&&<div style={{fontSize:18,fontWeight:'bold',color:resultColor}}>{result.status==='correct'?'✓ Richtig!':result.status==='partial'?'~ Fast richtig':'✗ Falsch'}</div>}
        {result&&<div style={{fontSize:13,color:G600,marginTop:4}}>Richtig: <strong>{result.correct}</strong>{result.typed&&result.status!=='correct'?'  (du: '+result.typed+')':''}</div>}
      </div>
      {!result&&(
        <div style={{display:'flex',gap:8,marginBottom:12}}>
          <input ref={inputRef} value={input} onChange={function(e){setInput(e.target.value);}}
            onKeyDown={function(e){if(e.key==='Enter')submit();}}
            autoCapitalize="none" autoCorrect="off" autoComplete="off" spellCheck="false"
            placeholder="Antwort eingeben…"
            style={{flex:1,padding:'12px 14px',fontSize:16,border:'2px solid '+T,borderRadius:8,outline:'none'}}/>
          <button onClick={submit} style={BtnStyle(T,'#fff',{padding:'12px 18px',fontSize:15})}>✓</button>
        </div>
      )}
      {result&&(
        <button onClick={submit} style={BtnStyle(T,'#fff',{width:'100%',padding:'12px',fontSize:15})}>
          {idx+1>=shuffled.length?'📊 Auswertung':'→ Nächste'}

    </div>
  );
}

        var p=data.pots||{};
        [1,2,3,4,5].forEach(function(pot){
          (p[pot]||[]).forEach(function(w){
            if(!pots[w.word]||pots[w.word]<pot) pots[w.word]=pot;
            if(pot===5) learned[w.word]=true;
          });
        });
      });
      setLearnedSet(learned);
      setPotMap(pots);
      setLoading(false);
    });

  });
  allWords.forEach(function(w){
    (w.cats||[]).forEach(function(cid){

      catMap[cid].total++;
      if(learnedSet[w.word]) catMap[cid].learned++;

  var catList=Object.keys(catMap).filter(function(k){return catMap[k].total>0;}).map(function(k){return Object.assign({id:k},catMap[k]);});
  catList.sort(function(a,b){return (b.learned/Math.max(b.total,1))-(a.learned/Math.max(a.total,1));});

  function pctColor(p){return p>=80?GR:p>=50?AM:RE;}

  return(
    <div>
      <div style={{background:'linear-gradient(135deg,'+T+','+TD+')',borderRadius:14,padding:16,color:'white',marginBottom:12}}>
        <div style={{display:'flex',justifyContent:'space-between',alignItems:'center',marginBottom:8}}>
          <div>
            <div style={{fontSize:28,fontWeight:'bold'}}>{overallPct}%</div>
            <div style={{fontSize:11,opacity:0.8}}>{totalLearned} / {totalWords} Vokabeln gelernt</div>
          </div>
          <div style={{textAlign:'right'}}>
            <div style={{fontSize:28,fontWeight:'bold'}}>{totalPoints} Pkt</div>
            <div style={{fontSize:11,opacity:0.8}}>Gesamt-Punkte</div>
          </div>
        </div>
        <div style={{height:8,background:'rgba(255,255,255,0.25)',borderRadius:4,overflow:'hidden'}}>
          <div style={{height:'100%',width:overallPct+'%',background:'white',borderRadius:4,transition:'width 0.5s'}}/>
        </div>
        <div style={{display:'flex',gap:10,marginTop:10,fontSize:11,opacity:0.85}}>
          <span>✅ Gelernt: {totalLearned}</span>
          <span>|</span>
          <span>⬜ Offen: {totalWords-totalLearned}</span>
        </div>
      </div>

      <div style={{display:'flex',gap:6,marginBottom:12}}>
        {[['chapters','📚 Kapitel'],['categories','🏷️ Kategorien']].map(function(tab){
          return <button key={tab[0]} onClick={function(){setViewMode(tab[0]);}}
            style={{flex:1,padding:'7px',borderRadius:8,border:'2px solid '+(viewMode===tab[0]?T:G200),background:viewMode===tab[0]?TL:'white',cursor:'pointer',fontWeight:'bold',fontSize:12,color:viewMode===tab[0]?T:G600,touchAction:'manipulation'}}>
            {tab[1]}
          </button>;
        })}
      </div>

      {viewMode==='chapters'&&(
        <div>
          {topLevel.map(function(kap){
            var children=chapters.filter(function(c){return c.parent_id===kap.id;});
            var kapWords=[];
            children.forEach(function(ch){ch.words.forEach(function(w){kapWords.push(w);});});
            var kapTotal=kapWords.length;
            var kapLearned=kapWords.filter(function(w){return !!learnedSet[w.word];}).length;
            var kapPct=kapTotal>0?Math.round(kapLearned/kapTotal*100):0;
            var kapOpen=expanded[kap.id];
            return(
              <div key={kap.id} style={{marginBottom:10,border:'2px solid '+(kapOpen?kap.color||T:G200),borderRadius:12,overflow:'hidden'}}>
                <div onClick={function(){toggle(kap.id);}} style={{display:'flex',alignItems:'center',gap:10,padding:'11px 12px',background:kapOpen?(kap.color||T)+'15':'white',cursor:'pointer'}}>
                  <span style={{fontSize:20}}>{kap.icon}</span>
                  <div style={{flex:1}}>
                    <div style={{fontWeight:'bold',fontSize:13,color:kap.color||T}}>{kap.title}</div>
                    <div style={{fontSize:10,color:G400,marginTop:1}}>{kapLearned}/{kapTotal} Vokabeln gelernt</div>

// ── Quiz Solo ─────────────────────────────────────────────────
function QuizSolo({ chapters, onDone }) {
  var allRounds = useMemo(function(){ return makeAllRounds(chapters); }, []);
  var [roundIdx, setRoundIdx] = useState(0);
  var [qIdx, setQIdx] = useState(0);
  var [chosen, setChosen] = useState(null);
  var [timeLeft, setTimeLeft] = useState(20);
  var [roundWins, setRoundWins] = useState([]);
  var [roundScore, setRoundScore] = useState(0);
  var [totalScore, setTotalScore] = useState(0);
  var [gameOver, setGameOver] = useState(false);
  var [roundOver, setRoundOver] = useState(false);
  var timerRef = useRef(null);

  var currentRound = allRounds[roundIdx] || [];
  var currentQ = currentRound[qIdx];

  function startTimer() {
    clearInterval(timerRef.current);
    setTimeLeft(20);
    timerRef.current = setInterval(function() {
      setTimeLeft(function(t) {
        if (t <= 1) { clearInterval(timerRef.current); handleAnswer(null); return 0; }
        return t - 1;
      });
    }, 1000);
  }

  useEffect(function() {
    if (!gameOver && !roundOver && !chosen) startTimer();
    return function() { clearInterval(timerRef.current); };
  }, [roundIdx, qIdx, roundOver, gameOver]);

  function handleAnswer(word) {
    clearInterval(timerRef.current);
    setChosen(word || "__none__");
    var correct = word === currentQ.correct.word;
    var pts = correct ? (timeLeft > 15 ? 15 : timeLeft > 8 ? 10 : 5) : 0;
    var newRoundScore = roundScore + (correct ? 1 : 0);
    setRoundScore(newRoundScore);
    setTotalScore(function(s) { return s + pts; });

    setTimeout(function() {
      if (qIdx + 1 >= currentRound.length) {
        // End of round
        var newWins = roundWins.concat([newRoundScore]);
        setRoundWins(newWins);
        setRoundScore(0);
        setChosen(null);
        if (roundIdx + 1 >= allRounds.length) {
          setGameOver(true);
        } else {
          setRoundOver(true);
        }
      } else {
        setQIdx(function(i) { return i + 1; });
        setChosen(null);
      }
    }, 1200);
  }

  function nextRound() {
    setRoundIdx(function(i) { return i + 1; });
    setQIdx(0);
    setRoundOver(false);
    setChosen(null);
  }

  if (!allRounds.length) return (
    <div style={{textAlign:"center",padding:40,color:G400}}>
      Zu wenige Vokabeln. Bitte zuerst Kapitel laden.
    </div>
  );

  if (gameOver) {
    var won = roundWins.filter(function(s){ return s >= 2; }).length;
    var lost = roundWins.filter(function(s){ return s < 2; }).length;
    return (
      <div style={{padding:"8px"}}>
        <div style={{background:"linear-gradient(135deg,"+T+","+TD+")",borderRadius:16,padding:"24px 20px",color:"white",textAlign:"center",marginBottom:16}}>
          <div style={{fontSize:40,marginBottom:8}}>{won >= 4 ? "🏆" : won >= 3 ? "🥈" : "📚"}</div>
          <div style={{fontSize:28,fontWeight:"bold",marginBottom:4}}>{totalScore} Punkte</div>
          <div style={{fontSize:14,opacity:0.8}}>{won} von 6 Runden gewonnen</div>
        </div>
        <div style={{marginBottom:12}}>
          {roundWins.map(function(s, i) {
            var win = s >= 2;
            return (
              <div key={i} style={{display:"flex",alignItems:"center",gap:10,padding:"8px 12px",marginBottom:4,borderRadius:8,background:win?"#f0fdf4":"#fef2f2",border:"1px solid "+(win?"#bbf7d0":"#fecaca")}}>
                <span style={{fontSize:16}}>{win ? "✓" : "✗"}</span>
                <span style={{fontSize:13,color:G600}}>Runde {i+1}</span>
                <span style={{marginLeft:"auto",fontWeight:"bold",color:win?T:RE}}>{s}/3 richtig</span>
              </div>
            );
          })}
        </div>
        <button onClick={onDone} style={BtnStyle(T,"#fff",{width:"100%",fontSize:15,padding:"12px"})}>← Zurück zum Menü</button>
      </div>
    );
  }

  if (roundOver) {
    var lastScore = roundWins[roundWins.length - 1] || 0;
    var roundWon = lastScore >= 2;
    return (
      <div style={{padding:"8px"}}>
        <div style={{textAlign:"center",padding:"32px 20px",background:roundWon?"#f0fdf4":"#fef2f2",borderRadius:16,marginBottom:16,border:"2px solid "+(roundWon?"#22c55e":RE)}}>
          <div style={{fontSize:40,marginBottom:8}}>{roundWon ? "🎉" : "😔"}</div>
          <div style={{fontSize:22,fontWeight:"bold",color:roundWon?T:RE,marginBottom:4}}>Runde {roundIdx+1} {roundWon?"gewonnen!":"verloren"}</div>
          <div style={{fontSize:14,color:G600}}>{lastScore}/3 Fragen richtig</div>
        </div>
        <div style={{display:"flex",gap:6,justifyContent:"center",marginBottom:16}}>
          {roundWins.map(function(s, i) {
            return <div key={i} style={{width:28,height:28,borderRadius:"50%",background:s>=2?T:RE,display:"flex",alignItems:"center",justifyContent:"center",color:"white",fontSize:12,fontWeight:"bold"}}>{s}</div>;
          })}
          {Array(6-roundWins.length).fill(0).map(function(_,i){ return <div key={"e"+i} style={{width:28,height:28,borderRadius:"50%",background:G200}}></div>; })}
        </div>
        <button onClick={nextRound} style={BtnStyle(T,"#fff",{width:"100%",fontSize:15,padding:"12px"})}>Runde {roundIdx+2} starten →</button>
      </div>
    );
  }

  var letters = ["A","B","C","D"];
  var isEn2De = currentQ && currentQ.type === "en2de";
  var question = currentQ ? (isEn2De ? currentQ.correct.word : currentQ.correct.clue) : "";
  var questionLabel = isEn2De ? "Was bedeutet dieses englische Wort?" : "Wie heißt das auf Englisch?";

  return (
    <div style={{padding:"8px"}}>
      {/* Progress */}
      <div style={{display:"flex",alignItems:"center",gap:8,marginBottom:12}}>
        <div style={{display:"flex",gap:4}}>
          {allRounds.map(function(_, i) {
            var active = i === roundIdx;
            var done = i < roundIdx;
            var win = done && roundWins[i] >= 2;
            return <div key={i} style={{width:24,height:24,borderRadius:"50%",background:active?T:done?(win?GR:RE):G200,display:"flex",alignItems:"center",justifyContent:"center",color:"white",fontSize:10,fontWeight:"bold"}}>{done?(roundWins[i]>=2?"✓":"✗"):(i+1)}</div>;
          })}
        </div>
        <span style={{fontSize:11,color:G400,marginLeft:"auto"}}>Frage {qIdx+1}/3</span>
      </div>
      {/* Stats bar */}
      <div style={{display:"flex",gap:8,marginBottom:12}}>
        <div style={{flex:1,textAlign:"center",padding:"8px",background:TL,borderRadius:8}}>
          <div style={{fontSize:10,color:G400}}>Punkte</div>
          <div style={{fontSize:18,fontWeight:"bold",color:T}}>{totalScore}</div>
        </div>
        <div style={{flex:1,textAlign:"center",padding:"8px",background:roundScore>=2?"#f0fdf4":G100,borderRadius:8}}>
          <div style={{fontSize:10,color:G400}}>Diese Runde</div>
          <div style={{fontSize:18,fontWeight:"bold",color:roundScore>=2?GR:G600}}>{roundScore}/3</div>
        </div>
        <div style={{flex:1,textAlign:"center",padding:"8px",background:timeLeft<=5?"#fef2f2":G100,borderRadius:8}}>
          <div style={{fontSize:10,color:G400}}>Zeit</div>
          <div style={{fontSize:18,fontWeight:"bold",color:timeLeft<=5?RE:G600}}>{timeLeft}s</div>
        </div>
      </div>
      {/* Chapter badge */}
      {currentQ && (
        <div style={{display:"flex",alignItems:"center",gap:6,marginBottom:8}}>
          <span style={{fontSize:14}}>{currentQ.correct.chapIcon}</span>
          <span style={{fontSize:11,fontWeight:"bold",color:currentQ.correct.chapColor}}>{currentQ.correct.chapTitle}</span>
          <span style={{marginLeft:"auto",fontSize:10,color:G400}}>Runde {roundIdx+1} · Frage {qIdx+1}</span>
        </div>
      )}
      {/* Question */}
      <div style={{textAlign:"center",padding:"28px 20px",background:G50,borderRadius:16,marginBottom:12,border:"2px solid "+G200}}>
        <div style={{fontSize:11,color:G400,marginBottom:8,textTransform:"uppercase",letterSpacing:1}}>{questionLabel}</div>
        <div style={{fontSize:28,fontWeight:"bold",color:G900}}>{question}</div>
      </div>
      {/* Timer bar */}
      <div style={{height:4,background:G200,borderRadius:2,overflow:"hidden",marginBottom:12}}>
        <div style={{height:"100%",width:(timeLeft/20*100)+"%",background:timeLeft<=5?RE:T,borderRadius:2,transition:"width 1s linear"}}></div>
      </div>
      {/* Answers */}
      <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:8}}>
        {currentQ && currentQ.answers.map(function(a, i) {
          var answerText = isEn2De ? a.clue : a.word;
          var isCorrect = a.word === currentQ.correct.word;
          var isChosen = chosen && chosen === a.word;
          var isNone = chosen === "__none__";
          var bg = G50, border2 = "2px solid "+G200, col = G900;
          if (chosen) {
            if (isCorrect) { bg="#d1fae5"; border2="2px solid "+GR; col="#065f46"; }
            else if (isChosen) { bg="#fee2e2"; border2="2px solid "+RE; col="#991b1b"; }
          }
          return (
            <button key={i} onClick={function(){ if (!chosen) handleAnswer(a.word); }} disabled={!!chosen}
              style={{padding:"14px 10px",background:bg,border:border2,borderRadius:12,cursor:chosen?"default":"pointer",textAlign:"left",transition:"all .2s"}}>
              <div style={{display:"flex",alignItems:"center",gap:8}}>
                <span style={{width:24,height:24,borderRadius:"50%",background:chosen&&isCorrect?GR:chosen&&isChosen?RE:G200,color:chosen&&(isCorrect||isChosen)?"white":G600,display:"flex",alignItems:"center",justifyContent:"center",fontSize:12,fontWeight:"bold",flexShrink:0}}>{letters[i]}</span>
                <span style={{fontSize:13,fontWeight:"bold",color:col,lineHeight:1.3}}>{answerText}</span>
              </div>
            </button>
          );
        })}
      </div>
    </div>
  );
}

// ── Quiz Duel (async, turn-based) ─────────────────────────────
// ══════════════════════════════════════════════════════════════
// QUIZ DUELL - User-Auswahl, Reihenfolge, Tie-Handling
// Reihenfolge: Herausgeforderter spielt ZUERST, dann Herausforderer
// ══════════════════════════════════════════════════════════════
function QuizDuel({ chapters, player, onDone, allUsers, allCategories }) {
  var [phase, setPhase] = useState("setup");
  var [selectedKapitel, setSelectedKapitel] = useState([]); // [] = alle
  var [tab, setTab] = useState("users"); // "users" | "code"
  var [gameId, setGameId] = useState(null);
  var [gameData, setGameData] = useState(null);
  var [rounds, setRounds] = useState([]);
  var [currentRoundIdx, setCurrentRoundIdx] = useState(0);
  var [qIdx, setQIdx] = useState(0);
  var [chosen, setChosen] = useState(null);
  var [timeLeft, setTimeLeft] = useState(20);
  var [myAnswers, setMyAnswers] = useState([]);
  var [joinCode, setJoinCode] = useState("");
  var [joinErr, setJoinErr] = useState("");
  var [myCode, setMyCode] = useState("");
  var [roundCat, setRoundCat] = useState(null); // selected category for this round
  var [pendingChallenges, setPendingChallenges] = useState([]);
  var timerRef = useRef(null);
  var pollRef = useRef(null);
  var [userSearch,setUserSearch]=useState(''); // For user list search in setup

  // Poll for game updates and pending challenges
  useEffect(function(){
    if(!player) return;
    function pollAll(){
      // Check pending challenges (games where I'm p2 and status=waiting)
      sbGet('quiz_duels','player2_id=eq.'+player.id+'&status=eq.waiting&select=id,code,player1_name,created_at').then(function(d){
        if(Array.isArray(d)) setPendingChallenges(d);
      });
      // If in active game, poll for updates
      if(gameId){
        sbSingle('quiz_duels','id=eq.'+gameId).then(function(d){
          if(d) setGameData(d);
        });
      }
    }
    pollAll();
    pollRef.current = setInterval(pollAll, 3000);
    return function(){ clearInterval(pollRef.current); };
  },[player, gameId]);

  // Auto-advance when opponent finishes and it's my turn
  useEffect(function(){
    if(!gameData||!gameId) return;
    var isP1 = gameData.player1_id === player.id;
    var myTurn = (isP1 && gameData.whose_turn==='p1')||((!isP1)&&gameData.whose_turn==='p2');
    if(phase==='waiting'&&myTurn) setPhase('readyToPlay');
    if(gameData.status==='finished'&&phase!=='finalResult') setPhase('finalResult');
  },[gameData]);

  function challengeUser(targetUser){
    var chapSrc = selectedKapitel.length>0 ? chapters.filter(function(c){ return selectedKapitel.indexOf(c.id)>=0 || selectedKapitel.indexOf(c.parent_id)>=0; }) : chapters;
    var generated = makeAllRounds(chapSrc);
    var code = Math.random().toString(36).slice(2,8).toUpperCase();
    // whose_turn starts as 'p2' - challenged user plays first
    sbPost('quiz_duels',{
      code:code, player1_id:player.id, player1_name:player.name,
      player2_id:targetUser.id, player2_name:targetUser.name,
      rounds:JSON.stringify(generated),
      round_wins_p1:JSON.stringify([]), round_wins_p2:JSON.stringify([]),
      current_round:0, whose_turn:'p2', status:'waiting',
    }).then(function(res){
      if(res&&!res._err){
        sbSingle('quiz_duels','code=eq.'+code).then(function(d){
          if(d){ setGameId(d.id); setRounds(generated); setMyCode(code); setPhase('waitingForChallengee'); }
        });
      }
    });
  }

  function createOpenGame(){
    var chapSrc = selectedKapitel.length>0 ? chapters.filter(function(c){ return selectedKapitel.indexOf(c.id)>=0 || selectedKapitel.indexOf(c.parent_id)>=0; }) : chapters;
    var generated = makeAllRounds(chapSrc);
    var code = Math.random().toString(36).slice(2,8).toUpperCase();
    sbPost('quiz_duels',{
      code:code, player1_id:player.id, player1_name:player.name,
      rounds:JSON.stringify(generated),
      round_wins_p1:JSON.stringify([]), round_wins_p2:JSON.stringify([]),
      current_round:0, whose_turn:'p2', status:'waiting',
    }).then(function(res){
      if(res&&!res._err){
        sbSingle('quiz_duels','code=eq.'+code).then(function(d){
          if(d){ setGameId(d.id); setRounds(generated); setMyCode(code); setPhase('invite'); }
        });
      }
    });
  }

  function joinByCode(){
    var code = joinCode.trim().toUpperCase();
    if(!code){ setJoinErr('Code eingeben'); return; }
    sbSingle('quiz_duels','code=eq.'+code+'&status=eq.waiting').then(function(d){
      if(!d){ setJoinErr('Spiel nicht gefunden'); return; }
      var parsedRounds = JSON.parse(d.rounds||'[]');
      sbPatch('quiz_duels',{player2_id:player.id, player2_name:player.name, status:'active'},'id=eq.'+d.id).then(function(){
        setRounds(parsedRounds); setGameId(d.id);
        setGameData(Object.assign({},d,{player2_id:player.id,player2_name:player.name,status:'active'}));
        setCurrentRoundIdx(0); setPhase('readyToPlay'); // challenged player goes first
      });
    });
  }

  function acceptChallenge(challenge){
    sbSingle('quiz_duels','id=eq.'+challenge.id).then(function(d){
      if(!d) return;
      var parsedRounds = JSON.parse(d.rounds||'[]');
      sbPatch('quiz_duels',{status:'active'},'id=eq.'+d.id).then(function(){
        setRounds(parsedRounds); setGameId(d.id);
        setGameData(Object.assign({},d,{status:'active'}));
        setCurrentRoundIdx(0); setPhase('readyToPlay');
      });
    });
  }

  function startMyTurn(){
    setQIdx(0); setMyAnswers([]); setChosen(null); setTimeLeft(20);
    // If categories available, player picks one first
    if(allCategories&&allCategories.length>0){
      setPhase('catpick');
    } else {
      setPhase('playing');
    }
  }

  function startWithCat(catId){
    setRoundCat(catId);
    setPhase('playing');
  }

  function handleDuelAnswer(word){
    clearInterval(timerRef.current);
    if(chosen) return;
    setChosen(word||'__none__');
    var correct = word && currentRound && word===currentRound.correct.word;
    var newAnswers = myAnswers.concat([{word:word,correct:!!correct}]);
    setMyAnswers(newAnswers);

    setTimeout(function(){
      if(!currentRoundArr||qIdx+1>=currentRoundArr.length){
        // Round done
        var roundCorrect = newAnswers.filter(function(a){return a.correct;}).length;
        var isP1 = gameData&&gameData.player1_id===player.id;
        var existingWins = JSON.parse((isP1?gameData.round_wins_p1:gameData.round_wins_p2)||'[]');
        var newWins = existingWins.concat([roundCorrect]);
        var otherWins = JSON.parse((isP1?gameData.round_wins_p2:gameData.round_wins_p1)||'[]');
        var update = {};
        if(isP1){
          update.round_wins_p1 = JSON.stringify(newWins);
          update.whose_turn = 'p2';
        } else {
          update.round_wins_p2 = JSON.stringify(newWins);
          update.whose_turn = 'p1';
        }
        // Game over when both have played all 6 rounds
        var totalMe = newWins.length;
        var totalOpp = otherWins.length;
        if(totalMe>=6&&totalOpp>=6) update.status='finished';
        sbPatch('quiz_duels',update,'id=eq.'+gameId).then(function(){
          setMyAnswers(newAnswers);
          setGameData(function(prev){return Object.assign({},prev,update,
            isP1?{round_wins_p1:update.round_wins_p1}:{round_wins_p2:update.round_wins_p2}
          );});
          setPhase('roundResult');
        });
      } else {
        setQIdx(function(i){return i+1;});
        setChosen(null); setTimeLeft(20);
      }
    },1200);
  }

  // Timer
  useEffect(function(){
    if(phase!=='playing'||chosen) return;
    clearInterval(timerRef.current);
    setTimeLeft(20);
    timerRef.current = setInterval(function(){
      setTimeLeft(function(t){
        if(t<=1){clearInterval(timerRef.current);handleDuelAnswer(null);return 0;}
        return t-1;
      });
    },1000);
    return function(){clearInterval(timerRef.current);};
  },[phase,qIdx,chosen]);

  var TOTAL_ROUNDS = 6;
  var currentRoundArr = rounds[currentRoundIdx]||[];
  // All words across all chapters for category filtering in quiz
  var allWordsFlat = (function(){
    var ws=[];
    (chapters||[]).forEach(function(ch){
      if(!ch.parent_id) return;
      (ch.words||[]).forEach(function(w){ ws.push(Object.assign({},w,{chapterId:ch.id})); });
    });
    return ws;
  })();
  var currentRound = currentRoundArr[qIdx];
  var isP1 = gameData&&gameData.player1_id===player.id;
  var myWins = JSON.parse((gameData&&(isP1?gameData.round_wins_p1:gameData.round_wins_p2))||'[]');
  var oppWins = JSON.parse((gameData&&(isP1?gameData.round_wins_p2:gameData.round_wins_p1))||'[]');
  var oppName = gameData?(isP1?gameData.player2_name:gameData.player1_name)||'Gegner':'Gegner';

  // ── SCORE DISPLAY HELPER ──
  function ScoreBoard({compact}){
    var myR=myWins.filter(function(s){return s>=2;}).length;
    var oppR=oppWins.filter(function(s){return s>=2;}).length;
    if(compact) return (
      <div style={{display:'flex',gap:6,alignItems:'center',justifyContent:'center',marginBottom:8}}>
        <span style={{fontWeight:'bold',color:T,fontSize:13}}>{player.name}</span>
        <span style={{fontSize:18,fontWeight:'bold',color:myR>oppR?GR:myR<oppR?RE:AM}}>{myR}</span>
        <span style={{color:G400}}>:</span>
        <span style={{fontSize:18,fontWeight:'bold',color:oppR>myR?GR:oppR<myR?RE:AM}}>{oppR}</span>
        <span style={{fontWeight:'bold',color:G600,fontSize:13}}>{oppName}</span>
        <span style={{marginLeft:8,fontSize:11,color:G400}}>Runde {Math.max(myWins.length,oppWins.length)+1}/{TOTAL_ROUNDS}</span>
      </div>
    );
    return (
      <div style={{padding:'10px 12px',background:G50,borderRadius:10,border:'1px solid '+G200,marginBottom:10}}>
        <div style={{display:'flex',justifyContent:'space-between',alignItems:'center',marginBottom:6}}>
          <span style={{fontWeight:'bold',fontSize:12,color:T}}>{player.name}</span>
          <span style={{fontSize:10,color:G400}}>Runde {Math.max(myWins.length,oppWins.length)}/{TOTAL_ROUNDS}</span>
          <span style={{fontWeight:'bold',fontSize:12,color:G600}}>{oppName}</span>
        </div>
        <div style={{display:'flex',gap:3,justifyContent:'center',flexWrap:'wrap'}}>
          {Array.from({length:TOTAL_ROUNDS}).map(function(_,i){
            var myS=myWins[i]; var oppS=oppWins[i];
            var myWon=myS!==undefined&&myS>=2; var oppWon=oppS!==undefined&&oppS>=2;
            return <div key={i} style={{textAlign:'center',width:36}}>
              <div style={{fontSize:9,color:G400,marginBottom:2}}>R{i+1}</div>
              <div style={{display:'flex',gap:1}}>
                <div style={{flex:1,height:20,borderRadius:'3px 0 0 3px',background:myS!==undefined?(myWon?GR:RE):G200,display:'flex',alignItems:'center',justifyContent:'center',fontSize:9,color:'white',fontWeight:'bold'}}>
                  {myS!==undefined?myS:''}
                </div>
                <div style={{flex:1,height:20,borderRadius:'0 3px 3px 0',background:oppS!==undefined?(oppWon?GR:RE):G200,display:'flex',alignItems:'center',justifyContent:'center',fontSize:9,color:'white',fontWeight:'bold'}}>
                  {oppS!==undefined?oppS:''}
                </div>
              </div>
            </div>;
          })}
        </div>
      </div>
    );
  }

  // ── SETUP SCREEN ──
  if(phase==='setup'){
    var allOtherUsers=(allUsers||[]).filter(function(u){
      if(String(u.id)===String(player.id)) return false;
      if(u.is_admin) return false;
      if(u.is_active===false) return false;
      var n=(u.name||'').toLowerCase();
      if(n.startsWith('testuser_')||n.startsWith('cors_test')||n.startsWith('srcdoc_test')||n==='debuguser123') return false;
      return true;
    });
    var filteredUsers=userSearch.trim()
      ? allOtherUsers.filter(function(u){return u.name.toLowerCase().includes(userSearch.toLowerCase());})
      : allOtherUsers;

    function avatarColor(name){
      var colors=['#0f766e','#7c3aed','#b45309','#0369a1','#be185d','#15803d','#dc2626','#0891b2'];
      var idx=0;for(var i=0;i<name.length;i++)idx=(idx+name.charCodeAt(i))%colors.length;
      return colors[idx];
    }

    var topLevelKapitel = chapters.filter(function(c){return !c.parent_id;}).slice().sort(naturalSort);
    return <div style={{padding:8}}>
      {/* Kapitel-Auswahl */}
      <div style={{marginBottom:12,padding:'10px 12px',background:G50,borderRadius:10,border:'1px solid '+G200}}>
        <div style={{fontWeight:'bold',fontSize:12,color:G600,marginBottom:6}}>
          📚 Kapitel-Auswahl <span style={{fontWeight:'normal',color:G400,fontSize:10}}>({selectedKapitel.length===0?'Alle':selectedKapitel.length+' ausgewählt'})</span>
        </div>
        <div style={{display:'flex',flexWrap:'wrap',gap:5}}>
          <button onClick={function(){setSelectedKapitel([]);}}
            style={{padding:'4px 10px',borderRadius:7,border:'2px solid '+(selectedKapitel.length===0?T:G200),background:selectedKapitel.length===0?TL:'white',cursor:'pointer',fontSize:11,fontWeight:'bold',color:selectedKapitel.length===0?T:G600,touchAction:'manipulation'}}>
            Alle
          </button>
          {topLevelKapitel.map(function(kap){
            var sel=selectedKapitel.indexOf(kap.id)>=0;
            return <button key={kap.id} onClick={function(){
              setSelectedKapitel(function(prev){
                return sel?prev.filter(function(id){return id!==kap.id;}):prev.concat([kap.id]);
              });
            }} style={{padding:'4px 10px',borderRadius:7,border:'2px solid '+(sel?kap.color||T:G200),background:sel?(kap.color||T)+'18':'white',cursor:'pointer',fontSize:11,fontWeight:'bold',color:sel?kap.color||T:G600,touchAction:'manipulation'}}>
              {kap.icon} {kap.title}
            </button>;
          })}
        </div>
      </div>
      {/* Pending challenges - highlighted at top */}
      {pendingChallenges.length>0&&<div style={{padding:12,background:'#fffbeb',borderRadius:12,
        border:'2px solid '+AM,marginBottom:14,boxShadow:'0 2px 8px rgba(245,158,11,0.15)'}}>
        <div style={{fontWeight:'bold',fontSize:13,color:AM,marginBottom:8}}>⚔️ Herausforderungen ({pendingChallenges.length})</div>
        {pendingChallenges.map(function(c){
          var ac2=avatarColor(c.player1_name||'?');
          return <div key={c.id} style={{display:'flex',alignItems:'center',gap:10,padding:'8px 0',borderTop:'1px solid #fde68a'}}>
            <div style={{width:36,height:36,borderRadius:'50%',background:ac2,color:'white',
              display:'flex',alignItems:'center',justifyContent:'center',fontWeight:'bold',fontSize:15,flexShrink:0}}>
              {(c.player1_name||'?')[0].toUpperCase()}
            </div>
            <div style={{flex:1}}>
              <div style={{fontWeight:'bold',fontSize:13,color:G900}}>{c.player1_name}</div>
              <div style={{fontSize:10,color:G400}}>fordert dich heraus!</div>
            </div>
            <button onClick={function(){acceptChallenge(c);}}
              style={{padding:'8px 16px',borderRadius:8,border:'none',background:T,color:'white',
                cursor:'pointer',fontSize:13,fontWeight:'bold',flexShrink:0,touchAction:'manipulation'}}>
              ✓ Annehmen
            </button>
          </div>;
        })}
      </div>}

      {/* Tabs */}
      <div style={{display:'flex',gap:6,marginBottom:12,background:G100,padding:4,borderRadius:10}}>
        <button onClick={function(){setTab('users');}}
          style={{flex:1,padding:'9px',borderRadius:8,fontSize:13,fontWeight:'bold',cursor:'pointer',border:'none',
            background:tab==='users'?'white':G100,color:tab==='users'?T:G600,
            boxShadow:tab==='users'?'0 1px 4px rgba(0,0,0,0.1)':'none'}}>
          👥 Spieler auswählen
        </button>
        <button onClick={function(){setTab('code');}}
          style={{flex:1,padding:'9px',borderRadius:8,fontSize:13,fontWeight:'bold',cursor:'pointer',border:'none',
            background:tab==='code'?'white':G100,color:tab==='code'?T:G600,
            boxShadow:tab==='code'?'0 1px 4px rgba(0,0,0,0.1)':'none'}}>
          🔗 Per Code
        </button>
      </div>

      {/* ── USER SELECTION TAB ── */}
      {tab==='users'&&<div>
        {/* Search bar */}
        <div style={{position:'relative',marginBottom:10}}>
          <span style={{position:'absolute',left:12,top:'50%',transform:'translateY(-50%)',color:G400,fontSize:16,pointerEvents:'none'}}>🔍</span>
          <input value={userSearch} onChange={function(e){setUserSearch(e.target.value);}}
            placeholder="Spieler suchen…"
            style={{width:'100%',padding:'11px 36px 11px 36px',fontSize:15,border:'1.5px solid '+G200,
              borderRadius:10,outline:'none',boxSizing:'border-box',background:'white'}}/>
          {userSearch&&<button onClick={function(){setUserSearch('');}}
            style={{position:'absolute',right:10,top:'50%',transform:'translateY(-50%)',
              border:'none',background:'none',cursor:'pointer',color:G400,fontSize:16}}>✕</button>}
        </div>

        {/* Legend */}
        <div style={{display:'flex',gap:12,fontSize:11,color:G400,marginBottom:8,paddingLeft:2}}>
          <div style={{display:'flex',gap:4,alignItems:'center'}}>
            <div style={{width:8,height:8,borderRadius:'50%',background:GR}}/><span>Aktiv</span>
          </div>
          <div style={{display:'flex',gap:4,alignItems:'center'}}>
            <div style={{width:8,height:8,borderRadius:'50%',background:G400}}/><span>Inaktiv</span>
          </div>
          <span style={{marginLeft:'auto'}}>{filteredUsers.length} Spieler</span>
        </div>

        {/* Player list */}
        {filteredUsers.length===0&&<div style={{textAlign:'center',color:G400,padding:24,fontSize:13}}>
          {userSearch?'Kein Spieler gefunden.':'Keine anderen Spieler vorhanden.'}
        </div>}
        {filteredUsers.map(function(u){
          var isInactive=u.is_active===false;
          var ac=avatarColor(u.name);
          return <div key={u.id} style={{display:'flex',alignItems:'center',gap:12,padding:'12px',marginBottom:6,
            borderRadius:12,border:'1.5px solid '+(isInactive?G200:G100),
            background:isInactive?G50:'white',
            boxShadow:isInactive?'none':'0 1px 4px rgba(0,0,0,0.06)'}}>
            {/* Avatar with status dot */}
            <div style={{position:'relative',flexShrink:0}}>
              <div style={{width:44,height:44,borderRadius:'50%',
                background:isInactive?G400:ac,
                display:'flex',alignItems:'center',justifyContent:'center',
                fontWeight:'bold',color:'white',fontSize:19,
                border:'2px solid '+(isInactive?G200:'white'),
                boxShadow:'0 2px 6px rgba(0,0,0,0.15)'}}>
                {u.name[0].toUpperCase()}
              </div>
              <div style={{position:'absolute',bottom:1,right:1,width:12,height:12,borderRadius:'50%',
                background:isInactive?G400:GR,border:'2.5px solid white'}}/>
            </div>
            {/* Name + status */}
            <div style={{flex:1,minWidth:0}}>
              <div style={{fontWeight:'bold',fontSize:14,color:isInactive?G400:G900,
                overflow:'hidden',textOverflow:'ellipsis',whiteSpace:'nowrap'}}>
                {u.name}
              </div>
              <div style={{fontSize:11,color:isInactive?G400:'#22c55e',fontWeight:'500'}}>
                {isInactive?'⏸ Inaktiv':'● Aktiv'}
              </div>
            </div>
            {/* Challenge button */}
            <button onClick={function(){challengeUser(u);}}
              style={{flexShrink:0,padding:'9px 16px',borderRadius:9,border:'none',
                background:isInactive?G200:T,color:isInactive?G600:'white',
                cursor:'pointer',fontSize:12,fontWeight:'bold',touchAction:'manipulation',
                boxShadow:isInactive?'none':'0 2px 5px rgba(15,118,110,0.3)'}}>
              {isInactive?'✉️ Einladen':'⚔️ Herausfordern'}
            </button>
          </div>;
        })}

        {/* Open game */}
        <button onClick={createOpenGame}
          style={{display:'block',width:'100%',padding:'11px',marginTop:10,borderRadius:10,
            border:'1.5px dashed '+G200,background:G50,cursor:'pointer',
            fontSize:12,color:G600,fontWeight:'bold',touchAction:'manipulation'}}>
          + Offenes Spiel per Code erstellen
        </button>
      </div>}

      {/* ── CODE TAB ── */}
      {tab==='code'&&<div>
        <div style={{padding:16,background:'white',borderRadius:12,border:'1px solid '+G200,marginBottom:10,
          boxShadow:'0 1px 4px rgba(0,0,0,0.06)'}}>
          <div style={{fontWeight:'bold',fontSize:14,color:T,marginBottom:4}}>🎮 Neues Duell erstellen</div>
          <div style={{fontSize:12,color:G400,marginBottom:12}}>Du erhältst einen 6-stelligen Code den du teilen kannst. Dein Gegner spielt als Erster.</div>
          <button onClick={createOpenGame} style={BtnStyle(T,'white',{width:'100%',padding:'12px',fontSize:14})}>
            Duell erstellen & Code teilen
          </button>
        </div>
        <div style={{padding:16,background:'white',borderRadius:12,border:'1px solid '+G200,
          boxShadow:'0 1px 4px rgba(0,0,0,0.06)'}}>
          <div style={{fontWeight:'bold',fontSize:14,color:'#7c3aed',marginBottom:4}}>🔗 Beitreten</div>
          <div style={{fontSize:12,color:G400,marginBottom:12}}>Du spielst zuerst - dann ist der Ersteller dran.</div>
          <div style={{display:'flex',gap:8,alignItems:'center'}}>
            <input value={joinCode} onChange={function(e){setJoinCode(e.target.value.toUpperCase());}}
              placeholder="CODE"
              style={{flex:1,padding:'12px 8px',fontSize:20,border:'2px solid #7c3aed',borderRadius:10,
                outline:'none',letterSpacing:8,textTransform:'uppercase',textAlign:'center',
                fontWeight:'bold',color:'#7c3aed'}}/>
            <button onClick={joinByCode}
              style={{padding:'12px 20px',borderRadius:10,border:'none',
                background:'#7c3aed',color:'white',cursor:'pointer',fontSize:16,fontWeight:'bold',
                touchAction:'manipulation'}}>→</button>
          </div>
          {joinErr&&<div style={{color:RE,fontSize:12,marginTop:8,padding:'6px 10px',
            background:'#fef2f2',borderRadius:7,border:'1px solid #fca5a5'}}>{joinErr}</div>}
        </div>
      </div>}
    </div>;
  }
  // ── WAITING FOR CHALLENGEE ──
  if(phase==='waitingForChallengee'){
    return <div style={{textAlign:'center',padding:32}}>
      <div style={{fontSize:36,marginBottom:12}}>📨</div>
      <h3 style={{color:T,marginBottom:8}}>Herausforderung gesendet!</h3>
      {myCode&&<div style={{fontSize:24,fontWeight:'bold',letterSpacing:6,color:AM,background:G100,padding:'10px 16px',borderRadius:10,display:'inline-block',marginBottom:12}}>{myCode}</div>}
      <p style={{color:G600,fontSize:13,marginBottom:16}}>Warte bis {gameData&&gameData.player2_name||'dein Gegner'} seine Runde gespielt hat - dann bist du dran.</p>
      <div style={{color:G400,fontSize:12,marginBottom:16}}>Der Herausgeforderte spielt immer zuerst.</div>
      <button onClick={function(){sbSingle('quiz_duels','id=eq.'+gameId).then(function(d){if(d){setGameData(d);if(d.whose_turn==='p1'&&d.status==='active'){setPhase('readyToPlay');}}});}}
        style={BtnStyle(G100,G600,{padding:'8px 16px',fontSize:12})}>🔄 Status prüfen</button>
    </div>;
  }

  // ── INVITE (open game) ──
  if(phase==='invite'){
    return <div style={{textAlign:'center',padding:32}}>
      <div style={{fontSize:32,marginBottom:12}}>⏳</div>
      <h3 style={{color:T,marginBottom:8}}>Warte auf Mitspieler…</h3>
      <div style={{fontSize:28,fontWeight:'bold',letterSpacing:8,color:AM,margin:'16px 0',background:G100,padding:'12px 20px',borderRadius:12,display:'inline-block'}}>{myCode}</div>
      <p style={{color:G400,fontSize:13}}>Code teilen - sobald jemand beitritt, kann er zuerst spielen, dann bist du dran.</p>
      <button onClick={function(){sbSingle('quiz_duels','id=eq.'+gameId).then(function(d){if(d){setGameData(d);if(d.whose_turn==='p1'&&d.status==='active')setPhase('readyToPlay');}});}}
        style={BtnStyle(G100,G600,{marginTop:16,padding:'8px 16px',fontSize:12})}>🔄 Aktualisieren</button>
    </div>;
  }

  // ── CATEGORY PICK ──
  if(phase==='catpick'){
    var catsWithWords = (allCategories||[]).filter(function(cat){
      var catWords = allWordsFlat.filter(function(w){return (w.cats||[]).indexOf(cat.id)>=0;});
      return catWords.length>=2;
    });
    // If no categories or none have enough words, skip to playing
    if(catsWithWords.length===0){setPhase('playing');return null;}
    var picker = isP1?player.name:(gameData&&gameData.player2_name)||'Du';
    return <div style={{padding:8,textAlign:'center'}}>
      {gameData&&<ScoreBoard/>}
      <div style={{fontWeight:'bold',fontSize:14,color:T,marginBottom:8}}>
        Wähle eine Kategorie für diese Runde:
      </div>
      <div style={{display:'grid',gridTemplateColumns:'1fr 1fr 1fr',gap:8,marginBottom:8}}>
        {catsWithWords.map(function(cat){
          var cnt=allWordsFlat.filter(function(w){return (w.cats||[]).indexOf(cat.id)>=0;}).length;
          return <button key={cat.id} onClick={function(){startWithCat(cat.id);}}
            style={{padding:'10px 5px',borderRadius:10,border:'2px solid '+G200,background:'white',cursor:'pointer',textAlign:'center',touchAction:'manipulation'}}>
            <div style={{fontSize:18,marginBottom:3}}>{cat.icon}</div>
            <div style={{fontSize:9,fontWeight:'bold',color:G600}}>{cat.name}</div>
            <div style={{fontSize:9,color:G400}}>{cnt} V</div>
          </button>;
        })}
      </div>
      <button onClick={function(){setPhase('playing');}} style={BtnStyle(G100,G600,{padding:'7px',fontSize:11,width:'100%'})}>
        Ohne Kategorie spielen
      </button>
    </div>;
  }

  // ── READY TO PLAY ──
  if(phase==='readyToPlay'){
    var isMyTurnNow = gameData&&((isP1&&gameData.whose_turn==='p1')||(!isP1&&gameData.whose_turn==='p2'));
    return <div style={{padding:8,textAlign:'center'}}>
      {gameData&&<ScoreBoard/>}
      {isMyTurnNow
        ? <div style={{padding:20,background:'#d1fae5',borderRadius:14,marginBottom:12,border:'2px solid '+GR}}>
            <div style={{fontSize:28,marginBottom:8}}>🎯</div>
            <div style={{fontWeight:'bold',fontSize:16,color:'#065f46',marginBottom:4}}>Jetzt bist du dran!</div>
            <div style={{fontSize:12,color:G600}}>Runde {(isP1?myWins:oppWins).length+1} von {TOTAL_ROUNDS}</div>
          </div>
        : <div style={{padding:20,background:'#eff6ff',borderRadius:14,marginBottom:12}}>
            <div style={{fontSize:28,marginBottom:8}}>⏳</div>
            <div style={{fontWeight:'bold',fontSize:14,color:T}}>{oppName} spielt gerade…</div>
          </div>
      }
      {isMyTurnNow&&<button onClick={startMyTurn} style={BtnStyle(T,'white',{width:'100%',padding:'14px',fontSize:16})}>
        ▶ Meine Runde starten
      </button>}
      {!isMyTurnNow&&<button onClick={function(){sbSingle('quiz_duels','id=eq.'+gameId).then(function(d){if(d){setGameData(d);}});}}
        style={BtnStyle(G100,G600,{width:'100%',padding:'10px'})}>🔄 Aktualisieren</button>}
    </div>;
  }

  // ── WAITING ──
  if(phase==='waiting'){
    return <div style={{padding:8,textAlign:'center'}}>
      <ScoreBoard/>
      <div style={{padding:20,background:'#eff6ff',borderRadius:14,marginBottom:12}}>
        <div style={{fontSize:28,marginBottom:8}}>⏳</div>
        <div style={{fontWeight:'bold',fontSize:14,color:T}}>{oppName} ist dran!</div>
        <div style={{fontSize:12,color:G600,marginTop:4}}>Warte bis er fertig ist - dann wirst du benachrichtigt.</div>
      </div>
      <button onClick={function(){sbSingle('quiz_duels','id=eq.'+gameId).then(function(d){
        if(d){setGameData(d);var myT=(isP1&&d.whose_turn==='p1')||(!isP1&&d.whose_turn==='p2');if(myT||d.status==='finished')setPhase('readyToPlay');}
      });}} style={BtnStyle(G100,G600,{width:'100%',padding:'10px'})}>🔄 Aktualisieren</button>
    </div>;
  }

  // ── ROUND RESULT ──
  if(phase==='roundResult'){
    var roundCorrect2=myAnswers.filter(function(a){return a.correct;}).length;
    var roundWon=roundCorrect2>=2;
    var myRoundsTotal=myWins.filter(function(s){return s>=2;}).length;
    var oppRoundsTotal=oppWins.filter(function(s){return s>=2;}).length;
    var gameOver=gameData&&gameData.status==='finished';
    return <div style={{padding:8}}>
      <div style={{textAlign:'center',padding:'20px 16px',background:roundWon?'#f0fdf4':'#fef2f2',borderRadius:14,marginBottom:12,border:'2px solid '+(roundWon?GR:RE)}}>
        <div style={{fontSize:32,marginBottom:6}}>{roundWon?'🎉':'😔'}</div>
        <div style={{fontSize:17,fontWeight:'bold',color:roundWon?'#065f46':RE}}>
          Runde {myWins.length}: {roundCorrect2}/3 richtig - {roundWon?'Gewonnen!':'Verloren'}
        </div>
      </div>
      <ScoreBoard/>
      {!gameOver&&<div style={{padding:10,background:'#eff6ff',borderRadius:10,marginBottom:12,fontSize:13,color:T,textAlign:'center'}}>
        Jetzt ist <strong>{oppName}</strong> dran mit Runde {oppWins.length+1}.
      </div>}
      <button onClick={function(){
        if(gameOver){setPhase('finalResult');return;}
        setPhase('waiting');
        setRoundCat(null);
        setCurrentRoundIdx(function(i){return i+1;});
        setQIdx(0); setMyAnswers([]); setChosen(null);
      }} style={BtnStyle(T,'white',{width:'100%',padding:'12px'})}>
        {gameOver?'🏁 Ergebnis sehen':'OK, Gegner ist dran →'}
      </button>
    </div>;
  }

  // ── FINAL RESULT ──
  if(phase==='finalResult'){
    var myR2=myWins.filter(function(s){return s>=2;}).length;
    var oppR2=oppWins.filter(function(s){return s>=2;}).length;
    var tie=myR2===oppR2;
    var iWon=myR2>oppR2;
    return <div style={{padding:8}}>
      <div style={{borderRadius:16,padding:'24px 16px',textAlign:'center',marginBottom:12,
        background:tie?'linear-gradient(135deg,'+AM+',#f59e0b)':iWon?'linear-gradient(135deg,'+GR+',#16a34a)':'linear-gradient(135deg,'+RE+',#dc2626)',
        color:'white'}}>
        <div style={{fontSize:48,marginBottom:8}}>{tie?'🤝':iWon?'🏆':'😔'}</div>
        <div style={{fontSize:22,fontWeight:'bold',marginBottom:4}}>
          {tie?'Unentschieden!':iWon?'Du hast gewonnen!':'Niederlage'}
        </div>
        <div style={{fontSize:16,opacity:0.9}}>{myR2} : {oppR2} Runden</div>
      </div>
      <ScoreBoard/>
      <div style={{display:'flex',gap:8,marginTop:8}}>
        <button onClick={function(){setPhase('setup');setGameId(null);setGameData(null);setRounds([]);setMyAnswers([]);setMyWins&&null;setCurrentRoundIdx(0);}}
          style={BtnStyle(T,'white',{flex:1,padding:'12px'})}>🔄 Neues Duell</button>
        <button onClick={onDone} style={BtnStyle(G100,G600,{flex:1,padding:'12px'})}>← Menü</button>
      </div>
    </div>;
  }

  // ── PLAYING ──
  // If category selected, override current round's question pool
  var effectiveRound = currentRound;
  if(roundCat && !currentRound) {
    // No pre-generated round - pick from category words on the fly
    var catWords = allWordsFlat.filter(function(w){return (w.cats||[]).indexOf(roundCat)>=0;});
    if(catWords.length>=2){
      var cor=catWords[Math.floor(Math.random()*catWords.length)];
      var dis=allWordsFlat.filter(function(w){return w.word!==cor.word;}).sort(function(){return Math.random()-.5;}).slice(0,3);
      effectiveRound={correct:cor,answers:[cor].concat(dis).sort(function(){return Math.random()-.5;}),type:'de2en'};
    }
  }
  var isEn2De2=effectiveRound&&effectiveRound.type==='en2de';
  var question2=effectiveRound?(isEn2De2?effectiveRound.correct.word:effectiveRound.correct.clue):'';
  var letters2=['A','B','C','D'];

  return <div style={{padding:8}}>
    <ScoreBoard compact={true}/>
    <div style={{display:'flex',gap:8,marginBottom:10}}>
      <div style={{flex:1,textAlign:'center',padding:'8px',background:TL,borderRadius:8}}>
        <div style={{fontSize:9,color:G400}}>Meine Runden</div>
        <div style={{fontSize:17,fontWeight:'bold',color:T}}>{myWins.filter(function(s){return s>=2;}).length}</div>
      </div>
      <div style={{flex:1,textAlign:'center',padding:'8px',background:G100,borderRadius:8}}>
        <div style={{fontSize:9,color:G400}}>{oppName}</div>
        <div style={{fontSize:17,fontWeight:'bold',color:G600}}>{oppWins.filter(function(s){return s>=2;}).length}</div>
      </div>
      <div style={{flex:1,textAlign:'center',padding:'8px',background:timeLeft<=5?'#fef2f2':G100,borderRadius:8}}>
        <div style={{fontSize:9,color:G400}}>Zeit</div>
        <div style={{fontSize:17,fontWeight:'bold',color:timeLeft<=5?RE:G600}}>{timeLeft}s</div>
      </div>
      <div style={{flex:1,textAlign:'center',padding:'8px',background:G100,borderRadius:8}}>
        <div style={{fontSize:9,color:G400}}>Frage</div>
        <div style={{fontSize:17,fontWeight:'bold',color:G600}}>{qIdx+1}/3</div>
      </div>
    </div>
    {currentRound&&<div style={{textAlign:'center',padding:'20px 16px',background:G50,borderRadius:14,marginBottom:10,border:'2px solid '+G200}}>
      <div style={{fontSize:10,color:G400,marginBottom:6,textTransform:'uppercase',letterSpacing:1}}>{isEn2De2?'Was bedeutet auf Deutsch:':'Wie heißt auf Englisch:'}</div>
      <div style={{fontSize:26,fontWeight:'bold',color:G900}}>{question2}</div>
    </div>}
    <div style={{height:4,background:G200,borderRadius:2,overflow:'hidden',marginBottom:10}}>
      <div style={{height:'100%',width:(timeLeft/20*100)+'%',background:timeLeft<=5?RE:T,borderRadius:2,transition:'width 1s linear'}}/>
    </div>
    <div style={{display:'grid',gridTemplateColumns:'1fr 1fr',gap:8}}>
      {effectiveRound&&effectiveRound.answers.map(function(a,i){
        var answerText=isEn2De2?a.clue:a.word;
        var isCorrect=a.word===effectiveRound.correct.word;
        var isChosen=chosen&&chosen===a.word;
        var bg=G50,border3='2px solid '+G200,col3=G900;
        if(chosen){
          if(isCorrect){bg='#d1fae5';border3='2px solid '+GR;col3='#065f46';}
          else if(isChosen){bg='#fee2e2';border3='2px solid '+RE;col3='#991b1b';}
        }
        return <button key={i} onClick={function(){if(!chosen)handleDuelAnswer(a.word,effectiveRound);}} disabled={!!chosen}
          style={{padding:'14px 10px',background:bg,border:border3,borderRadius:12,cursor:chosen?'default':'pointer',textAlign:'left',touchAction:'manipulation'}}>
          <div style={{display:'flex',alignItems:'center',gap:8}}>
            <span style={{width:22,height:22,borderRadius:'50%',background:chosen&&isCorrect?GR:chosen&&isChosen?RE:G200,color:chosen&&(isCorrect||isChosen)?'white':G600,display:'flex',alignItems:'center',justifyContent:'center',fontSize:11,fontWeight:'bold',flexShrink:0}}>{letters2[i]}</span>
            <span style={{fontSize:13,fontWeight:'bold',color:col3,lineHeight:1.3}}>{answerText}</span>
          </div>
        </button>;
      })}
    </div>
  </div>;
}


// ── Puzzle ────────────────────────────────────────────────────
function Puzzle({ data, solPhrase, solMsg, onWord, chapId }) {
  var grid = data.grid, nums = data.nums, across = data.across, down = data.down, rows = data.rows, cols = data.cols, solCells = data.solCells;
  var [user, setUser] = useState(function(){ var u=[]; for(var r=0;r<rows;r++){u.push([]);for(var c=0;c<cols;c++)u[r].push("");} return u; });
  var [checked, setChecked] = useState(false);
  var [cc, setCC] = useState(0);
  var reported = useRef({});
  var refs = useRef({});

  var order = useMemo(function() {
    var o = [];
    for (var r = 0; r < rows; r++) for (var c = 0; c < cols; c++) if ((grid[r]||[])[c] !== "") o.push(r+","+c);
    return o;
  }, [grid, rows, cols]);

  var solMap = useMemo(function() {
    var m = {};
    solCells.forEach(function(s){ m[s.r+","+s.c] = s; });
    return m;
  }, [solCells]);

  var rev = solCells.map(function(s){ return (user[s.r]&&user[s.r][s.c]||"") === s.letter ? s.letter : null; });
  var solOk = solCells.length > 0 && rev.every(function(l){ return l !== null; });

  function focusNext(r, c) { var i = order.indexOf(r+","+c); if (i < order.length-1 && refs.current[order[i+1]]) refs.current[order[i+1]].focus(); }
  function focusPrev(r, c) { var i = order.indexOf(r+","+c); if (i > 0 && refs.current[order[i-1]]) refs.current[order[i-1]].focus(); }

  var setCell = useCallback(function(r, c, v) {
    var ch = v.replace(/[^A-Za-z]/g,"").slice(-1);
    setUser(function(u){ var n=u.map(function(row){return row.slice();}); n[r][c]=ch; return n; });
    setChecked(false);
    if (ch) setTimeout(function(){ focusNext(r, c); }, 0);
  }, []);

  var handleKD = useCallback(function(r, c, e) {
    if (e.key==="Backspace" && !(user[r]&&user[r][c])) { e.preventDefault(); focusPrev(r,c); }
    else if (e.key==="ArrowRight" && (grid[r]||[])[c+1]!==undefined && (grid[r]||[])[c+1]!=="") { if(refs.current[r+","+(c+1)]) refs.current[r+","+(c+1)].focus(); }
    else if (e.key==="ArrowLeft" && (grid[r]||[])[c-1]!==undefined && (grid[r]||[])[c-1]!=="") { if(refs.current[r+","+(c-1)]) refs.current[r+","+(c-1)].focus(); }
    else if (e.key==="ArrowDown" && (grid[r+1]||[])[c]!=="") { if(refs.current[(r+1)+","+c]) refs.current[(r+1)+","+c].focus(); }
    else if (e.key==="ArrowUp" && (grid[r-1]||[])[c]!=="") { if(refs.current[(r-1)+","+c]) refs.current[(r-1)+","+c].focus(); }
  }, [user, grid]);

  function report(word, clue, uGrid, cnt) {
    if (reported.current[word]) return;
    var p = data.placed.find(function(pl){ return pl.word===word; });
    if (!p) return;
    var typed = "";
    for (var i=0;i<word.length;i++){ var r2=p.dir==="H"?p.row:p.row+i,c2=p.dir==="H"?p.col+i:p.col; typed+=(uGrid[r2]&&uGrid[r2][c2])||""; }
    reported.current[word] = true;
    if (onWord) onWord({word:word,clue:clue,correct:typed===word,typedAnswer:typed,checkCount:cnt,chapId:chapId});
  }

  function check() { var n=cc+1; setCC(n); setChecked(true); [].concat(across,down).forEach(function(x){ report(x.word,x.clue,user,n); }); }
  function finish() { [].concat(across,down).forEach(function(x){ report(x.word,x.clue,user,cc); }); }

  var corr=0,tot=0;
  if (checked) for(var r=0;r<rows;r++) for(var c=0;c<cols;c++) if((grid[r]||[])[c]!==""){tot++;if(user[r]&&user[r][c]===(grid[r]||[])[c])corr++;}
  var CS = 26;

  return (
    <div>
      <div style={{fontSize:11,color:G600,textAlign:"center",marginBottom:8,padding:"4px 8px",background:"#f0f9ff",borderRadius:6,border:"1px solid #bae6fd"}}>
        ℹ️ Monate → <strong>Großbuchstaben</strong> · alle anderen → <strong>Kleinbuchstaben</strong>
      </div>
      <div style={{overflowX:"auto",marginBottom:10}}>
        <table style={{borderCollapse:"collapse",margin:"0 auto"}}>
          <tbody>
            {Array(rows).fill(0).map(function(_,r){
              return (
                <tr key={r}>
                  {Array(cols).fill(0).map(function(_,c){
                    var letter=(grid[r]||[])[c]||"",isB=letter==="";
                    var num=nums[r+","+c],sol=solMap[r+","+c],uv=user[r]&&user[r][c]||"";
                    var bg="white";
                    if(!isB&&sol) bg="#fffbeb";
                    if(checked&&!isB&&uv) bg=uv===letter?"#bbf7d0":"#fecaca";
                    return (
                      <td key={c} style={{width:CS,height:CS,padding:0,border:isB?"none":"1px solid #555",background:isB?"#18181b":bg,position:"relative"}}>
                        {!isB && (
                          <span>
                            {num && <span style={{position:"absolute",top:1,left:2,fontSize:6,color:"#444",lineHeight:1,pointerEvents:"none",zIndex:3}}>{num}</span>}
                            {sol && <span style={{position:"absolute",bottom:1,right:1,width:9,height:9,borderRadius:"50%",background:AM,color:"white",fontSize:5,fontWeight:"bold",display:"flex",alignItems:"center",justifyContent:"center",pointerEvents:"none",zIndex:3}}>{sol.pos}</span>}
                            <input
                              ref={function(el){ if(el) refs.current[r+","+c]=el; else delete refs.current[r+","+c]; }}
                              type="text" inputMode="text" autoCapitalize="none" autoCorrect="off" autoComplete="off" spellCheck="false" value={uv}
                              onChange={function(e){ setCell(r,c,e.target.value); }}
                              onKeyDown={function(e){ handleKD(r,c,e); }}
                              style={{position:"absolute",inset:0,width:"100%",height:"100%",border:"none",outline:"none",background:"transparent",textAlign:"center",fontSize:12,fontWeight:"bold",color:"#111",paddingTop:num?5:0,boxSizing:"border-box",cursor:"text"}}
                            />
                          </span>
                        )}
                      </td>
                    );
                  })}
                </tr>
              );
            })}
          </tbody>
        </table>
      </div>
      {solCells.length > 0 && (
        <div style={{margin:"8px 0",padding:"8px 12px",background:solOk?"#fef9c3":"#f8fafc",border:"2px solid "+(solOk?AM:G200),borderRadius:8}}>
          <div style={{fontSize:10,color:G400,marginBottom:5,fontWeight:"bold",textTransform:"uppercase",letterSpacing:1}}>🔑 Lösungswort</div>
          <div style={{display:"flex",gap:3,flexWrap:"wrap"}}>
            {solCells.map(function(sc,i){
              var r2=rev[i];
              return (
                <div key={i} style={{display:"flex",flexDirection:"column",alignItems:"center",gap:1}}>
                  <div style={{width:24,height:24,border:"2px solid "+(r2?AM:G200),borderRadius:4,background:r2?"#fef3c7":"#f1f5f9",display:"flex",alignItems:"center",justifyContent:"center",fontSize:13,fontWeight:"bold",color:G900}}>{r2||""}</div>
                  <span style={{fontSize:7,color:AM,fontWeight:"bold"}}>{sc.pos}</span>
                </div>
              );
            })}
          </div>
          {solOk && <div style={{marginTop:8,padding:"6px 10px",background:"#fef08a",borderRadius:6,fontSize:14,fontWeight:"bold",color:"#92400e",textAlign:"center"}}>{solMsg}</div>}
        </div>
      )}
      <div style={{display:"flex",gap:8,justifyContent:"center",marginBottom:8,flexWrap:"wrap"}}>
        <button onClick={check} style={BtnStyle(T)}>✓ Prüfen</button>
        <button onClick={function(){ setUser(function(){ var u=[]; for(var r=0;r<rows;r++){u.push([]);for(var c=0;c<cols;c++)u[r].push("");} return u; }); setChecked(false); }} style={BtnStyle(G400)}>↺ Reset</button>
        <button onClick={finish} style={BtnStyle("#7c3aed")}>✅ Abschließen</button>
      </div>
      {checked && <div style={{textAlign:"center",marginBottom:8,padding:"6px 10px",borderRadius:6,fontWeight:"bold",fontSize:13,background:corr===tot?"#d1fae5":"#fee2e2",color:corr===tot?"#065f46":"#991b1b"}}>{corr}/{tot} richtig {corr===tot?"🎉 Perfekt!":""} · Prüfen: {cc}×</div>}
      <div style={{display:"flex",gap:12,flexWrap:"wrap",marginTop:4}}>
        {[["→ Waagerecht",across],["↓ Senkrecht",down]].map(function(pair){
          var t=pair[0], clues=pair[1];
          return (
            <div key={t} style={{flex:"1 1 160px",minWidth:0}}>
              <div style={{fontWeight:"bold",fontSize:12,color:T,borderBottom:"2px solid "+T,marginBottom:4,paddingBottom:2}}>{t}</div>
              {clues.map(function(item){
                return (
                  <div key={item.n} style={{fontSize:11,marginBottom:2,display:"flex",gap:4,alignItems:"baseline"}}>
                    <strong style={{minWidth:18,color:TD}}>{item.n}.</strong>
                    <span style={{color:G600}}>{item.clue}</span>
                    <span style={{marginLeft:"auto",fontSize:9,color:G400}}>({item.word.length})</span>
                  </div>
                );
              })}
            </div>
          );
        })}
      </div>
    </div>
  );
}

// ── Word Selector ─────────────────────────────────────────────
function WordSelector({ chapters, onStart, mode }) {
  var [openCh, setOpenCh] = useState(null);
  var [sel, setSel] = useState({});
  var [filter, setFilter] = useState("all");

  var total = Object.values(sel).reduce(function(s,set){ return s+set.size; }, 0);

  function getFiltered(ch) { return filter==="important" ? ch.words.filter(function(w){return w.important;}) : ch.words; }

  function togAll(ch) {
    setSel(function(prev){
      var n = Object.assign({}, prev);
      var fi = getFiltered(ch);
      var cur = n[ch.id] || new Set();
      var allS = fi.every(function(w){ return cur.has(ch.words.indexOf(w)); });
      var next = new Set(cur);
      if (allS) fi.forEach(function(w){ next.delete(ch.words.indexOf(w)); });
      else fi.forEach(function(w){ next.add(ch.words.indexOf(w)); });
      n[ch.id] = next;
      return n;
    });
  }

  function togW(chId, idx) {
    setSel(function(prev){
      var n = Object.assign({}, prev);
      var cur = new Set(n[chId] || []);
      if (cur.has(idx)) cur.delete(idx); else cur.add(idx);
      n[chId] = cur;
      return n;
    });
  }

  function getWords() {
    var w = [];
    chapters.forEach(function(ch){
      var s = sel[ch.id] || new Set();
      s.forEach(function(i){ if(ch.words[i]) w.push(Object.assign({},ch.words[i],{chapterId:ch.id})); });
    });
    return w;
  }

  return (
    <div>
      <div style={{display:"flex",gap:6,marginBottom:12,padding:"8px 12px",background:G50,borderRadius:10,alignItems:"center",flexWrap:"wrap"}}>
        <span style={{fontSize:12,color:G600,fontWeight:"bold"}}>Anzeigen:</span>
        {[["all","📚 Alle"],["important","⭐ Nur fett"]].map(function(pair){
          return <button key={pair[0]} onClick={function(){ setFilter(pair[0]); }} style={{padding:"5px 12px",borderRadius:20,fontSize:12,fontWeight:"bold",background:filter===pair[0]?T:"white",color:filter===pair[0]?"white":G600,border:"1.5px solid "+(filter===pair[0]?T:G200),cursor:"pointer"}}>{pair[1]}</button>;
        })}
      </div>
      <div style={{marginBottom:12,padding:"10px 14px",background:TL,borderRadius:10,display:"flex",justifyContent:"space-between",alignItems:"center"}}>
        <span style={{fontSize:13,color:T,fontWeight:"bold"}}>{total} Vokabeln gewählt</span>
        <button onClick={function(){ if(total>=3) onStart(getWords()); }} disabled={total<3} style={BtnStyle(total>=3?T:G400,"#fff",{padding:"6px 14px",opacity:total<3?0.5:1})}>
          {mode==="battle"?"⚔️ Rätsel-Duell":"🎯 Lernen starten"}
        </button>
      </div>
      {total < 3 && <p style={{fontSize:11,color:G400,textAlign:"center",marginBottom:8}}>Mindestens 3 Vokabeln auswählen</p>}
      {chapters.map(function(ch){
        var s = sel[ch.id] || new Set();
        var fi = getFiltered(ch);
        var allS = fi.length>0 && fi.every(function(w){ return s.has(ch.words.indexOf(w)); });
        var someS = fi.some(function(w){ return s.has(ch.words.indexOf(w)); }) && !allS;
        var open = openCh === ch.id;
        return (
          <div key={ch.id} style={{marginBottom:8,border:"2px solid "+(s.size>0?ch.color:G200),borderRadius:12,overflow:"hidden"}}>
            <div style={{display:"flex",alignItems:"center",gap:10,padding:"12px 14px",background:s.size>0?(ch.color+"15"):"white",cursor:"pointer"}} onClick={function(){ setOpenCh(open?null:ch.id); }}>
              <span style={{fontSize:20}}>{ch.icon}</span>
              <div style={{flex:1}}>
                <div style={{fontWeight:"bold",fontSize:13,color:ch.color}}>{ch.title}</div>
                <div style={{fontSize:11,color:G400}}>{ch.words.length} gesamt · {ch.words.filter(function(w){return w.important;}).length} ⭐ · {s.size} gewählt</div>
              </div>
