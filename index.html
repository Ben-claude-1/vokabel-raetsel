          {!prog.length&&<div style={{padding:'8px 12px',fontSize:12,color:G400}}>Noch kein Spieler gestartet</div>}
          {prog.map(function(p){
            var user2=(allUsers||[]).find(function(u){return String(u.id)===String(p.player_id);});
            var d2={}; try{d2=JSON.parse(p.data||'{}');}catch(e){}
            var pct2=lsPercent(d2,gradeSettings);
            var gr2=lsGrade(pct2,gradeSettings);
            var grColor2=gr2?({'1':'#22c55e','2':'#84cc16','3':'#f59e0b','4':'#f97316','5':'#ef4444'}[String(gr2)]||G400):G400;
            return <div key={p.player_id} onClick={function(){setSelectedUser({userId:p.player_id,runId:run.id,data:d2});}}
              style={{display:'flex',alignItems:'center',gap:8,padding:'9px 12px',borderTop:'1px solid '+G100,cursor:'pointer'}}
              onMouseOver={function(e){e.currentTarget.style.background=G50;}}

              <div style={{flex:1}}>
                <div style={{fontSize:13,fontWeight:'bold',color:G900}}>{user2?user2.name:p.player_id.slice(0,8)}</div>

}

// UPLOAD-VORSCHAU mit bearbeitbaren Vokabeln
// ══════════════════════════════════════════════════════════════
function UploadPreview({ draft, onSave, onCancel, chapters, chapterMode, targetChapter, setTargetChapter, targetKapitel, setTargetKapitel, allCategories, dTitle, setDTitle, dColor, setDColor, dIcon, setDIcon }) {
  var existingCh2 = chapterMode==='existing'&&targetChapter ? chapters.find(function(c){return c.id===targetChapter;}) : null;
  var existWordsSet = existingCh2 ? new Set((existingCh2.words||[]).map(function(w){return w.word.toLowerCase();})) : new Set();
  var existSentsSet = existingCh2 ? new Set((existingCh2.sentences||[]).map(function(s){return s.text.toLowerCase().trim();})) : new Set();
  var initWords = existingCh2 ? (draft.words||[]).filter(function(w){return !existWordsSet.has(w.word.toLowerCase());}) : (draft.words||[]);
  var initSents = existingCh2 ? (draft.sentences||[]).filter(function(s){return !existSentsSet.has(s.text.toLowerCase().trim());}) : (draft.sentences||[]);
  var [words,setWords]=useState(initWords);
  var [sentences,setSentences]=useState(initSents);
  var [tab,setTab]=useState('words');

  function toggleImportant(i,isSent){
    if(isSent){
      var ns=sentences.slice();ns[i]=Object.assign({},ns[i],{important:!ns[i].important});setSentences(ns);
    } else {
      var nw=words.slice();nw[i]=Object.assign({},nw[i],{important:!nw[i].important});setWords(nw);
    }
  }
  function editWord(i,field,val){var nw=words.slice();nw[i]=Object.assign({},nw[i]);nw[i][field]=val;setWords(nw);}
  function editSent(i,field,val){var ns=sentences.slice();ns[i]=Object.assign({},ns[i]);ns[i][field]=val;setSentences(ns);}
  function removeWord(i){setWords(words.filter(function(_,j){return j!==i;}));}
  function removeSent(i){setSentences(sentences.filter(function(_,j){return j!==i;}));}
  function addWord(){setWords(words.concat([{word:'',clue:'',important:false}]));}
  function addSent(){setSentences(sentences.concat([{text:'',translation:'',important:false}]));}

  var topLevel=chapters.filter(function(c){return !c.parent_id;}).slice().sort(naturalSort);
  var topicChaps=chapters.filter(function(c){return !!c.parent_id;});

  return <div>
    {/* Mode + name */}
    <div style={{padding:12,background:G50,borderRadius:10,border:'1px solid '+G200,marginBottom:10}}>
      {chapterMode==='new'&&<div style={{marginBottom:8}}>
        <div style={{fontSize:11,color:G600,marginBottom:3}}>Name des neuen Themenbereichs:</div>
        <input value={dTitle} onChange={function(e){setDTitle(e.target.value);}} placeholder="z.B. Shopping & Kleidung"
          style={{width:'100%',padding:'7px 10px',fontSize:16,border:'1.5px solid '+T,borderRadius:8,outline:'none',marginBottom:6}}/>
        <div style={{fontSize:11,color:G600,marginBottom:3}}>Übergeordnetes Kapitel:</div>
        <select key="kap_select" value={targetKapitel||''} onChange={function(e){setTargetKapitel&&setTargetKapitel(e.target.value);setTargetChapter(e.target.value);}}
          style={{width:'100%',padding:'7px 10px',fontSize:13,border:'1.5px solid '+T,borderRadius:8,outline:'none',background:'white'}}>
          <option value=''>-- Kapitel auswählen --</option>
          {topLevel.map(function(c){return <option key={c.id} value={c.id}>{c.icon} {c.title}</option>;})}
        </select>
        <div style={{display:'flex',gap:8,marginTop:6}}>
          <input value={dIcon} onChange={function(e){setDIcon(e.target.value);}} placeholder="📚"
            style={{width:46,padding:'6px',fontSize:16,border:'1.5px solid '+G200,borderRadius:8,textAlign:'center'}}/>
          <input type="color" value={dColor} onChange={function(e){setDColor(e.target.value);}}
            style={{width:42,height:36,border:'none',borderRadius:8,cursor:'pointer',padding:2}}/>
        </div>
      </div>}
      {chapterMode==='existing'&&<div>
        <div style={{fontSize:11,color:G600,marginBottom:3}}>Zu bestehendem Themenbereich:</div>
        <select value={targetChapter} onChange={function(e){setTargetChapter(e.target.value);}}
          style={{width:'100%',padding:'7px 10px',fontSize:13,border:'1.5px solid '+T,borderRadius:8,outline:'none',background:'white'}}>
          <option value=''>-- Themenbereich auswählen --</option>
          {topicChaps.map(function(c){
            var par=chapters.find(function(p){return p.id===c.parent_id;});
            return <option key={c.id} value={c.id}>{par?par.icon+' '+par.title+' → ':''}{c.icon} {c.title}</option>;
          })}
        </select>
      </div>}
    </div>

    {/* Stats + duplicate info */}
    {existingCh2&&(draft.words||[]).length>words.length&&(
      <div style={{padding:'6px 10px',background:'#fef9c3',borderRadius:8,border:'1px solid #fde68a',marginBottom:8,fontSize:11,color:'#92400e'}}>
        ⚡ {(draft.words||[]).length-words.length} bereits vorhandene Vokabeln ausgeblendet
        {(draft.sentences||[]).length-sentences.length>0?' · '+(((draft.sentences||[]).length-sentences.length)+' Sätze'):''}
      </div>
    )}
    <div style={{display:'flex',gap:8,marginBottom:10}}>
      {[['words','📝 Vokabeln',words.length],['sentences','💬 Sätze',sentences.length]].map(function(x){
        return <button key={x[0]} onClick={function(){setTab(x[0]);}}
          style={{flex:1,padding:'8px',borderRadius:8,border:'2px solid '+(tab===x[0]?T:G200),background:tab===x[0]?TL:'white',cursor:'pointer',fontSize:12,fontWeight:'bold',color:tab===x[0]?T:G600}}>
          {x[1]} ({x[2]}) {tab===x[0]&&<span style={{color:G400,fontWeight:'normal',fontSize:10}}> - ⭐ {(x[0]==='words'?words:sentences).filter(function(i){return i.important;}).length} fett</span>}
        </button>;
      })}
    </div>

    {/* Word editor */}
    {tab==='words'&&<div>
      {(function(){
        var TYPES=['verb','noun','adjective','phrase','other'];
        var TYPE_LABELS={verb:'Verben',noun:'Substantive',adjective:'Adjektive',phrase:'Phrasen',other:'Sonstiges'};
        var TYPE_BG={verb:'#dbeafe',noun:'#f3e8ff',adjective:'#d1fae5',phrase:'#fff7ed',other:'#f1f5f9'};
        var TYPE_COLOR={verb:'#1e40af',noun:'#7c3aed',adjective:'#065f46',phrase:'#c2410c',other:'#475569'};
        // Group words by type
        var groups={};
        words.forEach(function(w,i){
          var t=w.type||'other';
          if(!groups[t])groups[t]=[];
          groups[t].push({w:w,i:i});
        });
        var sections=[];
        TYPES.forEach(function(t){
          if(!groups[t]||!groups[t].length) return;
          sections.push(
            <div key={t} style={{marginBottom:10}}>
              <div style={{fontSize:11,fontWeight:'bold',color:TYPE_COLOR[t],background:TYPE_BG[t],padding:'3px 8px',borderRadius:6,marginBottom:4,display:'inline-block'}}>
                {TYPE_LABELS[t]} ({groups[t].length})
              </div>
              {groups[t].map(function(item){
                var w=item.w; var i=item.i;
                return <div key={i} style={{display:'flex',gap:4,alignItems:'center',marginBottom:3,padding:'5px 8px',borderRadius:8,background:w.important?'#fef3c7':G50,border:'1px solid '+(w.important?AM:G200)}}>
                  <div onClick={function(){toggleImportant(i,false);}} title="Fett/wichtig" style={{width:22,height:22,borderRadius:4,border:'2px solid '+(w.important?AM:G200),background:w.important?AM:'white',cursor:'pointer',display:'flex',alignItems:'center',justifyContent:'center',flexShrink:0}}>
                    {w.important&&<span style={{color:'white',fontSize:11,fontWeight:'bold'}}>⭐</span>}
                  </div>
                  <input value={w.word} onChange={function(e){editWord(i,'word',e.target.value);}}
                    style={{flex:1,padding:'3px 6px',fontSize:12,border:'1px solid '+G200,borderRadius:5,outline:'none',minWidth:60}}/>
                  <span style={{color:G400,fontSize:11}}>=</span>
                  <input value={w.clue} onChange={function(e){editWord(i,'clue',e.target.value);}}
                    style={{flex:1,padding:'3px 6px',fontSize:12,border:'1px solid '+G200,borderRadius:5,outline:'none',minWidth:60}}/>
                  <select value={w.type||'other'} onChange={function(e){editWord(i,'type',e.target.value);}}
                    style={{fontSize:10,padding:'2px 3px',border:'1px solid '+G200,borderRadius:4,background:TYPE_BG[w.type||'other'],color:TYPE_COLOR[w.type||'other']}}>
                    <option value="verb">Verb</option>
                    <option value="noun">Subst.</option>
                    <option value="adjective">Adj.</option>
                    <option value="phrase">Phrase</option>
                    <option value="other">Sonst.</option>
                  </select>
                  <span style={{flex:2,minWidth:80}}>
                    <CategoryPicker
                      wordCats={w.cats||[]}
                      onChange={function(newCats){editWord(i,'cats',newCats);}}
                      allCategories={allCategories||[]}
                    />
                  </span>
                  <button onClick={function(){removeWord(i);}} style={{width:22,height:22,borderRadius:4,border:'none',background:'#fef2f2',color:RE,cursor:'pointer',fontSize:12,flexShrink:0}}>✕</button>
                </div>;
              })}
            </div>
          );
        });
        return <div>{sections}</div>;
      })()}
      <button onClick={addWord} style={BtnStyle(G100,G600,{width:'100%',padding:'7px',fontSize:12,marginTop:4})}>+ Vokabel hinzufügen</button>
    </div>}

    {/* Sentence editor */}
    {tab==='sentences'&&<div>
      {sentences.map(function(s,i){return <div key={i} style={{marginBottom:6,padding:'8px',borderRadius:8,background:s.important?'#f0fdf4':G50,border:'1px solid '+(s.important?GR:G200)}}>
        <div style={{display:'flex',gap:4,alignItems:'center',marginBottom:4}}>
          <div onClick={function(){toggleImportant(i,true);}} title="Wichtig (fett)" style={{width:24,height:24,borderRadius:4,border:'2px solid '+(s.important?GR:G200),background:s.important?GR:'white',cursor:'pointer',display:'flex',alignItems:'center',justifyContent:'center',flexShrink:0}}>
            {s.important&&<span style={{color:'white',fontSize:12}}>⭐</span>}
          </div>
          <span style={{fontSize:10,color:G400}}>{s.important?'Wichtig (fett)':'Weniger wichtig'}</span>
          <button onClick={function(){removeSent(i);}} style={{marginLeft:'auto',width:24,height:24,borderRadius:4,border:'none',background:'#fef2f2',color:RE,cursor:'pointer',fontSize:14}}>✕</button>
        </div>
        <input value={s.text} onChange={function(e){editSent(i,'text',e.target.value);}}
          placeholder="Englischer Satz…"
          style={{width:'100%',padding:'4px 6px',fontSize:13,border:'1px solid '+G200,borderRadius:6,outline:'none',marginBottom:3}}/>
        <input value={s.translation} onChange={function(e){editSent(i,'translation',e.target.value);}}
          placeholder="Deutsche Übersetzung…"
          style={{width:'100%',padding:'4px 6px',fontSize:13,border:'1px solid '+G200,borderRadius:6,outline:'none'}}/>
      </div>;})}
      <button onClick={addSent} style={BtnStyle(G100,G600,{width:'100%',padding:'7px',fontSize:12,marginTop:4})}>+ Satz hinzufügen</button>
    </div>}

    <div style={{display:'flex',gap:8,marginTop:12}}>
      <button onClick={function(){onSave({words,sentences});}} style={BtnStyle(T,'white',{flex:2,padding:'12px'})}>✅ Speichern</button>
      <button onClick={onCancel} style={BtnStyle(G100,G600,{flex:1,padding:'12px'})}>✕ Abbrechen</button>
    </div>
  </div>;
}

// KATEGORIE-SYSTEM & VOKABEL-SUCHE
// ══════════════════════════════════════════════════════════════
function VocabSearch({ chapters, player, allCategories, onCategoryChange }) {
  var [query,setQuery]=useState('');
  var [results,setResults]=useState([]);
  var [editingWord,setEditingWord]=useState(null);
  var [newCatName,setNewCatName]=useState('');
  var [showCatForm,setShowCatForm]=useState(false);
  var [viewCat,setViewCat]=useState(null); // category id to view
  var [localCats,setLocalCats]=useState(allCategories||[]);

  useEffect(function(){setLocalCats(allCategories||[]);},[allCategories]);

  function search(q){
    if(!q||q.trim().length<2){setResults([]);return;}
    var ql=q.toLowerCase();
    var found=[];
    chapters.forEach(function(ch){
      if(!ch.parent_id) return;
      (ch.words||[]).forEach(function(w){
        if(w.word.toLowerCase().includes(ql)||w.clue.toLowerCase().includes(ql)){
          var parent=chapters.find(function(p){return p.id===ch.parent_id;});
          // Find linked sentences by vocabWord field
          var linked=(ch.sentences||[]).filter(function(s){
            if(!s.vocabWord) return false;
            var sw=s.vocabWord.toLowerCase().replace(/^to /,'');
            var ww=w.word.toLowerCase().replace(/^to /,'');
            return sw===ww||s.vocabWord.toLowerCase()===w.word.toLowerCase();
          });
          found.push({word:w.word,clue:w.clue,important:w.important,
            chapterId:ch.id,chapterTitle:ch.title,chapterIcon:ch.icon,
            parentTitle:parent?parent.title:'',color:ch.color,
            sentences:linked});
        }
      });
    });
    setResults(found);
  }

  function createCategory(){
    if(!newCatName.trim()) return;
    sbPost('categories',{name:newCatName.trim(),color:'#6366f1'}).then(function(res){
      if(res&&!res._err){
        var newCat=res.id?res:{id:'local_'+Date.now(),name:newCatName.trim(),color:'#6366f1'};
        setLocalCats(function(prev){return prev.concat([newCat]);});
        if(onCategoryChange) onCategoryChange();
        setNewCatName('');setShowCatForm(false);
      }
    });
  }

  function assignCategory(word,chapterId,catId){
    // Upsert into word_categories
    sbPost('word_categories',{word:word,chapter_id:chapterId,category_id:catId||null,is_important:(function(){var _f=results.find(function(r){return r.word===word&&r.chapterId===chapterId;});return _f?_f.important:false;})()})
      .then(function(){if(onCategoryChange) onCategoryChange();});
  }

  var viewCatData=viewCat?localCats.find(function(c){return c.id===viewCat;}):null;
  var catWords=viewCat?results.filter(function(r){return r.categoryId===viewCat;}):[];

  return <div>
    {/* Category chips */}
    <div style={{marginBottom:12}}>
      <div style={{display:'flex',justifyContent:'space-between',alignItems:'center',marginBottom:6}}>
        <div style={{fontWeight:'bold',fontSize:13,color:G900}}>🏷️ Kategorien ({localCats.length})</div>
        <button onClick={function(){setShowCatForm(!showCatForm);}} style={BtnStyle(T,'white',{padding:'4px 10px',fontSize:11})}>+ Neu</button>
      </div>
      {showCatForm&&<div style={{display:'flex',gap:6,marginBottom:8}}>
        <input value={newCatName} onChange={function(e){setNewCatName(e.target.value);}} placeholder="Kategoriename…"
          onKeyDown={function(e){if(e.key==='Enter')createCategory();}}
          style={{flex:1,padding:'6px 10px',fontSize:16,border:'1.5px solid '+T,borderRadius:8,outline:'none'}}/>
        <button onClick={createCategory} style={BtnStyle(T,'white',{padding:'6px 12px'})}>✓</button>
      </div>}
      <div style={{display:'flex',gap:6,flexWrap:'wrap'}}>
        {localCats.map(function(cat){return <button key={cat.id} onClick={function(){setViewCat(viewCat===cat.id?null:cat.id);}}

// Usage: <CategoryPicker wordCats={w.cats} onChange={fn} allCategories={allCategories}/>
// wordCats = string[] of cat ids, onChange = fn(newCats)
function CategoryPicker({ wordCats, onChange, allCategories }) {
  var cats = wordCats || [];
  var allCats = allCategories || [];
  var [open, setOpen] = useState(false);
  var [search, setSearch] = useState('');
  var wrapRef = useRef(null);

  useEffect(function() {
    if (!open) return;
    function handler(e) {
      if (wrapRef.current && !wrapRef.current.contains(e.target)) {
        setOpen(false); setSearch('');
      }
    }
    document.addEventListener('mousedown', handler);
    return function() { document.removeEventListener('mousedown', handler); };
  }, [open]);

  function toggle(catId) {
    var i = cats.indexOf(catId);
    var next = i >= 0 ? cats.filter(function(c){return c!==catId;}) : cats.concat([catId]);
    if (next.length === 0) { alert('Mindestens eine Kategorie muss zugewiesen sein!'); return; }
    onChange(next);
  }

  var filtered = allCats.filter(function(c) {
    return !search || c.name.toLowerCase().indexOf(search.toLowerCase()) >= 0 || c.icon.indexOf(search) >= 0;
  });
  var assigned = filtered.filter(function(c) { return cats.indexOf(c.id) >= 0; });
  var unassigned = filtered.filter(function(c) { return cats.indexOf(c.id) < 0; });

  return (
    <span ref={wrapRef} style={{position:'relative',display:'inline-flex',flexWrap:'wrap',gap:3,alignItems:'center'}}>
      {cats.map(function(cid) {
        var c = allCats.find(function(x){return x.id===cid;}) || {name:cid,icon:'🏷️',bg:G100,text:G400};
        return (
          <span key={cid} style={{display:'inline-flex',alignItems:'center',gap:2,padding:'2px 6px',borderRadius:99,fontSize:9,fontWeight:'bold',background:c.bg,color:c.text,cursor:'pointer',whiteSpace:'nowrap'}}
            onClick={function(){toggle(cid);}}>
            {c.icon} {c.name} ×
          </span>
        );
      })}
      <button onClick={function(){setOpen(!open);setSearch('');}}
        style={{display:'inline-flex',alignItems:'center',padding:'2px 6px',borderRadius:99,fontSize:9,fontWeight:'bold',background:G100,color:G400,border:'1.5px dashed '+G200,cursor:'pointer',whiteSpace:'nowrap',touchAction:'manipulation'}}>
        + Kategorie
      </button>
      {open && (
        <div style={{position:'absolute',top:'calc(100% + 3px)',left:0,zIndex:800,background:'white',border:'1.5px solid '+T,borderRadius:10,padding:7,minWidth:220,boxShadow:'0 6px 20px rgba(0,0,0,.14)'}}>
          <input value={search} onChange={function(e){setSearch(e.target.value);}} autoFocus
            placeholder="Kategorie suchen..."
            style={{width:'100%',padding:'5px 8px',fontSize:11,border:'1.5px solid '+G200,borderRadius:6,outline:'none',fontFamily:'inherit',marginBottom:5}}/>
          <div style={{maxHeight:160,overflowY:'auto'}}>
            {assigned.length > 0 && <div style={{fontSize:9,color:G400,fontWeight:'bold',padding:'0 4px 3px',textTransform:'uppercase',letterSpacing:.7}}>Zugewiesen</div>}
            {assigned.map(function(c) {
              return (
                <div key={c.id} onClick={function(){toggle(c.id);}} style={{display:'flex',alignItems:'center',gap:5,padding:'4px 6px',borderRadius:5,cursor:'pointer',fontSize:11,background:TL}}>
                  <span>{c.icon}</span><span style={{flex:1,fontWeight:'bold'}}>{c.name}</span>
                  <span style={{color:T,fontWeight:'bold',fontSize:10}}>✓</span>
                </div>
              );
            })}
            {assigned.length > 0 && unassigned.length > 0 && <div style={{height:1,background:G100,margin:'4px 0'}}/>}
            {unassigned.map(function(c) {
              return (
                <div key={c.id} onClick={function(){toggle(c.id);}} style={{display:'flex',alignItems:'center',gap:5,padding:'4px 6px',borderRadius:5,cursor:'pointer',fontSize:11}}>
                  <span>{c.icon}</span><span style={{flex:1,fontWeight:'bold'}}>{c.name}</span>
                </div>
              );
            })}
            {!filtered.length && <div style={{color:G400,padding:8,textAlign:'center',fontSize:11}}>Nicht gefunden</div>}
          </div>
          <div style={{height:1,background:G100,margin:'4px 0'}}/>
          <button onClick={function(){setOpen(false);setSearch('');}}
            style={{width:'100%',padding:'4px',borderRadius:6,border:'1px solid '+G200,background:G50,cursor:'pointer',fontSize:10,fontFamily:'inherit',color:G600}}>
            Schließen
          </button>
        </div>
      )}
    </span>
  );
}


function ApiKeyManager() {
  var [keyVal, setKeyVal] = useState('');
  var [status, setStatus] = useState('loading'); // loading|missing|set
  var [saving, setSaving] = useState(false);
  var [showInput, setShowInput] = useState(false);

  function loadKey() {
    sbGet('settings','key=eq.anthropic_key&select=value').then(function(rows){
      var v = Array.isArray(rows)&&rows.length>0 ? rows[0].value : '';
      if(v) {
        window._ANTHROPIC_KEY = v;
        try{sessionStorage.setItem('_ak',v);}catch(e){}
        setStatus('set');
      } else {
        setStatus('missing');
      }
    }).catch(function(){ setStatus('missing'); });
  }

  useEffect(function(){ loadKey(); }, []);

  function saveKey() {
    var k = keyVal.trim();
    if(!k) return;
    setSaving(true);
    // PATCH first (key already exists from seed), POST as fallback
    sbPatch('settings',{value:k,updated_at:new Date().toISOString()},'key=eq.anthropic_key').then(function(res){
      if(res&&res._err){
        // Row doesn't exist yet - create it
        return sbPost('settings',{key:'anthropic_key',value:k});
      }
      return res;
    }).then(function(){
      window._ANTHROPIC_KEY = k;
      try{sessionStorage.setItem('_ak',k);}catch(e){}
      setStatus('set'); setSaving(false); setShowInput(false); setKeyVal('');
    }).catch(function(){
      setSaving(false);
      setStatus('missing');
    });
  }

  function clearKey() {
    sbPatch('settings',{value:''},'key=eq.anthropic_key').then(function(){
      window._ANTHROPIC_KEY = '';
      try{sessionStorage.removeItem('_ak');}catch(e){}
      setStatus('missing');
    });
  }

  if(status==='loading') return <div style={{fontSize:11,color:G400,marginBottom:6}}>API-Key wird geladen...</div>;

  if(status==='set') return (
    <div style={{marginBottom:8,padding:'5px 10px',background:'#d1fae5',borderRadius:7,border:'1px solid #6ee7b7',fontSize:11,color:'#065f46',display:'flex',alignItems:'center',gap:8}}>
      <span>✅ Anthropic API-Key gesetzt (aus Datenbank)</span>
      <button onClick={function(){setShowInput(true);setStatus('missing');}} style={{fontSize:10,padding:'2px 7px',borderRadius:5,border:'1px solid #6ee7b7',background:'white',cursor:'pointer',color:'#065f46',marginLeft:'auto'}}>Ändern</button>
      <button onClick={clearKey} style={{fontSize:10,padding:'2px 7px',borderRadius:5,border:'1px solid #fca5a5',background:'white',cursor:'pointer',color:RE}}>Löschen</button>
    </div>
  );

  return (
    <div style={{marginBottom:8,padding:'8px 10px',background:'#fef3c7',borderRadius:7,border:'1px solid #fcd34d',fontSize:11,color:'#92400e'}}>
      ⚠️ Anthropic API-Key fehlt - Upload nicht möglich.
      <div style={{display:'flex',gap:6,marginTop:6}}>
        <input value={keyVal} onChange={function(e){setKeyVal(e.target.value);}}
          type="password" placeholder="sk-ant-api03-..."
          autoComplete="off" spellCheck="false"
          style={{flex:1,padding:'6px 8px',fontSize:13,border:'1.5px solid #f59e0b',borderRadius:6,outline:'none'}}
          onKeyDown={function(e){if(e.key==='Enter')saveKey();}}/>
        <button onClick={saveKey} disabled={saving||!keyVal.trim()}
          style={{padding:'6px 12px',borderRadius:6,background:saving?G400:AM,color:'white',border:'none',cursor:saving?'default':'pointer',fontSize:12,fontWeight:'bold',whiteSpace:'nowrap'}}>
          {saving?'..':'Speichern'}
        </button>
      </div>
      <div style={{fontSize:10,color:'#b45309',marginTop:4}}>Wird in der Datenbank gespeichert - nur einmal eingeben.</div>
    </div>
  );
}


// Natural sort: "Kapitel 1" before "Kapitel 2" before "Kapitel 10"
function naturalSort(a, b) {
  var ax=[], bx=[];
  a.title.replace(/(\d+)|(\D+)/g,function(_,d,s){ax.push(d?[0,parseInt(d)]:[1,s.toLowerCase()]);});
  b.title.replace(/(\d+)|(\D+)/g,function(_,d,s){bx.push(d?[0,parseInt(d)]:[1,s.toLowerCase()]);});
  for(var i=0;i<Math.max(ax.length,bx.length);i++){
    var a2=ax[i]||[-1,''], b2=bx[i]||[-1,''];
    if(a2[0]!==b2[0]) return a2[0]-b2[0];
    if(a2[1]<b2[1]) return -1;
    if(a2[1]>b2[1]) return 1;
  }
  return 0;
}


// ── saveChapterWords: patch words array back to Supabase ──
function sortWords(words) {
  return words.slice().sort(function(a,b){
    return (a.word||'').toLowerCase().localeCompare((b.word||'').toLowerCase());
  });
}
function saveChapterWords(chapterId, newWords, setChapters) {
  var sorted = sortWords(newWords);
  sbPatch('chapters',{words:JSON.stringify(sorted)},'id=eq.'+chapterId).then(function(){
    setChapters(function(prev){return prev.map(function(c){
      return c.id===chapterId?Object.assign({},c,{words:sorted}):c;
    });});
  });
}


function AdminDash({ chapters, setChapters, allUsers, setAllUsers, player, gradeSettings, streakSettings, setGradeSettings, setStreakSettings, allCategories, setAllCategories, allRuns }) {

  var [catJobLog, setCatJobLog] = useState([]);
  var [dedupLog, setDedupLog] = useState([]);
  var [dedupPct, setDedupPct] = useState(0);
  var [dedupPlan, setDedupPlan] = useState(null);
  var [dedupRunning, setDedupRunning] = useState(false);
  var [dedupPhase, setDedupPhase] = useState('idle');
  var [catJobRunning, setCatJobRunning] = useState(false);
  var [catJobPct, setCatJobPct] = useState(0);
  var [scoreJobLog, setScoreJobLog] = useState([]);
  var [scorePreview, setScorePreview] = useState(null);

  // Use allUsers from App state (loaded from Supabase on startup)
  useEffect(function(){
    var nonAdmins = Array.isArray(allUsers) ? allUsers.filter(function(u){ return !u.is_admin; }) : [];
    setPlayers(nonAdmins);
  }, [allUsers]);

  function loadP(p) {
    setSelP(p); setLoading(true); setSelLsProgress([]); setLsDetailPot(null);
    sbGet('results','player_id=eq.'+p.id+'&order=completed_at.desc').then(function(r){
      setResults(Array.isArray(r)?r:[]);
    });
    // Also load Leiterspiel progress for this user
    var UUID=/^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/i;
    if(UUID.test(p.id)){
      sbGet('ls_progress','player_id=eq.'+p.id+'&select=id,run_id,data,updated_at').then(function(rows){
        setSelLsProgress(Array.isArray(rows)?rows:[]);
        setLoading(false);
      }).catch(function(){ setLoading(false); });
    } else {
      setLoading(false);
    }
  }

  var wStats = useMemo(function(){
    var m={};
    results.forEach(function(r){ if(!m[r.word])m[r.word]={word:r.word,clue:r.clue,c:0,w:0}; if(r.correct)m[r.word].c++;else m[r.word].w++; });
    return Object.values(m).sort(function(a,b){return b.w-a.w;});
  },[results]);

  var chStats = useMemo(function(){
    return chapters.map(function(ch){
      var total=ch.words.length;
      var corrSet=new Set(results.filter(function(r){return r.chapter_id===ch.id&&r.correct;}).map(function(r){return r.word;}));
      var wrong=results.filter(function(r){return r.chapter_id===ch.id&&!r.correct;}).length;
      var pct=total>0?Math.round(corrSet.size/total*100):0;
      return Object.assign({},ch,{total:total,correct:corrSet.size,wrong:wrong,pct:pct});
    });
  },[chapters,results]);

  var totalW=chapters.reduce(function(s,ch){return s+ch.words.length;},0);
  var learnedW=selP?new Set(results.filter(function(r){return r.correct;}).map(function(r){return r.word;})).size:0;
  var overallPct=selP?Math.round(learnedW/totalW*100):0;

  // ── Category auto-assignment via Claude API ──────────────────
  var CAT_DEF='greetings=Begruessung, zahlen=Zahlen, farben=Farben, familie=Familie, koerper=Koerper, kleidung=Kleidung, essen=Essen, sport=Sport, schule=Schule, zuhause=Zuhause, transport=Transport, monate=Monate, freizeit=Freizeit, einkaufen=Einkaufen, kommunikation=Kommunikation, natur=Natur, gefuehle=Gefuehle, ort=Ort, grammatik=Grammatik';
  function appendCatLog(msg) { setCatJobLog(function(p){return p.concat([msg]);});  setTimeout(function(){if(catLogRef.current)catLogRef.current.scrollTop=catLogRef.current.scrollHeight;},50); }
  function appendScoreLog(msg) { setScoreJobLog(function(p){return p.concat([msg]);}); setTimeout(function(){if(scoreLogRef.current)scoreLogRef.current.scrollTop=scoreLogRef.current.scrollHeight;},50); }

  function runCatAssignment(forceAll) {
    if(catJobRunning) return;
    var key=window._ANTHROPIC_KEY||(function(){try{return sessionStorage.getItem('_ak')||'';}catch(e){return '';}}());
    if(!key){setCatJobLog(['Kein API-Key. Bitte im Upload-Bereich eintragen.']);return;}
    var topicChs=chapters.filter(function(c){return !!c.parent_id;});
    var toProcess=topicChs.filter(function(ch){
      if(forceAll) return ch.words.length>0;
      return ch.words.some(function(w){return !w.cats||w.cats.length===0;});
    });
    if(!toProcess.length){setCatJobLog(['Alle Vokabeln haben bereits Kategorien!']);return;}
    setCatJobRunning(true);setCatJobPct(0);
    setCatJobLog(['Start: '+toProcess.length+' Kapitel...']);
    var processed=0; var totalUpdated=0;
    function next(idx){
      if(idx>=toProcess.length){
        appendCatLog('Fertig! '+totalUpdated+' Vokabeln kategorisiert.');
        setCatJobPct(100);setCatJobRunning(false);return;
      }
      var ch=toProcess[idx];
      var needsCat=forceAll?ch.words:ch.words.filter(function(w){return !w.cats||w.cats.length===0;});
      if(!needsCat.length){processed++;setCatJobPct(Math.round(processed/toProcess.length*100));next(idx+1);return;}
      appendCatLog('"'+ch.title+'" - '+needsCat.length+' Vokabeln...');
      var wordList=needsCat.map(function(w){return w.word+' = '+w.clue;}).join('\n');
      var prompt='Weise jeder Vokabel 1-3 passende Kategorie-IDs zu ('+CAT_DEF+'). Nur JSON, kein Markdown:\n{"assignments":[{"word":"birthday","cats":["freizeit","familie"]}]}\n\nVokabeln:\n'+wordList;
      fetch('https://api.anthropic.com/v1/messages',{method:'POST',headers:{'Content-Type':'application/json','x-api-key':key,'anthropic-version':'2023-06-01','anthropic-dangerous-direct-browser-access':'true'},
        body:JSON.stringify({model:'claude-sonnet-4-20250514',max_tokens:2000,messages:[{role:'user',content:prompt}]})})
      .then(function(r){return r.json();})
      .then(function(d){
        var txt=(d.content||[]).map(function(b){return b.text||'';}).join('').trim().replace(/```json|```/g,'').trim();
        var res; try{res=JSON.parse(txt);}catch(e){res={assignments:[]};}
        var amap={}; (res.assignments||[]).forEach(function(a){amap[a.word.toLowerCase()]=a.cats||[];});
        var changed=0;
        var newWords=ch.words.map(function(w){
          if(forceAll||!w.cats||w.cats.length===0){var cats=amap[w.word.toLowerCase()];if(cats&&cats.length){changed++;return Object.assign({},w,{cats:cats});}}
          return w;
        });
        totalUpdated+=changed;
        return sbPatch('chapters',{words:JSON.stringify(newWords)},'id=eq.'+ch.id).then(function(){
          setChapters(function(prev){return prev.map(function(c){return c.id===ch.id?Object.assign({},c,{words:newWords}):c;});});
          appendCatLog('OK: "'+ch.title+'" - '+changed+' zugewiesen');
          processed++;setCatJobPct(Math.round(processed/toProcess.length*100));
          setTimeout(function(){next(idx+1);},800);
        });
      })
      .catch(function(e){appendCatLog('Fehler "'+ch.title+'": '+e.message);processed++;setCatJobPct(Math.round(processed/toProcess.length*100));setTimeout(function(){next(idx+1);},500);});
    }
    next(0);
  }

  // ── Score recalculation ──────────────────────────────────────
  var POT_CUM_MAP={1:10,2:30,3:60,4:100,5:160};
  function runScorePreview() {
    setScoreJobLog(['Lade Daten...']); setScorePreview(null);
    Promise.all([
      sbGet('players','select=id,name,total_score,is_admin&order=name.asc'),
      sbGet('ls_progress','select=player_id,data')
    ]).then(function(r){
      var pls=r[0]||[]; var allProg=r[1]||[];
      var preview=pls.map(function(p){
        var myProg=allProg.filter(function(x){return x.player_id===p.id;});
        var wmp={};
        myProg.forEach(function(row){
          var data={}; try{data=JSON.parse(row.data||'{}');}catch(e){}
          var pots=data.pots||{};
          [1,2,3,4,5].forEach(function(pot){
            (pots[pot]||[]).forEach(function(w){
              var mp=w.maxPot?Math.max(w.maxPot,pot):pot;
              if(!wmp[w.word]||wmp[w.word]<mp) wmp[w.word]=mp;
            });
          });
        });
        var newScore=0; var learned=0;
        Object.keys(wmp).forEach(function(word){var mp=wmp[word];newScore+=POT_CUM_MAP[mp]||0;if(mp===5)learned++;});
        return {id:p.id,name:p.name,oldScore:p.total_score||0,newScore:newScore,learned:learned,isAdmin:p.is_admin};
      });
      setScorePreview(preview);
      setScoreJobLog(['Vorschau geladen - '+preview.length+' Spieler']);
    }).catch(function(e){setScoreJobLog(['Fehler: '+e.message]);});
  }

  function runDedupAnalyze() {
    if(dedupRunning) return;
    setDedupRunning(true);
    setDedupPlan(null);
    setDedupPhase('analyzing');
    setDedupPct(0);
    setDedupLog([]);
    dedupAddLog('Lade Kapitel und Lernstaende...');
    Promise.all([
      sbGet('chapters','select=id,title,parent_id,words&order=created_at.asc'),
      sbGet('ls_progress','select=id,player_id,run_id,data')
    ]).then(function(res) {
      var chs=res[0]||[]; var prog=res[1]||[];
      dedupAddLog(''+chs.length+' Kapitel, '+prog.length+' Lernstaende geladen','ok');
      setDedupPct(20);
      // Parse topics
      var topics=chs.filter(function(c){return !!c.parent_id;}).map(function(c){
        var w=c.words; if(typeof w==='string'){try{w=JSON.parse(w);}catch(e){w=[];}} return Object.assign({},c,{words:Array.isArray(w)?w:[]});
      });
      // Build word progress map
      var wpMap={};
      prog.forEach(function(row){
        var data={}; try{data=JSON.parse(row.data||'{}');}catch(e){}
        var pots=data.pots||{};
        [1,2,3,4,5].forEach(function(pot){
          (pots[pot]||[]).forEach(function(w){
            var k=(w.word||'').toLowerCase();
            if(!wpMap[k]) wpMap[k]={maxPot:0,learnedByAny:false};
            var mp=w.maxPot?Math.max(w.maxPot,pot):pot;
            if(mp>wpMap[k].maxPot) wpMap[k].maxPot=mp;
            if(pot===5) wpMap[k].learnedByAny=true;
          });
        });
      });
      setDedupPct(50);
      // Find duplicates
      var totalDups=0;
      var plan2=[];
      topics.forEach(function(ch){
        var seen={};
        ch.words.forEach(function(w){ var k=(w.word||'').toLowerCase().trim(); if(!k)return; if(!seen[k])seen[k]=[]; seen[k].push(w); });
        var dupGroups=[];
        Object.keys(seen).forEach(function(key){
          var group=seen[key]; if(group.length<2) return;
          totalDups+=group.length-1;
          var bestScore=-1; var keep=group[0];
          group.forEach(function(w){
            var score=0;
            if(w.cats&&w.cats.length>0) score+=4;
            if(w.important) score+=2;
            if(wpMap[(w.word||'').toLowerCase()]) score+=1;
            if(score>bestScore){bestScore=score;keep=w;}
          });
          var merged=Object.assign({},keep);
          var allCats={}; (keep.cats||[]).forEach(function(c){allCats[c]=1;});
          group.forEach(function(w){(w.cats||[]).forEach(function(c){allCats[c]=1;});});
          merged.cats=Object.keys(allCats);
          merged.important=group.some(function(w){return w.important;});
          dupGroups.push({key:key,group:group,keep:keep,merged:merged,remove:group.filter(function(w){return w!==keep;})});
        });
        if(dupGroups.length>0) plan2.push({chapterId:ch.id,chapterTitle:ch.title,dupGroups:dupGroups,allWords:ch.words,prog:prog});
      });
      setDedupPct(100);
      if(totalDups===0){ dedupAddLog('Keine Duplikate gefunden - alles sauber!','ok'); setDedupPhase('idle'); }
      else { dedupAddLog(''+totalDups+' Duplikate in '+plan2.length+' Themenbereichen gefunden','warn'); setDedupPhase('ready'); }
      setDedupPlan({plan:plan2,totalDups:totalDups,progRows:prog,wpMap:wpMap});
      setDedupRunning(false);
    }).catch(function(e){ dedupAddLog('Fehler: '+e.message,'err'); setDedupRunning(false); setDedupPhase('idle'); });
  }

  function runDedupExecute() {
    if(!dedupPlan||dedupRunning) return;
    if(!confirm('Jetzt '+dedupPlan.totalDups+' Duplikate entfernen? Backup vorher erstellt?')) return;
    setDedupRunning(true); setDedupPhase('executing'); setDedupPct(0);
    var plan2=dedupPlan.plan; var progRows=dedupPlan.progRows;
    dedupAddLog('Schritt A: '+plan2.length+' Themenbereiche bereinigen...');
    var chapOk=0; var chapFail=0;
    function execChap(ci){
      if(ci>=plan2.length){
        dedupAddLog('Kapitel fertig: '+chapOk+' OK, '+chapFail+' Fehler',chapFail>0?'warn':'ok');
        setDedupPct(55);
        dedupAddLog('Schritt B: Lernstaende bereinigen...');
        execProg(0,0,0,0);
        return;
      }
      var ch=plan2[ci];
      setDedupPct(Math.round((ci/plan2.length)*50));
      sbGet('chapters','id=eq.'+ch.chapterId+'&select=words').then(function(fresh){
        var freshWords=[]; if(fresh&&fresh[0]){var w=fresh[0].words;if(typeof w==='string'){try{w=JSON.parse(w);}catch(e){w=[];}}freshWords=Array.isArray(w)?w:[];}else{freshWords=ch.allWords;}
        var keepMap={}; ch.dupGroups.forEach(function(g){keepMap[g.key]=g.merged;});
        var seenKeys={}; var newWords=[];
        freshWords.forEach(function(w){ var k=(w.word||'').toLowerCase().trim(); if(!k)return; if(keepMap[k]){if(!seenKeys[k]){seenKeys[k]=true;newWords.push(keepMap[k]);}}else{newWords.push(w);}});
        newWords.sort(function(a,b){return (a.word||'').toLowerCase().localeCompare((b.word||'').toLowerCase());});
        sbPatch('chapters',{words:JSON.stringify(newWords)},'id=eq.'+ch.chapterId).then(function(){
          setChapters(function(prev){return prev.map(function(c){return c.id===ch.chapterId?Object.assign({},c,{words:newWords}):c;});});
          dedupAddLog('OK: '+ch.chapterTitle+' - '+ch.dupGroups.reduce(function(s,g){return s+g.remove.length;},0)+' entfernt','ok');
          chapOk++;
          setTimeout(function(){execChap(ci+1);},150);
        }).catch(function(e){ dedupAddLog('Fehler '+ch.chapterTitle+': '+e.message,'err'); chapFail++; setTimeout(function(){execChap(ci+1);},150); });
      }).catch(function(e){ dedupAddLog('Ladefehler '+ch.chapterTitle+': '+e.message,'err'); chapFail++; setTimeout(function(){execChap(ci+1);},150); });
    }
    function execProg(pi, ok2, skip2, fail2){
      if(pi>=progRows.length){
        setDedupPct(100);
        dedupAddLog('Lernstaende: '+ok2+' aktualisiert, '+skip2+' unveraendert'+(fail2>0?', '+fail2+' Fehler':''),fail2>0?'warn':'ok');
        dedupAddLog('FERTIG! Duplikate erfolgreich entfernt.','ok');
        setDedupPhase('done'); setDedupRunning(false); setDedupPlan(null);
        return;
      }
      setDedupPct(55+Math.round((pi/progRows.length)*43));
      var row=progRows[pi];
      var data={}; try{data=JSON.parse(row.data||'{}');}catch(e){setTimeout(function(){execProg(pi+1,ok2,skip2+1,fail2);},40);return;}
      var pots=data.pots||{}; var changed=false;
      [1,2,3,4,5].forEach(function(pot){
        var arr=pots[pot]||[]; if(!arr.length)return;
        var seen2={}; var deduped=[];
        arr.forEach(function(w){ var k=(w.word||'').toLowerCase();
          if(!seen2[k]){seen2[k]=w;deduped.push(w);}
          else{var ex=seen2[k];ex.maxPot=Math.max(ex.maxPot||0,w.maxPot||0);ex.streak=Math.max(ex.streak||0,w.streak||0);ex.totalCorrect=Math.max(ex.totalCorrect||0,w.totalCorrect||0);ex.totalWrong=Math.max(ex.totalWrong||0,w.totalWrong||0);changed=true;}
        });
        if(deduped.length!==arr.length){pots[pot]=deduped;changed=true;}
      });
      if(!changed){setTimeout(function(){execProg(pi+1,ok2,skip2+1,fail2);},40);return;}
      sbPatch('ls_progress',{data:JSON.stringify(data),updated_at:new Date().toISOString()},'id=eq.'+row.id).then(function(){
        setTimeout(function(){execProg(pi+1,ok2+1,skip2,fail2);},60);
      }).catch(function(){ setTimeout(function(){execProg(pi+1,ok2,skip2,fail2+1);},60); });
    }
    execChap(0);
  }

                chapters={chapters}
                chapterMode={chapterMode}
                targetChapter={targetChapter}
                setTargetChapter={setTargetChapter}
                targetKapitel={targetKapitel}
                setTargetKapitel={setTargetKapitel}
                dTitle={dTitle} setDTitle={setDTitle}
                dColor={dColor} setDColor={setDColor}
                dIcon={dIcon}  setDIcon={setDIcon}
                allCategories={allCategories}
                onSave={function(edited){saveDraft(edited.words,edited.sentences);}}
                onCancel={function(){setDraft(null);setImgMsg('');}}
              />
            )}
          </div>

          {/* Chapter list */}
          {(function(){
            var topLevel=chapters.filter(function(c){return !c.parent_id;}).slice().sort(naturalSort);
            var topics=chapters.filter(function(c){return !!c.parent_id;});
            return <div>
              <div style={{fontWeight:'bold',fontSize:13,color:G900,marginBottom:8}}>📚 Kapitel ({topLevel.length}) · {topics.length} Themenbereiche</div>
              {topLevel.map(function(kap){
                var kapTopics=topics.filter(function(t){return t.parent_id===kap.id;});
                var totalW=kapTopics.reduce(function(s,t){return s+t.words.length;},0);
                var totalI=kapTopics.reduce(function(s,t){return s+t.words.filter(function(w){return w.important;}).length;},0);
                return <div key={kap.id} style={{marginBottom:10,border:'2px solid '+kap.color+'50',borderRadius:12,overflow:'hidden'}}>
                  <div style={{background:kap.color+'20',padding:'10px 12px',display:'flex',alignItems:'center',gap:8}}>
                    <span style={{fontSize:20}}>{kap.icon}</span>
                    <div style={{flex:1}}>
                      <div style={{fontWeight:'bold',fontSize:14,color:kap.color}}>{kap.title}</div>
                      <div style={{fontSize:10,color:G400}}>{kapTopics.length} Themenbereiche · {totalW} Vokabeln · {totalI} ⭐</div>
                    </div>
                    <button onClick={function(){var n=prompt('Neuer Name:',kap.title);if(!n||!n.trim())return;sbPatch('chapters',{title:n.trim()},'id=eq.'+kap.id).then(function(){setChapters(function(prev){return prev.map(function(c){return c.id===kap.id?Object.assign({},c,{title:n.trim()}):c;});});});}}
                      style={BtnStyle(G100,G600,{padding:'3px 8px',fontSize:10})}>✏️</button>
                    <button onClick={function(){delCh(kap);}} style={BtnStyle('#fee2e2',RE,{padding:'3px 8px',fontSize:10})}>🗑</button>
                  </div>
                  {kapTopics.map(function(t){
                    var isOpen = openTopicId === t.id;
                    var impCount = t.words.filter(function(w){return w.important;}).length;
                    return <div key={t.id} style={{borderTop:'1px solid '+G100}}>
                      {/* Topic header - clickable to expand */}
                      <div style={{display:'flex',alignItems:'center',gap:8,padding:'8px 12px 8px 24px',background:isOpen?TL:'white',cursor:'pointer'}}
                        onClick={function(){setOpenTopicId(isOpen?null:t.id);}}>
                        <span style={{fontSize:12}}>{isOpen?'▼':'▶'}</span>
                        <span>{t.icon}</span>
                        <div style={{flex:1}}>
                          <div style={{fontSize:12,fontWeight:'bold',color:isOpen?T:G600}}>{t.title}</div>
                          <div style={{fontSize:10,color:G400}}>{t.words.length}V · {impCount}⭐ · {(t.sentences||[]).filter(function(s){return s.important;}).length}/{(t.sentences||[]).length} Sätze</div>
                        </div>
                        <button onClick={function(e){e.stopPropagation();var n=prompt('Neuer Name:',t.title);if(!n||!n.trim())return;sbPatch('chapters',{title:n.trim()},'id=eq.'+t.id).then(function(){setChapters(function(prev){return prev.map(function(c){return c.id===t.id?Object.assign({},c,{title:n.trim()}):c;});});});}}
                          style={BtnStyle(G100,G600,{padding:'2px 6px',fontSize:10})}>✏️</button>
                        <button onClick={function(e){e.stopPropagation();if(moveSrcId===t.id){setMoveSrcId(null);setMoveSelected({});setMoveTgtId('');}else{setMoveSrcId(t.id);setMoveSelected({});setMoveTgtId('');setOpenTopicId(t.id);}}}
                          style={BtnStyle(moveSrcId===t.id?AM:G100,moveSrcId===t.id?'white':G600,{padding:'2px 6px',fontSize:10,touchAction:'manipulation'})}>
                          {moveSrcId===t.id?'✕':'🔀'}
                        </button>
                        <button onClick={function(e){e.stopPropagation();delCh(t);}} style={BtnStyle('#fee2e2',RE,{padding:'2px 6px',fontSize:10})}>🗑</button>
                      </div>
                      {/* Move panel */}
                      {moveSrcId===t.id&&(function(){
                        var otherTopics=chapters.filter(function(c){return !!c.parent_id&&c.id!==t.id;}).slice().sort(naturalSort);
                        var selCount=Object.keys(moveSelected).filter(function(k){return !!moveSelected[k];}).length;
                        return <div style={{padding:'8px 12px',background:'#fffbeb',borderTop:'1px solid #fde68a'}}>
                          <div style={{fontSize:11,color:'#92400e',fontWeight:'bold',marginBottom:6}}>
                            🔀 Verschieben - {selCount} Vokabel{selCount!==1?'n':''} ausgewählt
                          </div>
                          <div style={{display:'flex',gap:8,alignItems:'center',flexWrap:'wrap'}}>
                            <select value={moveTgtId} onChange={function(e){setMoveTgtId(e.target.value);}}
                              style={{flex:1,padding:'6px 8px',fontSize:12,border:'1.5px solid '+AM,borderRadius:7,outline:'none',background:'white'}}>
                              <option value=''>-- Ziel-Themenbereich --</option>
                              {otherTopics.map(function(ot){
                                var par=chapters.find(function(p){return p.id===ot.parent_id;});
                                return <option key={ot.id} value={ot.id}>{par?par.title+' > ':''}{ot.title} ({ot.words.length}V)</option>;
                              })}
                            </select>
                            <button onClick={executeMove} disabled={selCount===0||!moveTgtId}
                              style={BtnStyle(selCount>0&&moveTgtId?T:G200,selCount>0&&moveTgtId?'white':G400,{padding:'7px 14px',fontSize:12,opacity:selCount===0||!moveTgtId?0.5:1,touchAction:'manipulation'})}>
                              Verschieben →
                            </button>
                            <button onClick={function(){
                              var all={};
                              t.words.forEach(function(w){all[w.word]=true;});
                              setMoveSelected(all);
                            }} style={BtnStyle(G100,G600,{padding:'5px 10px',fontSize:11,touchAction:'manipulation'})}>
                              Alle
                            </button>
                            <button onClick={function(){setMoveSelected({});}} style={BtnStyle(G100,G600,{padding:'5px 10px',fontSize:11,touchAction:'manipulation'})}>
                              Keine
                            </button>
                          </div>
                        </div>;
                      })()}
                      {/* Expanded editable word list */}
                      {isOpen&&(function(){
                        var allCatsForAdmin = allCategories || [];
                        var isMoveMode = moveSrcId===t.id;
                        var sortedWords = t.words.slice().sort(function(a,b){return (a.word||'').toLowerCase().localeCompare((b.word||'').toLowerCase());});
                        function patchW(w,field,val){
                          var nw=t.words.map(function(x){return x.word===w.word?Object.assign({},x,{[field]:val}):x;});
                          saveChapterWords(t.id,nw,setChapters);
                        }
                        function toggleImp(w){
                          var nw=t.words.map(function(x){return x.word===w.word?Object.assign({},x,{important:!x.important}):x;});
                          saveChapterWords(t.id,nw,setChapters);
                        }
                        function deleteW(w){
                          if(!confirm('Vokabel "'+w.word+'" löschen?')) return;
                          var nw=t.words.filter(function(x){return x.word!==w.word;});
                          saveChapterWords(t.id,nw,setChapters);
                        }
                        function addWord(){
                          var nw=t.words.concat([{word:'',clue:'',important:false,type:'noun'}]);
                          saveChapterWords(t.id,nw,setChapters);
                        }
                        return <div style={{padding:'4px 0 10px 0',background:'#f9fafb',borderTop:'1px solid '+G100}}>
                          {/* Column headers */}
                          <div style={{display:'flex',gap:4,padding:'3px 8px 3px 24px',fontSize:9,color:G400,fontWeight:'bold',textTransform:'uppercase',letterSpacing:1}}>
                            {isMoveMode&&<div style={{width:22}}></div>}

                            <div style={{flex:2}}>Englisch</div>
                            <div style={{flex:3}}>Deutsch (/ für Alternativen)</div>
                            <div style={{width:70}}>Typ</div>
                            <div style={{width:22}}></div>
                          </div>
                          {sortedWords.map(function(w){
                            var wType=w.type||'noun';
                            var typeBg={'verb':'#dbeafe','noun':'#f3e8ff','adjective':'#d1fae5','phrase':'#fff7ed','other':'#f1f5f9'}[wType]||G100;
                            var typeColor={'verb':'#1e40af','noun':'#7c3aed','adjective':'#065f46','phrase':'#c2410c','other':'#475569'}[wType]||G400;
                            var isSelected=isMoveMode&&!!moveSelected[w.word];
                            return <div key={w.word} style={{display:'flex',alignItems:'center',gap:4,padding:'3px 8px 3px 24px',borderBottom:'1px solid '+G50,background:isSelected?'#fef9c3':'transparent'}}>
                              {/* Move checkbox */}
                              {isMoveMode&&<div onClick={function(){setMoveSelected(function(prev){var n=Object.assign({},prev);n[w.word]=!n[w.word];return n;});}}
                                style={{width:18,height:18,borderRadius:4,border:'2px solid '+(isSelected?AM:G200),background:isSelected?AM:'white',cursor:'pointer',flexShrink:0,display:'flex',alignItems:'center',justifyContent:'center',touchAction:'manipulation'}}>
                                {isSelected&&<span style={{color:'white',fontSize:11,fontWeight:'bold'}}>✓</span>}
                              </div>}
                              {/* Important toggle */}
                              <button onClick={function(){toggleImp(w);}} title="Wichtigkeit umschalten"
                                style={{width:20,height:20,padding:0,border:'none',background:'none',cursor:'pointer',fontSize:13,flexShrink:0}}>
                                {w.important?'⭐':'☆'}
                              </button>
                              {/* English word */}
                              <input value={w.word||''} onChange={function(e){patchW(w,'word',e.target.value);}}
                                style={{flex:2,padding:'2px 5px',fontSize:12,border:'1px solid '+G200,borderRadius:4,outline:'none',fontWeight:'bold',color:G900}}/>
                              {/* German / alternatives */}
                              <input value={w.clue||''} onChange={function(e){patchW(w,'clue',e.target.value);}}
                                placeholder="Übersetzung / Alternative"
                                style={{flex:3,padding:'2px 5px',fontSize:12,border:'1px solid '+G200,borderRadius:4,outline:'none',color:G600}}/>
                              {/* Type selector */}
                              <select value={wType} onChange={function(e){patchW(w,'type',e.target.value);}}
                                style={{width:70,fontSize:10,padding:'2px 3px',border:'1px solid '+G200,borderRadius:4,background:typeBg,color:typeColor}}>
                                <option value="verb">Verb</option>
                                <option value="noun">Subst.</option>
                                <option value="adjective">Adj.</option>
                                <option value="phrase">Phrase</option>
                                <option value="other">Sonst.</option>
                              </select>
                              {/* Categories */}
                              {!isMoveMode&&<span style={{flex:2,minWidth:80}}>
                                <CategoryPicker
                                  wordCats={w.cats||[]}
                                  onChange={function(newCats){patchW(w,'cats',newCats);}}
                                  allCategories={allCatsForAdmin}
                                />
                              </span>}
                              {/* Delete */}
                              {!isMoveMode&&<button onClick={function(){deleteW(w);}} title="Löschen"
                                style={{width:22,height:22,padding:0,border:'none',background:'none',cursor:'pointer',color:RE,fontSize:14,flexShrink:0}}>✕</button>}
                            </div>;
                          })}
                          {/* Add new word */}
                          {!isMoveMode&&<div style={{padding:'6px 8px 2px 44px'}}>
                            <button onClick={addWord}
                              style={{fontSize:11,padding:'4px 10px',borderRadius:6,border:'1px dashed '+T,background:TL,color:T,cursor:'pointer',touchAction:'manipulation'}}>
                              + Neue Vokabel
                            </button>
                          </div>}
                          {/* Sentences */}
                          {(t.sentences||[]).filter(function(s){return s.important;}).length>0&&<div style={{margin:'6px 24px 0',borderTop:'1px solid '+G200,paddingTop:4}}>
                            <div style={{fontSize:10,color:G400,marginBottom:3}}>Verknüpfte Sätze:</div>
                            {(t.sentences||[]).filter(function(s){return s.important;}).map(function(s,si){
                              return <div key={si} style={{fontSize:11,color:'#065f46',padding:'2px 0'}}>
                                ⭐ {s.text} <span style={{color:G400}}>- {s.translation}</span>
                              </div>;
                            })}
                          </div>}
                        </div>;
                      })()}
                    </div>;
                  })}
                  {kapTopics.length===0&&<div style={{padding:'8px 24px',color:G400,fontSize:11}}>Noch keine Themenbereiche.</div>}
                </div>;
              })}
              {topLevel.length===0&&<div style={{textAlign:'center',color:G400,padding:16}}>Noch keine Kapitel. Oben "Neues Kapitel" erstellen.</div>}
            </div>;
          })()}
        </div>
      )}
      {/* BEREINIGUNG TAB */}
      {tab==='bereinigung'&&(
        <div>
          <div style={{fontSize:12,color:G600,marginBottom:12,padding:'8px 12px',background:'#fef9c3',borderRadius:8,border:'1px solid #fde68a'}}>
            🧹 Findet doppelte Vokabeln in allen Themenbereichen, sichert Lernstaende und entfernt Duplikate.
            <strong> Backup zuerst erstellen!</strong>
          </div>

          {/* Step 1: Backup */}
          <div style={{padding:14,background:G50,borderRadius:12,border:'1px solid '+G200,marginBottom:12}}>
            <div style={{fontWeight:'bold',fontSize:13,color:G900,marginBottom:6}}>📦 Schritt 1 - Backup</div>
            <div style={{fontSize:11,color:G400,marginBottom:10}}>Laedt alle Kapitel-Vokabeln und Lernstaende als JSON-Datei herunter. Falls etwas schieflaeuft kann der alte Stand wiederhergestellt werden.</div>
            <button onClick={runDedupBackup} disabled={dedupRunning}
              style={BtnStyle(T,'white',{opacity:dedupRunning?0.5:1,touchAction:'manipulation'})}>
              💾 Backup herunterladen
            </button>
          </div>

          {/* Step 2: Analyze */}
          <div style={{padding:14,background:G50,borderRadius:12,border:'1px solid '+G200,marginBottom:12}}>
            <div style={{fontWeight:'bold',fontSize:13,color:G900,marginBottom:6}}>🔍 Schritt 2 - Analysieren</div>
            <div style={{fontSize:11,color:G400,marginBottom:10}}>Findet alle Duplikate. Zeigt Vorschau: was bleibt, was geloescht wird, welcher Lernstand erhalten bleibt.</div>
            <button onClick={runDedupAnalyze} disabled={dedupRunning}
              style={BtnStyle('#7c3aed','white',{opacity:dedupRunning?0.5:1,touchAction:'manipulation'})}>
              {dedupRunning&&dedupPhase==='analyzing'?'Analysiere...':'🔍 Analysieren'}
            </button>
            {dedupPct>0&&dedupPct<100&&(
              <div style={{height:6,background:G200,borderRadius:3,overflow:'hidden',margin:'8px 0'}}>
                <div style={{height:'100%',width:dedupPct+'%',background:'#7c3aed',borderRadius:3,transition:'width 0.3s'}}/>
              </div>
            )}

            {/* Preview table */}
            {dedupPlan&&dedupPlan.totalDups>0&&(
              <div style={{marginTop:10}}>
                <div style={{display:'flex',gap:8,flexWrap:'wrap',marginBottom:8}}>
                  <span style={{padding:'4px 10px',background:'#fee2e2',borderRadius:8,fontSize:11,fontWeight:'bold',color:RE}}>
                    {dedupPlan.totalDups} Duplikate
                  </span>
                  <span style={{padding:'4px 10px',background:'#dbeafe',borderRadius:8,fontSize:11,fontWeight:'bold',color:'#1e40af'}}>
                    {dedupPlan.plan.length} Themenbereiche
                  </span>
                </div>
                <div style={{maxHeight:300,overflowY:'auto',border:'1px solid '+G200,borderRadius:8}}>
                  {dedupPlan.plan.map(function(ch){
                    return <div key={ch.chapterId}>
                      <div style={{padding:'6px 10px',background:'#f0fdf4',fontWeight:'bold',fontSize:11,color:T,borderBottom:'1px solid '+G200,position:'sticky',top:0}}>
                        {ch.chapterTitle} - {ch.dupGroups.length} Duplikat{ch.dupGroups.length!==1?'e':''}
                      </div>
                      {ch.dupGroups.map(function(g){
                        var prog=dedupPlan.wpMap[g.key];
                        var progStr=prog?('Topf '+prog.maxPot+(prog.learnedByAny?' gelern':'')):'kein Lernstand';
                        return <div key={g.key} style={{display:'flex',alignItems:'flex-start',gap:8,padding:'6px 10px',borderBottom:'1px solid '+G50,fontSize:11}}>
                          <div style={{flex:2}}>
                            <strong>{g.keep.word}</strong><span style={{color:G400}}> = {g.keep.clue}</span>
                          </div>
                          <div style={{flex:2}}>
                            {g.merged.important?'⭐ ':''}
                            {(g.merged.cats||[]).length>0
                              ? (g.merged.cats||[]).slice(0,3).map(function(c){return <span key={c} style={{display:'inline-block',padding:'1px 5px',borderRadius:99,fontSize:9,background:TL,color:T,margin:'1px'}}>{c}</span>;})
                              : <span style={{color:RE,fontSize:10}}>keine Kat.</span>
                            }
                          </div>
                          <div style={{flex:1,color:RE,fontSize:10}}>
                            {g.remove.length} entfernt
                          </div>
                          <div style={{flex:1,color:G400,fontSize:10}}>{progStr}</div>
                        </div>;
                      })}
                    </div>;
                  })}
                </div>
              </div>
            )}
            {dedupPlan&&dedupPlan.totalDups===0&&(
              <div style={{marginTop:8,padding:'10px 12px',background:'#d1fae5',borderRadius:8,fontSize:12,color:'#065f46',fontWeight:'bold'}}>
                Keine Duplikate gefunden!
              </div>
            )}
          </div>

          {/* Step 3: Execute */}
          {dedupPlan&&dedupPlan.totalDups>0&&(dedupPhase==='ready'||dedupPhase==='executing')&&(
            <div style={{padding:14,background:'#fef2f2',borderRadius:12,border:'1px solid #fecaca',marginBottom:12}}>
              <div style={{fontWeight:'bold',fontSize:13,color:RE,marginBottom:6}}>🧹 Schritt 3 - Bereinigen</div>
              <div style={{fontSize:11,color:G600,marginBottom:10}}>
                Entfernt die Duplikate permanent. Lernstaende werden zusammengefuehrt (bester Topf/Streak bleibt erhalten).
              </div>
              <button onClick={runDedupExecute} disabled={dedupRunning||dedupPhase!=='ready'}
                style={BtnStyle(RE,'white',{opacity:(dedupRunning||dedupPhase!=='ready')?0.5:1,touchAction:'manipulation'})}>
                {dedupRunning&&dedupPhase==='executing'?'Bereinige...':'Jetzt bereinigen'}
              </button>
              {dedupPct>0&&(
                <div style={{height:6,background:G200,borderRadius:3,overflow:'hidden',margin:'8px 0'}}>
                  <div style={{height:'100%',width:dedupPct+'%',background:RE,borderRadius:3,transition:'width 0.3s'}}/>
                </div>
              )}
            </div>
          )}

          {/* Log */}
          {dedupLog.length>0&&(
            <div ref={dedupLogRef} style={{maxHeight:180,overflowY:'auto',background:'white',border:'1px solid '+G200,borderRadius:8,padding:'8px 10px',fontSize:11,fontFamily:'monospace',lineHeight:1.9}}>
              {dedupLog.map(function(l,i){
                var col=l.t==='ok'?'#065f46':l.t==='err'?RE:l.t==='warn'?AM:G600;
                return <div key={i} style={{color:col}}>{l.msg}</div>;
              })}
            </div>
          )}

          {dedupPhase==='done'&&(
            <div style={{marginTop:10,padding:'10px 12px',background:'#d1fae5',borderRadius:8,fontSize:12,color:'#065f46',fontWeight:'bold',textAlign:'center'}}>
              ✅ Bereinigung abgeschlossen! Bitte Seite neu laden.
            </div>
          )}
        </div>
      )}

    </div>
  );
}
// ── Leaderboard ───────────────────────────────────────────────
function Leaderboard({ me }) {
  var [rows, setRows] = useState([]);
  var load = useCallback(function() {
    sbGet("players","is_admin=eq.false&order=total_score.desc&limit=20").then(function(d){
      if(Array.isArray(d)) setRows(d.map(function(p,i){
        var acc = p.total_correct+p.total_wrong > 0 ? Math.round(p.total_correct/(p.total_correct+p.total_wrong)*100) : 0;
        return Object.assign({},p,{rank:i+1,acc:acc});
      }));
    });
  }, []);
  useEffect(function(){ load(); var t=setInterval(load,5000); return function(){clearInterval(t);}; }, [load]);
  return (
    <div>
      <h3 style={{color:T,margin:"0 0 12px",fontSize:16}}>🏆 Rangliste</h3>
      {rows.map(function(r,i){
        var medalBg = i===0?"#fbbf24":i===1?"#9ca3af":i===2?"#cd7f32":G200;
        var isCurrent = me && r.id===me.id;
        return (
          <div key={r.id} style={{display:"flex",alignItems:"center",gap:10,padding:"10px 12px",marginBottom:6,background:isCurrent?TL:G50,borderRadius:10,border:"1px solid "+(isCurrent?T:G200)}}>
            <div style={{width:28,height:28,borderRadius:"50%",background:medalBg,display:"flex",alignItems:"center",justifyContent:"center",fontSize:13,fontWeight:"bold",color:"white",flexShrink:0}}>{i+1}</div>
            <div style={{flex:1}}>
              <div style={{fontWeight:"bold",fontSize:13,color:G900}}>{r.name}{isCurrent?" (Du)":""}</div>
              <div style={{fontSize:11,color:G400}}>{r.acc}% korrekt</div>
            </div>
            <div style={{textAlign:"right"}}>
              <div style={{fontSize:18,fontWeight:"bold",color:T}}>{r.total_score||0}</div>
              <div style={{fontSize:10,color:G400}}>Punkte</div>
            </div>
          </div>
        );
      })}
    </div>
  );
}

// ── Stats ─────────────────────────────────────────────────────
function Stats({ results, onRemedial, name }) {
  var real = results.filter(function(r){return r.word!=="__done__";});
  var wrong = real.filter(function(r){return !r.correct;});
  var corr = real.filter(function(r){return r.correct;});
  var tc = real.reduce(function(s,r){return s+(r.checkCount||0);},0);
  var mail = encodeURIComponent("Auswertung – "+name+"\n"+new Date().toLocaleDateString("de-DE")+"\n\nRichtig: "+corr.length+"/"+real.length+"\nPrüfen: "+tc+"×\n\n"+(wrong.length?"Falsch:\n"+wrong.map(function(r){return "  "+r.clue+" → "+r.word;}).join("\n")+"\n\n":"Alle richtig! 🎉\n\n")+"Richtig:\n"+corr.map(function(r){return "  "+r.clue+" → "+r.word;}).join("\n"));
  return (
    <div>
      <div style={{display:"flex",gap:8,marginBottom:16}}>
        {[["Richtig",corr.length,GR,"#d1fae5"],["Falsch",wrong.length,RE,"#fee2e2"],["Prüfen",tc+"×",AM,"#fffbeb"]].map(function(x){
          return <div key={x[0]} style={{flex:1,textAlign:"center",padding:"10px 6px",background:x[3],borderRadius:10}}><div style={{fontSize:22,fontWeight:"bold",color:x[2]}}>{x[1]}</div><div style={{fontSize:10,color:G400}}>{x[0]}</div></div>;
        })}
      </div>
      {wrong.length > 0 && (
        <div>
          <div style={{fontWeight:"bold",fontSize:13,color:RE,marginBottom:6}}>❌ Falsch</div>

}

// ── Login / Register ──────────────────────────────────────────
function LoginScreen({ onLogin, onGoRegister, users }) {
  var [name, setName] = useState("");
  var [pw, setPw] = useState("");
  var [err, setErr] = useState("");
  var [loading, setLoading] = useState(false);

  function doLogin() {
    var n = name.trim();
    if (!n) { setErr("Bitte Namen eingeben"); return; }
    if (!pw) { setErr("Bitte Passwort eingeben"); return; }
    setLoading(true); setErr("");

    // ADMIN SHORTCUT - always works, no Supabase needed
    if (n.toLowerCase() === "admin" && pw === "Magda1982") {
      setLoading(false);
      onLogin({ id: "admin-local", name: "admin", is_admin: true, total_score: 0, total_correct: 0, total_wrong: 0 });
      return;
    }

    var _hash = simpleHash(pw); // synchronous, never hangs

    // Step 1: check in-memory users list (loaded from Supabase on startup)
    var found = null;
    if (Array.isArray(users)) {
      found = users.find(function(u) { return u.name && u.name.toLowerCase() === n.toLowerCase(); });
    }
    if (found) {
      if (found.password_hash !== _hash) { setLoading(false); setErr("Falsches Passwort"); return; }
      if (found.is_active === false) { setLoading(false); setErr("Account noch nicht freigeschalten. Warte auf Admin-Genehmigung."); return; }
      setLoading(false); onLogin(found); return;
    }

    // Step 2: Supabase GET fallback
    sbGet("players", "name=ilike." + encodeURIComponent(n) + "&select=*").then(function(rows) {
      var sbFound = Array.isArray(rows) && rows.length > 0 ? rows[0] : null;
      if (sbFound) {
        if (sbFound.password_hash !== _hash) { setLoading(false); setErr("Falsches Passwort"); return; }
        if (sbFound.is_active === false) { setLoading(false); setErr("Account noch nicht freigeschalten."); return; }
        setLoading(false); onLogin(sbFound); return;
      }
      // Step 3: Last resort - check KNOWN_USERS directly (works fully offline)
      var knownFound = KNOWN_USERS.find(function(u){ return u.name.toLowerCase() === n.toLowerCase(); });
      if (knownFound) {
        if (knownFound.password_hash !== _hash) { setLoading(false); setErr("Falsches Passwort"); return; }
        setLoading(false); onLogin(knownFound); return;
      }
      setLoading(false); setErr("Kein Account gefunden. Bitte zuerst registrieren.");
    }).catch(function() {
      // Network completely down - try KNOWN_USERS as last resort
      var knownFound = KNOWN_USERS.find(function(u){ return u.name.toLowerCase() === n.toLowerCase(); });
      if (knownFound) {
        if (knownFound.password_hash !== _hash) { setLoading(false); setErr("Falsches Passwort"); return; }
        setLoading(false); onLogin(knownFound); return;
      }
      setLoading(false); setErr("Verbindungsfehler – bitte nochmal versuchen");
    });
  }

  var INP = {padding:"10px 14px",fontSize:16,border:"2px solid "+T,borderRadius:8,outline:"none",boxSizing:"border-box",width:"100%",marginBottom:8,display:"block"};
  return (
    <div style={{minHeight:"100vh",background:"linear-gradient(135deg,"+T+","+TD+")",display:"flex",alignItems:"center",justifyContent:"center",padding:"16px",fontFamily:"system-ui,sans-serif",boxSizing:"border-box"}}>
      <div style={{background:"white",borderRadius:20,padding:"28px 24px",maxWidth:360,width:"100%",boxShadow:"0 20px 50px rgba(0,0,0,.3)",textAlign:"center"}}>
        <div style={{fontSize:40,marginBottom:6}}>📚</div>
        <h1 style={{fontSize:20,color:T,margin:"0 0 3px"}}>Vokabel-Rätsel</h1>
        <p style={{color:G400,fontSize:13,margin:"0 0 16px"}}>Anmelden</p>
        <input value={name} onChange={function(e){setName(e.target.value);}} placeholder="Name…" style={INP} />
        <input type="password" value={pw} onChange={function(e){setPw(e.target.value);}} placeholder="Passwort…" onKeyDown={function(e){if(e.key==="Enter")doLogin();}} style={INP} />
        {err && <div style={{color:RE,fontSize:12,marginBottom:8,padding:"6px 10px",background:"#fef2f2",borderRadius:6}}>{err}</div>}
        <button onClick={doLogin} disabled={loading} style={BtnStyle(T,"#fff",{width:"100%",fontSize:15,padding:"10px",marginBottom:12,opacity:loading?0.7:1})}>{loading?"…":"Anmelden →"}</button>
        <div style={{borderTop:"1px solid "+G200,paddingTop:12}}>
          <p style={{fontSize:12,color:G400,margin:"0 0 8px"}}>Noch kein Account?</p>
          <button onClick={onGoRegister} style={BtnStyle(G100,T,{width:"100%",fontSize:13,border:"1px solid "+T})}>Neuen Account erstellen</button>
        </div>
      </div>
    </div>
  );
}

function RegisterScreen({ onRegister, onGoLogin, users, onUserAdded }) {
  var [name, setName] = useState("");
  var [pw, setPw] = useState("");
  var [pw2, setPw2] = useState("");
  var [err, setErr] = useState("");
  var [loading, setLoading] = useState(false);
  var [pending, setPending] = useState(false);

  function doReg() {
    var n = name.trim();
    if (!n) { setErr("Bitte Namen eingeben"); return; }
    if (!pw) { setErr("Bitte Passwort eingeben"); return; }
    if (pw !== pw2) { setErr("Passwörter stimmen nicht überein"); return; }
    if (pw.length < 4) { setErr("Passwort mind. 4 Zeichen"); return; }
    setLoading(true); setErr("");
    var _hash = simpleHash(pw);
    var alreadyExists = Array.isArray(users) && users.some(function(u) {
      return u.name && u.name.toLowerCase() === n.toLowerCase();
    });
    if (alreadyExists) { setLoading(false); setErr("Name bereits vergeben"); return; }
    sbGet("players", "name=ilike." + encodeURIComponent(n) + "&select=id").then(function(rows) {
      if (Array.isArray(rows) && rows.length > 0) { setLoading(false); setErr("Name bereits vergeben"); return; }
      sbPost("players", { name: n, password_hash: _hash, is_admin: false, is_active: false, total_score: 0, total_correct: 0, total_wrong: 0, puzzles_completed: 0 }).then(function(res) {
        if (res && res._err) {
          setLoading(false);
          setErr("Registrierung fehlgeschlagen: " + (res.msg || "Datenbankfehler") + " - bitte erneut versuchen.");
          return;
        }
        var u = (res && res.id) ? res : { id: "local_" + Date.now(), name: n, password_hash: _hash, is_admin: false, is_active: false, total_score: 0, total_correct: 0, total_wrong: 0 };
        u.is_active = false;
        if (onUserAdded) onUserAdded(u);
        setLoading(false); setPending(true);
      }).catch(function() {
        setErr("Verbindungsfehler - wird erneut versucht…");
        setTimeout(function() {
          sbPost("players", { name: n, password_hash: _hash, is_admin: false, is_active: false, total_score: 0, total_correct: 0, total_wrong: 0, puzzles_completed: 0 }).then(function(res2) {
            if (res2 && res2._err) { setLoading(false); setErr("Registrierung fehlgeschlagen. Bitte Verbindung prüfen."); return; }
            var u2 = (res2 && res2.id) ? res2 : { id: "local_" + Date.now(), name: n, password_hash: _hash, is_admin: false, is_active: false, total_score: 0, total_correct: 0, total_wrong: 0 };
            u2.is_active = false;
            if (onUserAdded) onUserAdded(u2);
            setLoading(false); setPending(true);
          }).catch(function() {
            setLoading(false);
            setErr("Keine Verbindung zur Datenbank. Account wurde nicht angelegt - bitte Internetverbindung prüfen.");
          });
        }, 2000);
    });
  });
  }

  var INP = {padding:"10px 14px",fontSize:16,border:"2px solid "+T,borderRadius:8,outline:"none",boxSizing:"border-box",width:"100%",marginBottom:8,display:"block"};
  return (
    <div style={{minHeight:"100vh",background:"linear-gradient(135deg,"+T+","+TD+")",display:"flex",alignItems:"center",justifyContent:"center",padding:"16px",fontFamily:"system-ui,sans-serif",boxSizing:"border-box"}}>
      <div style={{background:"white",borderRadius:20,padding:"28px 24px",maxWidth:360,width:"100%",boxShadow:"0 20px 50px rgba(0,0,0,.3)",textAlign:"center"}}>
        <div style={{fontSize:40,marginBottom:6}}>📚</div>
        <h1 style={{fontSize:20,color:T,margin:"0 0 3px"}}>Vokabel-Rätsel</h1>
        <p style={{color:G400,fontSize:13,margin:"0 0 16px"}}>Neuen Account erstellen</p>
        <input value={name} onChange={function(e){setName(e.target.value);}} placeholder="Name…" style={INP} />
        <input type="password" value={pw} onChange={function(e){setPw(e.target.value);}} placeholder="Passwort wählen…" style={INP} />
        <input type="password" value={pw2} onChange={function(e){setPw2(e.target.value);}} placeholder="Passwort bestätigen…" onKeyDown={function(e){if(e.key==="Enter")doReg();}} style={Object.assign({},INP,{border:"2px solid "+AM})} />
        {err && <div style={{color:RE,fontSize:12,marginBottom:8,padding:"6px 10px",background:"#fef2f2",borderRadius:6}}>{err}</div>}
        {pending ? (
          <div style={{background:"#d1fae5",border:"1px solid #6ee7b7",borderRadius:10,padding:"14px 16px",marginBottom:12,textAlign:"center"}}>
            <div style={{fontSize:20,marginBottom:4}}>⏳</div>
            <div style={{fontWeight:"bold",color:"#065f46",fontSize:14}}>Registrierung eingegangen!</div>
            <div style={{color:"#047857",fontSize:12,marginTop:4}}>Der Admin muss deinen Account noch freischalten.</div>
            <button onClick={onGoLogin} style={BtnStyle(T,"#fff",{width:"100%",marginTop:12,fontSize:13})}>Zum Login</button>
          </div>
        ) : (
          <button onClick={doReg} disabled={loading} style={BtnStyle(T,"#fff",{width:"100%",fontSize:15,padding:"10px",marginBottom:12,opacity:loading?0.7:1})}>{loading?"…":"Account erstellen →"}</button>
        )}
        <div style={{borderTop:"1px solid "+G200,paddingTop:12}}>
          <button onClick={onGoLogin} style={BtnStyle(G100,T,{width:"100%",fontSize:13,border:"1px solid "+T})}>Bereits registriert? Zum Login</button>
        </div>
      </div>
    </div>
  );
}
