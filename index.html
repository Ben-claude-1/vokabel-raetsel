var DEFAULT_STREAK = {
  upThresholds:   {1:2, 2:1, 3:1, 4:1},
  downThresholds: {1:0, 2:1, 3:1, 4:1}
};

function lsGetRuns() { return sbGet('ls_runs','select=*&order=created_at.desc'); }
function lsGetProgress(pid, rid) {
  var UUID=/^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/i;
  if(!UUID.test(pid)||!UUID.test(rid)) return Promise.resolve([]);
  return sbGet('ls_progress','player_id=eq.'+pid+'&run_id=eq.'+rid+'&select=*');
}
function lsSaveProgress(pid, rid, data, eid) {
  var UUID=/^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/i;
  if(!UUID.test(pid)||!UUID.test(rid)) return Promise.resolve({_ok:true});
  var payload = {data: JSON.stringify(data), updated_at: new Date().toISOString()};
  if(eid) return sbPatch('ls_progress', payload, 'id=eq.'+eid);
  return sbPost('ls_progress', Object.assign({player_id:pid, run_id:rid}, payload));
}

function lsInitProgress(words, sentences) {
  return {
    pots:{1:words.map(function(w){return{word:w.word,clue:w.clue,chapterId:w.chapterId||'',streak:0,wrongStreak:0};}),2:[],3:[],4:[],5:[]},
    sentences:(sentences||[]).map(function(s){return{text:s.text,translation:s.translation,streak:0};}),
    bonusStarted:false, history:[], lastWord:null, streak:0
  };
}

function lsPercent(progress, gs) {
  var p=progress.pots||{};
  var t=(p[1]||[]).length+(p[2]||[]).length+(p[3]||[]).length+(p[4]||[]).length+(p[5]||[]).length;
  if(t===0) return 0;
  var score=(p[1]||[]).length*0+(p[2]||[]).length*25+(p[3]||[]).length*50+(p[4]||[]).length*75+(p[5]||[]).length*100;
  var base=Math.round(score/t);
  if(progress.bonusStarted&&(progress.sentences||[]).length>0){
    var sl=progress.sentences.filter(function(s){return s.streak>=2;}).length;
    return Math.min(100,base+Math.round(sl/progress.sentences.length*10));
  }
  return base;
}

function lsGrade(pct, gs) {
  if(!gs||!gs.grades) return null;
  var correct=Math.round(pct/100*(gs.testSize||20));
  var errors=(gs.testSize||20)-correct;
  var sorted=(gs.grades||[]).slice().sort(function(a,b){return a.maxErrors-b.maxErrors;});
  for(var i=0;i<sorted.length;i++) if(errors<=sorted[i].maxErrors) return sorted[i].grade;
  return sorted.length?sorted[sorted.length-1].grade+1:null;
}

function lsPickWord(progress, lastWord) {
  var cands=[];
  [1,2,3,4].forEach(function(pot){
    (progress.pots[pot]||[]).forEach(function(w){
      if(w.disputeId) return; // skip pending dispute words
      if(!lastWord||w.word!==lastWord) cands.push({word:w,pot:pot});
    });
  });
  if(cands.length===0&&lastWord){
    [1,2,3,4].forEach(function(pot){(progress.pots[pot]||[]).forEach(function(w){
      if(!w.disputeId) cands.push({word:w,pot:pot});
    });});
  }
  // Only fallback to pending words if nothing else
  if(cands.length===0){
    [1,2,3,4].forEach(function(pot){(progress.pots[pot]||[]).forEach(function(w){cands.push({word:w,pot:pot});});});
  }
  return cands.length?shuffleArr(cands)[0]:null;
}

// ── T2LetterField: Buchstaben antippen oder drag & drop ───────
function T2LetterField({ word, onCorrect, onWrong }) {
  var initLetters=useMemo(function(){
    // Real letters from word
    var real=word.split('').map(function(l,i){return{l:l,id:'t2_'+i,dummy:false};});
    // Add 2-3 dummy letters (not in the word) to prevent seeing complete word
    var POOL='bcdfghjklmnpqrstvwxyz'.split('').filter(function(c){
      return word.toLowerCase().indexOf(c)<0;
    });
    var extras=shuffleArr(POOL).slice(0,Math.min(3,POOL.length));
    var dummies=extras.map(function(l,i){return{l:l,id:'t2_dummy_'+i,dummy:true};});
    return shuffleArr(real.concat(dummies));
  },[word]);

  var [source,setSource]=useState(initLetters);
  var [answer,setAnswer]=useState([]);
  var [dragId,setDragId]=useState(null);
  var [dragFrom,setDragFrom]=useState(null);
  var [overZone,setOverZone]=useState(null);
  var [overIdx,setOverIdx]=useState(null);
  var [checked,setChecked]=useState(false);
  var [correct,setCorrect]=useState(null);

  useEffect(function(){
    setSource(shuffleArr(word.split('').map(function(l,i){return{l:l,id:'t2_'+i};})));
    setAnswer([]); setChecked(false); setCorrect(null);
  },[word]);

  function getTile(id){return source.find(function(t){return t.id===id;})||answer.find(function(t){return t.id===id;});}
  function moveToAnswer(tile,idx){
    setSource(function(s){return s.filter(function(t){return t.id!==tile.id;});});
    setAnswer(function(a){var na=a.filter(function(t){return t.id!==tile.id;});if(typeof idx==='number')na.splice(idx,0,tile);else na.push(tile);return na;});
  }
  function moveToSource(tile){
    setAnswer(function(a){return a.filter(function(t){return t.id!==tile.id;});});
    setSource(function(s){return s.concat([tile]);});
  }
  function reorderAnswer(tile,idx){
    setAnswer(function(a){var na=a.filter(function(t){return t.id!==tile.id;});if(typeof idx==='number')na.splice(idx,0,tile);else na.push(tile);return na;});
  }
  function check(){
    var typed=answer.map(function(t){return t.l;}).join('');
    var ok=typed.toLowerCase()===word.toLowerCase();
    setChecked(true); setCorrect(ok);
    if(ok) onCorrect(); else onWrong(typed);
  }
  var complete=answer.length===word.length;

  var tileBase={display:'inline-flex',alignItems:'center',justifyContent:'center',width:38,height:38,borderRadius:6,fontSize:18,fontWeight:'bold',cursor:checked?'default':'pointer',userSelect:'none',touchAction:'none',flexShrink:0,transition:'border-color 0.1s'};

  function dropOnAnswer(e,insertIdx){
    e.preventDefault();
    if(!dragId) return;
    var tile=getTile(dragId);
    if(!tile) return;
    if(dragFrom==='source') moveToAnswer(tile,insertIdx);
    else reorderAnswer(tile,insertIdx);
    setDragId(null);setDragFrom(null);setOverZone(null);setOverIdx(null);
  }

  return (
    <div>
      {/* Answer zone */}
      <div onDragOver={function(e){e.preventDefault();setOverZone('answer');}}
        onDrop={function(e){dropOnAnswer(e,answer.length);}}
        style={{display:'flex',flexWrap:'wrap',gap:5,minHeight:54,padding:8,borderRadius:8,border:'2px solid '+(overZone==='answer'?'#0369a1':'#93c5fd'),background:overZone==='answer'?'#eff6ff':'#f0f9ff',marginBottom:8,alignItems:'center',justifyContent:'center',position:'relative'}}>
        <div style={{position:'absolute',top:3,left:8,fontSize:10,color:'#93c5fd'}}>Antwortfeld</div>
        {answer.length===0&&<span style={{color:G400,fontSize:12,marginTop:8}}>Antippen oder hierher ziehen</span>}
        {answer.map(function(tile,idx){
          var corr=checked&&tile.l===word[idx];
          var wrng=checked&&tile.l!==word[idx];
          return (
            <div key={tile.id} style={{display:'inline-flex',alignItems:'center'}}>
              <div onDragOver={function(e){e.preventDefault();setOverIdx(idx);}}
                onDrop={function(e){dropOnAnswer(e,idx);}}
                style={{width:overIdx===idx?4:0,height:38,background:'#0369a1',borderRadius:2,transition:'width 0.12s'}}/>
              <div draggable={!checked}
                onDragStart={function(){if(!checked){setDragId(tile.id);setDragFrom('answer');}}}
                onDragEnd={function(){setDragId(null);setOverZone(null);setOverIdx(null);}}
                onClick={function(){if(!checked)moveToSource(tile);}}
                style={Object.assign({},tileBase,
                  {border:'1.5px solid '+(dragId===tile.id?'#93c5fd':corr?'#22c55e':wrng?'#ef4444':'#0369a1'),
                  background:dragId===tile.id?'#dbeafe':corr?'#dcfce7':wrng?'#fee2e2':'#eff6ff',
                  color:corr?'#15803d':wrng?'#dc2626':'#1e40af',opacity:dragId===tile.id?0.4:1})}>
                {tile.l}
              </div>
            </div>
          );
        })}
        {answer.length>0&&<div onDragOver={function(e){e.preventDefault();setOverIdx(answer.length);}}
          onDrop={function(e){dropOnAnswer(e,answer.length);}}
          style={{width:overIdx===answer.length?4:6,height:38,background:overIdx===answer.length?'#0369a1':'transparent',borderRadius:2,transition:'width 0.12s'}}/>}
      </div>
      {/* Source zone */}
      <div onDragOver={function(e){e.preventDefault();setOverZone('source');}}
        onDrop={function(e){e.preventDefault();if(!dragId||dragFrom!=='answer')return;var t=getTile(dragId);if(t)moveToSource(t);setDragId(null);setDragFrom(null);setOverZone(null);}}
        style={{display:'flex',flexWrap:'wrap',gap:5,minHeight:46,padding:'6px 8px',borderRadius:8,border:'1px dashed '+(overZone==='source'?'#0369a1':G200),background:overZone==='source'?'#eff6ff':G50,alignItems:'center',justifyContent:'center',marginBottom:10}}>
        <div style={{fontSize:10,color:G400,width:'100%',textAlign:'center'}}>Vorrat - antippen oder ziehen</div>
        {source.length===0&&<span style={{color:G400,fontSize:11}}>Alle eingesetzt</span>}
        {source.map(function(tile){
          return <div key={tile.id} draggable={!checked}
            onDragStart={function(){if(!checked){setDragId(tile.id);setDragFrom('source');}}}
            onDragEnd={function(){setDragId(null);setOverZone(null);}}
            onClick={function(){if(!checked)moveToAnswer(tile);}}
            style={Object.assign({},tileBase,{border:'1.5px solid '+(dragId===tile.id?'#93c5fd':G200),background:dragId===tile.id?'#dbeafe':G50,color:G900,opacity:dragId===tile.id?0.4:1})}>
            {tile.l}
          </div>;
        })}
      </div>
      {!checked&&<button onClick={check} disabled={!complete}
        style={BtnStyle(complete?'#f97316':G400,'white',{width:'100%',padding:'12px',opacity:complete?1:0.6,touchAction:'manipulation'})}>
        {complete?'✓ Prüfen':'Alle Buchstaben einsetzen'}
      </button>}
    </div>
  );
}

// ── LeitersSpielSession - 5-Topf mit persistentem Speichern ──
function LeitersSpielSession({ run, player, gradeSettings, streakSettings, onBack }) {
  var ss=streakSettings||DEFAULT_STREAK;
  var [progress,setProgress]=useState(null);
  var [progressId,setProgressId]=useState(null);
  var [currentItem,setCurrentItem]=useState(null);
  var [result,setResult]=useState(null);
  var [loading,setLoading]=useState(true);
  var [saving,setSaving]=useState(false);
  var [saveErr,setSaveErr]=useState(false);
  var [celebration,setCelebration]=useState(null);
  var [view,setView]=useState('learn'); // 'learn'|'pots'
  var [disputeSent,setDisputeSent]=useState(false);
  var [openPot,setOpenPot]=useState(null); // which pot is expanded
  var [quizAnswers,setQuizAnswers]=useState([]);
  var [typeInput,setTypeInput]=useState('');
  var [sentInput,setSentInput]=useState('');
  var typeInputRef=useRef();
  var sentInputRef=useRef();

  var words=useMemo(function(){try{return JSON.parse(run.words||'[]');}catch(e){return[];}});
  var sentences=useMemo(function(){try{return JSON.parse(run.sentences||'[]');}catch(e){return[];}});

  // Load or init
  useEffect(function(){
    if(!player) return;
    lsGetProgress(player.id,run.id).then(function(rows){
      if(Array.isArray(rows)&&rows.length>0){
        var row=rows[0]; setProgressId(row.id);
        var data=JSON.parse(row.data||'{}');
        // Migrate 4→5 pots
        if(data.pots&&data.pots[4]&&!data.pots[5]){
          data.pots[5]=data.pots[4]; data.pots[4]=data.pots[3];
          data.pots[3]=data.pots[2]; data.pots[2]=[];
        }
        if(!data.pots[5]) data.pots[5]=[];
        setProgress(data); setCurrentItem(lsPickWord(data,data.lastWord));
      } else {
        var init=lsInitProgress(words,sentences);
        setProgress(init); setCurrentItem(lsPickWord(init,null));
      }
      setLoading(false);
    });
  },[]);

  // Build quiz answers for pot 1
  // REGEL: Deutsches Wort zeigen → 4 englische Optionen
  // Ähnlichkeiten: Verben bei Verben, etc. (einfache Heuristik via Suffix)
  useEffect(function(){
    if(!currentItem||currentItem.pot!==1||!progress) return;
    var correct=currentItem.word;
    // Try to find similar-type words as distractors
    var allWords=words.filter(function(w){return w.word!==correct.word;});
    // Heuristic: group by word ending / type
    function getType(w){
      var word=w.word.toLowerCase();
      if(['ing','ed','ate','ise','ize','ify'].some(function(s){return word.endsWith(s);})) return 'verb';
      if(['ful','less','ous','ive','ent','ant','al','tic'].some(function(s){return word.endsWith(s);})) return 'adj';
      if(['tion','ment','ness','ity','ance','ence','er','or','ist'].some(function(s){return word.endsWith(s);})) return 'noun';
      return 'other';
    }
    var cType=getType(correct);
    var similar=allWords.filter(function(w){return getType(w)===cType;});
    var pool=similar.length>=3?similar:allWords;
    var distractors=shuffleArr(pool).slice(0,3);
    setQuizAnswers(shuffleArr([correct].concat(distractors)));
  },[currentItem]);

  // Focus type input
  useEffect(function(){
    if(!currentItem||currentItem.pot<3||result) return;
    setTypeInput('');
    setTimeout(function(){if(typeInputRef.current)typeInputRef.current.focus();},100);
  },[currentItem,result]);

  // ── Persistent save: called after EVERY answer ──
  function saveProgress(np) {
    if(!player||!run.id) return;
    setSaving(true); setSaveErr(false);
    lsSaveProgress(player.id,run.id,np,progressId).then(function(res){
      setSaving(false);
      if(res&&res._err){ setSaveErr(true); return; }
      if(res&&res.id&&!progressId) setProgressId(res.id);
    }).catch(function(){ setSaving(false); setSaveErr(true); });
  }

  function submitDispute() {
    if(!currentItem||disputeSent||!player) return;
    var word=currentItem.word;
    var pot=currentItem.pot;
    // Save dispute to DB
    var UUID=/^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/i;
    var pid=UUID.test(player.id)?player.id:null;
    var rid=UUID.test(run.id)?run.id:null;
    sbPost('word_disputes',{
      player_id:pid,
      player_name:player.name,
      run_id:rid,
      word:word.word,
      clue:word.clue,
      typed_answer:result?result.typed:'',
      pot:pot,
      chapter_id:word.chapterId||word.topic||''
    }).then(function(res){
      if(res&&!res._err){
        var dispId=res.id||('local_'+Date.now());
        // Mark word as pending in progress
        var np=JSON.parse(JSON.stringify(progress));
        np.pots[pot]=np.pots[pot].map(function(w){
          return w.word===word.word?Object.assign({},w,{disputeId:dispId}):w;
        });
        setProgress(np);
        saveProgress(np);
        setDisputeSent(true);
      }
    });
  }

  function handleAnswer(isCorrect) {
    if(!currentItem||result) return;
    var np=JSON.parse(JSON.stringify(progress));
    var pot=currentItem.pot;
    var widx=np.pots[pot].findIndex(function(w){return w.word===currentItem.word.word;});
    if(widx<0) return;
    var word=np.pots[pot][widx];
    var upT=(ss.upThresholds[pot]!==undefined)?ss.upThresholds[pot]:1;
    var dnT=(ss.downThresholds[pot]!==undefined)?ss.downThresholds[pot]:1;

    if(isCorrect){
      word.streak=Math.max(0,word.streak||0)+1; word.wrongStreak=0;
      word.totalCorrect=(word.totalCorrect||0)+1; // NEVER resets
      np.streak=(np.streak||0)+1;
      if(upT>0&&word.streak>=upT){
        np.pots[pot].splice(widx,1); word.streak=0; word.wrongStreak=0;
        // totalCorrect/totalWrong preserved across pot moves
        var nextPot=Math.min(pot+1,5); np.pots[nextPot].push(word);
        // Award points when word reaches a new highest pot (maxPot tracks highest ever reached)
        // Note system: Topf1=Note5(+10), Topf2=Note4(+20), Topf3=Note3(+30), Topf4=Note2(+40), Topf5=Note1(+50)+gelernt(+10)
        var POT_PTS={1:10,2:20,3:30,4:40,5:60};
        var prevMax=word.maxPot||0;
        if(nextPot>prevMax){
          word.maxPot=nextPot;
          if(player){
            var UUID=/^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/i;
            if(UUID.test(player.id)){
              var pts=POT_PTS[nextPot]||0;
              var newScore=(player.total_score||0)+pts;
              var newCorrect=(player.total_correct||0)+1;
              sbPatch('players',{total_score:newScore,total_correct:newCorrect},'id=eq.'+player.id);
              setPlayer(function(pl){return Object.assign({},pl,{total_score:newScore,total_correct:newCorrect});});
            }
          }
        }
        var newGr=lsGrade(lsPercent(np,gradeSettings),gradeSettings);
        var oldGr=lsGrade(lsPercent(progress,gradeSettings),gradeSettings);
        if(newGr&&oldGr&&newGr<oldGr) setCelebration(newGr);
        if(!np.bonusStarted&&np.pots[1].length===0&&np.pots[2].length===0&&np.pots[3].length===0&&np.pots[4].length===0&&np.sentences.length>0) np.bonusStarted=true;
      }
    } else {
      word.wrongStreak=Math.max(0,word.wrongStreak||0)+1; word.streak=0;
      word.totalWrong=(word.totalWrong||0)+1; // NEVER resets
      np.streak=0;
      if(dnT>0&&word.wrongStreak>=dnT&&pot>1){
        np.pots[pot].splice(widx,1); word.streak=0; word.wrongStreak=0;
        np.pots[pot-1].push(word);
      }
    }
    np.lastWord=currentItem.word.word;
    np.history=(np.history||[]).concat([{date:new Date().toISOString(),grade:lsGrade(lsPercent(np,gradeSettings),gradeSettings),percent:lsPercent(np,gradeSettings)}]).slice(-100);

    setProgress(np);
    setResult({correct:isCorrect, typed:typeInput, expected:currentItem.pot===2?currentItem.word.word:currentItem.word.clue});
    // ← SOFORT in Supabase speichern
    saveProgress(np);
  }

  function next(){
    setResult(null); setTypeInput(''); setDisputeSent(false);
    var ni=lsPickWord(progress,currentItem&&currentItem.word?currentItem.word.word:null);
    setCurrentItem(ni);
  }

  if(loading) return <div style={{textAlign:'center',padding:40,color:G400}}>Lade Fortschritt…</div>;
  if(!progress) return null;

  var pct=lsPercent(progress,gradeSettings);
  var grade=lsGrade(pct,gradeSettings);
  var allVocabDone=(progress.pots[1]||[]).length===0&&(progress.pots[2]||[]).length===0&&(progress.pots[3]||[]).length===0&&(progress.pots[4]||[]).length===0;
  var bonusAllDone=allVocabDone&&progress.sentences.every(function(s){return s.streak>=2;});

  // ── POTS VIEW - klick auf Topf zeigt Vokabeln ──
  var potLabels={1:'Topf 1 - Quiz (DE→EN)',2:'Topf 2 - Buchstaben-Puzzle',3:'Topf 3 - DE→EN Tippen',4:'Topf 4 - EN→DE Tippen',5:'✅ Gelernt'};
  var potColors={1:RE,2:'#f97316',3:AM,4:T,5:GR};

  if(view==='pots'){
    return (
      <div>
        <button onClick={function(){setView('learn');setOpenPot(null);}} style={BtnStyle(G100,G600,{marginBottom:12,fontSize:12})}>← Zurück</button>
        {[1,2,3,4,5].map(function(pot){
          var pWords=progress.pots[pot]||[];
          var isOpen=openPot===pot;
          return (
            <div key={pot} style={{marginBottom:8,border:'2px solid '+potColors[pot]+'40',borderRadius:10,overflow:'hidden'}}>
              <div onClick={function(){setOpenPot(isOpen?null:pot);}}
                style={{background:potColors[pot]+'15',padding:'10px 12px',fontWeight:'bold',fontSize:12,color:potColors[pot],display:'flex',justifyContent:'space-between',cursor:'pointer',alignItems:'center'}}>
                <span>{potLabels[pot]}</span>
                <div style={{display:'flex',alignItems:'center',gap:8}}>
                  <span style={{background:potColors[pot],color:'white',borderRadius:99,padding:'2px 8px',fontSize:12}}>{pWords.length}</span>
                  <span style={{fontSize:12}}>{isOpen?'▲':'▼'}</span>
                </div>
              </div>
              {isOpen&&<div style={{padding:'6px 10px',maxHeight:300,overflowY:'auto'}}>
                {pWords.length===0&&<div style={{color:G400,fontSize:11,padding:'4px 0'}}>Leer</div>}
                {pWords.map(function(w,i){
                  return <div key={i} style={{display:'flex',justifyContent:'space-between',alignItems:'center',padding:'4px 0',borderBottom:'1px solid '+G50,fontSize:12}}>
                    <div>
                      <span style={{fontWeight:'bold',color:G900}}>{w.word}</span>
                      <span style={{color:G400,marginLeft:8}}>{w.clue}</span>
                    </div>
                    <div style={{display:'flex',gap:4}}>
                      <span style={{fontSize:10,color:GR,background:'#dcfce7',padding:'1px 5px',borderRadius:5}}>✓{w.totalCorrect||0}</span>
                      <span style={{fontSize:10,color:RE,background:'#fee2e2',padding:'1px 5px',borderRadius:5}}>✗{w.totalWrong||0}</span>
                    </div>
                  </div>;
                })}
              </div>}
            </div>
          );
        })}
      </div>
    );
  }

  // ── HEADER ──
  var p=progress.pots;
  var header=(
    <div style={{marginBottom:10}}>
      {saveErr&&<div style={{fontSize:10,color:RE,background:'#fef2f2',padding:'3px 8px',borderRadius:5,marginBottom:4}}>⚠️ Speichern fehlgeschlagen - wird erneut versucht</div>}
      <div style={{display:'flex',alignItems:'center',gap:8,marginBottom:5}}>
        <div style={{flex:1}}>
          <div style={{display:'flex',justifyContent:'space-between',fontSize:11,color:G400,marginBottom:3}}>
            <span>{pct}%{saving?' 💾':''}</span>
            {grade&&<span style={{fontWeight:'bold'}}>Note: <GradeDisplay grade={grade} size={13}/></span>}
          </div>
          <div style={{height:6,background:G200,borderRadius:3,overflow:'hidden'}}>
            <div style={{height:'100%',width:pct+'%',background:'linear-gradient(90deg,'+AM+','+GR+')',borderRadius:3,transition:'width 0.5s'}}/>
          </div>
        </div>
        <button onClick={function(){setView('pots');}} style={{fontSize:10,padding:'3px 7px',borderRadius:6,border:'1px solid '+G200,background:'white',cursor:'pointer',color:G600,flexShrink:0}}>📊 Töpfe</button>
      </div>
      <div style={{display:'flex',gap:3,justifyContent:'center'}}>
        {[{n:(p[1]||[]).length,c:RE,l:'T1'},{n:(p[2]||[]).length,c:'#f97316',l:'T2'},{n:(p[3]||[]).length,c:AM,l:'T3'},{n:(p[4]||[]).length,c:T,l:'T4'},{n:(p[5]||[]).length,c:GR,l:'✓'}].map(function(x,i){
          return <div key={i} onClick={function(){setView('pots');setOpenPot(i+1);}} style={{textAlign:'center',padding:'2px 6px',borderRadius:5,background:x.c+'15',minWidth:34,cursor:'pointer'}}>
            <div style={{fontSize:13,fontWeight:'bold',color:x.c}}>{x.n}</div>
            <div style={{fontSize:9,color:G400}}>{x.l}</div>
          </div>;
        })}
        {progress.streak>1&&<div style={{textAlign:'center',padding:'2px 6px',borderRadius:5,background:'#fef3c7',minWidth:34}}>
          <div style={{fontSize:13,fontWeight:'bold',color:AM}}>🔥{progress.streak}</div>
          <div style={{fontSize:9,color:G400}}>Streak</div>
        </div>}
      </div>
    </div>
  );

  // Done states
  if(allVocabDone&&!progress.bonusStarted&&progress.sentences.length>0){
    return <div style={{padding:8}}>{header}
      <div style={{textAlign:'center',padding:24,background:'#d1fae5',borderRadius:14}}>
        <div style={{fontSize:40,marginBottom:8}}>🎯</div>
        <div style={{fontWeight:'bold',fontSize:16,color:'#065f46'}}>Alle Vokabeln gelernt!</div>
        <button onClick={function(){var np=JSON.parse(JSON.stringify(progress));np.bonusStarted=true;setProgress(np);saveProgress(np);}}

      </div>
    </div>;
  }
  if(bonusAllDone) return <div style={{padding:8}}>{header}
    <div style={{textAlign:'center',padding:24,background:'#d1fae5',borderRadius:14}}>
      <div style={{fontSize:50,marginBottom:8}}>🏆</div>
      <div style={{fontWeight:'bold',fontSize:18,color:'#065f46'}}>100% - Du bist bereit!</div>
      {grade&&<div style={{marginTop:8}}>Note: <GradeDisplay grade={grade} size={32}/></div>}

  // Bonus sentences
  if(progress.bonusStarted){

          var ok=checkAnswer(sentInput,activeSent.translation)==='correct';
          var np=JSON.parse(JSON.stringify(progress));
          var idx=np.sentences.findIndex(function(x){return x.text===activeSent.text;});
          if(idx>=0){if(ok)np.sentences[idx].streak=Math.min((np.sentences[idx].streak||0)+1,2);else np.sentences[idx].streak=0;}
          setProgress(np); setResult({correct:ok}); saveProgress(np); setSentInput('');
        }} style={BtnStyle('#7c3aed','white',{padding:'10px 16px'})}>✓</button>
      </div>}
      {result&&<button onClick={function(){setResult(null);setSentInput('');}} style={BtnStyle(T,'white',{width:'100%',padding:'12px'})}>→ Weiter</button>}
    </div>;
  }

  if(!currentItem) return <div style={{padding:8}}>{header}<div style={{textAlign:'center',color:G400,padding:20}}>Keine Vokabeln.</div></div>;

  var word=currentItem.word; var pot=currentItem.pot;
  var potColors2={1:RE,2:'#f97316',3:AM,4:T};
  var potLabel2={1:'Topf 1 - Quiz',2:'Topf 2 - Buchstaben-Puzzle',3:'Topf 3 - DE → EN',4:'Topf 4 - EN → DE'};

  // ── POT 1: Quiz - Deutsches Wort → 4 englische Optionen ──
  if(pot===1) return <div style={{padding:8}}>
    {celebration&&<CelebrationPopup newGrade={celebration} onClose={function(){setCelebration(null);}}/>}
    {header}
    <div style={{textAlign:'center',fontSize:10,color:RE,textTransform:'uppercase',letterSpacing:1,marginBottom:5}}>{potLabel2[1]}</div>
    <div style={{textAlign:'center',padding:'18px 14px',background:result?(result.correct?'#d1fae5':'#fef2f2'):'white',borderRadius:14,marginBottom:10,border:'2px solid '+(result?result.correct?GR:RE:G200)}}>
      <div style={{fontSize:11,color:G400,marginBottom:4}}>Was bedeutet auf Englisch:</div>
      <div style={{fontSize:26,fontWeight:'bold',color:G900}}>{word.clue}</div>
      {result&&<div style={{marginTop:8,fontSize:14,fontWeight:'bold',color:result.correct?GR:RE}}>{result.correct?'✓ Richtig!':'✗ Falsch - '+word.word}</div>}
    </div>
    {!result&&<div style={{display:'grid',gridTemplateColumns:'1fr 1fr',gap:8}}>
      {quizAnswers.map(function(a,i){
        return <button key={i} onClick={function(){handleAnswer(a.word===word.word);}}
          style={BtnStyle(G50,G900,{padding:'10px',fontSize:13,border:'2px solid '+G200,textAlign:'center',touchAction:'manipulation'})}>{a.word}</button>;
      })}
    </div>}
    {result&&!result.correct&&<div style={{marginTop:6,marginBottom:2}}>
      {disputeSent
        ? <div style={{padding:'7px 10px',borderRadius:8,background:'#fef3c7',border:'1.5px solid #f59e0b',fontSize:11,color:'#92400e',textAlign:'center'}}>
            ⏳ Anfrage gesendet - Wort pausiert bis Admin entscheidet
          </div>
        : <button onClick={submitDispute}
            style={{width:'100%',padding:'8px',borderRadius:8,border:'1.5px dashed #f59e0b',background:'#fffbeb',color:'#92400e',cursor:'pointer',fontSize:12,touchAction:'manipulation'}}>
            ❓ Meine Antwort war korrekt - Anfrage stellen
          </button>
      }
    </div>}
    {result&&<button onClick={next} style={BtnStyle(T,'white',{width:'100%',padding:'12px',marginTop:8})}>→ Weiter</button>}
  </div>;

  // ── POT 2: Buchstaben-Puzzle ──
  if(pot===2) return <div style={{padding:8}}>
    {celebration&&<CelebrationPopup newGrade={celebration} onClose={function(){setCelebration(null);}}/>}
    {header}
    <div style={{textAlign:'center',fontSize:10,color:'#f97316',textTransform:'uppercase',letterSpacing:1,marginBottom:5}}>{potLabel2[2]}</div>
    <div style={{textAlign:'center',padding:'14px',background:result?(result.correct?'#d1fae5':'#fef2f2'):'white',borderRadius:14,marginBottom:10,border:'2px solid '+(result?result.correct?GR:RE:G200)}}>
      <div style={{fontSize:11,color:G400,marginBottom:4}}>Schreibe auf Englisch:</div>
      <div style={{fontSize:22,fontWeight:'bold',color:G900}}>{word.clue}</div>
      {result&&<div style={{marginTop:8}}>
        <div style={{fontSize:14,fontWeight:'bold',color:result.correct?GR:RE}}>{result.correct?'✓ Richtig!':'✗ Falsch'}</div>
        {!result.correct&&<div style={{marginTop:6,display:'flex',gap:8,justifyContent:'center',flexWrap:'wrap'}}>
          <div style={{fontSize:12,padding:'3px 8px',background:'#fee2e2',borderRadius:5,color:RE}}>Du: {result.typed||'?'}</div>
          <div style={{fontSize:12,padding:'3px 8px',background:'#dcfce7',borderRadius:5,color:GR}}>Richtig: {word.word}</div>
        </div>}
      </div>}
    </div>
    {!result&&<T2LetterField word={word.word}
                onCorrect={function(){handleAnswer(true);}}
                onWrong={function(typed){
                  setResult({correct:false,typed:typed||'?',expected:word.word});
                  handleAnswer(false);
                }}/>}
    {result&&!result.correct&&<div style={{marginTop:6,marginBottom:2}}>
      {disputeSent
        ? <div style={{padding:'7px 10px',borderRadius:8,background:'#fef3c7',border:'1.5px solid #f59e0b',fontSize:11,color:'#92400e',textAlign:'center'}}>
            ⏳ Anfrage gesendet - Wort pausiert bis Admin entscheidet
          </div>
        : <button onClick={submitDispute}
            style={{width:'100%',padding:'8px',borderRadius:8,border:'1.5px dashed #f59e0b',background:'#fffbeb',color:'#92400e',cursor:'pointer',fontSize:12,touchAction:'manipulation'}}>
            ❓ Meine Antwort war korrekt - Anfrage stellen
          </button>
      }
    </div>}
    {result&&<button onClick={next} style={BtnStyle(T,'white',{width:'100%',padding:'12px'})}>→ Weiter</button>}
  </div>;

  // ── POT 3: DE→EN tippen mit Kästchen direkt als Input ──
  if(pot===3){
    var wordParts=word.word.split(' ');
    var boxW=Math.max(22,Math.min(36,180/word.word.length));
    return <div style={{padding:8}}>
      {celebration&&<CelebrationPopup newGrade={celebration} onClose={function(){setCelebration(null);}}/>}
      {header}
      <div style={{textAlign:'center',fontSize:10,color:AM,textTransform:'uppercase',letterSpacing:1,marginBottom:5}}>{potLabel2[3]}</div>
      <div style={{textAlign:'center',padding:'14px',background:result?(result.correct?'#d1fae5':result.partial?'#fefce8':'#fef2f2'):'white',borderRadius:14,marginBottom:10,border:'2px solid '+(result?result.correct?GR:result.partial?AM:RE:G200)}}>
        <div style={{fontSize:11,color:G400,marginBottom:4}}>Schreibe auf Englisch:</div>
        <div style={{fontSize:22,fontWeight:'bold',color:G900}}>{word.clue}</div>
        {result&&<div style={{marginTop:8}}>
          <div style={{fontSize:14,fontWeight:'bold',color:result.correct?GR:result.partial?AM:RE}}>
            {result.correct?'✓ Richtig!':result.partial?'⚠️ Fast korrekt - „to" fehlt':'✗ Falsch'}
          </div>
          {!result.correct&&<div style={{marginTop:6,display:'flex',gap:8,justifyContent:'center',flexWrap:'wrap'}}>
            <div style={{fontSize:12,padding:'3px 8px',background:result.partial?'#fef3c7':'#fee2e2',borderRadius:5,color:result.partial?'#92400e':RE}}>Du: {result.typed}</div>
            <div style={{fontSize:12,padding:'3px 8px',background:'#dcfce7',borderRadius:5,color:GR}}>Richtig: {word.word}</div>
          </div>}
        </div>}
      </div>
      {!result&&<div>
        {/* Kästchen-Anzeige mit Längenhinweis */}
        <div style={{fontSize:11,color:G400,textAlign:'center',marginBottom:6}}>
          {wordParts.length===1?wordParts[0].length+' Buchstaben':wordParts.length+' Wörter: '+wordParts.map(function(w){return w.length;}).join(' + ')+' Buchstaben'}
        </div>
        {/* Input DIREKT über den Strichen - transparenter Input mit Strich-Visualisierung */}
        <div style={{position:'relative',marginBottom:12}}>
          <div style={{display:'flex',gap:6,justifyContent:'center',flexWrap:'wrap',pointerEvents:'none',userSelect:'none',padding:'0 4px'}}>
            {wordParts.map(function(wp,wi){
              return <div key={wi} style={{display:'flex',gap:3,alignItems:'flex-end'}}>
                {wi>0&&<span style={{color:G400,fontSize:16,paddingBottom:6,lineHeight:'1'}}>·</span>}
                {wp.split('').map(function(_,li){
                  var charIdx=wordParts.slice(0,wi).join('').length+li;
                  var typedChar=typeInput[charIdx]||'';
                  return <div key={li} style={{width:boxW,height:34,borderBottom:'2px solid '+AM,display:'flex',alignItems:'flex-end',justifyContent:'center',paddingBottom:2}}>
                    <span style={{fontSize:15,fontWeight:'bold',color:G600}}>{typedChar||''}</span>
                  </div>;
                })}
              </div>;
            })}
          </div>
          <input ref={typeInputRef} value={typeInput} onChange={function(e){setTypeInput(e.target.value);}}
            onKeyDown={function(e){if(e.key==='Enter'){var ca=checkAnswer(typeInput,word.word);var ok=ca==='correct';if(ca==='partial'){setResult({correct:false,partial:true,typed:typeInput,expected:word.word});}else if(!ok){setResult({correct:false,typed:typeInput,expected:word.word});}handleAnswer(ok);}}}
            autoCapitalize="none" autoCorrect="off" spellCheck="false"
            type="text" inputMode="text"
            style={{position:'absolute',top:0,left:0,width:'100%',height:'100%',opacity:0,fontSize:16,cursor:'text',textTransform:'none'}}/>
        </div>
        <div style={{display:'flex',gap:8}}>
          <button onClick={function(){var ca=checkAnswer(typeInput,word.word);var ok=ca==='correct';if(ca==='partial'){setResult({correct:false,partial:true,typed:typeInput,expected:word.word});}else if(!ok){setResult({correct:false,typed:typeInput,expected:word.word});}handleAnswer(ok);}}
            style={BtnStyle(AM,'white',{flex:1,padding:'12px'})}>✓ Prüfen</button>
        </div>
      </div>}
    {result&&!result.correct&&<div style={{marginTop:6,marginBottom:2}}>
      {disputeSent

          </div>
        : <button onClick={submitDispute}
            style={{width:'100%',padding:'8px',borderRadius:8,border:'1.5px dashed #f59e0b',background:'#fffbeb',color:'#92400e',cursor:'pointer',fontSize:12,touchAction:'manipulation'}}>
            ❓ Meine Antwort war korrekt - Anfrage stellen
          </button>
      }
    </div>}
      {result&&<button onClick={next} style={BtnStyle(T,'white',{width:'100%',padding:'12px',marginTop:8})}>→ Weiter</button>}
    </div>;
  }

  // ── POT 4: EN→DE tippen ──
  return <div style={{padding:8}}>
    {celebration&&<CelebrationPopup newGrade={celebration} onClose={function(){setCelebration(null);}}/>}
    {header}
    <div style={{textAlign:'center',fontSize:10,color:T,textTransform:'uppercase',letterSpacing:1,marginBottom:5}}>{potLabel2[4]}</div>
    <div style={{textAlign:'center',padding:'14px',background:result?(result.correct?'#d1fae5':result.partial?'#fefce8':'#fef2f2'):'white',borderRadius:14,marginBottom:10,border:'2px solid '+(result?result.correct?GR:result.partial?AM:RE:G200)}}>
      <div style={{fontSize:11,color:G400,marginBottom:4}}>Schreibe auf Deutsch:</div>
      <div style={{fontSize:22,fontWeight:'bold',color:G900}}>{word.word}</div>
      {result&&<div style={{marginTop:8}}>
        <div style={{fontSize:14,fontWeight:'bold',color:result.correct?GR:result.partial?AM:RE}}>
          {result.correct?'✓ Richtig!':result.partial?'⚠️ Fast korrekt - „to" fehlt':'✗ Falsch'}
        </div>
        {!result.correct&&<div style={{marginTop:6,display:'flex',gap:8,justifyContent:'center',flexWrap:'wrap'}}>
          <div style={{fontSize:12,padding:'3px 8px',background:result.partial?'#fef3c7':'#fee2e2',borderRadius:5,color:result.partial?'#92400e':RE}}>Du: {result.typed}</div>
          <div style={{fontSize:12,padding:'3px 8px',background:'#dcfce7',borderRadius:5,color:GR}}>Richtig: {word.clue}</div>
        </div>}
      </div>}
    </div>
    {!result&&<div style={{display:'flex',gap:8,marginBottom:8}}>
      <input ref={typeInputRef} value={typeInput} onChange={function(e){setTypeInput(e.target.value);}}
        onKeyDown={function(e){if(e.key==='Enter'){var ca=checkAnswer(typeInput,word.clue);var ok=ca==='correct';if(ca==='partial'){setResult({correct:false,partial:true,typed:typeInput,expected:word.clue});}else if(!ok){setResult({correct:false,typed:typeInput,expected:word.clue});}handleAnswer(ok);}}}
        autoCapitalize="none" autoCorrect="off" spellCheck="false"
        placeholder="Deutsche Übersetzung…" style={{flex:1,padding:'12px 14px',fontSize:16,border:'2px solid '+T,borderRadius:8,outline:'none'}}/>
      <button onClick={function(){var ca=checkAnswer(typeInput,word.clue);var ok=ca==='correct';if(ca==='partial'){setResult({correct:false,partial:true,typed:typeInput,expected:word.clue});}else if(!ok){setResult({correct:false,typed:typeInput,expected:word.clue});}handleAnswer(ok);}}
        style={BtnStyle(T,'white',{padding:'12px 16px'})}>✓</button>
    </div>}
    {result&&!result.correct&&<div style={{marginTop:6,marginBottom:2}}>
      {disputeSent
        ? <div style={{padding:'7px 10px',borderRadius:8,background:'#fef3c7',border:'1.5px solid #f59e0b',fontSize:11,color:'#92400e',textAlign:'center'}}>
            ⏳ Anfrage gesendet - Wort pausiert bis Admin entscheidet
          </div>

            style={{width:'100%',padding:'8px',borderRadius:8,border:'1.5px dashed #f59e0b',background:'#fffbeb',color:'#92400e',cursor:'pointer',fontSize:12,touchAction:'manipulation'}}>
            ❓ Meine Antwort war korrekt - Anfrage stellen
          </button>
      }
    </div>}
    {result&&<button onClick={next} style={BtnStyle(T,'white',{width:'100%',padding:'12px'})}>→ Weiter</button>}
  </div>;
}

// ── LeitersSpielMenu ──────────────────────────────────────────
function LeitersSpielMenu({ player, chapters, onStart, onCreateOwn, gradeSettings }) {
  var [runs,setRuns]=useState([]);
  var [progMap,setProgMap]=useState({});
  var [loading,setLoading]=useState(true);

  useEffect(function(){
    lsGetRuns().then(function(d){
      var rList=Array.isArray(d)?d:[];
      setRuns(rList);
      // Load progress for each run
      if(player&&rList.length>0){
        var UUID=/^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/i;
        if(!UUID.test(player.id)){setLoading(false);return;}
        Promise.all(rList.map(function(r){
          return lsGetProgress(player.id,r.id).then(function(rows){
            if(Array.isArray(rows)&&rows.length>0){
              try{return[r.id,JSON.parse(rows[0].data||'{}')];}catch(e){}
            }
            return null;
          });
        })).then(function(results){
          var map={};
          results.filter(Boolean).forEach(function(p){map[p[0]]=p[1];});
          setProgMap(map);
          setLoading(false);
        });
      } else {
        setLoading(false);
      }
    });
  },[player]);

  if(loading) return <div style={{textAlign:'center',padding:40,color:G400}}>Lade Läufe…</div>;

  var adminRuns=runs.filter(function(r){return r.is_admin_run;});
  var myRuns=runs.filter(function(r){return !r.is_admin_run;});

  function makeRunCard(r, border, progMap, gradeSettings, onStart) {
    var data=progMap[r.id]||{};
    var hasProg=!!(progMap[r.id]);
    var pct=hasProg?lsPercent(data,gradeSettings):null;
    var gr=hasProg?lsGrade(pct,gradeSettings):null;
    var grColor=gr?({'1':'#22c55e','2':'#84cc16','3':'#f59e0b','4':'#f97316','5':'#ef4444'}[String(gr)]||G400):G400;
    return <button key={r.id} onClick={function(){onStart(r);}}
      style={{display:'block',width:'100%',textAlign:'left',padding:'12px 14px',marginBottom:6,borderRadius:12,
        border:'2px solid '+(hasProg?T:border||G200),background:'white',cursor:'pointer'}}>
      <div style={{display:'flex',justifyContent:'space-between',alignItems:'center',marginBottom:hasProg?5:0}}>
        <div style={{fontWeight:'bold',color:hasProg?T:G900,fontSize:14}}>
          {border===T?'🎯 ':''}{r.name}
        </div>
        {hasProg&&<div style={{textAlign:'right'}}>
          <span style={{fontSize:12,color:G400}}>{pct}%</span>
          {gr&&<span style={{fontSize:12,fontWeight:'bold',color:grColor,marginLeft:6}}>Note {gr}</span>}
        </div>}
      </div>
      {hasProg&&<div style={{height:4,background:G200,borderRadius:2,overflow:'hidden'}}>
        <div style={{height:'100%',width:pct+'%',background:'linear-gradient(90deg,'+AM+','+GR+')',borderRadius:2}}/>
      </div>}
      {!hasProg&&<div style={{fontSize:11,color:G400}}>{r.word_count} Vokabeln · {r.sentence_count||0} Sätze</div>}
      {hasProg&&<div style={{fontSize:10,color:G400,marginTop:3}}>
        {r.word_count} Vokabeln · Topf 5: {(data.pots&&data.pots[5]||[]).length} gelernt
      </div>}
    </button>;
  }

  return <div>
    <button onClick={onCreateOwn} style={BtnStyle(T,'white',{width:'100%',padding:'12px',marginBottom:16,fontSize:15})}>➕ Neuen Lauf erstellen</button>
    {adminRuns.length>0&&<div style={{fontWeight:'bold',fontSize:13,color:G600,marginBottom:8}}>📋 Klassen-Läufe</div>}
    {adminRuns.map(function(r){return makeRunCard(r, T, progMap, gradeSettings, onStart);} )}
    {myRuns.length>0&&<div style={{fontWeight:'bold',fontSize:13,color:G600,marginBottom:8,marginTop:adminRuns.length?12:0}}>📁 Meine Läufe</div>}
    {myRuns.map(function(r){return makeRunCard(r, G200, progMap, gradeSettings, onStart);} )}
    {runs.length===0&&<div style={{textAlign:'center',color:G400,padding:20}}>Noch keine Läufe.</div>}
  </div>;
}

// ── LeitersSpielCreate ────────────────────────────────────────
function LeitersSpielCreate({ player, chapters, onCreated, isAdmin }) {
  var [runName,setRunName]=useState('');
  var [selectedWords,setSelectedWords]=useState([]);
  var [selectedSents,setSelectedSents]=useState([]);
  var [expandedCh,setExpandedCh]=useState(null);
  var [loading,setLoading]=useState(false);
  var [err,setErr]=useState('');

  function toggleWord(ch,w){
    var key=ch.id+':'+w.word;
    var ex=selectedWords.find(function(x){return x.key===key;});
    if(ex) setSelectedWords(selectedWords.filter(function(x){return x.key!==key;}));
    else setSelectedWords(selectedWords.concat([{key:key,word:w.word,clue:w.clue,chapterId:ch.id,chapTitle:ch.title}]));
  }

  function createRun(){
    if(!runName.trim()){setErr('Bitte Namen eingeben');return;}
    if(selectedWords.length<4){setErr('Mind. 4 Vokabeln auswählen');return;}
    setLoading(true);setErr('');
    var UUID=/^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/i;
    var runData={name:runName.trim(),is_admin_run:isAdmin?true:false,word_count:selectedWords.length,sentence_count:selectedSents.length,words:JSON.stringify(selectedWords),sentences:JSON.stringify(selectedSents),created_at:new Date().toISOString()};
    if(UUID.test(player.id)) runData.player_id=player.id;
    sbPost('ls_runs',runData).then(function(res){
      setLoading(false);
      if(res&&res._err){setErr('Fehler: '+res.msg);return;}
      onCreated(res&&res.id?res:Object.assign({id:'local_'+Date.now()},runData));
    }).catch(function(){setLoading(false);setErr('Verbindungsfehler');});
  }

  var topicChs=chapters.filter(function(c){return !!c.parent_id;});
  return <div>
    <input value={runName} onChange={function(e){setRunName(e.target.value);}} placeholder="Name des Laufs…"
      style={{width:'100%',padding:'10px 12px',fontSize:16,border:'2px solid '+T,borderRadius:8,outline:'none',marginBottom:10}}/>
    <div style={{padding:'8px 10px',background:G50,borderRadius:8,border:'1px solid '+G200,marginBottom:10}}>
      <div style={{fontWeight:'bold',fontSize:13,color:G600,marginBottom:6}}>Vokabeln: <span style={{color:T}}>{selectedWords.length}</span></div>
      <div style={{display:'flex',gap:6,flexWrap:'wrap'}}>
        <button onClick={function(){
          var allImp=[];
          topicChs.forEach(function(ch){
            ch.words.filter(function(w){return w.important;}).forEach(function(w){
              var key=ch.id+':'+w.word;
              if(!selectedWords.find(function(x){return x.key===key;}))
                allImp.push({key:key,word:w.word,clue:w.clue,chapterId:ch.id,chapTitle:ch.title});
            });
          });
          setSelectedWords(selectedWords.concat(allImp));
        }} style={BtnStyle(T,'white',{padding:'5px 10px',fontSize:11})}>⭐ Alle wichtigen</button>
        <button onClick={function(){setSelectedWords([]);setSelectedSents([]);}} style={BtnStyle(G100,RE,{padding:'5px 10px',fontSize:11})}>✗ Leeren</button>
      </div>
    </div>
    {topicChs.map(function(ch){
      var isOpen=expandedCh===ch.id;
      var sel=selectedWords.filter(function(w){return w.chapterId===ch.id;}).length;
      var par=chapters.find(function(p){return p.id===ch.parent_id;});
      return <div key={ch.id} style={{marginBottom:6,border:'1.5px solid '+(sel>0?ch.color:G200),borderRadius:10,overflow:'hidden'}}>
        <div style={{display:'flex',alignItems:'center',gap:8,padding:'10px 12px',background:sel>0?ch.color+'15':'white',cursor:'pointer'}}
          onClick={function(){setExpandedCh(isOpen?null:ch.id);}}>
          <span style={{fontSize:16}}>{ch.icon}</span>
          <div style={{flex:1}}>
            <div style={{fontWeight:'bold',fontSize:12,color:ch.color}}>{ch.title}</div>
            <div style={{fontSize:10,color:G400}}>{par?par.title+' · ':''}{ch.words.length} Vokabeln</div>
          </div>
          {sel>0&&<span style={{background:ch.color,color:'white',fontSize:11,padding:'2px 7px',borderRadius:10,fontWeight:'bold'}}>{sel}</span>}
          <span style={{color:G400,fontSize:12}}>{isOpen?'▲':'▼'}</span>
        </div>
        {isOpen&&<div style={{padding:'8px 10px',background:'#fafafa',borderTop:'1px solid '+G200}}>
          <div style={{display:'flex',gap:6,marginBottom:8}}>
            <button onClick={function(){
              var imp=ch.words.filter(function(w){return w.important;});
              var impKeys=imp.map(function(w){return ch.id+':'+w.word;});
              var allSel=impKeys.every(function(k){return selectedWords.find(function(x){return x.key===k;});});
              if(allSel) setSelectedWords(selectedWords.filter(function(x){return !impKeys.includes(x.key);}));
              else {var toAdd=imp.filter(function(w){return !selectedWords.find(function(x){return x.key===ch.id+':'+w.word;});}).map(function(w){return{key:ch.id+':'+w.word,word:w.word,clue:w.clue,chapterId:ch.id,chapTitle:ch.title};});setSelectedWords(selectedWords.concat(toAdd));}
            }} style={BtnStyle(T,'white',{flex:1,padding:'5px',fontSize:10})}>⭐ Wichtige</button>
            <button onClick={function(){
              var allKeys=ch.words.map(function(w){return ch.id+':'+w.word;});
              var allSel=allKeys.every(function(k){return selectedWords.find(function(x){return x.key===k;});});
              if(allSel) setSelectedWords(selectedWords.filter(function(x){return !allKeys.includes(x.key);}));
              else {var toAdd2=ch.words.filter(function(w){return !selectedWords.find(function(x){return x.key===ch.id+':'+w.word;});}).map(function(w){return{key:ch.id+':'+w.word,word:w.word,clue:w.clue,chapterId:ch.id,chapTitle:ch.title};});setSelectedWords(selectedWords.concat(toAdd2));}
            }} style={BtnStyle(G100,G600,{flex:1,padding:'5px',fontSize:10})}>Alle</button>
          </div>
          {ch.words.map(function(w,i){
            var key=ch.id+':'+w.word; var sel2=!!selectedWords.find(function(x){return x.key===key;});
            return <div key={i} onClick={function(){toggleWord(ch,w);}}
              style={{display:'flex',alignItems:'center',gap:8,padding:'5px 4px',borderBottom:'1px solid '+G100,cursor:'pointer',background:sel2?ch.color+'10':'white'}}>
              <div style={{width:18,height:18,borderRadius:4,border:'2px solid '+(sel2?ch.color:G200),background:sel2?ch.color:'white',flexShrink:0,display:'flex',alignItems:'center',justifyContent:'center'}}>
                {sel2&&<span style={{color:'white',fontSize:12}}>✓</span>}
              </div>
              <span style={{fontSize:12,fontWeight:w.important?'bold':'normal',flex:1}}>{w.important?'⭐ ':''}{w.word}</span>
              <span style={{fontSize:11,color:G400}}>{w.clue}</span>
            </div>;
          })}
        </div>}
      </div>;
    })}
    {err&&<div style={{color:RE,fontSize:12,padding:'6px 10px',background:'#fef2f2',borderRadius:6,marginTop:8}}>{err}</div>}
    <button onClick={createRun} disabled={loading} style={BtnStyle(T,'white',{width:'100%',padding:'12px',marginTop:12,fontSize:15,opacity:loading?0.6:1})}>
      {loading?'…':'🚀 Lauf erstellen'}
    </button>
  </div>;
}

// ── KapitelProgress ───────────────────────────────────────────
function KapitelProgress({ chapters, player, allRuns, gradeSettings }) {
  var [progressMap,setProgressMap]=useState({});
  useEffect(function(){
    if(!player||!allRuns||!allRuns.length) return;
    var UUID=/^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/i;
    if(!UUID.test(player.id)) return;
    Promise.all(allRuns.map(function(r){
      return lsGetProgress(player.id,r.id).then(function(rows){
        if(Array.isArray(rows)&&rows.length>0){try{return[r.id,JSON.parse(rows[0].data||'{}')];}catch(e){}}
        return null;
      });
    })).then(function(results){
      var map={};
      results.filter(Boolean).forEach(function(pair){map[pair[0]]=pair[1];});
      setProgressMap(map);
    });
  },[player,allRuns]);

  var topLevel=chapters.filter(function(c){return !c.parent_id&&c.id!=='allgemein';}).slice().sort(naturalSort);
  if(!topLevel.length||!allRuns||!allRuns.length) return null;

  return <div style={{marginBottom:14}}>
    <div style={{fontWeight:'bold',fontSize:12,color:G600,marginBottom:6}}>📊 Mein Fortschritt</div>
    {topLevel.map(function(kap){
      var run=allRuns.find(function(r){return r.name===kap.title||r.name.toLowerCase().includes(kap.title.toLowerCase());});
      if(!run) return null;
      var data=progressMap[run.id]||{};
      var pct=lsPercent(data,gradeSettings);
      var gr=lsGrade(pct,gradeSettings);
      var grColor=gr?({'1':'#22c55e','2':'#84cc16','3':'#f59e0b','4':'#f97316','5':'#ef4444','6':'#dc2626'}[String(gr)]||G400):G400;
      return <div key={kap.id} style={{marginBottom:6,padding:'8px 10px',background:'white',borderRadius:8,border:'1px solid '+G200}}>
        <div style={{display:'flex',alignItems:'center',gap:6,marginBottom:3}}>
          <span style={{fontSize:14}}>{kap.icon}</span>
          <span style={{fontSize:12,fontWeight:'bold',color:G900,flex:1}}>{kap.title}</span>
          <span style={{fontSize:11,color:G400}}>{pct}%</span>
          {gr&&<span style={{fontSize:13,fontWeight:'bold',color:grColor}}>Note {gr}</span>}
        </div>
        <div style={{height:5,background:G200,borderRadius:3,overflow:'hidden'}}>
          <div style={{height:'100%',width:pct+'%',background:'linear-gradient(90deg,'+AM+','+GR+')',borderRadius:3,transition:'width 0.5s'}}/>
        </div>
      </div>;
    })}
  </div>;
}

// ── RunEditor - Lauf bearbeiten (Vokabeln hinzufügen/entfernen) ──
function RunEditor({ run, chapters, onClose, onSaved }) {
  var [runName, setRunName] = useState(run.name||'');
  var [selectedKeys, setSelectedKeys] = useState(null); // null = loading
  var [progRows, setProgRows] = useState([]);
  var [saving, setSaving] = useState(false);
  var [msg, setMsg] = useState('');
  var [expandedKap, setExpandedKap] = useState({});
  var [expandedTopic, setExpandedTopic] = useState({});
  var [onlyImportant, setOnlyImportant] = useState(true);
  var [filterText, setFilterText] = useState('');

  // Load current run words + all progress rows for this run
  useEffect(function(){
    var UUID=/^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/i;
    var runWords = [];
    try { runWords = JSON.parse(run.words||'[]'); } catch(e) {}
    var keys = new Set(runWords.map(function(w){ return (w.chapterId||'')+'|||'+(w.word||''); }));
    setSelectedKeys(keys);
    if(UUID.test(run.id)){
      sbGet('ls_progress','run_id=eq.'+run.id+'&select=id,player_id,data').then(function(rows){
        setProgRows(Array.isArray(rows)?rows:[]);
      });
    }
  },[]);

  if(selectedKeys===null) return <div style={{textAlign:'center',padding:30,color:G400}}>Lade…</div>;

  var topicChs = chapters.filter(function(c){return !!c.parent_id;});
  var topLevel  = chapters.filter(function(c){return !c.parent_id;}).slice().sort(naturalSort);

  // Compute stats
  var originalKeys = new Set();
  try { JSON.parse(run.words||'[]').forEach(function(w){ originalKeys.add((w.chapterId||'')+'|||'+(w.word||'')); }); } catch(e) {}
  var toAdd    = [];
  var toRemove = [];
  selectedKeys.forEach(function(k){ if(!originalKeys.has(k)) toAdd.push(k); });
  originalKeys.forEach(function(k){ if(!selectedKeys.has(k)) toRemove.push(k); });

  function toggle(chId, w) {
    var k = chId+'|||'+w.word;
    setSelectedKeys(function(prev){
      var next = new Set(prev);
      if(next.has(k)) next.delete(k); else next.add(k);
      return next;
    });
  }
  function selectAll(chId, words) {
    setSelectedKeys(function(prev){
      var next = new Set(prev);
      words.forEach(function(w){ next.add(chId+'|||'+w.word); });
      return next;
    });
  }
  function deselectAll(chId, words) {
    setSelectedKeys(function(prev){
      var next = new Set(prev);
      words.forEach(function(w){ next.delete(chId+'|||'+w.word); });
      return next;
    });
  }
  function selectTopic(topicId, important) {
    var ch = chapters.find(function(c){return c.id===topicId;});
    if(!ch) return;
    var words = important ? ch.words.filter(function(w){return w.important;}) : ch.words;
    selectAll(topicId, words);
  }
  function selectKapitel(kapId, important) {
    var topics = topicChs.filter(function(c){return c.parent_id===kapId;});
    topics.forEach(function(t){
      var words = important ? t.words.filter(function(w){return w.important;}) : t.words;
      selectAll(t.id, words);
    });
  }

  function doSave() {
    setSaving(true); setMsg('Speichere Lauf…');
    // Build new words array from selectedKeys
    var newWords = [];
    selectedKeys.forEach(function(k){
      var parts = k.split('|||');
      var chId = parts[0]; var wordStr = parts[1];
      var ch = chapters.find(function(c){return c.id===chId;});
      if(!ch) return;
      var w = ch.words.find(function(x){return x.word===wordStr;});
      if(!w) return;
      newWords.push({word:w.word, clue:w.clue, chapterId:chId, chapTitle:ch.title, important:w.important||false});
    });
    newWords.sort(function(a,b){return (a.word||'').toLowerCase().localeCompare((b.word||'').toLowerCase());});

    // Patch run
    sbPatch('ls_runs',{
      name: runName.trim()||run.name,
      words: JSON.stringify(newWords),
      word_count: newWords.length
    },'id=eq.'+run.id).then(function(){
      setMsg('Lauf gespeichert. Aktualisiere '+progRows.length+' Lernstände…');
      // For each progress row: add new words to pot1, remove deleted words
      var addSet = new Set(toAdd.map(function(k){return k.split('|||')[1];}));
      var removeSet = new Set(toRemove.map(function(k){return k.split('|||')[1];}));
      function patchNext(idx, ok, fail){
        if(idx>=progRows.length){
          setMsg('✅ Fertig! '+newWords.length+' Vokabeln im Lauf. '+ok+' Lernstände aktualisiert'+(fail?' ('+fail+' Fehler)':''));
          setSaving(false);
          if(onSaved) onSaved();
          return;
        }
        var row=progRows[idx];
        var data={}; try{data=JSON.parse(row.data||'{}');}catch(e){}
        var pots=data.pots||{1:[],2:[],3:[],4:[],5:[]};
        if(!pots[1])pots[1]=[]; if(!pots[2])pots[2]=[]; if(!pots[3])pots[3]=[]; if(!pots[4])pots[4]=[]; if(!pots[5])pots[5]=[];
        var changed = false;
        // Remove deleted words from all pots
        if(removeSet.size>0){
          [1,2,3,4,5].forEach(function(pot){
            var before=pots[pot].length;
            pots[pot]=pots[pot].filter(function(w){return !removeSet.has(w.word);});
            if(pots[pot].length!==before) changed=true;
          });
        }
        // Add new words to pot 1 (only if not already in any pot)
        if(addSet.size>0){
          var inPots=new Set();
          [1,2,3,4,5].forEach(function(pot){pots[pot].forEach(function(w){inPots.add(w.word);});});
          newWords.filter(function(w){return addSet.has(w.word)&&!inPots.has(w.word);}).forEach(function(w){
            pots[1].push({word:w.word,clue:w.clue,chapterId:w.chapterId||'',streak:0,wrongStreak:0});
            changed=true;
          });
        }
        if(!changed){patchNext(idx+1,ok,fail);return;}
        data.pots=pots;
        sbPatch('ls_progress',{data:JSON.stringify(data),updated_at:new Date().toISOString()},'id=eq.'+row.id)
          .then(function(){setTimeout(function(){patchNext(idx+1,ok+1,fail);},80);})
          .catch(function(){setTimeout(function(){patchNext(idx+1,ok,fail+1);},80);});
      }
      patchNext(0,0,0);
    }).catch(function(e){setMsg('Fehler: '+e.message);setSaving(false);});
  }

  return (
    <div>
      <div style={{display:'flex',alignItems:'center',gap:10,marginBottom:14}}>
        <button onClick={onClose} style={BtnStyle(G100,G600,{fontSize:12})}>← Zurück</button>
        <span style={{fontWeight:'bold',fontSize:15,color:G900,flex:1}}>✏️ Lauf bearbeiten</span>
      </div>

      {/* Run name */}
      <div style={{marginBottom:12}}>
        <input value={runName} onChange={function(e){setRunName(e.target.value);}}
          style={{width:'100%',padding:'9px 12px',fontSize:14,border:'2px solid '+T,borderRadius:8,outline:'none'}}/>
      </div>

      {/* Stats bar */}
      <div style={{display:'flex',gap:8,flexWrap:'wrap',marginBottom:12}}>
        <span style={{padding:'4px 10px',background:TL,borderRadius:8,fontSize:12,fontWeight:'bold',color:T}}>
          {selectedKeys.size} ausgewählt
        </span>
        {toAdd.length>0&&<span style={{padding:'4px 10px',background:'#d1fae5',borderRadius:8,fontSize:12,fontWeight:'bold',color:'#065f46'}}>
          +{toAdd.length} neu
        </span>}
        {toRemove.length>0&&<span style={{padding:'4px 10px',background:'#fee2e2',borderRadius:8,fontSize:12,fontWeight:'bold',color:RE}}>
          -{toRemove.length} entfernt
        </span>}
        <span style={{padding:'4px 10px',background:G100,borderRadius:8,fontSize:11,color:G600}}>
          {progRows.length} Lernstände
        </span>
      </div>

      {/* Filter options */}
      <div style={{display:'flex',gap:8,marginBottom:10,alignItems:'center',flexWrap:'wrap'}}>
        <input value={filterText} onChange={function(e){setFilterText(e.target.value);}}
          placeholder="Vokabel suchen…"
          style={{flex:1,minWidth:120,padding:'6px 10px',fontSize:13,border:'1px solid '+G200,borderRadius:7,outline:'none'}}/>
        <div onClick={function(){setOnlyImportant(!onlyImportant);}}
          style={{display:'flex',alignItems:'center',gap:5,cursor:'pointer',fontSize:12,color:G600,userSelect:'none'}}>
          <div style={{width:18,height:18,borderRadius:4,border:'2px solid '+(onlyImportant?T:G200),background:onlyImportant?T:'white',display:'flex',alignItems:'center',justifyContent:'center'}}>
            {onlyImportant&&<span style={{color:'white',fontSize:11}}>✓</span>}
          </div>
          Nur ⭐
        </div>
      </div>

      {/* Kapitel tree */}
      <div style={{maxHeight:440,overflowY:'auto',border:'1px solid '+G200,borderRadius:10,marginBottom:12}}>
        {topLevel.map(function(kap){
          var kapTopics = topicChs.filter(function(c){return c.parent_id===kap.id;});
          var kapOpen = !!expandedKap[kap.id];
          var kapTotal = kapTopics.reduce(function(s,t){return s+(onlyImportant?t.words.filter(function(w){return w.important;}).length:t.words.length);},0);
          var kapSel = kapTopics.reduce(function(s,t){
            var ws=onlyImportant?t.words.filter(function(w){return w.important;}):t.words;
            return s+ws.filter(function(w){return selectedKeys.has(t.id+'|||'+w.word);}).length;
          },0);
          return <div key={kap.id}>
            {/* Kapitel header */}
            <div style={{display:'flex',alignItems:'center',gap:8,padding:'9px 12px',background:G50,borderBottom:'1px solid '+G200,cursor:'pointer'}}
              onClick={function(){setExpandedKap(function(p){var n=Object.assign({},p);n[kap.id]=!n[kap.id];return n;});}}>
              <span style={{fontSize:16}}>{kap.icon}</span>
              <span style={{fontWeight:'bold',fontSize:13,color:kap.color||T,flex:1}}>{kap.title}</span>
              <span style={{fontSize:11,color:G400}}>{kapSel}/{kapTotal}</span>
              <button onClick={function(e){e.stopPropagation();selectKapitel(kap.id,onlyImportant);}}
                style={{fontSize:10,padding:'2px 7px',borderRadius:5,border:'1px solid '+T,background:TL,color:T,cursor:'pointer',touchAction:'manipulation'}}>
                Alle
              </button>
              <span style={{color:G400,fontSize:11}}>{kapOpen?'▲':'▼'}</span>
            </div>
            {/* Topics */}
            {kapOpen&&kapTopics.map(function(t){
              var tOpen=!!expandedTopic[t.id];
              var tWords=onlyImportant?t.words.filter(function(w){return w.important;}):t.words;
              var tFiltered=filterText.trim()?tWords.filter(function(w){return (w.word+''+w.clue).toLowerCase().includes(filterText.toLowerCase());}):tWords;
              var tSel=tWords.filter(function(w){return selectedKeys.has(t.id+'|||'+w.word);}).length;
              return <div key={t.id} style={{borderBottom:'1px solid '+G100}}>
                {/* Topic header */}
                <div style={{display:'flex',alignItems:'center',gap:8,padding:'7px 12px 7px 24px',cursor:'pointer',background:tOpen?TL:'white'}}
                  onClick={function(){setExpandedTopic(function(p){var n=Object.assign({},p);n[t.id]=!n[t.id];return n;});}}>
                  <span style={{fontSize:14}}>{t.icon}</span>
                  <span style={{fontSize:12,fontWeight:'bold',color:t.color||T,flex:1}}>{t.title}</span>
                  <span style={{fontSize:11,color:G400}}>{tSel}/{tWords.length}</span>
                  <button onClick={function(e){e.stopPropagation();selectTopic(t.id,onlyImportant);}}
                    style={{fontSize:10,padding:'2px 6px',borderRadius:5,border:'1px solid '+T,background:TL,color:T,cursor:'pointer',touchAction:'manipulation'}}>
                    Alle
                  </button>
                  <button onClick={function(e){e.stopPropagation();deselectAll(t.id,tWords);}}
                    style={{fontSize:10,padding:'2px 6px',borderRadius:5,border:'1px solid '+G200,background:G50,color:G600,cursor:'pointer',touchAction:'manipulation'}}>
                    Keine
                  </button>
                  <span style={{color:G400,fontSize:10}}>{tOpen?'▲':'▼'}</span>
                </div>
                {/* Words */}
                {tOpen&&tFiltered.map(function(w){
                  var k=t.id+'|||'+w.word;
                  var sel=selectedKeys.has(k);
                  var isNew=sel&&!originalKeys.has(k);
                  var isRemoved=!sel&&originalKeys.has(k);
                  return <div key={w.word} onClick={function(){toggle(t.id,w);}}
                    style={{display:'flex',alignItems:'center',gap:8,padding:'5px 12px 5px 40px',borderBottom:'1px solid '+G50,cursor:'pointer',background:isNew?'#f0fdf4':isRemoved?'#fef2f2':'white'}}>
                    <div style={{width:17,height:17,borderRadius:4,border:'2px solid '+(sel?T:G200),background:sel?T:'white',flexShrink:0,display:'flex',alignItems:'center',justifyContent:'center'}}>
                      {sel&&<span style={{color:'white',fontSize:11,fontWeight:'bold'}}>✓</span>}
                    </div>
                    <span style={{fontSize:12,fontWeight:w.important?'bold':'normal',flex:1,color:isRemoved?RE:G900}}>
                      {w.important?'⭐ ':''}{w.word}
                    </span>
                    <span style={{fontSize:11,color:G400}}>{w.clue}</span>
                    {isNew&&<span style={{fontSize:9,color:'#065f46',background:'#d1fae5',padding:'1px 5px',borderRadius:5,fontWeight:'bold'}}>NEU</span>}
                    {isRemoved&&<span style={{fontSize:9,color:RE,background:'#fee2e2',padding:'1px 5px',borderRadius:5,fontWeight:'bold'}}>ENTFERNT</span>}
                  </div>;
                })}
              </div>;
            })}
          </div>;
        })}
      </div>

      {/* Info about what will happen */}
      {(toAdd.length>0||toRemove.length>0)&&<div style={{padding:'8px 12px',background:'#fef9c3',borderRadius:8,border:'1px solid #fde68a',marginBottom:10,fontSize:11,color:'#92400e'}}>
        {toAdd.length>0&&<div>✅ {toAdd.length} neue Vokabeln → werden in Topf 1 aller Lernstände eingefügt</div>}
        {toRemove.length>0&&<div>🗑 {toRemove.length} Vokabeln entfernt → werden aus allen Töpfen aller Lernstände gelöscht</div>}
        <div style={{marginTop:3}}>Bestehende Vokabeln bleiben in ihrem aktuellen Topf.</div>
      </div>}

      {msg&&<div style={{padding:'7px 12px',background:msg.startsWith('✅')?'#d1fae5':msg.startsWith('Fehler')?'#fee2e2':G50,borderRadius:8,fontSize:12,color:msg.startsWith('✅')?'#065f46':msg.startsWith('Fehler')?RE:G600,marginBottom:10}}>{msg}</div>}

      <div style={{display:'flex',gap:8}}>
        <button onClick={doSave} disabled={saving||(toAdd.length===0&&toRemove.length===0&&runName.trim()===run.name)}
          style={BtnStyle(T,'white',{flex:2,padding:'11px',fontSize:14,opacity:(saving||(toAdd.length===0&&toRemove.length===0&&runName.trim()===run.name))?0.5:1,touchAction:'manipulation'})}>
          {saving?'Speichere…':'💾 Speichern'}
        </button>
        <button onClick={onClose} style={BtnStyle(G100,G600,{flex:1,padding:'11px',fontSize:13,touchAction:'manipulation'})}>
          Abbrechen
        </button>
      </div>
    </div>
  );
}

// ── LeitersSpielAdminOverview - mit Spieler-Detail ───────────
function LeitersSpielAdminOverview({ allUsers, gradeSettings, chapters, setChapters }) {
  var [runs,setRuns]=useState([]);
  var [allProg,setAllProg]=useState([]);
  var [loading,setLoading]=useState(true);
  var [selectedUser,setSelectedUser]=useState(null);
  var [disputes,setDisputes]=useState([]);
  var [lsTab,setLsTab]=useState('overview'); // 'overview'|'disputes'
  var [editRun,setEditRun]=useState(null);

  function reload(){
    setLoading(true);
    Promise.all([
      lsGetRuns(),
      sbGet('ls_progress','select=id,player_id,run_id,data,updated_at&order=updated_at.desc'),
      sbGet('word_disputes','status=eq.pending&order=created_at.desc&select=id,player_id,player_name,run_id,word,clue,typed_answer,pot,chapter_id,created_at')
    ]).then(function(res){
      setRuns(Array.isArray(res[0])?res[0]:[]);
      setAllProg(Array.isArray(res[1])?res[1]:[]);
      setDisputes(Array.isArray(res[2])?res[2]:[]);
      setLoading(false);
    });
  }
  useEffect(function(){
    reload();
    // Auto-refresh every 30s
    var t=setInterval(reload,30000);
    return function(){clearInterval(t);};
  },[]);

  if(loading) return <div style={{textAlign:'center',padding:20,color:G400}}>Lade…</div>;

  // Edit run view
  if(editRun) return <RunEditor run={editRun} chapters={chapters} onClose={function(){setEditRun(null);}} onSaved={function(){setEditRun(null);reload();}}/>;

  // Detail view
  if(selectedUser){
    var data=selectedUser.data;
    var pct=lsPercent(data,gradeSettings);
    var grade=lsGrade(pct,gradeSettings);
    var run=runs.find(function(r){return r.id===selectedUser.runId;});
    var user=(allUsers||[]).find(function(u){return String(u.id)===String(selectedUser.userId);});
    var potLabels2={1:'Topf 1 - Quiz',2:'Topf 2 - Buchstaben',3:'Topf 3 - DE→EN',4:'Topf 4 - EN→DE',5:'✅ Gelernt'};
    var potColorsD={1:RE,2:'#f97316',3:AM,4:T,5:GR};
    return (
      <div>
        <button onClick={function(){setSelectedUser(null);}} style={BtnStyle(G100,G600,{marginBottom:12,fontSize:12})}>← Übersicht</button>
        <div style={{padding:12,background:G50,borderRadius:10,border:'1px solid '+G200,marginBottom:12}}>
          <div style={{fontWeight:'bold',fontSize:15,color:G900,marginBottom:4}}>{user?user.name:'Spieler'} - {run?run.name:'Lauf'}</div>
          <div style={{display:'flex',alignItems:'center',gap:10,marginBottom:6}}>
            <div style={{flex:1}}>
              <div style={{display:'flex',justifyContent:'space-between',fontSize:12,color:G400,marginBottom:3}}>
                <span>Fortschritt</span><span style={{fontWeight:'bold'}}>{pct}%{grade?' - Note '+grade:''}</span>
              </div>
              <div style={{height:8,background:G200,borderRadius:4,overflow:'hidden'}}>
                <div style={{height:'100%',width:pct+'%',background:'linear-gradient(90deg,'+AM+','+GR+')',borderRadius:4}}/>
              </div>
            </div>
            {grade&&<GradeDisplay grade={grade} size={28}/>}
          </div>
          <div style={{display:'flex',gap:6,flexWrap:'wrap'}}>
            {[1,2,3,4,5].map(function(pot){
              var n=(data.pots[pot]||[]).length;
              return <div key={pot} style={{textAlign:'center',padding:'4px 8px',borderRadius:6,background:potColorsD[pot]+'15',minWidth:44}}>
                <div style={{fontSize:16,fontWeight:'bold',color:potColorsD[pot]}}>{n}</div>
                <div style={{fontSize:9,color:G400}}>T{pot}</div>
              </div>;
            })}
          </div>
          {data._reconstructed&&<div style={{marginTop:8,fontSize:10,color:AM,background:'#fef3c7',padding:'4px 8px',borderRadius:6}}>⚠️ Rekonstruiert</div>}
        </div>
        {[1,2,3,4,5].map(function(pot){
          var words=data.pots[pot]||[];
          if(!words.length) return null;
          return <div key={pot} style={{marginBottom:10,border:'1.5px solid '+potColorsD[pot]+'40',borderRadius:10,overflow:'hidden'}}>
            <div style={{background:potColorsD[pot]+'15',padding:'8px 12px',fontWeight:'bold',fontSize:12,color:potColorsD[pot],display:'flex',justifyContent:'space-between'}}>
              <span>{potLabels2[pot]}</span><span>{words.length} Vokabeln</span>
            </div>
            <div style={{padding:'4px 10px'}}>
              {words.map(function(w,i){
                return <div key={i} style={{display:'flex',alignItems:'center',gap:6,padding:'4px 0',borderBottom:'1px solid '+G50,fontSize:12}}>
                  <span style={{fontWeight:'bold',flex:1,color:G900}}>{w.word}</span>
                  <span style={{color:G400,minWidth:80}}>{w.clue}</span>
                  <div style={{display:'flex',gap:3}}>
                    {(w.streak||0)>0&&<span style={{fontSize:10,color:GR,background:'#dcfce7',padding:'1px 5px',borderRadius:5}}>✓{w.streak}×</span>}
                    {(w.wrongStreak||0)>0&&<span style={{fontSize:10,color:RE,background:'#fee2e2',padding:'1px 5px',borderRadius:5}}>✗{w.wrongStreak}×</span>}
                  </div>
                </div>;
              })}
            </div>
          </div>;
        })}
        {(data.history||[]).length>1&&<div style={{marginTop:10,padding:10,background:G50,borderRadius:10,border:'1px solid '+G200}}>
          <div style={{fontWeight:'bold',fontSize:12,color:G600,marginBottom:6}}>Verlauf</div>
          <div style={{display:'flex',alignItems:'flex-end',gap:2,height:40}}>
            {data.history.slice(-20).map(function(h,i){
              var col=h.grade?({'1':'#22c55e','2':'#84cc16','3':'#f59e0b','4':'#f97316','5':'#ef4444'}[String(h.grade)]||T):T;
              return <div key={i} title={h.percent+'%'} style={{flex:1,background:col,borderRadius:'2px 2px 0 0',height:Math.max(2,h.percent/100*40)+'px'}}/>;
            })}
          </div>
        </div>}
      </div>
    );
  }

  // Dispute accept/reject handlers
  function acceptDispute(d) {
    // 1. Add typed_answer as valid alternative in chapter word data
    var UUID=/^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/i;
    // Find the chapter containing this word
    var chaps = Array.isArray(chapters) ? chapters : [];
    var targetChap = null;
    var targetWordIdx = -1;
    chaps.forEach(function(ch){
      if(targetChap) return;
      var ws = ch.words||[];
      var wi = ws.findIndex(function(w){return w.word===d.word;});
      if(wi>=0){ targetChap=ch; targetWordIdx=wi; }
    });
    if(targetChap && targetWordIdx>=0){
      var newWords = (targetChap.words||[]).slice();
      var oldClue = newWords[targetWordIdx].clue||'';
      // Append typed_answer if not already in clue
      if(oldClue.toLowerCase().indexOf(d.typed_answer.toLowerCase())<0){
        newWords[targetWordIdx] = Object.assign({},newWords[targetWordIdx],{
          clue: oldClue + '/' + d.typed_answer
        });
        sbPatch('chapters',{words:JSON.stringify(newWords)},'id=eq.'+targetChap.id).then(function(){
          if(setChapters) setChapters(function(prev){return prev.map(function(c){
            return c.id===targetChap.id?Object.assign({},c,{words:newWords}):c;
          });});
        });
      }
    }
    // 2. Move word up a pot in player's progress + remove disputeId
    sbGet('ls_progress','player_id=eq.'+d.player_id+'&run_id=eq.'+d.run_id+'&select=id,data').then(function(rows){
      if(!Array.isArray(rows)||!rows.length) return;
      var row=rows[0];
      var data={}; try{data=JSON.parse(row.data||'{}');}catch(e){}
      var pots=data.pots||{};
      var foundPot=null; var wordObj=null; var wordIdx=-1;
      [1,2,3,4].forEach(function(pot){
        if(foundPot) return;
        var wi=(pots[pot]||[]).findIndex(function(w){return w.word===d.word;});
        if(wi>=0){ foundPot=pot; wordObj=(pots[pot])[wi]; wordIdx=wi; }
      });
      if(foundPot&&wordObj){
        pots[foundPot].splice(wordIdx,1);
        var nextPot=Math.min(foundPot+1,5);
        var cleaned=Object.assign({},wordObj); delete cleaned.disputeId;
        cleaned.streak=0; cleaned.wrongStreak=0;
        if(!pots[nextPot]) pots[nextPot]=[];
        pots[nextPot].push(cleaned);
        data.pots=pots;
        sbPatch('ls_progress',{data:JSON.stringify(data)},'id=eq.'+row.id);
      }
    });
    // 3. Mark dispute resolved
    sbPatch('word_disputes',{status:'accepted',resolved_at:new Date().toISOString(),resolved_by:'admin'},'id=eq.'+d.id).then(function(){
      setDisputes(function(prev){return prev.filter(function(x){return x.id!==d.id;});});
    });
  }

  function rejectDispute(d) {
    // Move word down a pot + remove disputeId (as if wrong answer was processed)
    sbGet('ls_progress','player_id=eq.'+d.player_id+'&run_id=eq.'+d.run_id+'&select=id,data').then(function(rows){
      if(!Array.isArray(rows)||!rows.length) return;
      var row=rows[0];
      var data={}; try{data=JSON.parse(row.data||'{}');}catch(e){}
      var pots=data.pots||{};
      var foundPot=null; var wordObj=null; var wordIdx=-1;
      [1,2,3,4].forEach(function(pot){
        if(foundPot) return;
        var wi=(pots[pot]||[]).findIndex(function(w){return w.word===d.word;});
        if(wi>=0){ foundPot=pot; wordObj=(pots[pot])[wi]; wordIdx=wi; }
      });
      if(foundPot&&wordObj){
        pots[foundPot].splice(wordIdx,1);
        var cleaned=Object.assign({},wordObj); delete cleaned.disputeId;
        // Move down if pot > 1
        var downPot=foundPot>1?foundPot-1:1;
        cleaned.streak=0; cleaned.wrongStreak=(cleaned.wrongStreak||0)+1;
        if(!pots[downPot]) pots[downPot]=[];
        pots[downPot].push(cleaned);
        data.pots=pots;
        sbPatch('ls_progress',{data:JSON.stringify(data)},'id=eq.'+row.id);
      }
    });
    sbPatch('word_disputes',{status:'rejected',resolved_at:new Date().toISOString(),resolved_by:'admin'},'id=eq.'+d.id).then(function(){
      setDisputes(function(prev){return prev.filter(function(x){return x.id!==d.id;});});
    });
  }

  // Overview
  return (
    <div>
      {/* Tab bar */}
      <div style={{display:'flex',gap:6,marginBottom:10}}>
        <button onClick={function(){setLsTab('overview');}} style={BtnStyle(lsTab==='overview'?T:G100,lsTab==='overview'?'white':G600,{flex:1,padding:'7px',fontSize:12})}>
          📋 Läufe ({runs.length})
        </button>
        <button onClick={function(){setLsTab('disputes');reload();}} style={BtnStyle(lsTab==='disputes'?RE:G100,lsTab==='disputes'?'white':G600,{flex:1,padding:'7px',fontSize:12})}>
          ❓ Anfragen {disputes.length>0&&<span style={{background:'white',color:RE,borderRadius:'50%',padding:'0 5px',fontWeight:'bold',fontSize:10,marginLeft:4}}>{disputes.length}</span>}
        </button>
        <button onClick={reload} style={{padding:'7px 10px',borderRadius:7,border:'1px solid '+G200,background:'white',cursor:'pointer',color:G600,fontSize:11}}>
          🔄
        </button>
      </div>

      {/* DISPUTES TAB */}
      {lsTab==='disputes'&&<div>
        {loading&&<div style={{textAlign:'center',color:G400,padding:16}}>Lade...</div>}
        {!loading&&disputes.length===0&&<div style={{textAlign:'center',color:G400,padding:20,background:G50,borderRadius:10,fontSize:13}}>
          ✅ Keine offenen Anfragen
        </div>}
        {!loading&&disputes.map(function(d){
          return <div key={d.id} style={{marginBottom:10,border:'1.5px solid #fcd34d',borderRadius:12,overflow:'hidden',background:'#fffbeb'}}>
            <div style={{padding:'10px 12px',borderBottom:'1px solid #fde68a'}}>
              <div style={{display:'flex',alignItems:'center',gap:8,marginBottom:4}}>
                <span style={{fontWeight:'bold',fontSize:13,color:G900}}>{d.word}</span>
                <span style={{fontSize:11,color:G400}}>=</span>
                <span style={{fontSize:12,color:G600}}>{d.clue}</span>
                <span style={{marginLeft:'auto',fontSize:10,color:G400}}>Topf {d.pot}</span>
              </div>
              <div style={{fontSize:12,color:G600,marginBottom:2}}>
                <span style={{color:G400}}>Spieler: </span><strong>{d.player_name}</strong>
                <span style={{color:G400,marginLeft:8}}>Antwort: </span>
                <span style={{background:'#fee2e2',color:RE,padding:'1px 7px',borderRadius:5,fontWeight:'bold'}}>"{d.typed_answer}"</span>
              </div>
              <div style={{fontSize:10,color:G400}}>{new Date(d.created_at).toLocaleDateString('de-DE')}</div>
            </div>
            <div style={{padding:'8px 12px',display:'flex',gap:8}}>
              <button onClick={function(){acceptDispute(d);}}
                style={{flex:1,padding:'8px',borderRadius:8,background:GR,color:'white',border:'none',cursor:'pointer',fontSize:12,fontWeight:'bold',touchAction:'manipulation'}}>
                ✓ Akzeptieren - "{d.typed_answer}" als Alternative speichern
              </button>
              <button onClick={function(){rejectDispute(d);}}
                style={{flex:1,padding:'8px',borderRadius:8,background:RE,color:'white',border:'none',cursor:'pointer',fontSize:12,fontWeight:'bold',touchAction:'manipulation'}}>
                ✗ Ablehnen - Wort runterstufen
              </button>
            </div>
          </div>;
        })}
      </div>}

      {/* OVERVIEW TAB */}
      {lsTab==='overview'&&<div>
      <div style={{display:'flex',justifyContent:'space-between',alignItems:'center',marginBottom:10}}>
        <div style={{fontWeight:'bold',fontSize:14,color:G900}}>📋 Alle Läufe ({runs.length})</div>
      </div>
      {runs.map(function(run){
        var prog=allProg.filter(function(p){return p.run_id===run.id;});
        return <div key={run.id} style={{marginBottom:10,border:'1.5px solid '+G200,borderRadius:12,overflow:'hidden'}}>
          <div style={{padding:'10px 12px',background:G50,fontWeight:'bold',fontSize:13,color:T,display:'flex',alignItems:'center',justifyContent:'space-between'}}>
            <span>{run.is_admin_run?'📋 ':''}{run.name}</span>
            <div style={{display:'flex',alignItems:'center',gap:8}}>
              <span style={{fontSize:11,color:G400,fontWeight:'normal'}}>{run.word_count}V</span>
              <button onClick={function(e){e.stopPropagation();setEditRun(run);}}
                style={{fontSize:11,padding:'3px 9px',borderRadius:6,border:'1px solid '+T,background:TL,color:T,cursor:'pointer',fontWeight:'bold',touchAction:'manipulation'}}>
