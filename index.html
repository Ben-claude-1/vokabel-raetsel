          <h1 style={{fontSize:22,fontWeight:'bold',color:G900,margin:0}}>Vokabel-Rätsel</h1>
          <p style={{fontSize:13,color:G400,margin:'4px 0 0'}}>Anmelden</p>
        </div>
        <div style={{marginBottom:12}}>
          <label style={{fontSize:12,color:G600,fontWeight:'bold',display:'block',marginBottom:4}}>Name</label>
          <input value={name} onChange={function(e){setName(e.target.value);}} onKeyDown={function(e){if(e.key==='Enter')doLogin();}}
            autoCapitalize="words" autoCorrect="off" autoComplete="username"
            placeholder="Dein Name"
            style={{width:'100%',padding:'12px 14px',fontSize:16,border:'2px solid '+G200,borderRadius:10,outline:'none',boxSizing:'border-box'}}/>
        </div>
        <div style={{marginBottom:16}}>
          <label style={{fontSize:12,color:G600,fontWeight:'bold',display:'block',marginBottom:4}}>Passwort</label>
          <input value={pw} onChange={function(e){setPw(e.target.value);}} onKeyDown={function(e){if(e.key==='Enter')doLogin();}}
            type="password" placeholder="Passwort" autoComplete="current-password"
            style={{width:'100%',padding:'12px 14px',fontSize:16,border:'2px solid '+G200,borderRadius:10,outline:'none',boxSizing:'border-box'}}/>
        </div>
        {err&&<div style={{padding:'8px 12px',background:'#fee2e2',borderRadius:8,color:RE,fontSize:12,marginBottom:12}}>{err}</div>}
        <button onClick={doLogin} disabled={loading} style={BtnStyle(T,'white',{width:'100%',padding:'13px',fontSize:15})}>
          {loading?'…':'→ Anmelden'}
        </button>
        {onRegister&&<div style={{textAlign:'center',marginTop:16}}>
          <span style={{fontSize:13,color:G400}}>Noch kein Konto? </span>
          <button onClick={onRegister} style={{border:'none',background:'none',color:T,fontSize:13,fontWeight:'bold',cursor:'pointer',padding:0}}>Registrieren</button>

function GoalTracker({ player, onInfo }) {
  var [toasts, setToasts] = useState([]);
  var streakKey = 'goal_streak_'+(player&&player.id||'x');
  var shownKey  = 'goal_shown_' +(player&&player.id||'x');

  function check() {
    var UUID=/^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/i;
    if(!player||!player.id||!UUID.test(player.id)) return;
    sbGet('learn_sessions','player_id=eq.'+player.id+'&select=active_seconds,started_at').then(function(sessions){
      if(!Array.isArray(sessions)) return;
      var byDay = buildByDay(sessions);
      var today = new Date().toISOString().slice(0,10);
      var todaySec = byDay[today]||0;
      var weekDays = getWeekDays();
      var weekGoalDays = weekDays.filter(function(k){return (byDay[k]||0)>=DAILY_GOAL_SEC;}).length;
      var streak = calcStreakFromByDay(byDay);
      var stored={}; try{stored=JSON.parse(localStorage.getItem(streakKey)||'{}');}catch(e){}
      var shown={};  try{shown =JSON.parse(localStorage.getItem(shownKey)||'{}');}catch(e){}
      var best = Math.max(stored.best||0, streak);
      var newToasts=[];
      if(todaySec>=DAILY_GOAL_SEC && shown.dailyDate!==today){
        shown.dailyDate=today;
        newToasts.push({id:'daily',emoji:'🎯',msg:'Super gemacht! Dein Tagesziel hast du erreicht!'});
      }
      var weekKey=getWeekKey();
      if(weekGoalDays>=5 && shown.weekKey!==weekKey){
        shown.weekKey=weekKey;
        newToasts.push({id:'weekly',emoji:'🏆',msg:'Glückwunsch, dein Wochenziel hast du erreicht!'});
      }
      if(streak>(stored.best||0) && streak>1 && shown.streakRecord!==String(streak)){
        shown.streakRecord=String(streak);
        newToasts.push({id:'streak',emoji:'🔥',msg:'Super, du hast deine alte Streak gebrochen! '+streak+' Tage am Stück!'});
      }
      localStorage.setItem(streakKey,JSON.stringify({current:streak,best:best}));
      localStorage.setItem(shownKey, JSON.stringify(shown));
      if(onInfo) onInfo({current:streak,best:best,todaySec:todaySec});
      if(newToasts.length>0) setToasts(function(prev){
        return prev.concat(newToasts.filter(function(n){return !prev.find(function(p){return p.id===n.id;});}));
      });
    }).catch(function(){});
  }

  useEffect(function(){
    check();
    var iv=setInterval(check,60000);
    return function(){clearInterval(iv);};
  },[player&&player.id]);

  function dismiss(id){ setToasts(function(t){return t.filter(function(x){return x.id!==id;});}); }
  return <div>{toasts.map(function(t){return <GoalToast key={t.id} emoji={t.emoji} msg={t.msg} onClose={function(){dismiss(t.id);}}/>;})}</div>;
}

function saveGrammarPool(topic, pool) {

function grammarPickQuestions(pool, ruleStats, count) {
  if(!pool||pool.length===0) return [];
  var weighted=pool.map(function(q){
    var st=ruleStats[q.rule]||{correct:0,total:0};
    var score=st.total>0?st.correct/st.total:0;
    var weight=1+(1-score)*3;
    return Object.assign({},q,{_weight:weight});
  });
  var picked=[], seen=new Set();
  var attempts=0;
  while(picked.length<count&&attempts<count*10){
    attempts++;
    var totalW=weighted.reduce(function(s,q){return s+q._weight;},0);
    var r=Math.random()*totalW, cum=0, sel=weighted[0];
    for(var i=0;i<weighted.length;i++){cum+=weighted[i]._weight;if(cum>=r){sel=weighted[i];break;}}
    if(!seen.has(sel.id)){seen.add(sel.id);picked.push(sel);}
  }
  return shuffle(picked);
}

];

function kaSentenceMatch(input, target) {
  function norm(s){return (s||'').toLowerCase().replace(/[^a-z0-9\s]/g,'').trim();}
  var inp=norm(input).split(/\s+/).filter(Boolean);
  var tgt=norm(target).split(/\s+/).filter(Boolean);
  if(!tgt.length) return false;
  var inpSet={}; inp.forEach(function(w){inpSet[w]=1;});
  var matches=tgt.filter(function(w){return !!inpSet[w];}).length;
  return matches/tgt.length>=0.65;
}
function kaGradeFor(correct, total) {
  var pct=total>0?correct/total:0;
  if(pct>=0.95) return 1; if(pct>=0.85) return 2; if(pct>=0.70) return 3;
  if(pct>=0.55) return 4; if(pct>=0.40) return 5; return 6;
}
function buildKaQuestions(selectedRuns, grammarPool, withSentences) {
  var vocabMap={};
  selectedRuns.forEach(function(run){safeWords(run.words).forEach(function(w){var k=normWordKey(w.word);if(!vocabMap[k])vocabMap[k]=w;});});
  var vocabArr=Object.values(vocabMap);
  // KA_SAETZE sind englische Übersetzungssätze — nur für Englisch beilegen.
  var sentQs=(withSentences===false)?[]:KA_SAETZE.map(function(s){return {kind:'sentence',german:s.de,answer:s.en};});
  var remaining=40;
  var hasV=vocabArr.length>0, hasG=grammarPool.length>0;
  var vQ=hasV&&hasG?20:(hasV?40:0), gQ=hasG&&hasV?20:(hasG?40:0);
  var vocabQs=shuffleArr(vocabArr.slice()).slice(0,Math.min(vQ,vocabArr.length)).map(function(w){return {kind:'vocab',german:w.clue,answer:w.word};});
  var grammarQs=shuffleArr(grammarPool.slice()).slice(0,Math.min(gQ,grammarPool.length)).map(function(q){return {kind:'grammar',sentence:q.sentence,answer:q.answer,acceptable_answers:q.acceptable_answers||[],hint:q.rule||'',german_hint:q.german_hint||''};});
  return shuffleArr(vocabQs.concat(grammarQs).concat(sentQs));
}

function GrammarAdmin({ player, chapters }) {
  var [topic, setTopic] = useState('sp');
  var [pool, setPool] = useState([]);
  var [loading, setLoading] = useState(false);
  var [generating, setGenerating] = useState(false);
  var [msg, setMsg] = useState('');
  var [batchN, setBatchN] = useState(10);
  var [apiKey, setApiKey] = useState('');
  var [savedKey, setSavedKey] = useState('');

  useEffect(function(){
    var k = localStorage.getItem('claude_api_key') || '';
    setApiKey(k); setSavedKey(k);
  },[]);

  useEffect(function(){
    setLoading(true);
    loadGrammarPool(topic).then(function(p){setPool(p);setLoading(false);}).catch(function(){setLoading(false);});
  },[topic]);

  function saveKey(){
    localStorage.setItem('claude_api_key', apiKey.trim());
    setSavedKey(apiKey.trim());
    setMsg('✓ API-Key gespeichert');
  }

  function generate(){
    var key = savedKey || localStorage.getItem('claude_api_key') || '';
    if(!key){setMsg('Bitte zuerst API-Key eintragen und speichern');return;}
    setGenerating(true); setMsg('');
    var topicLabel = topic==='sp'?'Simple Present':topic==='pp'?'Present Progressive':topic==='sa'?'some/any':'Modal Verbs (must/mustn\'t/should/shouldn\'t/need to/don\'t need to)';
    var promptDetail = topic==='sp'
      ? 'Verwende verschiedene Subjekte (I, you, he, she, we, they). Die Lücke ist das Verb in der richtigen Simple-Present-Form. Am Ende des Satzes steht der Infinitiv in Klammern als Hinweis. Das Feld "german_hint" enthält nur den deutschen Infinitiv (z.B. "spielen" für "to play"). WICHTIG: Nur EINE Lücke pro Satz. Beispiel: {"sentence":"She ___ football every day. (to play)","answer":"plays","distractors":["play","playing","played"],"rule":"Simple Present","translation":"Sie spielt jeden Tag Fußball.","german_hint":"spielen"}'
      : topic==='pp'
      ? 'Verwende verschiedene Subjekte (I, you, he, she, we, they). Die Lücke ist das Verb in der richtigen Present-Progressive-Form (am/is/are + Verb+ing). Am Ende des Satzes steht der Infinitiv in Klammern als Hinweis. Das Feld "german_hint" enthält nur den deutschen Infinitiv (z.B. "spielen" für "to play"). WICHTIG: Nur EINE Lücke pro Satz. Beispiel: {"sentence":"She ___ football right now. (to play)","answer":"is playing","distractors":["plays","play","are playing"],"rule":"Present Progressive","translation":"Sie spielt gerade Fußball.","german_hint":"spielen"}'
      : topic==='sa'
      ? 'Die Lücke ist "some" oder "any". Verwende alltägliche Sätze (Fragen, Verneinungen, Angebote, Bitten). WICHTIG: Nur EINE Lücke pro Satz. Beispiel: {"sentence":"Can I have ___ of these kiwis?","answer":"some","distractors":["any","no","a"],"rule":"some/any","translation":"Kann ich einige dieser Kiwis haben?"}'
      : 'Erstelle alltagsnahe Sätze für Schüler der 6. Klasse wo ein Modalverb fehlt. Verfügbare Modalverben: must, mustn\'t, should, shouldn\'t, need to, don\'t need to. WICHTIG: Manchmal sind mehrere Modalverben sinnvoll — gib dann ALLE akzeptablen Antworten im "acceptable_answers"-Array an (immer befüllen, auch wenn nur eine Antwort möglich ist). Das "answer"-Feld enthält die beste/typischste Antwort. Kein Hinweis in Klammern am Satzende. Beispiel: {"sentence":"You ___ eat so many sweets.","answer":"shouldn\'t","acceptable_answers":["shouldn\'t","mustn\'t"],"distractors":["must","should","need to"],"rule":"modal verbs","translation":"Du solltest nicht so viele Süßigkeiten essen."}';
    var distNote = topic==='sa'
      ? 'Die 3 distractors müssen sinnvolle aber falsche Alternativen sein (any, some, no, a, the).'
      : topic==='mv'
      ? 'Die distractors sind die Modalverben aus [must, mustn\'t, should, shouldn\'t, need to, don\'t need to] die NICHT in acceptable_answers stehen.'
      : 'Die 3 distractors müssen andere Konjugationsformen DESSELBEN Verbs sein (nicht andere Wörter).';
    var promptTemplate = function(n){
      var fields = topic==='mv'
        ? 'sentence (mit ___ als einziger Lücke), answer, acceptable_answers, distractors, rule, translation'
        : (topic==='sp'||topic==='pp')
        ? 'sentence (mit ___ als einziger Lücke, Infinitiv am Ende in Klammern), answer, distractors, rule, translation, german_hint'
        : 'sentence (mit ___ als einziger Lücke), answer, distractors, rule, translation';
      return 'Erstelle '+n+' verschiedene Lückentext-Aufgaben auf Englisch für das Thema '+topicLabel+'. '+promptDetail+' '+distNote+' Antworte NUR mit einem JSON-Array mit genau diesen Feldern: '+fields+'. Keine Erklärungen, kein Markdown, nur das JSON-Array.';
    };
    var CHUNK=10;
    var chunks=[];
    for(var ci=0;ci<batchN;ci+=CHUNK) chunks.push(Math.min(CHUNK,batchN-ci));
    var allNew=[];
    var currentPool=pool.slice();
    function runChunk(idx, retries){
      if(idx>=chunks.length){
        setPool(currentPool);
        setMsg('✓ '+allNew.length+' Sätze generiert und gespeichert');
        setGenerating(false);
        return;
      }
      var attempt=retries||0;
      setMsg('Generiere… ('+allNew.length+'/'+batchN+')'+(attempt>0?' — Versuch '+(attempt+1):''));
      fetch('https://api.anthropic.com/v1/messages',{
        method:'POST',
        headers:{'Content-Type':'application/json','x-api-key':key,'anthropic-version':'2023-06-01','anthropic-dangerous-direct-browser-access':'true'},
        body:JSON.stringify({model:'claude-sonnet-4-20250514',max_tokens:4000,messages:[{role:'user',content:promptTemplate(chunks[idx])}]})
      }).then(function(r){
        if(r.status===529||r.status===503||r.status===429){
          if(attempt<5){
            var wait=(attempt+1)*8000;
            setMsg('API überlastet — warte '+(wait/1000)+'s… ('+allNew.length+'/'+batchN+')');
            setTimeout(function(){ runChunk(idx,attempt+1); }, wait);
          } else {
            setMsg('Fehler: API dauerhaft überlastet. Bitte später erneut versuchen.');
            setGenerating(false);
          }
          return null;
        }
        return r.json();
      })
      .then(function(d){
        if(!d) return;
        if(d.error){ throw new Error(d.error.message||'API Fehler'); }
        var text=d.content&&d.content[0]&&d.content[0].text||'';
        var clean=text.replace(/```json|```/g,'').trim();
        var arr=JSON.parse(clean).map(function(q){ return Object.assign({id:Date.now()+'_'+Math.random().toString(36).slice(2)},q); });
        allNew=allNew.concat(arr);
        currentPool=currentPool.concat(arr);
        return saveGrammarPool(topic, currentPool).then(function(){ setTimeout(function(){ runChunk(idx+1,0); }, 500); });
      })
      .catch(function(e){ setMsg('Fehler bei Batch '+(idx+1)+': '+e.message); setGenerating(false); });
    }
    runChunk(0,0);
  }

  function deleteQ(id){

function GrammarProgress({ ruleStats, sessions, qStats }) {
  var qs=qStats||{};
  var mastered=Object.keys(qs).filter(function(id){return qs[id].correct>=2;}).length;
  var practiced=Object.keys(qs).length;
  var rules=Object.keys(ruleStats||{});
  var noData=rules.length===0&&(!sessions||sessions.length===0);
  return(
    <div>
      {practiced>0&&(

            <div style={{fontSize:10,color:T}}>gemeistert</div>
            <div style={{fontSize:9,color:G400}}>2× korrekt</div>

            <div style={{fontSize:10,color:'#92400e'}}>offen</div>

      )}
      {rules.map(function(rule){

        var col=pct>=80?GR:pct>=50?AM:RE;
        return <div key={rule} style={{display:'flex',alignItems:'center',gap:8,padding:'8px 10px',marginBottom:5,background:'white',borderRadius:8,border:'1px solid '+G200}}>

function buildOptions(q, pool) {
  // some/any: always exactly 2 options
  if(q.rule==='some/any') return Math.random()<0.5?['some','any']:['any','some'];
  // modal verbs: show all 6 options shuffled
  if(q.rule==='modal verbs') {
    var mo=MODAL_OPTS.slice();
    for(var mi=mo.length-1;mi>0;mi--){var mj=Math.floor(Math.random()*(mi+1));var mt=mo[mi];mo[mi]=mo[mj];mo[mj]=mt;}
    return mo;
  }
  // sp/pp: 4 options = correct + 3 distractors
  var opts = [q.answer];
  var dist = (q.distractors||[]).filter(function(d){ return d&&d.toLowerCase()!==q.answer.toLowerCase(); });
  if(dist.length<3) {
    var poolAnswers = (pool||[]).filter(function(p){ return p.answer&&p.answer.toLowerCase()!==q.answer.toLowerCase(); }).map(function(p){return p.answer;});
    var arr=poolAnswers.slice(); for(var ii=arr.length-1;ii>0;ii--){var jj=Math.floor(Math.random()*(ii+1));var tmp=arr[ii];arr[ii]=arr[jj];arr[jj]=tmp;}
    var seen=new Set([q.answer.toLowerCase()].concat(dist.map(function(d){return d.toLowerCase();})));
    for(var pi=0;pi<arr.length&&dist.length<3;pi++){ if(!seen.has(arr[pi].toLowerCase())){seen.add(arr[pi].toLowerCase());dist.push(arr[pi]);} }
  }
  opts=opts.concat(dist.slice(0,3));
  while(opts.length<4) opts.push('…');
  var o=opts.slice(); for(var oi=o.length-1;oi>0;oi--){var oj=Math.floor(Math.random()*(oi+1));var ot=o[oi];o[oi]=o[oj];o[oj]=ot;}
  return o;
}

    if(!q||result) return;
    var correct=isCorrectAnswer(q,opt);
    tallyAnswer(correct);
    var newRes={q:q,input:opt,correct:correct};
    setChosen(opt);
    setResults(function(r){return r.concat([newRes]);});
    var newStats=JSON.parse(JSON.stringify(ruleStats));
    if(!newStats[q.rule]) newStats[q.rule]={correct:0,total:0};
    newStats[q.rule].total++;
    if(correct) newStats[q.rule].correct++;
    setRuleStats(newStats);
    var newQStats=Object.assign({},qStats);
    if(!newQStats[q.id]) newQStats[q.id]={correct:0,total:0};

  var [sel, setSel] = useState({});
  var [filter, setFilter] = useState('all');
  var [openKap, setOpenKap] = useState({});
  var [openCh, setOpenCh] = useState(null);

  function cwValid(w){ return w.word && w.clue && w.word.replace(/[^A-Za-z]/g,'').length>=3; }
  function getFiltered(ch){
    var ws=safeWords(ch.words);
    return ws.filter(function(w){ return cwValid(w)&&(filter==='all'||w.important); });
  }
  function togAll(ch){
    var ws=safeWords(ch.words);
    var fi=ws.filter(function(w){ return cwValid(w)&&(filter==='all'||w.important); });
    setSel(function(prev){
      var n=Object.assign({},prev); var cur=n[ch.id]||new Set();
      var allS=fi.every(function(w){return cur.has(ws.indexOf(w));});
      var next=new Set(cur);
      if(allS) fi.forEach(function(w){next.delete(ws.indexOf(w));});
      else fi.forEach(function(w){next.add(ws.indexOf(w));});
      n[ch.id]=next; return n;
    });
  }
  function togW(chId,idx){
    setSel(function(prev){var n=Object.assign({},prev);var cur=new Set(n[chId]||[]);if(cur.has(idx))cur.delete(idx);else cur.add(idx);n[chId]=cur;return n;});
  }
  function getWords(){
    var w=[];
    chapters.forEach(function(ch){var ws=safeWords(ch.words);var s=sel[ch.id]||new Set();s.forEach(function(i){if(ws[i]&&cwValid(ws[i]))w.push(Object.assign({},ws[i]));});});
    return w;
  }
  function startPuzzle(){
    var words=getWords().map(function(w){return Object.assign({},w,{word:w.word.replace(/[^A-Za-z]/g,'').toUpperCase()});});
    if(words.length<4){alert('Mindestens 4 Vokabeln auswählen (mind. 3 englische Buchstaben je Wort).');return;}
    var sol=SOLS[Math.floor(Math.random()*SOLS.length)];
    var cw=buildCW(words,sol.phrase);
    setPuzzle({cw:cw,sol:sol});
  }

  var total=Object.values(sel).reduce(function(s,set){return s+set.size;},0);
  var topLevel=rootsOf(chapters).slice().sort(naturalSort);
  var childMap={};
  chapters.filter(function(c){return c.parent_id;}).forEach(function(c){
    if(!childMap[c.parent_id]) childMap[c.parent_id]=[];
    childMap[c.parent_id].push(c);
  });

  // kapitel-level counts
  function kapSelCount(kap){
    return (childMap[kap.id]||[]).reduce(function(s,ch){return s+(sel[ch.id]||new Set()).size;},0);
  }

  if(puzzle){
    return (
      <div style={{padding:8}}>
        <button onClick={function(){setPuzzle(null);}} style={{marginBottom:10,background:'none',border:'none',color:T,cursor:'pointer',fontSize:13,touchAction:'manipulation'}}>← Andere Vokabeln wählen</button>
        <Puzzle data={puzzle.cw} solPhrase={puzzle.sol.phrase} solMsg={puzzle.sol.msg}/>
      </div>
    );
  }

  return (
    <div style={{padding:8}}>
      <div style={{display:'flex',gap:6,marginBottom:12,padding:'8px 12px',background:G50,borderRadius:10,alignItems:'center',flexWrap:'wrap'}}>
        <span style={{fontSize:12,color:G600,fontWeight:'bold'}}>Anzeigen:</span>
        {[['all','📚 Alle'],['important','⭐ Nur wichtige']].map(function(pair){
          return <button key={pair[0]} onClick={function(){setFilter(pair[0]);}} style={{padding:'5px 12px',borderRadius:20,fontSize:12,fontWeight:'bold',background:filter===pair[0]?T:'white',color:filter===pair[0]?'white':G600,border:'1.5px solid '+(filter===pair[0]?T:G200),cursor:'pointer',touchAction:'manipulation'}}>{pair[1]}</button>;
        })}
      </div>
      <div style={{marginBottom:12,padding:'10px 14px',background:TL,borderRadius:10,display:'flex',justifyContent:'space-between',alignItems:'center'}}>
        <span style={{fontSize:13,color:T,fontWeight:'bold'}}>{total} Vokabeln gewählt</span>
        <button onClick={startPuzzle} disabled={total<4} style={BtnStyle(total>=4?T:G400,'#fff',{padding:'6px 14px',opacity:total<4?0.5:1,touchAction:'manipulation'})}>🔤 Rätsel starten</button>
      </div>
      {total<4&&<p style={{fontSize:11,color:G400,textAlign:'center',marginBottom:8}}>Mindestens 4 Vokabeln auswählen</p>}
      {topLevel.map(function(kap){
        var kids=(childMap[kap.id]||[]).filter(function(c){return getFiltered(c).length>0;}).slice().sort(naturalSort);
        if(kids.length===0) return null;
        var kapSel=kapSelCount(kap);
        var kapOpen=openKap[kap.id];
        return (
          <div key={kap.id} style={{marginBottom:10,border:'2px solid '+(kapSel>0?(kap.color||T):G200),borderRadius:12,overflow:'hidden'}}>
            <div onClick={function(){setOpenKap(function(p){var n=Object.assign({},p);n[kap.id]=!p[kap.id];return n;});}} style={{display:'flex',alignItems:'center',gap:8,padding:'10px 14px',background:kapSel>0?((kap.color||T)+'15'):'white',cursor:'pointer',touchAction:'manipulation'}}>
              <span style={{fontSize:20}}>{kap.icon}</span>
              <div style={{flex:1}}>
                <div style={{fontWeight:'bold',fontSize:14,color:kap.color||T}}>{kap.title}</div>
                <div style={{fontSize:11,color:G400}}>{kids.length} Themenbereiche{kapSel>0?' · '+kapSel+' gewählt':''}</div>
              </div>
              <span style={{color:G400,fontSize:12}}>{kapOpen?'▲':'▼'}</span>
            </div>
            {kapOpen&&(<div style={{borderTop:'1px solid '+G200}}>
              {kids.map(function(c){
                var ws=safeWords(c.words); var s=sel[c.id]||new Set(); var fi=getFiltered(c);
                var allS=fi.length>0&&fi.every(function(w){return s.has(ws.indexOf(w));}); var someS=fi.some(function(w){return s.has(ws.indexOf(w));})&&!allS;
                var open=openCh===c.id;
                return (
                  <div key={c.id} style={{borderBottom:'1px solid '+G100}}>
                    <div style={{display:'flex',alignItems:'center',gap:8,padding:'9px 14px 9px 20px',background:s.size>0?(c.color+'10'):'#fafafa',cursor:'pointer',touchAction:'manipulation'}} onClick={function(){setOpenCh(open?null:c.id);}}>
                      <span style={{fontSize:16}}>{c.icon}</span>
                      <div style={{flex:1}}>
                        <div style={{fontWeight:'bold',fontSize:12,color:c.color}}>{c.title}</div>
                        <div style={{fontSize:10,color:G400}}>{fi.length} wählbar · {s.size} gewählt</div>
                      </div>
                      <div onClick={function(e){e.stopPropagation();togAll(c);}} style={{width:20,height:20,borderRadius:5,border:'2px solid '+(allS?c.color:someS?c.color:G200),background:allS?c.color:'white',display:'flex',alignItems:'center',justifyContent:'center',flexShrink:0,cursor:'pointer',touchAction:'manipulation'}}>
                        {allS&&<span style={{color:'white',fontSize:11}}>✓</span>}{someS&&<span style={{color:c.color,fontSize:11}}>–</span>}
                      </div>
                      <span style={{color:G400,fontSize:11}}>{open?'▲':'▼'}</span>
                    </div>
                    {open&&(<div style={{padding:'8px 14px 10px 20px',background:'#f9fafb'}}>
                      <div style={{display:'flex',flexWrap:'wrap',gap:5}}>
                        {fi.map(function(w){var ri=ws.indexOf(w);var isSel=s.has(ri);
                          return (<div key={ri} onClick={function(){togW(c.id,ri);}} style={{display:'flex',alignItems:'center',gap:4,padding:'4px 9px',borderRadius:20,border:'1.5px solid '+(isSel?c.color:G200),background:isSel?(c.color+'15'):'white',cursor:'pointer',touchAction:'manipulation'}}>
                            {w.important&&<span style={{fontSize:9}}>⭐</span>}
                            <span style={{fontSize:11,fontWeight:w.important?'bold':'normal',color:isSel?c.color:G600}}>{w.word}</span>
                            <span style={{fontSize:10,color:G400}}>= {w.clue}</span>
                          </div>);
                        })}
                      </div>
                    </div>)}
                  </div>
                );
              })}
            </div>)}
          </div>
        );
      })}
      {topLevel.length===0&&<div style={{color:G400,fontSize:13,textAlign:'center',marginTop:30}}>Keine Kapitel mit gültigen Vokabeln gefunden.</div>}
    </div>
  );
}

// Kompakter Umschalter für Klasse + Sprache. Sitzt in der Kopfzeile und öffnet
// ein Overlay; alle Lernbereiche zeigen danach nur noch Inhalte dieser Auswahl.
function ScopeSwitcher({ scopes, scope, onChange, compact }) {
  var [open, setOpen] = useState(false);
  if(!scope) return null;
  var grades = []; scopes.forEach(function(s){ if(grades.indexOf(s.grade)<0) grades.push(s.grade); });
  grades.sort(function(a,b){return a-b;});
  var langsForGrade = scopes.filter(function(s){ return s.grade===scope.grade; }).map(function(s){ return s.language; });
  function pickGrade(g){
    var langs = scopes.filter(function(s){ return s.grade===g; }).map(function(s){ return s.language; });
    var lang = langs.indexOf(scope.language)>=0 ? scope.language : langs[0];
    onChange({grade:g, language:lang});
  }
  return(
    <React.Fragment>
      <button onClick={function(){setOpen(true);}} title="Klasse und Sprache wechseln"
        style={{background:'rgba(255,255,255,0.18)',border:'none',color:'white',padding:compact?'3px 8px':'4px 10px',borderRadius:8,cursor:'pointer',fontSize:11,fontWeight:'bold',touchAction:'manipulation',flexShrink:0,whiteSpace:'nowrap'}}>
        {langFlag(scope.language)} Kl. {scope.grade} ▾
      </button>
      {open&&(
        <div onClick={function(){setOpen(false);}} style={{position:'fixed',inset:0,background:'rgba(0,0,0,0.45)',zIndex:300,display:'flex',alignItems:'center',justifyContent:'center',padding:16}}>
          <div onClick={function(e){e.stopPropagation();}} style={{background:'white',borderRadius:16,padding:18,width:'100%',maxWidth:340,boxShadow:'0 8px 30px rgba(0,0,0,0.3)'}}>
            <div style={{fontWeight:'bold',fontSize:15,color:G900,marginBottom:3}}>Was möchtest du lernen?</div>
            <div style={{fontSize:11,color:G400,marginBottom:14}}>Leiterspiel, Quiz, Wiederholung &amp; Co. zeigen danach nur diese Auswahl.</div>

            <div style={{fontSize:11,fontWeight:'bold',color:G600,marginBottom:6}}>Klasse</div>
            <div style={{display:'flex',gap:6,flexWrap:'wrap',marginBottom:16}}>
              {grades.map(function(g){
                var act = g===scope.grade;
                return <button key={g} onClick={function(){pickGrade(g);}}
                  style={{padding:'8px 16px',borderRadius:20,fontSize:13,fontWeight:'bold',cursor:'pointer',touchAction:'manipulation',
                    background:act?T:'white',color:act?'white':G600,border:'2px solid '+(act?T:G200)}}>Klasse {g}</button>;
              })}
            </div>

            <div style={{fontSize:11,fontWeight:'bold',color:G600,marginBottom:6}}>Sprache</div>
            <div style={{display:'flex',gap:6,flexWrap:'wrap',marginBottom:16}}>
              {langsForGrade.map(function(l){
                var act = l===scope.language;
                return <button key={l} onClick={function(){onChange({grade:scope.grade, language:l});}}
                  style={{padding:'8px 16px',borderRadius:20,fontSize:13,fontWeight:'bold',cursor:'pointer',touchAction:'manipulation',
                    background:act?T:'white',color:act?'white':G600,border:'2px solid '+(act?T:G200)}}>{langFlag(l)} {langLabel(l)}</button>;
              })}
            </div>

            <button onClick={function(){setOpen(false);}} style={BtnStyle(T,'white',{width:'100%',padding:'10px'})}>Fertig</button>
          </div>
        </div>
      )}
    </React.Fragment>
  );
}

function Shell({ player, setPlayer, chapters, setChapters, allUsers, setAllUsers, allCategories, setAllCategories, onLogout }) {
  var isAdmin = !!(player && player.is_admin);
  var [screen, setScreen] = useState(isAdmin ? 'admin' : 'home');
  var [screenData, setScreenData] = useState(null);
  var [lsRun, setLsRun] = useState(null);
  var [lsStreak, setLsStreak] = useState(null);
  var [kaQuestions, setKaQuestions] = useState(null);
  var [onlineIds, setOnlineIds] = useState([]);
  var [quizScoring, setQuizScoring] = useState({correct:10,win:50,loss:-50,draw:30});
  var [goalInfo, setGoalInfo] = useState({current:0,best:0,todaySec:0});
  var [scope, setScopeState] = useState(loadScope());
  var allUsersRef = useRef(allUsers);
  allUsersRef.current = allUsers;

  var scopes = useMemo(function(){ return listScopes(chapters); }, [chapters]);
  // Sobald die Kapitel geladen sind: gespeicherte Auswahl prüfen, sonst Standard
  // (Klasse 6 / Englisch, falls vorhanden — sonst höchste verfügbare Klasse).
  useEffect(function(){
    if(!scopes.length) return;
    var valid = scope && scopes.some(function(s){ return sameScope(s, scope); });
    if(!valid) setScopeState(defaultScope(scopes));
  }, [scopes]);
  function setScope(sc){ setScopeState(sc); saveScope(sc); }

  useEffect(function(){
    if(!player) return;
    sbGet('settings','key=eq.quiz_scoring&select=value').then(function(d){
      if(Array.isArray(d)&&d.length>0){try{var s=JSON.parse(d[0].value);if(s)setQuizScoring(s);}catch(e){}}
    }).catch(function(){});
  },[player&&player.id]);

  useEffect(function(){
    var UUID=/^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/i;
    if(!player||!UUID.test(player.id)) return;
    if(!(window.crypto && window.crypto.randomUUID)) return;
    var game = screenGame(screen);
    if(!game) return; // Menüs/Verwaltung nicht als Lernzeit tracken
    var runId = (lsRun&&lsRun.id&&UUID.test(lsRun.id))?lsRun.id:null;
    var sessionId = window.crypto.randomUUID();
    var startedAt = new Date().toISOString();
    var localSeconds=0, lastSavedSeconds=0, lastActivity=Date.now(), created=false;
    var IDLE_MS=120000, TICK_MS=1000, FLUSH_MS=15000;
    // Antworten dieser Session = Zuwachs des globalen Zählers seit Sessionstart.
    var baseOk=ANSWER_TALLY.ok, baseBad=ANSWER_TALLY.bad;
    function isActive(){ return document.visibilityState==='visible' && (Date.now()-lastActivity)<IDLE_MS; }
    // Jede Speicherung ist ein vollständiger Upsert (merge-duplicates auf der id).
    // Damit ist die Reihenfolge egal — kein "PATCH vor INSERT"-Verlust mehr, und
    // mit keepalive überlebt die letzte Speicherung auch das Schließen/Wegwischen der App.
    function flush(closing, keepalive){
      if(created && localSeconds===lastSavedSeconds && !closing) return;
      created=true; lastSavedSeconds=localSeconds;
      var row={ id:sessionId, player_id:player.id, run_id:runId, game:game, started_at:startedAt, active_seconds:localSeconds,
        correct_count:Math.max(0,ANSWER_TALLY.ok-baseOk), wrong_count:Math.max(0,ANSWER_TALLY.bad-baseBad) };
      if(closing) row.ended_at=new Date().toISOString();
      try{
        fetch(SB_URL+'/rest/v1/learn_sessions',{
          method:'POST',
          headers:Object.assign({},HW_POST,{'Prefer':'resolution=merge-duplicates,return=minimal'}),
          body:JSON.stringify(row), mode:'cors', credentials:'omit', keepalive:!!keepalive
        }).catch(function(){});
      }catch(e){}
    }
    flush(false,false); // Zeile sofort anlegen (0 s), upsert-sicher
    function bump(){ lastActivity=Date.now(); }
    var evs=['click','keydown','touchstart','mousemove','scroll','pointerdown'];
    evs.forEach(function(ev){ document.addEventListener(ev,bump,{passive:true}); });
    var tickIv=setInterval(function(){ if(isActive()) localSeconds++; },TICK_MS);
    var flushIv=setInterval(function(){ flush(false,false); },FLUSH_MS);
    function onVis(){ if(document.visibilityState==='hidden') flush(false,true); }
    document.addEventListener('visibilitychange',onVis);
    function onUnload(){ flush(true,true); }
    window.addEventListener('beforeunload',onUnload);
    window.addEventListener('pagehide',onUnload);
    return function(){
      clearInterval(tickIv); clearInterval(flushIv);
      evs.forEach(function(ev){ document.removeEventListener(ev,bump); });
      document.removeEventListener('visibilitychange',onVis);
      window.removeEventListener('beforeunload',onUnload);
      window.removeEventListener('pagehide',onUnload);
      flush(true,true);
    };
  },[player&&player.id, lsRun&&lsRun.id, screen]);

  useEffect(function(){
    if(!player) return;
    var pid = String(player.id);
    function sendHeartbeat(){
      sbGet('settings','key=eq.presence_'+pid+'&select=key').then(function(d){
        if(Array.isArray(d)&&d.length>0){
          sbPatch('settings',{value:new Date().toISOString()},'key=eq.presence_'+pid).catch(function(){});
        } else {
          sbPost('settings',{key:'presence_'+pid,value:new Date().toISOString()}).catch(function(){});
        }
      }).catch(function(){});
    }
    function loadPresence(){
      var users = allUsersRef.current||[];
      if(!users.length) return;
      var cutoff = Date.now()-90000;
      Promise.all(users.map(function(u){
        return sbGet('settings','key=eq.presence_'+u.id+'&select=key,value').then(function(d){
          if(!d||!d.length) return null;
          try{ if(new Date(d[0].value).getTime()>cutoff) return u.id; }catch(e){}
          return null;
        }).catch(function(){ return null; });
      })).then(function(results){
        setOnlineIds(results.filter(Boolean));
      });
    }
    sendHeartbeat();
    loadPresence();
    var hb = setInterval(function(){ sendHeartbeat(); loadPresence(); }, 30000);
    return function(){ clearInterval(hb); };
  },[player&&player.id]);

  function go(s, data) { setScreen(s); setScreenData(data||null); }

  function handleUpdateScore(pts) {
    if(!player||!pts) return;
    var UUID=/^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/i;
    if(UUID.test(player.id)){
      sbPatch('players',{total_score:(player.total_score||0)+pts},'id=eq.'+player.id).then(function(){
        setPlayer(function(p){return Object.assign({},p,{total_score:(p.total_score||0)+pts});});
        setAllUsers(function(prev){return prev.map(function(u){return u.id===player.id?Object.assign({},u,{total_score:(u.total_score||0)+pts}):u;});});
      });
    } else {
      setPlayer(function(p){return Object.assign({},p,{total_score:(p.total_score||0)+pts});});
    }
  }

  var tabs = isAdmin
    ? [{id:'admin', label:'⚙️', title:'Admin'}]
    : [
        {id:'home',       label:'🏠', title:'Home'},
        {id:'learn',      label:'📚', title:'Lernen'},
        {id:'games',      label:'🎮', title:'Spiele'},
        {id:'progress',   label:'📊', title:'Fortschritt'},
        {id:'scoreboard', label:'🏆', title:'Sticker'},
      ];

  // scopeTree = alle Kapitel der gewählten Klasse/Sprache (inkl. Sprachknoten),
  // childChapters = davon die Blätter, also die eigentlichen Themen mit Wörtern.
  var scopeTree = useMemo(function(){
    return chapters.filter(function(c){ return c.language && inScope(c, scope); });
  }, [chapters, scope]);
  var childChapters = useMemo(function(){
    var hasKid = {};
    chapters.forEach(function(c){ if(c.parent_id) hasKid[c.parent_id] = 1; });
    return scopeTree.filter(function(c){ return !hasKid[c.id]; });
  }, [chapters, scopeTree]);
  var isEnglish = !scope || scope.language === 'en';

  function renderContent() {
    if(screen==='vocab_trainer'&&screenData) return <VokabelTrainer words={screenData} player={player} onDone={function(){go('learn');}} title="Vokabeln"/>;
    if(screen==='workout'&&screenData) return <WorkoutSession words={screenData.words} player={player} progressMap={screenData.progressMap} onDone={function(){go('learn');}}/>;
    if(screen==='sentence_learner') return <SentenceLearner chapters={childChapters} player={player} onDone={function(){go('learn');}}/>;
    if(screen==='quiz_solo'){var gwSolo=[];childChapters.forEach(function(ch){(ch.words||[]).forEach(function(w){gwSolo.push(Object.assign({},w));});});return <QuizSolo chapters={screenData&&screenData.chapters||childChapters} globalWords={gwSolo} onDone={function(){go('quiz_duel_menu');}}/>;}
    if(screen==='quiz_duel'){var gwDuel=[];childChapters.forEach(function(ch){(ch.words||[]).forEach(function(w){gwDuel.push(Object.assign({},w));});});var duelChs=screenData&&screenData.chapters||childChapters;return <QuizDuel chapters={duelChs} allChapters={childChapters} globalWords={gwDuel} player={player} allUsers={allUsers} setAllUsers={setAllUsers} setPlayer={setPlayer} allCategories={allCategories} onlineIds={onlineIds} quizScoring={quizScoring} onDone={function(){go('quiz_duel_menu');}}/>;}
    if(screen==='quiz_duel_menu') return <QuizDuelMenu chapters={scopeTree} allChapters={childChapters} player={player} allUsers={allUsers} allCategories={allCategories} onlineIds={onlineIds} quizScoring={quizScoring} setQuizScoring={setQuizScoring} onDone={function(){go('games');}}/>;

    if(screen==='puzzle') return <div style={{padding:8}}><BrowseChapter ch={screenData||childChapters[0]}/></div>;
    if(screen==='crossword') return <CrosswordGame chapters={scopeTree} onDone={function(){go('games');}}/>;
    if(screen==='leiterspiel_menu') return <LeitersSpielMenu player={player} chapters={chapters} scope={scope} allUsers={allUsers}
      onStart={function(run,streak){setLsRun(run);setLsStreak(streak);go('leiterspiel_play');}}
      onDone={function(){go('games');}}/>;
    if(screen==='leiterspiel_play'&&lsRun) return <LeitersSpielSession run={lsRun} player={player} chapters={chapters} streak={lsStreak} setPlayer={setPlayer} onUpdateScore={handleUpdateScore} onDone={function(){go('leiterspiel_menu');}}/>;
    if(screen==='leiterspiel_create') return <LeitersSpielCreate player={player} chapters={scopeTree} scope={scope} onDone={function(){go('games');}}/>;
    if(screen==='grammar') return <GrammarGame player={player} setPlayer={setPlayer} onDone={function(){go('games');}}/>;
    if(screen==='wiederholung') return <WiederholungMode player={player} chapters={childChapters} onDone={function(){go('home');}}/>;
    if(screen==='klassenarbeit_player') return <KlassenarbeitPlayer player={player} chapters={chapters} scope={scope} onStart={function(qs){setKaQuestions(qs);go('klassenarbeit_play');}} onDone={function(){go('games');}}/>;
    if(screen==='klassenarbeit_play'&&kaQuestions) return <KlassenarbeitTest player={player} questions={kaQuestions} onDone={function(){go('klassenarbeit_player');}}/>;
    if(screen==='admin') return <AdminDash player={player} chapters={chapters} scope={scope} setChapters={setChapters} allUsers={allUsers} setAllUsers={setAllUsers} allCategories={allCategories} setAllCategories={setAllCategories} onDone={function(){go('home');}}/>;
    if(screen==='stats') return <Stats player={player} chapters={scopeTree}/>;
    if(screen==='leaderboard') return <Leaderboard allUsers={allUsers} player={player}/>;
    if(screen==='browse') return <div style={{padding:8}}>{childChapters.map(function(ch){return <BrowseChapter key={ch.id} ch={ch}/>;})}</div>;
    if(screen==='word_select_trainer') return <WordSelector chapters={childChapters} onStart={function(ws){go('vocab_trainer',ws);}} mode="trainer"/>;
    if(screen==='workout_setup') return <WorkoutSetup chapters={childChapters} player={player} onStart={function(words,pm){go('workout',{words:words,progressMap:pm});}}/>;
    return null;
  }

  var inner = renderContent();

  var screenTitles = {
    home:'🏠 Start',learn:'📚 Lernen',games:'🎮 Spiele',progress:'📊 Fortschritt',admin:'⚙️ Admin',
    vocab_trainer:'📝 Vokabeltrainer',workout:'🏋️ Workout',workout_setup:'🏋️ Workout',sentence_learner:'💬 Sätze',
    quiz_solo:'🎯 Quiz Solo',quiz_duel:'⚔️ Quiz Duell',quiz_duel_menu:'🎯 Quiz',crossword:'🧩 Kreuzworträtsel',browse:'📖 Vokabeln',
    leiterspiel_menu:'🪜 Leiterspiel',leiterspiel_play:'🪜 Leiterspiel',leiterspiel_create:'➕ Run erstellen',
    grammar:'✏️ Grammar Trainer',stats:'📊 Mein Fortschritt',leaderboard:'🏆 Gesamtrangliste',word_select_trainer:'📝 Trainer',
    scoreboard:'🏆 Meine Sticker',klassenarbeit_player:'📋 Klassenarbeit',klassenarbeit_play:'📋 Klassenarbeit'
  };

  var mainScreens = isAdmin
    ? ['admin']
    : ['home','learn','games','progress','scoreboard','admin'];
  var showBack = mainScreens.indexOf(screen)<0;

  if(inner===null||mainScreens.indexOf(screen)>=0){
    return(
      <div style={{maxWidth:480,margin:'0 auto',minHeight:'100vh',display:'flex',flexDirection:'column',background:'white'}}>
        <div style={{background:'linear-gradient(135deg,'+T+','+TD+')',padding:'12px 16px',display:'flex',alignItems:'center',gap:10,flexShrink:0}}>
          <span style={{fontSize:20}}>🎓</span>
          <div style={{flex:1}}>
            <div style={{fontWeight:'bold',fontSize:15,color:'white'}}>Vokabel-Rätsel</div>
            <div style={{fontSize:10,color:'rgba(255,255,255,0.7)'}}>{player&&player.name} · {player&&(player.total_score||0)} Pkt{scope?' · '+scopeText(scope):''}</div>
          </div>
          <ScopeSwitcher scopes={scopes} scope={scope} onChange={setScope}/>
          <button onClick={onLogout} style={{background:'rgba(255,255,255,0.15)',border:'none',color:'white',padding:'4px 10px',borderRadius:8,cursor:'pointer',fontSize:11,touchAction:'manipulation'}}>Abmelden</button>
        </div>

        {!isAdmin&&<GoalTracker player={player} onInfo={setGoalInfo}/>}
        <div style={{flex:1,overflowY:'auto',padding:'12px 10px 70px'}}>
          {screen==='home'&&(<div>
            <div style={{background:'linear-gradient(135deg,'+T+'22,'+T+'08)',borderRadius:16,padding:16,marginBottom:14,border:'1px solid '+T+'22'}}>
              <div style={{display:'flex',alignItems:'center',justifyContent:'space-between',marginBottom:4}}>
                <div style={{fontWeight:'bold',fontSize:14,color:T}}>Hallo, {player&&player.name}! 👋</div>
                {goalInfo.current>0&&<span style={{fontSize:13,fontWeight:'bold',color:'#d97706'}}>🔥 {goalInfo.current}</span>}
              </div>
              {goalInfo.todaySec>0
                ? <div style={{fontSize:12,color:G600}}>{Math.round(goalInfo.todaySec/60)} Min heute{goalInfo.todaySec>=DAILY_GOAL_SEC?' · ✅ Tagesziel erreicht!':' / 15 Min Ziel'}</div>
                : <div style={{fontSize:12,color:G600}}>Heute noch nichts gelernt — los geht's! 💪</div>
              }
              {goalInfo.current>0&&<div style={{fontSize:10,color:G400,marginTop:4}}>Streak: {goalInfo.current} Tag{goalInfo.current!==1?'e':''} · Bestwert: {goalInfo.best} Tag{goalInfo.best!==1?'e':''}</div>}
            </div>
            {[
              {icon:'🔁',title:'Wiederholung',sub:'Gelerntes festigen · Punkte pro Lauf',action:function(){go('wiederholung');}},
              {icon:'🏋️',title:'Workout',sub:'Schwache Vokabeln trainieren',action:function(){go('workout_setup');}},
              {icon:'🪜',title:'Leiterspiel',sub:'Topf-System mit Fortschritt',action:function(){go('leiterspiel_menu');}},
              {icon:'🎯',title:'Quiz',sub:'Solo oder Duell spielen',action:function(){go('quiz_duel_menu');}},
              {icon:'🧩',title:'Kreuzworträtsel',sub:'Vokabeln im Rätsel lösen',action:function(){go('crossword');}},
              ...(isEnglish?[{icon:'✏️',title:'Grammar Trainer',sub:'Englische Grammatik üben',action:function(){go('grammar');}}]:[]),
              {icon:'📋',title:'Klassenarbeit',sub:'Vorbereitung auf die Klassenarbeit',action:function(){go('klassenarbeit_player');}},
              {icon:'🏆',title:'Gesamtrangliste',sub:'Punkte aus allen Spielen',action:function(){go('leaderboard');}},
            ].map(function(item,i){
              return <button key={i} onClick={item.action} style={{display:'flex',alignItems:'center',gap:12,width:'100%',padding:'12px 14px',marginBottom:7,borderRadius:12,border:'1px solid '+G200,background:'white',cursor:'pointer',textAlign:'left',touchAction:'manipulation',boxShadow:'0 1px 4px rgba(0,0,0,0.06)'}}>
                <span style={{fontSize:24,flexShrink:0}}>{item.icon}</span>
                <div><div style={{fontWeight:'bold',fontSize:13,color:G900}}>{item.title}</div><div style={{fontSize:11,color:G400}}>{item.sub}</div></div>
                <span style={{marginLeft:'auto',color:G400,fontSize:14}}>›</span>
              </button>;
            })}
          </div>)}

          {screen==='learn'&&(<div>
            {[
              {icon:'📝',title:'Vokabeltrainer',sub:'Alle Vokabeln üben',action:function(){go('word_select_trainer');}},
              {icon:'💬',title:'Sätze lernen',sub:'Sätze übersetzen',action:function(){go('sentence_learner');}},
              {icon:'📖',title:'Vokabeln durchblättern',sub:'Alle Wörter anschauen',action:function(){go('browse');}},
            ].map(function(item,i){
              return <button key={i} onClick={item.action} style={{display:'flex',alignItems:'center',gap:12,width:'100%',padding:'12px 14px',marginBottom:7,borderRadius:12,border:'1px solid '+G200,background:'white',cursor:'pointer',textAlign:'left',touchAction:'manipulation'}}>
                <span style={{fontSize:22,flexShrink:0}}>{item.icon}</span>
                <div><div style={{fontWeight:'bold',fontSize:13}}>{item.title}</div><div style={{fontSize:11,color:G400}}>{item.sub}</div></div>
                <span style={{marginLeft:'auto',color:G400,fontSize:14}}>›</span>
              </button>;
            })}
          </div>)}

          {screen==='games'&&(<div>
            {[
              {icon:'🔁',title:'Wiederholung',sub:'Gelerntes festigen · Punkte pro Lauf',action:function(){go('wiederholung');}},
              {icon:'🎯',title:'Quiz',sub:'Solo oder Duell - Kapitel auswaehlen',action:function(){go('quiz_duel_menu');}},
              {icon:'🧩',title:'Kreuzworträtsel',sub:'Vokabeln im Rätsel lösen',action:function(){go('crossword');}},
              {icon:'🪜',title:'Leiterspiel',sub:'Topf-System Spiel',action:function(){go('leiterspiel_menu');}},
              ...(isEnglish?[{icon:'✏️',title:'Grammar Trainer',sub:'Grammatik mit KI-Feedback',action:function(){go('grammar');}}]:[]),
              {icon:'📋',title:'Klassenarbeit',sub:'Vorbereitung auf die Klassenarbeit',action:function(){go('klassenarbeit_player');}},
              ...(isAdmin?[{icon:'➕',title:'Run erstellen',sub:'Neuen Leiterspiel-Run erstellen',action:function(){go('leiterspiel_create');}}]:[]),
            ].map(function(item,i){
              return <button key={i} onClick={item.action} style={{display:'flex',alignItems:'center',gap:12,width:'100%',padding:'12px 14px',marginBottom:7,borderRadius:12,border:'1px solid '+G200,background:'white',cursor:'pointer',textAlign:'left',touchAction:'manipulation'}}>
                <span style={{fontSize:22,flexShrink:0}}>{item.icon}</span>
                <div><div style={{fontWeight:'bold',fontSize:13}}>{item.title}</div><div style={{fontSize:11,color:G400}}>{item.sub}</div></div>
                <span style={{marginLeft:'auto',color:G400,fontSize:14}}>›</span>
              </button>;
            })}
          </div>)}

          {screen==='progress'&&(<div>
            <MeineLernuebersicht player={player} chapters={chapters} scope={scope}/>
            <RepeatHistorySelf player={player}/>
            <div style={{borderTop:'1px solid '+G200,margin:'16px 0 12px'}}/>
            <div style={{display:'flex',gap:6,marginBottom:12}}>
              <button onClick={function(){go('stats');}} style={BtnStyle(T,'white',{flex:1,padding:'10px',fontSize:12})}>📊 Leiterspiel-Fortschritt</button>
              <button onClick={function(){go('leaderboard');}} style={BtnStyle(G100,G600,{flex:1,padding:'10px',fontSize:12})}>🏆 Rangliste</button>
            </div>
            <Stats player={player} chapters={scopeTree}/>
          </div>)}

          {screen==='scoreboard'&&<Scoreboard player={player}/>}

          {screen==='admin'&&<AdminDash player={player} chapters={chapters} scope={scope} setChapters={setChapters} allUsers={allUsers} setAllUsers={setAllUsers} allCategories={allCategories} setAllCategories={setAllCategories} onDone={function(){go('home');}}/>}
        </div>

        <div style={{position:'fixed',bottom:0,left:'50%',transform:'translateX(-50%)',width:'100%',maxWidth:480,background:'white',borderTop:'1px solid '+G200,display:'flex',zIndex:100}}>
          {tabs.map(function(tab){
            var active=screen===tab.id;
            return <button key={tab.id} onClick={function(){setScreen(tab.id);setScreenData(null);}} style={{flex:1,padding:'8px 4px 10px',border:'none',background:'none',cursor:'pointer',display:'flex',flexDirection:'column',alignItems:'center',gap:2,touchAction:'manipulation'}}>
              <span style={{fontSize:20}}>{tab.label}</span>
              <span style={{fontSize:9,fontWeight:active?'bold':'normal',color:active?T:G400}}>{tab.title}</span>
            </button>;
          })}
        </div>
      </div>
    );
  }

  return(
    <div style={{maxWidth:480,margin:'0 auto',minHeight:'100vh',display:'flex',flexDirection:'column',background:'white'}}>
      <div style={{background:'linear-gradient(135deg,'+T+','+TD+')',padding:'12px 16px',display:'flex',alignItems:'center',gap:10,flexShrink:0}}>
        {showBack&&<button onClick={function(){
          var backMap={vocab_trainer:'learn',workout:'learn',workout_setup:'learn',sentence_learner:'learn',
            word_select_trainer:'learn',quiz_solo:'quiz_duel_menu',quiz_duel:'quiz_duel_menu',quiz_duel_menu:'games',crossword:'games',
            leiterspiel_menu:'games',leiterspiel_play:'leiterspiel_menu',leiterspiel_create:'games',
            grammar:'games',klassenarbeit_player:'games',klassenarbeit_play:'klassenarbeit_player',
            stats:'progress',leaderboard:'home',browse:'learn',puzzle:'learn'};
          var dest=backMap[screen]||'home';
          go(dest);
        }} style={{background:'rgba(255,255,255,0.2)',border:'none',color:'white',padding:'5px 10px',borderRadius:8,cursor:'pointer',fontSize:14,touchAction:'manipulation',flexShrink:0}}>←</button>}
        <div style={{flex:1}}>
          <div style={{fontWeight:'bold',fontSize:14,color:'white'}}>{screenTitles[screen]||screen}</div>
          <div style={{fontSize:10,color:'rgba(255,255,255,0.7)'}}>{player&&player.name}{scope?' · '+scopeText(scope):''}</div>
        </div>
        <ScopeSwitcher scopes={scopes} scope={scope} onChange={setScope} compact/>
        <div style={{fontSize:11,color:'rgba(255,255,255,0.8)',fontWeight:'bold'}}>{player&&(player.total_score||0)} Pkt</div>
      </div>
      <div style={{flex:1,overflowY:'auto',padding:'10px 10px 20px'}}>
        {inner}
      </div>
    </div>
  );
}

function App() {
  var [player, setPlayer] = useState(null);
  var [chapters, setChapters] = useState(BUILTIN);
  var [allUsers, setAllUsers] = useState([]);
  var [allCategories, setAllCategories] = useState([]);
  var [loading, setLoading] = useState(false);
  var [showRegister, setShowRegister] = useState(false);

  function handleLogin(user) {
    setPlayer(user);
    setLoading(true);
    var UUID=/^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/i;
    var p1 = sbGet('chapters','select=id,parent_id,title,color,icon,words,sentences,is_builtin,grade,language').then(function(d){
      if(Array.isArray(d)&&d.length>0){
        var merged=BUILTIN.slice();
        d.forEach(function(remote){
          var bi=merged.findIndex(function(b){return b.id===remote.id;});
          if(bi>=0) merged[bi]=Object.assign({},merged[bi],remote);
          else merged.push(remote);
        });
        setChapters(merged);
      }
    });
    var p2 = sbGet('players','select=id,name,total_score,total_correct,total_wrong,is_admin,is_active').then(function(d){
      if(Array.isArray(d)&&d.length>0) setAllUsers(d);
    });
    var p3 = sbGet('settings','key=eq.word_categories&select=value').then(function(d){
      if(Array.isArray(d)&&d.length>0){
        try{var cats=JSON.parse(d[0].value||'[]');if(Array.isArray(cats)&&cats.length>0)setAllCategories(cats);}catch(e){}
      }
    });
    if(!UUID.test(user.id)){
      p1; p2; p3;
      setLoading(false);
      return;
    }
    Promise.all([p1,p2,p3]).then(function(){ setLoading(false); }).catch(function(){ setLoading(false); });
  }

  function handleLogout() {
    setPlayer(null); setChapters(BUILTIN); setAllUsers([]); setAllCategories([]);
  }

  if(!player&&showRegister) return <RegisterScreen onRegister={function(u){handleLogin(u);setShowRegister(false);}} onBack={function(){setShowRegister(false);}}/>;
  if(!player) return <LoginScreen onLogin={handleLogin} onRegister={function(){setShowRegister(true);}}/>;
  if(loading) return(
    <div style={{minHeight:'100vh',display:'flex',alignItems:'center',justifyContent:'center',background:'linear-gradient(135deg,#0f766e,#134e4a)'}}>
      <div style={{textAlign:'center',color:'white'}}><div style={{fontSize:48,marginBottom:16}}>🎓</div><div style={{fontSize:16}}>Lade Daten…</div></div>
    </div>
  );

  return <Shell player={player} setPlayer={setPlayer} chapters={chapters} setChapters={setChapters} allUsers={allUsers} setAllUsers={setAllUsers} allCategories={allCategories} setAllCategories={setAllCategories} onLogout={handleLogout}/>;
}

var root = ReactDOM.createRoot(document.getElementById('root'));
root.render(<App/>);
  </script>
</body>
</html>
