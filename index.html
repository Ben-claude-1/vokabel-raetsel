function GrammarProgress({ ruleStats, sessions }) {
  var rules=Object.keys(ruleStats||{});
  if(rules.length===0&&(!sessions||sessions.length===0)) return <div style={{textAlign:'center',color:G400,padding:20,fontSize:13}}>Noch keine Übungen absolviert.</div>;
  return(
    <div>
      {rules.map(function(rule){
        var st=ruleStats[rule];
        var pct=st.total>0?Math.round(st.correct/st.total*100):0;
        var col=pct>=80?GR:pct>=50?AM:RE;
        return <div key={rule} style={{display:'flex',alignItems:'center',gap:8,padding:'8px 10px',marginBottom:5,background:'white',borderRadius:8,border:'1px solid '+G200}}>
          <div style={{flex:1,minWidth:0}}>
            <div style={{fontWeight:'bold',fontSize:12,color:G900,overflow:'hidden',textOverflow:'ellipsis',whiteSpace:'nowrap'}}>{rule}</div>
            <div style={{fontSize:10,color:G400}}>{st.correct}/{st.total} richtig</div>
          </div>
          <div style={{width:60,height:5,background:G200,borderRadius:3,overflow:'hidden'}}>
            <div style={{height:'100%',width:pct+'%',background:col}}/>
          </div>
          <span style={{fontSize:12,fontWeight:'bold',color:col,minWidth:32,textAlign:'right'}}>{pct}%</span>
        </div>;
      })}
      {sessions&&sessions.length>0&&<div style={{marginTop:10}}>
        <div style={{fontWeight:'bold',fontSize:12,color:G600,marginBottom:6}}>Letzte Sessions:</div>
        {sessions.slice(-5).reverse().map(function(s,i){
          return <div key={i} style={{fontSize:11,color:G400,padding:'4px 0',borderBottom:'1px solid '+G100}}>
            {new Date(s.date).toLocaleDateString('de')}: {s.correct}/{s.total} ({Math.round(s.correct/s.total*100)}%)
          </div>;
        })}
      </div>}
    </div>
  );
}

function GrammarGame({ player, onDone }) {
  var [topic, setTopic] = useState(null);
  var [pool, setPool] = useState([]);
  var [questions, setQuestions] = useState([]);
  var [qIdx, setQIdx] = useState(0);
  var [input, setInput] = useState('');
  var [result, setResult] = useState(null);
  var [results, setResults] = useState([]);
  var [loading, setLoading] = useState(false);
  var [ruleStats, setRuleStats] = useState({});
  var [sessions, setSessions] = useState([]);
  var [phase, setPhase] = useState('menu');
  var [aiExplain, setAiExplain] = useState('');
  var [aiLoading, setAiLoading] = useState(false);
  var inputRef = useRef();
  var PROG_KEY = 'grammar_prog_'+(player&&player.id||'anon');

  useEffect(function(){
    try{ var s=localStorage.getItem(PROG_KEY); if(s){var p=JSON.parse(s);setRuleStats(p.ruleStats||{});setSessions(p.sessions||{});} }catch(e){}
  },[]);

  function saveProg(rs,sess){
    try{ localStorage.setItem(PROG_KEY,JSON.stringify({ruleStats:rs,sessions:sess})); }catch(e){}
  }

  function startTopic(t){
    setLoading(true); setTopic(t);
    loadGrammarPool(t).then(function(p){
      if(!p||p.length===0){
        setLoading(false); setPhase('empty'); return;
      }
      setPool(p);
      var qs=grammarPickQuestions(p,ruleStats,Math.min(10,p.length));
      setQuestions(qs); setQIdx(0); setResults([]); setInput(''); setResult(null); setPhase('game');
      setLoading(false);
    }).catch(function(){setLoading(false);});
  }

  useEffect(function(){ if(inputRef.current&&!result&&phase==='game') inputRef.current.focus(); },[qIdx,result,phase]);

  function submit(){
    var q=questions[qIdx];
    if(!q) return;
    if(result){ next(); return; }
    var correct=input.trim().toLowerCase()===q.answer.toLowerCase();
    var newRes={q:q,input:input,correct:correct};
    setResults(function(r){return r.concat([newRes]);});
    var newStats=JSON.parse(JSON.stringify(ruleStats));
    if(!newStats[q.rule]) newStats[q.rule]={correct:0,total:0};
    newStats[q.rule].total++;
    if(correct) newStats[q.rule].correct++;
    setRuleStats(newStats);
    setResult(newRes);
    if(!correct){
      setAiLoading(true);
      fetch('https://api.anthropic.com/v1/messages',{
        method:'POST',
        headers:{'Content-Type':'application/json','anthropic-dangerous-direct-browser-access':'true'},
        body:JSON.stringify({model:'claude-sonnet-4-20250514',max_tokens:200,messages:[{role:'user',content:'Erkläre kurz auf Deutsch, warum "'+q.answer+'" die richtige Antwort ist für: "'+q.sentence+'". Schülerin, 6. Klasse. Max 2 Sätze.'}]})
      }).then(function(r){return r.json();}).then(function(data){
        var txt=data.content&&data.content[0]&&data.content[0].text||'';
        setAiExplain(txt); setAiLoading(false);
      }).catch(function(){setAiLoading(false);});
    } else { setAiExplain(''); }
  }

  function next(){
    if(qIdx+1>=questions.length){ finishSession(); return; }
    setQIdx(function(i){return i+1;}); setInput(''); setResult(null); setAiExplain('');
    setTimeout(function(){if(inputRef.current)inputRef.current.focus();},50);
  }

  function finishSession(){
    var corr=results.filter(function(r){return r.correct;}).length;
    var newSess=(Array.isArray(sessions)?sessions:[]).concat([{date:new Date().toISOString(),correct:corr,total:results.length,topic:topic}]);
    setSessions(newSess); saveProg(ruleStats,newSess); setPhase('result');
  }

  if(phase==='menu') return(
    <div style={{padding:8}}>
      <div style={{marginBottom:12,padding:12,background:G50,borderRadius:10,border:'1px solid '+G200}}>
        <div style={{fontWeight:'bold',fontSize:13,color:G900,marginBottom:6}}>📊 Fortschritt</div>
        <GrammarProgress ruleStats={ruleStats} sessions={Array.isArray(sessions)?sessions:[]}/>
      </div>
      <div style={{fontWeight:'bold',fontSize:13,color:G900,marginBottom:8}}>Thema wählen:</div>
      {[['sp','Simple Present','Gegenwart — What does she do?'],['pp','Past Participle','Perfekt — I have eaten.']].map(function(t){
        return <button key={t[0]} onClick={function(){startTopic(t[0]);}} style={{display:'block',width:'100%',textAlign:'left',padding:'13px 14px',marginBottom:7,borderRadius:12,border:'2px solid '+T+'44',background:'white',cursor:'pointer',touchAction:'manipulation'}}>
          <div style={{fontWeight:'bold',fontSize:14,color:T}}>{t[1]}</div>
          <div style={{fontSize:11,color:G400}}>{t[2]}</div>
        </button>;
      })}
    </div>
  );

  if(loading) return <div style={{textAlign:'center',padding:40,color:G400}}>Lade Fragen…</div>;

  if(phase==='empty') return(
    <div style={{padding:16,textAlign:'center'}}>
      <div style={{fontSize:40,marginBottom:12}}>📝</div>
      <div style={{fontWeight:'bold',fontSize:15,color:G900,marginBottom:8}}>Noch keine Übungen vorhanden</div>
      <div style={{fontSize:13,color:G600,marginBottom:16}}>
        Admin muss zuerst Sätze generieren: Admin → ✏️ Grammatik-Tab → Thema wählen → 🤖 KI-Generierung
      </div>
      <button onClick={function(){setPhase('menu');setTopic(null);}} style={BtnStyle(T,'white',{padding:'10px 20px'})}>← Zurück</button>
    </div>
  );

  if(phase==='result'){
    var corr2=results.filter(function(r){return r.correct;}).length;
    return(
      <div style={{padding:8}}>
        <div style={{background:'linear-gradient(135deg,'+T+','+TD+')',borderRadius:14,padding:20,color:'white',textAlign:'center',marginBottom:12}}>
          <div style={{fontSize:36,marginBottom:6}}>{corr2>=8?'🏆':corr2>=6?'👍':'📚'}</div>
          <div style={{fontSize:20,fontWeight:'bold'}}>{corr2}/{results.length} richtig</div>
        </div>
        {results.map(function(r,i){
          return <div key={i} style={{padding:'6px 8px',marginBottom:3,borderRadius:7,background:r.correct?'#d1fae5':'#fee2e2',fontSize:11}}>
            <div style={{fontWeight:'bold',color:G900}}>{r.q.sentence}</div>
            <div style={{color:r.correct?T:RE}}>Antwort: {r.q.answer}{!r.correct&&<span style={{color:G400}}> (du: {r.input})</span>}</div>
          </div>;
        })}
        <div style={{display:'flex',gap:6,marginTop:10}}>
        {checked&&correct&&<div style={{color:GR,fontWeight:'bold',fontSize:13,padding:'6px'}}>✓ Richtig!</div>}{checked&&!correct&&<div style={{color:RE,fontWeight:'bold',fontSize:13,padding:'6px'}}>✗ Falsch</div>}
        </div>
      </div>
    );
  }

  var q=questions[qIdx];
  if(!q) return null;
  return(
    <div style={{padding:8}}>
      <div style={{display:'flex',alignItems:'center',gap:8,marginBottom:10}}>
        <div style={{flex:1,height:5,background:G200,borderRadius:3,overflow:'hidden'}}>
          <div style={{height:'100%',width:((qIdx/questions.length)*100)+'%',background:T}}/>
        </div>
        <span style={{fontSize:11,color:G400}}>{qIdx+1}/{questions.length}</span>
      </div>
      <div style={{padding:'18px 16px',background:G50,borderRadius:14,marginBottom:10,border:'2px solid '+G200,textAlign:'center'}}>
        <div style={{fontSize:10,color:G400,marginBottom:4,textTransform:'uppercase'}}>{q.rule}</div>
        <div style={{fontSize:18,fontWeight:'bold',color:G900}}>{q.sentence}</div>
      </div>
      {!result&&(
        <div style={{display:'flex',gap:8,marginBottom:8}}>
          <input ref={inputRef} value={input} onChange={function(e){setInput(e.target.value);}}
            onKeyDown={function(e){if(e.key==='Enter')submit();}}
            placeholder="Antwort eingeben…" autoCapitalize="none" autoCorrect="off"
            style={{flex:1,padding:'12px 14px',fontSize:16,border:'2px solid '+T,borderRadius:10,outline:'none'}}/>
          <button onClick={submit} style={BtnStyle(T,'white',{padding:'12px 16px'})}>✓</button>
        </div>
      )}
      {result&&(
        <div style={{padding:12,borderRadius:10,background:result.correct?'#d1fae5':'#fee2e2',border:'2px solid '+(result.correct?GR:RE),marginBottom:8}}>
          <div style={{fontWeight:'bold',color:result.correct?T:RE,marginBottom:4}}>{result.correct?'✓ Richtig!':'✗ Falsch'}</div>
          <div style={{fontSize:13,color:G900}}>Richtig: <strong>{q.answer}</strong></div>
          {!result.correct&&result.input&&<div style={{fontSize:11,color:G400}}>Deine Antwort: {result.input}</div>}
          {aiLoading&&<div style={{fontSize:11,color:G400,marginTop:6}}>KI erklärt…</div>}
          {aiExplain&&<div style={{fontSize:11,color:G600,marginTop:6,padding:'6px 8px',background:'white',borderRadius:6,border:'1px solid '+G200}}>{aiExplain}</div>}
        </div>
      )}
      {result&&<button onClick={next} style={BtnStyle(T,'white',{width:'100%',padding:'11px'})}>{qIdx+1>=questions.length?'📊 Auswertung':'→ Weiter'}</button>}
    </div>
  );
}

      sbPatch('players',{total_score:(player.total_score||0)+pts},'id=eq.'+player.id).then(function(){
        setPlayer(function(p){return Object.assign({},p,{total_score:(p.total_score||0)+pts});});
        setAllUsers(function(prev){return prev.map(function(u){return u.id===player.id?Object.assign({},u,{total_score:(u.total_score||0)+pts}):u;});});

                <span style={{fontSize:22,flexShrink:0}}>{item.icon}</span>
                <div><div style={{fontWeight:'bold',fontSize:13}}>{item.title}</div><div style={{fontSize:11,color:G400}}>{item.sub}</div></div>
                <span style={{marginLeft:'auto',color:G400,fontSize:14}}>›</span>
              </button>;
            })}
          </div>)}

          {screen==='progress'&&(<div>
            <div style={{display:'flex',gap:6,marginBottom:12}}>
              <button onClick={function(){go('stats');}} style={BtnStyle(T,'white',{flex:1,padding:'10px',fontSize:12})}>📊 Leiterspiel-Fortschritt</button>
              <button onClick={function(){go('leaderboard');}} style={BtnStyle(G100,G600,{flex:1,padding:'10px',fontSize:12})}>🏆 Rangliste</button>
            </div>
            <Stats player={player} chapters={childChapters}/>
          </div>)}

          {screen==='admin'&&<AdminDash player={player} chapters={chapters} setChapters={setChapters} allUsers={allUsers} setAllUsers={setAllUsers} allCategories={allCategories} setAllCategories={setAllCategories} onDone={function(){go('home');}}/>}
        </div>

        <div style={{position:'fixed',bottom:0,left:'50%',transform:'translateX(-50%)',width:'100%',maxWidth:480,background:'white',borderTop:'1px solid '+G200,display:'flex',zIndex:100}}>
          {tabs.map(function(tab){
            var active=screen===tab.id;
            return <button key={tab.id} onClick={function(){setScreen(tab.id);setScreenData(null);}} style={{flex:1,padding:'8px 4px 10px',border:'none',background:'none',cursor:'pointer',display:'flex',flexDirection:'column',alignItems:'center',gap:2,touchAction:'manipulation'}}>
              <span style={{fontSize:20}}>{tab.label}</span>
              <span style={{fontSize:9,fontWeight:active?'bold':'normal',color:active?T:G400}}>{tab.title}</span>
            </button>;
          })}
        </div>
      </div>
    );
  }

  return(
    <div style={{maxWidth:480,margin:'0 auto',minHeight:'100vh',display:'flex',flexDirection:'column',background:'white'}}>
      <div style={{background:'linear-gradient(135deg,'+T+','+TD+')',padding:'12px 16px',display:'flex',alignItems:'center',gap:10,flexShrink:0}}>
        {showBack&&<button onClick={function(){
          var backMap={vocab_trainer:'learn',workout:'learn',workout_setup:'learn',sentence_learner:'learn',
            word_select_trainer:'learn',quiz_solo:'games',quiz_duel:'games',crossword:'games',
            leiterspiel_menu:'games',leiterspiel_play:'leiterspiel_menu',leiterspiel_create:'games',
            grammar:'games',stats:'progress',leaderboard:'progress',browse:'learn',puzzle:'learn'};
          var dest=backMap[screen]||'home';
          go(dest);
        }} style={{background:'rgba(255,255,255,0.2)',border:'none',color:'white',padding:'5px 10px',borderRadius:8,cursor:'pointer',fontSize:14,touchAction:'manipulation',flexShrink:0}}>←</button>}
        <div style={{flex:1}}>
          <div style={{fontWeight:'bold',fontSize:14,color:'white'}}>{screenTitles[screen]||screen}</div>
          <div style={{fontSize:10,color:'rgba(255,255,255,0.7)'}}>{player&&player.name}</div>
        </div>
        <div style={{fontSize:11,color:'rgba(255,255,255,0.8)',fontWeight:'bold'}}>{player&&(player.total_score||0)} Pkt</div>
      </div>
      <div style={{flex:1,overflowY:'auto',padding:'10px 10px 20px'}}>
        {inner}
      </div>
    </div>
  );
}

function App() {
  var [player, setPlayer] = useState(null);
  var [chapters, setChapters] = useState(BUILTIN);
  var [allUsers, setAllUsers] = useState([]);
  var [allCategories, setAllCategories] = useState([]);
  var [loading, setLoading] = useState(false);
  var [showRegister, setShowRegister] = useState(false);

  function handleLogin(user) {
    setPlayer(user);
    setLoading(true);
    var UUID=/^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/i;
    var p1 = sbGet('chapters','select=id,parent_id,title,color,icon,words,sentences,is_builtin').then(function(d){
      if(Array.isArray(d)&&d.length>0){
        var merged=BUILTIN.slice();
        d.forEach(function(remote){
          var bi=merged.findIndex(function(b){return b.id===remote.id;});
          if(bi>=0) merged[bi]=Object.assign({},merged[bi],remote);
          else merged.push(remote);
        });
        setChapters(merged);
      }
    });
    var p2 = sbGet('players','select=id,name,total_score,total_correct,total_wrong,is_admin,is_active').then(function(d){
      if(Array.isArray(d)&&d.length>0) setAllUsers(d);
    });
    var p3 = sbGet('settings','key=eq.word_categories&select=value').then(function(d){
      if(Array.isArray(d)&&d.length>0){
        try{var cats=JSON.parse(d[0].value||'[]');if(Array.isArray(cats)&&cats.length>0)setAllCategories(cats);}catch(e){}
      }
    });
    if(!UUID.test(user.id)){
      p1; p2; p3;
      setLoading(false);
      return;
    }
    Promise.all([p1,p2,p3]).then(function(){ setLoading(false); }).catch(function(){ setLoading(false); });
  }

  function handleLogout() {
    setPlayer(null); setChapters(BUILTIN); setAllUsers([]); setAllCategories([]);
  }

  if(!player&&showRegister) return <RegisterScreen onRegister={function(u){handleLogin(u);setShowRegister(false);}} onBack={function(){setShowRegister(false);}}/>;
  if(!player) return <LoginScreen onLogin={handleLogin} onRegister={function(){setShowRegister(true);}}/>;
  if(loading) return(
    <div style={{minHeight:'100vh',display:'flex',alignItems:'center',justifyContent:'center',background:'linear-gradient(135deg,#0f766e,#134e4a)'}}>
      <div style={{textAlign:'center',color:'white'}}><div style={{fontSize:48,marginBottom:16}}>🎓</div><div style={{fontSize:16}}>Lade Daten…</div></div>
    </div>
  );

  return <Shell player={player} setPlayer={setPlayer} chapters={chapters} setChapters={setChapters} allUsers={allUsers} setAllUsers={setAllUsers} allCategories={allCategories} setAllCategories={setAllCategories} onLogout={handleLogout}/>;
}

var root = ReactDOM.createRoot(document.getElementById('root'));
root.render(<App/>);
  </script>
</body>
</html>
