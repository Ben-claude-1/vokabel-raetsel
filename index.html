  var word=(w.word||'').toLowerCase().replace(/^to /,'');

  function stripTo(c){ return c.replace(/^to\s+/i,'').trim(); }
  var allVariants = [];
  corrects.forEach(function(c){ allVariants = allVariants.concat(wordVariants(c)); });
  for (var i=0;i<allVariants.length;i++) { if (allVariants[i] === t) return 'correct'; }
  for (var k=0;k<corrects.length;k++) {
    if (isToVerb(corrects[k])) { if (stripTo(corrects[k]) === t) return 'partial'; }
  }
  return 'wrong';
}

function getWordColor(history) {
  if (!history || history.length===0) return 'new';
  var last = history.slice(-4), correct = last.filter(Boolean).length;
  if (last.length>=4 && correct===4) return 'green';
  if (correct===0) return 'red';
  return 'yellow';
}
var COLOR_BG = { green:'#d1fae5', yellow:'#fef9c3', red:'#fee2e2', new:'#f1f5f9' };
var COLOR_FG = { green:'#065f46', yellow:'#92400e', red:'#991b1b', new:'#475569' };
var COLOR_DOT = { green:'#22c55e', yellow:'#f59e0b', red:'#ef4444', new:'#94a3b8' };

var PROGRESS = {
  key: function(uid, word) { return 'wp:' + uid + ':' + word.toLowerCase(); },
  get: function(uid, word) {
    try {
      if (typeof window.storage === "undefined") return Promise.resolve(null);
      return window.storage.get(PROGRESS.key(uid, word))
        .then(function(r) { return r && r.value ? JSON.parse(r.value) : null; })
        .catch(function() { return null; });
    } catch(e) { return Promise.resolve(null); }
  },
  set: function(uid, word, clue, chapId, correct) {
    PROGRESS.get(uid, word).then(function(existing) {
      var data = existing || {history:[]};
      data.history = data.history.concat([correct]).slice(-10);
      data.word = word; data.clue = clue; data.chapId = chapId; data.lastSeen = Date.now();
      try {
        if (typeof window.storage !== "undefined") {
          window.storage.set(PROGRESS.key(uid, word), JSON.stringify(data)).catch(function(){});
        }
      } catch(e) {}
    });
  },
  getAll: function(uid) {
    try {
      if (typeof window.storage === "undefined") return Promise.resolve({});
      return window.storage.list('wp:' + uid + ':')
        .then(function(keys) {
          var promises = (keys.keys || []).map(function(k) {
            return window.storage.get(k).then(function(r) {
              if (r && r.value) { var d = JSON.parse(r.value); return [d.word, d.history]; }
              return null;
            }).catch(function() { return null; });
          });
          return Promise.all(promises).then(function(arr) {
            var map = {};
            arr.filter(Boolean).forEach(function(pair) { map[pair[0]] = pair[1]; });
            return map;
          });
        })
        .catch(function() { return {}; });
    } catch(e) { return Promise.resolve({}); }
  }
};

function selectWorkoutWords(allWords, progressMap, count) {
  var categorized={red:[],yellow:[],green:[],new:[]};
  allWords.forEach(function(w){
    var hist=progressMap[w.word]||[];
    categorized[getWordColor(hist)].push(w);
  });
  var red=shuffleArr(categorized.red.concat(categorized.new));
  var yellow=shuffleArr(categorized.yellow);
  var green=shuffleArr(categorized.green);
  var nRed=Math.min(Math.ceil(count*0.5), red.length);
  var nYellow=Math.min(Math.ceil(count*0.3), yellow.length);
  var nGreen=Math.min(count-nRed-nYellow, green.length);
  var pool=[].concat(red.slice(0,nRed), yellow.slice(0,nYellow), green.slice(0,nGreen));
  if (pool.length<count) {
    var used=new Set(pool.map(function(w){return w.word;}));
    var rest=shuffleArr(allWords.filter(function(w){return !used.has(w.word);}));
    pool=pool.concat(rest.slice(0,count-pool.length));
  }
  return shuffleArr(pool).slice(0,count);
}

  useEffect(function(){
    Promise.all([sbGet('settings','key=eq.grammar_sentences'),sbGet('settings','key=eq.grammar_progress_'+player.id)]).then(function(results){
      try{var gs=results[0]; setSents(gs&&gs.length?JSON.parse(gs[0].value||'[]'):[]);}catch(e){}
      try{var gp=results[1]; setProgData(gp&&gp.length?JSON.parse(gp[0].value||'{}'):null);}catch(e){}
      setLoading(false);
    });
  },[]);
  if(loading) return <div style={{textAlign:'center',padding:30,color:G400}}>Lade...</div>;
  var answered=progData?Object.values(progData).filter(function(v){return v&&v.attempts;}).length:0;

      return <div key={i} style={{padding:'7px 10px',borderRadius:8,border:'1px solid '+(corr?'#86efac':attempts?AM:G200),background:corr?'#f0fdf4':attempts?'#fffbeb':'white',marginBottom:4,fontSize:12}}>

        <div style={{color:G400}}>{s.translation}</div>
        <div style={{fontSize:10,color:G400,marginTop:1}}>Versuche: {attempts} {corr&&'ok'}</div>
      </div>; })}
  </div>;
}

function GrammarGame({ player, onDone }) {
  var [sents,setSents]=useState([]); var [loading,setLoading]=useState(true); var [idx,setIdx]=useState(0);
  var [input,setInput]=useState(''); var [result,setResult]=useState(null); var [score,setScore]=useState(0); var [progData,setProgData]=useState({});

    sbGet('settings','key=eq.grammar_sentences').then(function(d){ var gs=d&&d.length?d[0]:null; try{var parsed=JSON.parse(gs?gs.value||'[]':'[]'); setSents(shuffle(parsed));} catch(e){setSents([]);} setLoading(false); });
    sbGet('settings','key=eq.grammar_progress_'+player.id).then(function(d){ try{setProgData(d&&d.length?JSON.parse(d[0].value||'{}'):{});}catch(e){setProgData({});} });
  },[]);
  useEffect(function(){ if(!result&&sents.length&&inputRef.current) inputRef.current.focus(); },[idx,result]);

  if(idx>=sents.length) return <div style={{padding:8,textAlign:'center'}}>

  var s=sents[idx];

    <div style={{display:'flex',alignItems:'center',gap:8,marginBottom:10}}>
      <div style={{flex:1,height:5,background:G200,borderRadius:3,overflow:'hidden'}}><div style={{height:'100%',width:(idx/sents.length*100)+'%',background:T,borderRadius:3}}/></div>

      {result&&<div style={{marginTop:10,fontSize:13}}><div style={{fontWeight:'bold',color:result.ok?GR:RE}}>{result.ok?'Richtig!':'Falsch'}</div>
        {!result.ok&&<div style={{color:G400,marginTop:4}}>Richtig: <strong style={{color:T}}>{s.text}</strong></div>}</div>}
    </div>
    {!result&&<div style={{display:'flex',gap:8,marginBottom:8}}>
      <input ref={inputRef} value={input} onChange={function(e){setInput(e.target.value);}} onKeyDown={function(e){if(e.key==='Enter'){var ok2=checkAnswer(input,s.text)==='correct';var np2=Object.assign({},progData);setResult({ok:ok2});setScore(function(sc){return sc+(ok2?1:0);});if(s.id){np2[s.id]={attempts:(np2[s.id]?np2[s.id].attempts||0:0)+1,correct:ok2};setProgData(np2);saveProgress(np2);}setInput('');}}} autoCapitalize="none" autoCorrect="off" placeholder="Englische Uebersetzung..." style={{flex:1,padding:'10px 12px',fontSize:16,border:'2px solid '+T,borderRadius:8,outline:'none'}}/>
      <button onClick={function(){var ok3=checkAnswer(input,s.text)==='correct';var np3=Object.assign({},progData);setResult({ok:ok3});setScore(function(sc){return sc+(ok3?1:0);});if(s.id){np3[s.id]={attempts:(np3[s.id]?np3[s.id].attempts||0:0)+1,correct:ok3};setProgData(np3);saveProgress(np3);}setInput('');}} style={BtnStyle(T)}>OK</button>
    </div>}
    {result&&<button onClick={function(){setResult(null);setIdx(function(i){return i+1;});}} style={BtnStyle(T,'white',{width:'100%',padding:'12px'})}>{idx+1>=sents.length?'Fertig':'Weiter'}</button>}

function BuchstabenSession({ words, onDone }) {
  var [idx,setIdx]=useState(0); var [results,setResults]=useState([]);
  if(!words.length||idx>=words.length) return <div style={{textAlign:'center',padding:20}}>
    <div style={{fontSize:36,marginBottom:8}}>Fertig!</div>
    <div style={{fontSize:18,fontWeight:'bold',color:T,marginBottom:12}}>{results.filter(Boolean).length}/{words.length} richtig</div>
    <button onClick={onDone} style={BtnStyle(T,'white',{width:'100%',padding:'12px'})}>Zurueck</button>
  </div>;
  var cw=words[idx];
  return <div>
    <div style={{textAlign:'center',padding:'16px 10px',background:G50,borderRadius:12,marginBottom:12,border:'2px solid '+G200}}>
      <div style={{fontSize:11,color:G400,marginBottom:4}}>Englisch fuer:</div>
      <div style={{fontSize:24,fontWeight:'bold',color:G900}}>{cw.clue}</div>
      <div style={{fontSize:10,color:G400,marginTop:4}}>{idx+1}/{words.length}</div>
    </div>
    <T2LetterField word={cw.word} onCorrect={function(){setResults(function(r){return r.concat([true]);});setIdx(function(i){return i+1;});}} onWrong={function(){setResults(function(r){return r.concat([false]);});setIdx(function(i){return i+1;});}}/>
  </div>;
}


function QuizSolo({ chapters, onDone }) {
  var allRounds = useMemo(function(){ return makeAllRounds(chapters); }, []);
  var [roundIdx, setRoundIdx] = useState(0);
  var [qIdx, setQIdx] = useState(0);
  var [chosen, setChosen] = useState(null);
  var [timeLeft, setTimeLeft] = useState(20);
  var [roundWins, setRoundWins] = useState([]);
  var [roundScore, setRoundScore] = useState(0);
  var [totalScore, setTotalScore] = useState(0);
  var [gameOver, setGameOver] = useState(false);
  var [roundOver, setRoundOver] = useState(false);
  var timerRef = useRef(null);
  var currentRound = allRounds[roundIdx] || [];
  var currentQ = currentRound[qIdx];
  function startTimer() {
    clearInterval(timerRef.current); setTimeLeft(20);
    timerRef.current = setInterval(function() {
      setTimeLeft(function(t) { if (t <= 1) { clearInterval(timerRef.current); handleAnswer(null); return 0; } return t - 1; });
    }, 1000);
  }
  useEffect(function() {
    if (!gameOver && !roundOver && !chosen) startTimer();
    return function() { clearInterval(timerRef.current); };
  }, [roundIdx, qIdx, roundOver, gameOver]);
  function handleAnswer(word) {
    clearInterval(timerRef.current);
    setChosen(word || "__none__");
    var correct = word === currentQ.correct.word;
    var pts = correct ? (timeLeft > 15 ? 15 : timeLeft > 8 ? 10 : 5) : 0;
    var newRoundScore = roundScore + (correct ? 1 : 0);
    setRoundScore(newRoundScore); setTotalScore(function(s) { return s + pts; });
    setTimeout(function() {
      if (qIdx + 1 >= currentRound.length) {
        var newWins = roundWins.concat([newRoundScore]);
        setRoundWins(newWins); setRoundScore(0); setChosen(null);
        if (roundIdx + 1 >= allRounds.length) setGameOver(true);
        else setRoundOver(true);
      } else { setQIdx(function(i) { return i + 1; }); setChosen(null); }
    }, 1200);
  }
  function nextRound() { setRoundIdx(function(i) { return i + 1; }); setQIdx(0); setRoundOver(false); setChosen(null); }
  if (!allRounds.length) return <div style={{textAlign:"center",padding:40,color:G400}}>Zu wenige Vokabeln.</div>;
  if (gameOver) {
    var won = roundWins.filter(function(s){ return s >= 2; }).length;
    return (
      <div style={{padding:"8px"}}>
        <div style={{background:"linear-gradient(135deg,"+T+","+TD+")",borderRadius:16,padding:"24px 20px",color:"white",textAlign:"center",marginBottom:16}}>
          <div style={{fontSize:40,marginBottom:8}}>{won >= 4 ? "🏆" : won >= 3 ? "🥈" : "📚"}</div>
          <div style={{fontSize:28,fontWeight:"bold",marginBottom:4}}>{totalScore} Punkte</div>
          <div style={{fontSize:14,opacity:0.8}}>{won} von 6 Runden gewonnen</div>
        </div>
        <div style={{marginBottom:12}}>
          {roundWins.map(function(s, i) {
            var win = s >= 2;
            return (<div key={i} style={{display:"flex",alignItems:"center",gap:10,padding:"8px 12px",marginBottom:4,borderRadius:8,background:win?"#f0fdf4":"#fef2f2",border:"1px solid "+(win?"#bbf7d0":"#fecaca")}}>
              <span style={{fontSize:16}}>{win ? "✓" : "✗"}</span>
              <span style={{fontSize:13,color:G600}}>Runde {i+1}</span>
              <span style={{marginLeft:"auto",fontWeight:"bold",color:win?T:RE}}>{s}/3 richtig</span>
            </div>);
          })}
        </div>
        <button onClick={onDone} style={BtnStyle(T,"#fff",{width:"100%",fontSize:15,padding:"12px"})}>← Zurück zum Menü</button>
      </div>
    );
  }
  if (roundOver) {
    var lastScore = roundWins[roundWins.length - 1] || 0;
    var roundWon = lastScore >= 2;
    return (
      <div style={{padding:"8px"}}>
        <div style={{textAlign:"center",padding:"32px 20px",background:roundWon?"#f0fdf4":"#fef2f2",borderRadius:16,marginBottom:16,border:"2px solid "+(roundWon?"#22c55e":RE)}}>
          <div style={{fontSize:40,marginBottom:8}}>{roundWon ? "🎉" : "😔"}</div>
          <div style={{fontSize:22,fontWeight:"bold",color:roundWon?T:RE,marginBottom:4}}>Runde {roundIdx+1} {roundWon?"gewonnen!":"verloren"}</div>
          <div style={{fontSize:14,color:G600}}>{lastScore}/3 Fragen richtig</div>
        </div>
        <div style={{display:"flex",gap:6,justifyContent:"center",marginBottom:16}}>
          {roundWins.map(function(s, i) { return <div key={i} style={{width:28,height:28,borderRadius:"50%",background:s>=2?T:RE,display:"flex",alignItems:"center",justifyContent:"center",color:"white",fontSize:12,fontWeight:"bold"}}>{s}</div>; })}
          {Array(6-roundWins.length).fill(0).map(function(_,i){ return <div key={"e"+i} style={{width:28,height:28,borderRadius:"50%",background:G200}}></div>; })}
        </div>
        <button onClick={nextRound} style={BtnStyle(T,"#fff",{width:"100%",fontSize:15,padding:"12px"})}>Runde {roundIdx+2} starten →</button>
      </div>
    );
  }
  var letters = ["A","B","C","D"];
  var isEn2De = currentQ && currentQ.type === "en2de";
  var question = currentQ ? (isEn2De ? currentQ.correct.word : currentQ.correct.clue) : "";
  var questionLabel = isEn2De ? "Was bedeutet dieses englische Wort?" : "Wie heißt das auf Englisch?";
  return (
    <div style={{padding:"8px"}}>
      <div style={{display:"flex",alignItems:"center",gap:8,marginBottom:12}}>
        <div style={{display:"flex",gap:4}}>
          {allRounds.map(function(_, i) {
            var active = i === roundIdx, done = i < roundIdx, win = done && roundWins[i] >= 2;
            return <div key={i} style={{width:24,height:24,borderRadius:"50%",background:active?T:done?(win?GR:RE):G200,display:"flex",alignItems:"center",justifyContent:"center",color:"white",fontSize:10,fontWeight:"bold"}}>{done?(roundWins[i]>=2?"✓":"✗"):(i+1)}</div>;
          })}
        </div>
        <span style={{fontSize:11,color:G400,marginLeft:"auto"}}>Frage {qIdx+1}/3</span>
      </div>
      <div style={{display:"flex",gap:8,marginBottom:12}}>
        <div style={{flex:1,textAlign:"center",padding:"8px",background:TL,borderRadius:8}}><div style={{fontSize:10,color:G400}}>Punkte</div><div style={{fontSize:18,fontWeight:"bold",color:T}}>{totalScore}</div></div>
        <div style={{flex:1,textAlign:"center",padding:"8px",background:roundScore>=2?"#f0fdf4":G100,borderRadius:8}}><div style={{fontSize:10,color:G400}}>Diese Runde</div><div style={{fontSize:18,fontWeight:"bold",color:roundScore>=2?GR:G600}}>{roundScore}/3</div></div>
        <div style={{flex:1,textAlign:"center",padding:"8px",background:timeLeft<=5?"#fef2f2":G100,borderRadius:8}}><div style={{fontSize:10,color:G400}}>Zeit</div><div style={{fontSize:18,fontWeight:"bold",color:timeLeft<=5?RE:G600}}>{timeLeft}s</div></div>
      </div>
      {currentQ && (<div style={{display:"flex",alignItems:"center",gap:6,marginBottom:8}}>
        <span style={{fontSize:14}}>{currentQ.correct.chapIcon}</span>
        <span style={{fontSize:11,fontWeight:"bold",color:currentQ.correct.chapColor}}>{currentQ.correct.chapTitle}</span>
        <span style={{marginLeft:"auto",fontSize:10,color:G400}}>Runde {roundIdx+1} · Frage {qIdx+1}</span>
      </div>)}
      <div style={{textAlign:"center",padding:"28px 20px",background:G50,borderRadius:16,marginBottom:12,border:"2px solid "+G200}}>
        <div style={{fontSize:11,color:G400,marginBottom:8,textTransform:"uppercase",letterSpacing:1}}>{questionLabel}</div>
        <div style={{fontSize:28,fontWeight:"bold",color:G900}}>{question}</div>
      </div>
      <div style={{height:4,background:G200,borderRadius:2,overflow:"hidden",marginBottom:12}}>
        <div style={{height:"100%",width:(timeLeft/20*100)+"%",background:timeLeft<=5?RE:T,borderRadius:2,transition:"width 1s linear"}}></div>
      </div>
      <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:8}}>
        {currentQ && currentQ.answers.map(function(a, i) {
          var answerText = isEn2De ? a.clue : a.word;
          var isCorrect = a.word === currentQ.correct.word, isChosen = chosen && chosen === a.word;
          var bg = G50, border2 = "2px solid "+G200, col = G900;
          if (chosen) {
            if (isCorrect) { bg="#d1fae5"; border2="2px solid "+GR; col="#065f46"; }
            else if (isChosen) { bg="#fee2e2"; border2="2px solid "+RE; col="#991b1b"; }
          }
          return (
            <button key={i} onClick={function(){ if (!chosen) handleAnswer(a.word); }} disabled={!!chosen}
              style={{padding:"14px 10px",background:bg,border:border2,borderRadius:12,cursor:chosen?"default":"pointer",textAlign:"left",transition:"all .2s"}}>
              <div style={{display:"flex",alignItems:"center",gap:8}}>
                <span style={{width:24,height:24,borderRadius:"50%",background:chosen&&isCorrect?GR:chosen&&isChosen?RE:G200,color:chosen&&(isCorrect||isChosen)?"white":G600,display:"flex",alignItems:"center",justifyContent:"center",fontSize:12,fontWeight:"bold",flexShrink:0}}>{letters[i]}</span>
                <span style={{fontSize:13,fontWeight:"bold",color:col,lineHeight:1.3}}>{answerText}</span>
              </div>
            </button>
          );
        })}
      </div>
    </div>
  );
}

function QuizDuel({ chapters, player, onDone, allUsers, allCategories }) {
  var [phase, setPhase] = useState("setup");
  var [selectedKapitel, setSelectedKapitel] = useState([]);
  var [tab, setTab] = useState("users");
  var [gameId, setGameId] = useState(null);
  var [gameData, setGameData] = useState(null);
  var [rounds, setRounds] = useState([]);
  var [currentRoundIdx, setCurrentRoundIdx] = useState(0);
  var [qIdx, setQIdx] = useState(0);
  var [chosen, setChosen] = useState(null);
  var [timeLeft, setTimeLeft] = useState(20);
  var [myAnswers, setMyAnswers] = useState([]);
  var [joinCode, setJoinCode] = useState("");
  var [joinErr, setJoinErr] = useState("");
  var [myCode, setMyCode] = useState("");
  var [roundCat, setRoundCat] = useState(null);
  var [pendingChallenges, setPendingChallenges] = useState([]);
  var timerRef = useRef(null);
  var pollRef = useRef(null);
  var [userSearch,setUserSearch]=useState('');

  useEffect(function(){
    if(!player) return;
    function pollAll(){
      sbGet('quiz_duels','player2_id=eq.'+player.id+'&status=eq.waiting&select=id,code,player1_name,created_at').then(function(d){
        if(Array.isArray(d)) setPendingChallenges(d);
      });
      if(gameId){
        sbSingle('quiz_duels','id=eq.'+gameId).then(function(d){ if(d) setGameData(d); });
      }
    }
    pollAll();
    pollRef.current = setInterval(pollAll, 3000);
    return function(){ clearInterval(pollRef.current); };
  },[player, gameId]);

  useEffect(function(){
    if(!gameData||!gameId) return;
    var isP1 = gameData.player1_id === player.id;
    var myTurn = (isP1 && gameData.whose_turn==='p1')||((!isP1)&&gameData.whose_turn==='p2');

    if(gameData.status==='finished'&&phase!=='finalResult') setPhase('finalResult');

      player2_id:targetUser.id, player2_name:targetUser.name,

      round_wins_p1:JSON.stringify([]), round_wins_p2:JSON.stringify([]),
      current_round:0, whose_turn:'p2', status:'waiting',

      if(res&&!res._err){
        sbSingle('quiz_duels','code=eq.'+code).then(function(d){
          if(d){ setGameId(d.id); setRounds(generated); setMyCode(code); setPhase('waitingForChallengee'); }
        });
      }

      rounds:JSON.stringify(generated),
      round_wins_p1:JSON.stringify([]), round_wins_p2:JSON.stringify([]),

  function startMyTurn(){

  function handleDuelAnswer(word){
    clearInterval(timerRef.current);
    if(chosen) return;
    setChosen(word||'__none__');
    var correct = word && currentRoundArr && word===currentRoundArr[qIdx]&&currentRoundArr[qIdx].correct&&word===currentRoundArr[qIdx].correct.word;
    if(currentRoundArr&&currentRoundArr[qIdx]) correct = word===currentRoundArr[qIdx].correct.word;
    var newAnswers = myAnswers.concat([{word:word,correct:!!correct}]);
    setMyAnswers(newAnswers);
    setTimeout(function(){
      if(!currentRoundArr||qIdx+1>=currentRoundArr.length){
        var roundCorrect = newAnswers.filter(function(a){return a.correct;}).length;
        var isP1 = gameData&&gameData.player1_id===player.id;
        var existingWins = JSON.parse((isP1?gameData.round_wins_p1:gameData.round_wins_p2)||'[]');
        var newWins = existingWins.concat([roundCorrect]);
        var otherWins = JSON.parse((isP1?gameData.round_wins_p2:gameData.round_wins_p1)||'[]');
        var update = {};
        if(isP1){ update.round_wins_p1 = JSON.stringify(newWins); update.whose_turn = 'p2'; }
        else { update.round_wins_p2 = JSON.stringify(newWins); update.whose_turn = 'p1'; }
        if(newWins.length>=6&&otherWins.length>=6) update.status='finished';
        sbPatch('quiz_duels',update,'id=eq.'+gameId).then(function(){
          setGameData(function(prev){return Object.assign({},prev,update);});
          setPhase('roundResult');
        });
      } else {
        setQIdx(function(i){return i+1;}); setChosen(null); setTimeLeft(20);
      }
    },1200);
  }

  useEffect(function(){
    if(phase!=='playing'||chosen) return;
    clearInterval(timerRef.current); setTimeLeft(20);
    timerRef.current = setInterval(function(){
      setTimeLeft(function(t){
        if(t<=1){clearInterval(timerRef.current);handleDuelAnswer(null);return 0;}
        return t-1;
      });

    return function(){clearInterval(timerRef.current);};

              </div>
            </div>;
          })}
        </div>
      </div>

  }

  if(phase==='waitingForChallengee') return <div style={{textAlign:'center',padding:32}}>

  if(phase==='readyToPlay'){

  if(phase==='waiting') return <div style={{padding:8,textAlign:'center'}}>

    <div style={{padding:20,background:'#eff6ff',borderRadius:14,marginBottom:12}}>

    <button onClick={function(){sbSingle('quiz_duels','id=eq.'+gameId).then(function(d){

function Puzzle({ data, solPhrase, solMsg, onWord, chapId }) {
  var grid = data.grid, nums = data.nums, across = data.across, down = data.down, rows = data.rows, cols = data.cols, solCells = data.solCells;
  var [user, setUser] = useState(function(){ var u=[]; for(var r=0;r<rows;r++){u.push([]);for(var c=0;c<cols;c++)u[r].push("");} return u; });
  var [checked, setChecked] = useState(false);
  var [cc, setCC] = useState(0);
  var reported = useRef({});
  var refs = useRef({});
  var order = useMemo(function() { var o=[]; for(var r=0;r<rows;r++) for(var c=0;c<cols;c++) if((grid[r]||[])[c]!=="") o.push(r+","+c); return o; }, [grid,rows,cols]);
  var solMap = useMemo(function(){ var m={}; solCells.forEach(function(s){ m[s.r+","+s.c]=s; }); return m; }, [solCells]);
  var rev = solCells.map(function(s){ return (user[s.r]&&user[s.r][s.c]||"")===s.letter?s.letter:null; });
  var solOk = solCells.length>0 && rev.every(function(l){ return l!==null; });
  function focusNext(r,c){ var i=order.indexOf(r+","+c); if(i<order.length-1&&refs.current[order[i+1]]) refs.current[order[i+1]].focus(); }
  function focusPrev(r,c){ var i=order.indexOf(r+","+c); if(i>0&&refs.current[order[i-1]]) refs.current[order[i-1]].focus(); }
  var setCell = useCallback(function(r,c,v){ var ch=v.replace(/[^A-Za-z]/g,"").slice(-1); setUser(function(u){ var n=u.map(function(row){return row.slice();}); n[r][c]=ch; return n; }); setChecked(false); if(ch) setTimeout(function(){focusNext(r,c);},0); },[]);
  var handleKD = useCallback(function(r,c,e){ if(e.key==="Backspace"&&!(user[r]&&user[r][c])){ e.preventDefault(); focusPrev(r,c); } else if(e.key==="ArrowRight"&&(grid[r]||[])[c+1]!==""){if(refs.current[r+","+(c+1)])refs.current[r+","+(c+1)].focus();} else if(e.key==="ArrowLeft"&&(grid[r]||[])[c-1]!==""){if(refs.current[r+","+(c-1)])refs.current[r+","+(c-1)].focus();} else if(e.key==="ArrowDown"&&(grid[r+1]||[])[c]!==""){if(refs.current[(r+1)+","+c])refs.current[(r+1)+","+c].focus();} else if(e.key==="ArrowUp"&&(grid[r-1]||[])[c]!==""){if(refs.current[(r-1)+","+c])refs.current[(r-1)+","+c].focus();} },[user,grid]);
  function report(word,clue,uGrid,cnt){ if(reported.current[word]) return; var p=data.placed.find(function(pl){return pl.word===word;}); if(!p) return; var typed=""; for(var i=0;i<word.length;i++){var r2=p.dir==="H"?p.row:p.row+i,c2=p.dir==="H"?p.col+i:p.col;typed+=(uGrid[r2]&&uGrid[r2][c2])||"";} reported.current[word]=true; if(onWord) onWord({word:word,clue:clue,correct:typed===word,typedAnswer:typed,checkCount:cnt,chapId:chapId}); }
  function check(){ var n=cc+1; setCC(n); setChecked(true); [].concat(across,down).forEach(function(x){ report(x.word,x.clue,user,n); }); }
  function finish(){ [].concat(across,down).forEach(function(x){ report(x.word,x.clue,user,cc); }); }
  var corr=0,tot=0;
  if(checked) for(var r=0;r<rows;r++) for(var c=0;c<cols;c++) if((grid[r]||[])[c]!==""){tot++;if(user[r]&&user[r][c]===(grid[r]||[])[c])corr++;}
  var CS=26;
  return (
    <div>
      <div style={{fontSize:11,color:G600,textAlign:"center",marginBottom:8,padding:"4px 8px",background:"#f0f9ff",borderRadius:6,border:"1px solid #bae6fd"}}>ℹ️ Monate → <strong>Großbuchstaben</strong> · alle anderen → <strong>Kleinbuchstaben</strong></div>
      <div style={{overflowX:"auto",marginBottom:10}}>
        <table style={{borderCollapse:"collapse",margin:"0 auto"}}>
          <tbody>
            {Array(rows).fill(0).map(function(_,r){
              return (<tr key={r}>{Array(cols).fill(0).map(function(_,c){
                var letter=(grid[r]||[])[c]||"",isB=letter==="",num=nums[r+","+c],sol=solMap[r+","+c],uv=user[r]&&user[r][c]||"";
                var bg="white"; if(!isB&&sol) bg="#fffbeb"; if(checked&&!isB&&uv) bg=uv===letter?"#bbf7d0":"#fecaca";
                return (<td key={c} style={{width:CS,height:CS,padding:0,border:isB?"none":"1px solid #555",background:isB?"#18181b":bg,position:"relative"}}>
                  {!isB&&(<span>
                    {num&&<span style={{position:"absolute",top:1,left:2,fontSize:6,color:"#444",lineHeight:1,pointerEvents:"none",zIndex:3}}>{num}</span>}
                    {sol&&<span style={{position:"absolute",bottom:1,right:1,width:9,height:9,borderRadius:"50%",background:AM,color:"white",fontSize:5,fontWeight:"bold",display:"flex",alignItems:"center",justifyContent:"center",pointerEvents:"none",zIndex:3}}>{sol.pos}</span>}
                    <input ref={function(el){if(el)refs.current[r+","+c]=el;else delete refs.current[r+","+c];}} type="text" inputMode="text" autoCapitalize="none" autoCorrect="off" autoComplete="off" spellCheck="false" value={uv}
                      onChange={function(e){setCell(r,c,e.target.value);}} onKeyDown={function(e){handleKD(r,c,e);}}
                      style={{position:"absolute",inset:0,width:"100%",height:"100%",border:"none",outline:"none",background:"transparent",textAlign:"center",fontSize:12,fontWeight:"bold",color:"#111",paddingTop:num?5:0,boxSizing:"border-box",cursor:"text"}}/>
                  </span>)}
                </td>);
              })}</tr>);
            })}
          </tbody>
        </table>
      </div>
      {solCells.length>0&&(<div style={{margin:"8px 0",padding:"8px 12px",background:solOk?"#fef9c3":"#f8fafc",border:"2px solid "+(solOk?AM:G200),borderRadius:8}}>
        <div style={{fontSize:10,color:G400,marginBottom:5,fontWeight:"bold",textTransform:"uppercase",letterSpacing:1}}>🔑 Lösungswort</div>
        <div style={{display:"flex",gap:3,flexWrap:"wrap"}}>{solCells.map(function(sc,i){ var r2=rev[i]; return (<div key={i} style={{display:"flex",flexDirection:"column",alignItems:"center",gap:1}}><div style={{width:24,height:24,border:"2px solid "+(r2?AM:G200),borderRadius:4,background:r2?"#fef3c7":"#f1f5f9",display:"flex",alignItems:"center",justifyContent:"center",fontSize:13,fontWeight:"bold",color:G900}}>{r2||""}</div><span style={{fontSize:7,color:AM,fontWeight:"bold"}}>{sc.pos}</span></div>); })}</div>
        {solOk&&<div style={{marginTop:8,padding:"6px 10px",background:"#fef08a",borderRadius:6,fontSize:14,fontWeight:"bold",color:"#92400e",textAlign:"center"}}>{solMsg}</div>}
      </div>)}
      <div style={{display:"flex",gap:8,justifyContent:"center",marginBottom:8,flexWrap:"wrap"}}>
        <button onClick={check} style={BtnStyle(T)}>✓ Prüfen</button>
        <button onClick={function(){setUser(function(){var u=[];for(var r=0;r<rows;r++){u.push([]);for(var c=0;c<cols;c++)u[r].push("");}return u;});setChecked(false);}} style={BtnStyle(G400)}>↺ Reset</button>
        <button onClick={finish} style={BtnStyle("#7c3aed")}>✅ Abschließen</button>
      </div>
      {checked&&<div style={{textAlign:"center",marginBottom:8,padding:"6px 10px",borderRadius:6,fontWeight:"bold",fontSize:13,background:corr===tot?"#d1fae5":"#fee2e2",color:corr===tot?"#065f46":"#991b1b"}}>{corr}/{tot} richtig {corr===tot?"🎉 Perfekt!":""} · Prüfen: {cc}×</div>}
      <div style={{display:"flex",gap:12,flexWrap:"wrap",marginTop:4}}>
        {[["→ Waagerecht",across],["↓ Senkrecht",down]].map(function(pair){
          var t2=pair[0],clues=pair[1];
          return (<div key={t2} style={{flex:"1 1 160px",minWidth:0}}>
            <div style={{fontWeight:"bold",fontSize:12,color:T,borderBottom:"2px solid "+T,marginBottom:4,paddingBottom:2}}>{t2}</div>
            {clues.map(function(item){ return (<div key={item.n} style={{fontSize:11,marginBottom:2,display:"flex",gap:4,alignItems:"baseline"}}><strong style={{minWidth:18,color:TD}}>{item.n}.</strong><span style={{color:G600}}>{item.clue}</span><span style={{marginLeft:"auto",fontSize:9,color:G400}}>({item.word.length})</span></div>); })}
          </div>);
        })}
      </div>
    </div>
  );
}

function WordSelector({ chapters, onStart, mode }) {
  var [openCh, setOpenCh] = useState(null);
  var [sel, setSel] = useState({});
  var [filter, setFilter] = useState("all");
  var total = Object.values(sel).reduce(function(s,set){ return s+set.size; }, 0);
  function getFiltered(ch){ return filter==="important" ? ch.words.filter(function(w){return w.important;}) : ch.words; }
  function togAll(ch){ setSel(function(prev){ var n=Object.assign({},prev); var fi=getFiltered(ch); var cur=n[ch.id]||new Set(); var allS=fi.every(function(w){return cur.has(ch.words.indexOf(w));}); var next=new Set(cur); if(allS) fi.forEach(function(w){next.delete(ch.words.indexOf(w));}); else fi.forEach(function(w){next.add(ch.words.indexOf(w));}); n[ch.id]=next; return n; }); }
  function togW(chId,idx){ setSel(function(prev){ var n=Object.assign({},prev); var cur=new Set(n[chId]||[]); if(cur.has(idx)) cur.delete(idx); else cur.add(idx); n[chId]=cur; return n; }); }
  function getWords(){ var w=[]; chapters.forEach(function(ch){ var s=sel[ch.id]||new Set(); s.forEach(function(i){ if(ch.words[i]) w.push(Object.assign({},ch.words[i],{chapterId:ch.id})); }); }); return w; }

        <span style={{fontSize:13,color:T,fontWeight:"bold"}}>{total} Vokabeln gewählt</span>
        <button onClick={function(){ if(total>=3) onStart(getWords()); }} disabled={total<3} style={BtnStyle(total>=3?T:G400,"#fff",{padding:"6px 14px",opacity:total<3?0.5:1})}>{mode==="battle"?"⚔️ Rätsel-Duell":"🎯 Lernen starten"}</button>
      </div>
      {total<3&&<p style={{fontSize:11,color:G400,textAlign:"center",marginBottom:8}}>Mindestens 3 Vokabeln auswählen</p>}
      {chapters.map(function(ch){ var s=sel[ch.id]||new Set(); var fi=getFiltered(ch); var allS=fi.length>0&&fi.every(function(w){return s.has(ch.words.indexOf(w));}); var someS=fi.some(function(w){return s.has(ch.words.indexOf(w));})&&!allS; var open=openCh===ch.id;
        return (<div key={ch.id} style={{marginBottom:8,border:"2px solid "+(s.size>0?ch.color:G200),borderRadius:12,overflow:"hidden"}}>
          <div style={{display:"flex",alignItems:"center",gap:10,padding:"12px 14px",background:s.size>0?(ch.color+"15"):"white",cursor:"pointer"}} onClick={function(){setOpenCh(open?null:ch.id);}}>
            <span style={{fontSize:20}}>{ch.icon}</span>

            <div onClick={function(e){e.stopPropagation();togAll(ch);}} style={{width:22,height:22,borderRadius:6,border:"2px solid "+(allS?ch.color:someS?ch.color:G200),background:allS?ch.color:"white",display:"flex",alignItems:"center",justifyContent:"center",flexShrink:0,cursor:"pointer"}}>
              {allS&&<span style={{color:"white",fontSize:13}}>✓</span>}{someS&&<span style={{color:ch.color,fontSize:13}}>–</span>}
            </div>

          </div>
          {open&&(<div style={{padding:"8px 14px 12px",background:"#fafafa",borderTop:"1px solid "+G200}}>
            <div style={{display:"flex",flexWrap:"wrap",gap:6}}>
              {fi.map(function(w){ var ri=ch.words.indexOf(w); var isSel=s.has(ri);

                  <span style={{fontSize:10,color:G400}}>= {w.clue}</span>

// T2LetterField with FIX 2, 3, 4 (wordNoSpaces)
function T2LetterField({ word, onCorrect, onWrong }) {
  var wordNoSpaces=word.replace(/ /g,'');
  var initLetters=useMemo(function(){
    var real=word.split('').filter(function(l){return l!==' ';}).map(function(l,i){return{l:l,id:'t2_'+i,dummy:false};});
    var POOL='bcdfghjklmnpqrstvwxyz'.split('').filter(function(c){
      return wordNoSpaces.toLowerCase().indexOf(c)<0;
    });
    var extras=shuffleArr(POOL).slice(0,Math.min(3,POOL.length));
    var dummies=extras.map(function(l,i){return{l:l,id:'t2_dummy_'+i,dummy:true};});
    return shuffleArr(real.concat(dummies));
  },[word]);
  var [tiles, setTiles] = useState(initLetters);
  var [answer, setAnswer] = useState([]);
  var [checked, setChecked] = useState(false);
  var [correct, setCorrect] = useState(false);
  var complete=answer.length===wordNoSpaces.length;
  function addLetter(tile){
    if(checked) return;
    setAnswer(function(a){ return a.concat([tile]); });
    setTiles(function(t){ return t.filter(function(x){ return x.id!==tile.id; }); });
  }
  function removeLast(){
    if(checked||answer.length===0) return;
    var last=answer[answer.length-1];
    setAnswer(function(a){ return a.slice(0,-1); });
    setTiles(function(t){ return t.concat([last]); });
  }
  function check(){
    var typed=answer.map(function(t){return t.l;}).join('');
    var ok=typed.toLowerCase()===wordNoSpaces.toLowerCase();
    setChecked(true); setCorrect(ok);
    if(ok) onCorrect(); else onWrong(typed);
  }
  function reset(){ setTiles(initLetters); setAnswer([]); setChecked(false); setCorrect(false); }
  var displayWord = word;
  var answerDisplay = (function(){
    if(!checked) return answer.map(function(t){return t.l;});
    var res=[]; var ai=0;
    for(var ci=0;ci<displayWord.length;ci++){
      if(displayWord[ci]===' '){ res.push({l:' ',isSpace:true}); }
      else { res.push({l:answer[ai]?answer[ai].l:'',isSpace:false}); ai++; }
    }
    return res;
  })();
  var tileBg=checked?(correct?'#d1fae5':'#fee2e2'):'white';
  var tileCol=checked?(correct?'#065f46':'#991b1b'):G900;
  return(
    <div>
      <div style={{display:'flex',flexWrap:'wrap',gap:4,justifyContent:'center',minHeight:44,padding:'8px',background:G50,borderRadius:10,marginBottom:8,border:'2px solid '+(checked?(correct?GR:RE):G200)}}>
        {checked
          ? answerDisplay.map(function(item,i){
              if(item.isSpace) return <span key={'sp'+i} style={{width:12}}/>;
              return <div key={i} style={{width:32,height:36,borderRadius:8,background:tileBg,border:'2px solid '+(correct?GR:RE),display:'flex',alignItems:'center',justifyContent:'center',fontWeight:'bold',fontSize:16,color:tileCol}}>{item.l}</div>;
            })
          : answer.map(function(t,i){ return <div key={t.id} onClick={function(){removeLast();}} style={{width:32,height:36,borderRadius:8,background:'white',border:'2px solid '+T,display:'flex',alignItems:'center',justifyContent:'center',fontWeight:'bold',fontSize:16,color:T,cursor:'pointer'}}>{t.l}</div>; })
        }
        {!checked&&answer.length===0&&<span style={{color:G400,fontSize:12,alignSelf:'center'}}>Buchstaben antippen…</span>}
      </div>
      {!checked&&(
        <div style={{display:'flex',flexWrap:'wrap',gap:5,justifyContent:'center',marginBottom:10}}>
          {tiles.map(function(t){ return <button key={t.id} onClick={function(){addLetter(t);}} style={{width:36,height:40,borderRadius:8,background:t.dummy?G100:'white',border:'2px solid '+(t.dummy?G200:G200),fontWeight:'bold',fontSize:17,color:t.dummy?G400:G900,cursor:'pointer',touchAction:'manipulation'}}>{t.l}</button>; })}
        </div>
      )}
      <div style={{display:'flex',gap:6,justifyContent:'center'}}>
        {!checked&&<button onClick={removeLast} disabled={answer.length===0} style={BtnStyle(G100,G600,{padding:'8px 14px',opacity:answer.length===0?0.4:1})}>← Zurück</button>}
        {!checked&&<button onClick={check} disabled={!complete} style={BtnStyle(T,'white',{padding:'8px 20px',opacity:complete?1:0.4})}>✓ Prüfen</button>}
        {checked&&<button onClick={reset} style={BtnStyle(G100,G600,{padding:'8px 14px'})}>↺ Nochmal</button>}
      </div>
    </div>
  );
}

function LeitersSpielSession({ run, player, chapters, onDone, onUpdateScore, streak: streakProp, setPlayer }) {
  var streak = streakProp || DEFAULT_STREAK;
  var [data, setData] = useState(function(){
    var saved = lsGetProgress(run.id, player.id);
    if(saved) return saved;
    return lsInitProgress(run, player.id, streak);
  });
  var [phase, setPhase] = useState('pick');
  var [current, setCurrent] = useState(null);
  var [input, setInput] = useState('');
  var [result, setResult] = useState(null);
  var [streakCount, setStreakCount] = useState(0);
  var [celebration, setCelebration] = useState(null);
  var [sessionLog, setSessionLog] = useState([]);
  var inputRef = useRef();
  useEffect(function(){ if(inputRef.current && phase==='answer') inputRef.current.focus(); },[phase]);

  function saveAndUpdate(newData){
    lsSaveProgress(run.id, player.id, newData);
    setData(newData);
  }

  function pickWord(){
    var w = lsPickWord(data, streak);
    if(!w){ setPhase('done'); return; }
    setCurrent(w); setInput(''); setResult(null);
    setPhase(w.pot===2?'t2':'answer');
  }

  function submitAnswer(){
    if(!current) return;
    var typed = input.trim();
    var status = checkAnswer(typed, current.clue);
    var correct = status==='correct'||status==='partial';
    var newData = JSON.parse(JSON.stringify(data));
    var fromPot = current.pot;
    var reqStreak = (streak.required||DEFAULT_STREAK.required)[fromPot-1]||2;
    var potArr = (newData.pots[fromPot]||[]);
    var wIdx = potArr.findIndex(function(w){ return normWordKey(w.word)===normWordKey(current.word); });
    if(wIdx<0) wIdx = potArr.findIndex(function(w){ return w.word===current.word; });
    var wObj = wIdx>=0 ? potArr[wIdx] : {word:current.word,clue:current.clue,streak:0};
    if(wIdx>=0) potArr.splice(wIdx,1);
    var newStreak = correct ? (wObj.streak||0)+1 : 0;
    var moveTo = fromPot;
    if(correct && newStreak>=reqStreak){
      moveTo = fromPot<(streak.pots||5) ? fromPot+1 : fromPot;
      newStreak = 0;
    } else if(!correct && fromPot>1){
      moveTo = fromPot-1; newStreak=0;
    }
    wObj.streak = newStreak;
    if(!(newData.pots[moveTo])) newData.pots[moveTo]=[];
    newData.pots[moveTo].push(wObj);
    if(correct) newData.totalCorrect=(newData.totalCorrect||0)+1;
    else newData.totalWrong=(newData.totalWrong||0)+1;
    saveAndUpdate(newData);

    var pts = correct ? (fromPot*5+(status==='partial'?1:0)) : 0;
    if(pts>0 && onUpdateScore) onUpdateScore(pts);
    if(pts>0 && setPlayer) setPlayer(function(p){ return Object.assign({},p,{total_score:(p.total_score||0)+pts}); });

    var newSc = correct ? streakCount+1 : 0;
    setStreakCount(newSc);
    var log = {word:current.word,clue:current.clue,typed:typed,correct:correct,partial:status==='partial',fromPot:fromPot,toPot:moveTo,pts:pts};
    setSessionLog(function(l){return l.concat([log]);});
    setResult({correct:correct,partial:status==='partial',answer:current.clue,typed:typed,fromPot:fromPot,toPot:moveTo,pts:pts,newStreak:newStreak,reqStreak:reqStreak});
    if(correct && moveTo===5 && fromPot!==5) setCelebration('🏆 "'+current.word+'" gelernt!');
  }

  function nextWord(){
    setResult(null); setCelebration(null);
    var allDone = (data.pots[5]||[]).length >= Object.values(data.pots).reduce(function(s,a){return s+a.length;},0);
    if(allDone){ setPhase('done'); return; }
    pickWord();
  }

  if(phase==='pick'){
    var pct = lsPercent(data);
    var grade = lsGrade(data);
    var totalWords = Object.values(data.pots).reduce(function(s,a){return s+a.length;},0);
    var learned = (data.pots[5]||[]).length;
    return(
      <div style={{padding:8}}>
        <div style={{background:'linear-gradient(135deg,'+T+','+TD+')',borderRadius:16,padding:20,color:'white',textAlign:'center',marginBottom:12}}>
          <div style={{fontSize:32,marginBottom:6}}>{run.icon||'🎯'} {run.name}</div>
          <div style={{display:'flex',gap:16,justifyContent:'center',marginBottom:10}}>
            <div><div style={{fontSize:24,fontWeight:'bold'}}>{pct}%</div><div style={{fontSize:10,opacity:.8}}>Fortschritt</div></div>
            <div><div style={{fontSize:24,fontWeight:'bold'}}>{learned}/{totalWords}</div><div style={{fontSize:10,opacity:.8}}>Gelernt</div></div>
            <div><div style={{fontSize:24,fontWeight:'bold'}}>{grade}</div><div style={{fontSize:10,opacity:.8}}>Note</div></div>
          </div>
          <div style={{height:6,background:'rgba(255,255,255,.3)',borderRadius:3,overflow:'hidden'}}>
            <div style={{height:'100%',width:pct+'%',background:'white',borderRadius:3}}/>
          </div>
        </div>
        <div style={{display:'flex',gap:6,marginBottom:12,flexWrap:'wrap',justifyContent:'center'}}>
          {[1,2,3,4,5].map(function(p){
            var cnt=(data.pots[p]||[]).length;
            return <div key={p} style={{textAlign:'center',padding:'8px 10px',borderRadius:10,background:POT_COL[p]+'18',border:'2px solid '+POT_COL[p]+'44',minWidth:52}}>
              <div style={{fontSize:18}}>{POT_ICON[p]}</div>
              <div style={{fontSize:17,fontWeight:'bold',color:POT_COL[p]}}>{cnt}</div>
              <div style={{fontSize:9,color:G400}}>{POT_LABEL[p]}</div>
            </div>;
          })}
        </div>
        <button onClick={pickWord} style={BtnStyle(T,'white',{width:'100%',padding:'14px',fontSize:16,marginBottom:8})}>▶ Lernen starten</button>
        <button onClick={onDone} style={BtnStyle(G100,G600,{width:'100%',padding:'10px',fontSize:13})}>← Zurück</button>
      </div>
    );
  }

  if(phase==='t2'){
    return(
      <div style={{padding:8}}>
        <div style={{textAlign:'center',padding:'18px 16px',background:'#eff6ff',borderRadius:14,marginBottom:12,border:'2px solid #93c5fd'}}>
          <div style={{fontSize:10,color:G400,marginBottom:6,textTransform:'uppercase',letterSpacing:1}}>Topf 2 — Buchstaben sortieren</div>
          <div style={{fontSize:11,color:G600,marginBottom:6}}>Bedeutung: <strong>{current&&current.clue}</strong></div>
          <div style={{fontSize:10,color:G400}}>Tippe die Buchstaben in der richtigen Reihenfolge</div>
        </div>
        {current&&<T2LetterField word={current.word} onCorrect={function(){
          var newData=JSON.parse(JSON.stringify(data));
          var potArr=(newData.pots[2]||[]);
          var wIdx=potArr.findIndex(function(w){return normWordKey(w.word)===normWordKey(current.word);});
          if(wIdx<0) wIdx=potArr.findIndex(function(w){return w.word===current.word;});
          var wObj=wIdx>=0?potArr.splice(wIdx,1)[0]:{word:current.word,clue:current.clue,streak:0};
          var reqStreak=(streak.required||DEFAULT_STREAK.required)[1]||2;
          wObj.streak=(wObj.streak||0)+1;
          var moveTo=2;
          if(wObj.streak>=reqStreak){moveTo=3;wObj.streak=0;}
          if(!newData.pots[moveTo])newData.pots[moveTo]=[];
          newData.pots[moveTo].push(wObj);
          newData.totalCorrect=(newData.totalCorrect||0)+1;
          saveAndUpdate(newData);
          var pts=10;
          if(onUpdateScore)onUpdateScore(pts);
          if(setPlayer)setPlayer(function(p){return Object.assign({},p,{total_score:(p.total_score||0)+pts});});
          if(moveTo===5)setCelebration('🏆 "'+current.word+'" gelernt!');
          setResult({correct:true,partial:false,answer:current.word,typed:current.word,fromPot:2,toPot:moveTo,pts:pts,newStreak:wObj.streak,reqStreak:reqStreak});
          setPhase('showResult');
        }} onWrong={function(typed){
          var newData=JSON.parse(JSON.stringify(data));
          var potArr=(newData.pots[2]||[]);
          var wIdx=potArr.findIndex(function(w){return normWordKey(w.word)===normWordKey(current.word);});
          if(wIdx<0) wIdx=potArr.findIndex(function(w){return w.word===current.word;});
          var wObj=wIdx>=0?potArr.splice(wIdx,1)[0]:{word:current.word,clue:current.clue,streak:0};
          wObj.streak=0;
          if(2>1){var moveTo2=1;if(!newData.pots[moveTo2])newData.pots[moveTo2]=[];newData.pots[moveTo2].push(wObj);}else{if(!newData.pots[2])newData.pots[2]=[];newData.pots[2].push(wObj);}
          newData.totalWrong=(newData.totalWrong||0)+1;
          saveAndUpdate(newData);
          setResult({correct:false,partial:false,answer:current.word,typed:typed,fromPot:2,toPot:1,pts:0});
          setPhase('showResult');
        }}/>}
        <button onClick={function(){setResult({skipped:true,answer:current?current.word:'',fromPot:2,toPot:2,pts:0});setPhase('showResult');}} style={BtnStyle(G100,G600,{width:'100%',padding:'8px',marginTop:10,fontSize:12})}>Überspringen</button>
      </div>
    );
  }

  if(phase==='showResult'||phase==='answer'){
    if(phase==='answer') return(
      <div style={{padding:8}}>
        {celebration&&<CelebrationPopup msg={celebration} onClose={function(){setCelebration(null);nextWord();}}/>}
        <div style={{textAlign:'center',padding:'18px 16px',background:G50,borderRadius:14,marginBottom:12,border:'2px solid '+G200}}>
          <div style={{fontSize:10,color:G400,marginBottom:4,textTransform:'uppercase',letterSpacing:1}}>Topf {current&&current.pot} — Wie heißt das auf Englisch?</div>
          <div style={{fontSize:24,fontWeight:'bold',color:G900,marginBottom:4}}>{current&&current.clue}</div>
        </div>
        <div style={{display:'flex',gap:8,marginBottom:8}}>
          <input ref={inputRef} value={input} onChange={function(e){setInput(e.target.value);}}
            onKeyDown={function(e){if(e.key==='Enter')submitAnswer();}}
            autoCapitalize="none" autoCorrect="off" autoComplete="off" spellCheck="false"
            placeholder="Englisch…"
            style={{flex:1,padding:'12px 14px',fontSize:16,border:'2px solid '+T,borderRadius:10,outline:'none'}}/>
          <button onClick={submitAnswer} style={BtnStyle(T,'white',{padding:'12px 16px',fontSize:15})}>✓</button>
        </div>
        <button onClick={function(){setResult({skipped:true,answer:current?current.clue:'',fromPot:current?current.pot:1,toPot:current?current.pot:1,pts:0});setPhase('showResult');}} style={BtnStyle(G100,G600,{width:'100%',padding:'8px',fontSize:12})}>Überspringen / Nicht gewusst</button>
      </div>
    );
    return(
      <div style={{padding:8}}>
        {celebration&&<CelebrationPopup msg={celebration} onClose={function(){setCelebration(null);}}/>}
        {result&&(
          <div style={{padding:16,borderRadius:14,marginBottom:12,background:result.skipped?G50:result.correct?'#d1fae5':'#fee2e2',border:'2px solid '+(result.skipped?G200:result.correct?GR:RE)}}>
            <div style={{fontSize:18,fontWeight:'bold',color:result.skipped?G600:result.correct?'#065f46':'#991b1b',marginBottom:6}}>
              {result.skipped?'⏭ Übersprungen':result.correct?'✓ Richtig'+(result.partial?' (fast)':''):'✗ Falsch'}
            </div>
            <div style={{fontSize:14,color:G900,marginBottom:4}}>Richtig: <strong>{result.answer}</strong></div>
            {!result.correct&&!result.skipped&&<div style={{fontSize:12,color:G400}}>Deine Antwort: {result.typed}</div>}
            {!result.skipped&&<div style={{display:'flex',gap:8,marginTop:8,flexWrap:'wrap',alignItems:'center'}}>
              <span style={{fontSize:11,padding:'3px 10px',borderRadius:20,background:POT_COL[result.fromPot]+'22',color:POT_COL[result.fromPot],fontWeight:'bold'}}>{POT_ICON[result.fromPot]} {POT_LABEL[result.fromPot]}</span>
              <span style={{fontSize:12,color:G400}}>→</span>
              <span style={{fontSize:11,padding:'3px 10px',borderRadius:20,background:POT_COL[result.toPot]+'22',color:POT_COL[result.toPot],fontWeight:'bold'}}>{POT_ICON[result.toPot]} {POT_LABEL[result.toPot]}</span>
              {result.pts>0&&<span style={{marginLeft:'auto',fontSize:12,fontWeight:'bold',color:AM}}>+{result.pts} Pkt</span>}
            </div>}
          </div>
        )}
        <button onClick={nextWord} style={BtnStyle(T,'white',{width:'100%',padding:'12px',fontSize:15,marginBottom:8})}>→ Weiter</button>
        <button onClick={function(){setPhase('pick');}} style={BtnStyle(G100,G600,{width:'100%',padding:'9px',fontSize:12})}>Pause / Menü</button>
      </div>
    );
  }

  if(phase==='done'){
    var corr3=sessionLog.filter(function(l){return l.correct;}).length;
    var wrong3=sessionLog.filter(function(l){return !l.correct&&!l.skipped;}).length;
    var pct2=lsPercent(data);
    return(
      <div style={{padding:8}}>
        <div style={{background:'linear-gradient(135deg,'+T+','+TD+')',borderRadius:16,padding:24,color:'white',textAlign:'center',marginBottom:12}}>
          <div style={{fontSize:40,marginBottom:8}}>{pct2>=80?'🏆':pct2>=60?'👍':'📚'}</div>
          <div style={{fontSize:22,fontWeight:'bold',marginBottom:4}}>Session beendet</div>
          <div style={{fontSize:14,opacity:.85}}>{corr3} richtig · {wrong3} falsch</div>
          <div style={{marginTop:8,fontSize:16,fontWeight:'bold'}}>{pct2}% Gesamtfortschritt</div>
        </div>
        {sessionLog.length>0&&<div style={{marginBottom:12}}>
          {sessionLog.slice(-10).map(function(l,i){
            return <div key={i} style={{display:'flex',alignItems:'center',gap:8,padding:'5px 8px',marginBottom:3,borderRadius:7,background:l.correct?'#d1fae5':l.skipped?G50:'#fee2e2',fontSize:11}}>
              <span>{l.correct?'✓':l.skipped?'⏭':'✗'}</span>
              <span style={{fontWeight:'bold',flex:1}}>{l.word}</span>
              <span style={{color:G400}}>{l.clue}</span>
              {l.pts>0&&<span style={{color:AM,fontWeight:'bold'}}>+{l.pts}</span>}
            </div>;
          })}
        </div>}
        <button onClick={onDone} style={BtnStyle(T,'white',{width:'100%',padding:'12px'})}>← Zurück</button>
      </div>
    );
  }
  return null;
}

function LeitersSpielCreate({ player, chapters, onDone }) {
  var [name, setName] = useState('');
  var [icon, setIcon] = useState('🎯');
  var [selectedWords, setSelectedWords] = useState([]);
  var [saving, setSaving] = useState(false);
  var [msg, setMsg] = useState('');
  var [openCh, setOpenCh] = useState(null);
  var allWords = useMemo(function(){
    var w=[];
    chapters.filter(function(c){return c.parent_id;}).forEach(function(ch){
      (ch.words||[]).forEach(function(ww){ w.push(Object.assign({},ww,{chapId:ch.id,chapTitle:ch.title,chapColor:ch.color})); });
    });
    return w;
  },[chapters]);
  function isSelected(word){ return selectedWords.findIndex(function(w){return normWordKey(w.word)===normWordKey(word.word);})>=0; }
  function toggleWord(wObj){
    setSelectedWords(function(prev){
      if(isSelected(wObj)) return prev.filter(function(w){return normWordKey(w.word)!==normWordKey(wObj.word);});
      return prev.concat([{word:wObj.word,clue:wObj.clue,pot:1}]);
    });
  }
  function selectAll(){ setSelectedWords(allWords.map(function(w){return{word:w.word,clue:w.clue,pot:1};})); }
  function selectImportant(){ setSelectedWords(allWords.filter(function(w){return w.important;}).map(function(w){return{word:w.word,clue:w.clue,pot:1};})); }
  function toggleChapter(ch){
    var chWords=ch.words||[];
    var allSel=chWords.every(function(w){return isSelected(w);});
    if(allSel){ setSelectedWords(function(prev){return prev.filter(function(sw){return !chWords.some(function(cw){return normWordKey(cw.word)===normWordKey(sw.word);});}); }); }
    else { var toAdd=chWords.filter(function(w){return !isSelected(w);}).map(function(w){return{word:w.word,clue:w.clue,pot:1};}); setSelectedWords(function(prev){return prev.concat(toAdd);}); }
  }
  function save(){
    if(!name.trim()||selectedWords.length<2){setMsg('Name und mind. 2 Wörter erforderlich');return;}
    setSaving(true);
    var runId='run_'+Date.now();
    sbGet('settings','key=eq.ls_runs').then(function(d){
      var existing=[]; if(d&&d[0]){try{existing=JSON.parse(d[0].value);}catch(e){}}
      var newRun={id:runId,name:name.trim(),icon:icon,words:selectedWords,createdBy:player.id,createdAt:new Date().toISOString()};
      var updated=existing.concat([newRun]);
      var body={key:'ls_runs',value:JSON.stringify(updated)};
      if(d&&d[0]){ sbPatch('settings',{value:JSON.stringify(updated)},'key=eq.ls_runs').then(function(){setSaving(false);setMsg('✓ Run gespeichert!');setTimeout(onDone,1000);}); }
      else { sbPost('settings',body).then(function(){setSaving(false);setMsg('✓ Run gespeichert!');setTimeout(onDone,1000);}); }
    });
  }
  var topLevel=chapters.filter(function(c){return !c.parent_id;}).slice().sort(function(a,b){return a.id<b.id?-1:1;});
  return(
    <div style={{padding:8}}>
      <div style={{display:'flex',gap:6,marginBottom:12}}>
        <div style={{fontSize:32,cursor:'pointer'}} onClick={function(){var icons=['🎯','📚','🏆','⭐','🎓','💪','🔥','🧠'];setIcon(icons[(icons.indexOf(icon)+1)%icons.length]);}}>{icon}</div>
        <input value={name} onChange={function(e){setName(e.target.value);}} placeholder="Run-Name…"
          style={{flex:1,padding:'10px 12px',fontSize:16,border:'2px solid '+T,borderRadius:10,outline:'none'}}/>
      </div>
      <div style={{display:'flex',gap:6,marginBottom:10}}>
        <button onClick={selectImportant} style={BtnStyle(T,'white',{flex:1,padding:'7px',fontSize:11})}>⭐ Alle wichtigen</button>
        <button onClick={selectAll} style={BtnStyle(G100,G600,{flex:1,padding:'7px',fontSize:11})}>Alle ({allWords.length})</button>
        <button onClick={function(){setSelectedWords([]);}} style={BtnStyle(RE,'white',{padding:'7px 10px',fontSize:11})}>✕</button>
      </div>
      <div style={{marginBottom:12,padding:'8px 12px',background:TL,borderRadius:8,fontSize:13,color:T,fontWeight:'bold'}}>{selectedWords.length} Vokabeln ausgewählt</div>
      {topLevel.map(function(kap){
        var children=chapters.filter(function(c){return c.parent_id===kap.id;});
        return <div key={kap.id} style={{marginBottom:8,border:'1px solid '+G200,borderRadius:10,overflow:'hidden'}}>
          <div style={{padding:'8px 12px',background:G50,fontWeight:'bold',fontSize:12,color:kap.color||T}}>{kap.icon} {kap.title}</div>
          {children.map(function(ch){
            var chSel=ch.words.every(function(w){return isSelected(w);});
            var chSome=!chSel&&ch.words.some(function(w){return isSelected(w);});
            var open=openCh===ch.id;
            return <div key={ch.id} style={{borderTop:'1px solid '+G100}}>
              <div style={{display:'flex',alignItems:'center',gap:8,padding:'7px 12px',cursor:'pointer'}} onClick={function(){setOpenCh(open?null:ch.id);}}>
                <div onClick={function(e){e.stopPropagation();toggleChapter(ch);}} style={{width:18,height:18,borderRadius:4,border:'2px solid '+(chSel?ch.color:chSome?ch.color:G200),background:chSel?ch.color:'white',display:'flex',alignItems:'center',justifyContent:'center',cursor:'pointer',flexShrink:0}}>
                  {chSel&&<span style={{color:'white',fontSize:10}}>✓</span>}
                  {chSome&&<span style={{color:ch.color,fontSize:12}}>−</span>}
                </div>
                <span style={{fontSize:12,fontWeight:'bold',color:ch.color,flex:1}}>{ch.icon} {ch.title}</span>
                <span style={{fontSize:10,color:G400}}>{ch.words.filter(function(w){return isSelected(w);}).length}/{ch.words.length}</span>
                <span style={{fontSize:10,color:G400,marginLeft:4}}>{open?'▲':'▼'}</span>
              </div>
              {open&&<div style={{padding:'4px 12px 8px 32px',background:'#fafafa',display:'flex',flexWrap:'wrap',gap:4}}>
                {ch.words.map(function(w,i){
                  var sel=isSelected(w);
                  return <div key={i} onClick={function(){toggleWord(w);}} style={{display:'flex',alignItems:'center',gap:4,padding:'3px 8px',borderRadius:20,border:'1.5px solid '+(sel?ch.color:G200),background:sel?ch.color+'18':'white',cursor:'pointer',touchAction:'manipulation'}}>
                    {w.important&&<span style={{fontSize:9}}>⭐</span>}
                    <span style={{fontSize:11,fontWeight:w.important?'bold':'normal',color:sel?ch.color:G600}}>{w.word}</span>
                  </div>;
                })}
              </div>}
            </div>;
          })}
        </div>;
      })}
      {msg&&<div style={{padding:'8px 12px',borderRadius:8,background:msg.startsWith('✓')?'#d1fae5':'#fee2e2',color:msg.startsWith('✓')?T:RE,marginBottom:8,fontSize:12}}>{msg}</div>}
      <button onClick={save} disabled={saving} style={BtnStyle(T,'white',{width:'100%',padding:'12px',marginTop:8})}>{saving?'Speichern…':'💾 Run speichern'}</button>
    </div>
  );
}

function LeitersSpielStreakSettings({ onDone }) {
  var [settings, setSettings] = useState(DEFAULT_STREAK);
  var [saving, setSaving] = useState(false);
  var [msg, setMsg] = useState('');
  useEffect(function(){
    sbGet('settings','key=eq.streak_settings').then(function(d){
      if(d&&d[0]){try{setSettings(JSON.parse(d[0].value));}catch(e){}}
    });
  },[]);
  function save(){
    setSaving(true);
    sbGet('settings','key=eq.streak_settings').then(function(d){
      var body={key:'streak_settings',value:JSON.stringify(settings)};
      if(d&&d[0]){ sbPatch('settings',{value:JSON.stringify(settings)},'key=eq.streak_settings').then(function(){setSaving(false);setMsg('✓ Gespeichert');}); }
      else { sbPost('settings',body).then(function(){setSaving(false);setMsg('✓ Gespeichert');}); }
    });
  }
  return(
    <div style={{padding:8}}>
      <p style={{fontSize:12,color:G400,marginBottom:12}}>Wie oft muss ein Wort in jedem Topf richtig beantwortet werden?</p>

function RunEditor({ run, chapters, onSave, onCancel }) {
  var [words, setWords] = useState((run.words||[]).slice());
  var [saving, setSaving] = useState(false);
  var allChapWords = useMemo(function(){
    var w=[];
    chapters.filter(function(c){return c.parent_id;}).forEach(function(ch){
      (ch.words||[]).forEach(function(ww){ w.push(Object.assign({},ww,{chapId:ch.id,chapColor:ch.color||T})); });
    });
    return w;
  },[chapters]);
  var [openCh, setOpenCh] = useState(null);
  function isInRun(word){ return words.findIndex(function(w){return normWordKey(w.word)===normWordKey(word.word);})>=0; }
  function toggle(wObj){
    setWords(function(prev){
      if(isInRun(wObj)) return prev.filter(function(w){return normWordKey(w.word)!==normWordKey(wObj.word);});
      var existing=prev.find(function(w){return normWordKey(w.word)===normWordKey(wObj.word);});
      return prev.concat([{word:wObj.word,clue:wObj.clue,pot:existing?existing.pot:1}]);
    });
  }
  function toggleChapter(ch){
    var allIn=ch.words.every(function(w){return isInRun(w);});
    if(allIn){ setWords(function(prev){return prev.filter(function(w){return !ch.words.some(function(cw){return normWordKey(cw.word)===normWordKey(w.word);});}); }); }
    else { var toAdd=ch.words.filter(function(w){return !isInRun(w);}).map(function(w){return{word:w.word,clue:w.clue,pot:1};}); setWords(function(prev){return prev.concat(toAdd);}); }
  }
  function setPot(wordStr, pot){
    setWords(function(prev){ return prev.map(function(w){ return normWordKey(w.word)===normWordKey(wordStr)?Object.assign({},w,{pot:pot}):w; }); });
  }
  function save(){
    setSaving(true);
    sbGet('settings','key=eq.ls_runs').then(function(d){
      var existing=[]; if(d&&d[0]){try{existing=JSON.parse(d[0].value);}catch(e){}}
      var updated=existing.map(function(r){return r.id===run.id?Object.assign({},r,{words:words}):r;});
      if(!updated.find(function(r){return r.id===run.id;})) updated=updated.concat([Object.assign({},run,{words:words})]);
      var body={value:JSON.stringify(updated)};
      if(d&&d[0]){ sbPatch('settings',body,'key=eq.ls_runs').then(function(){setSaving(false);onSave(Object.assign({},run,{words:words}));}); }
      else { sbPost('settings',Object.assign({key:'ls_runs'},body)).then(function(){setSaving(false);onSave(Object.assign({},run,{words:words}));}); }
    });
  }
  var topLevel=chapters.filter(function(c){return !c.parent_id;}).slice().sort(naturalSort);
  return(
    <div style={{padding:8}}>
      <div style={{fontWeight:'bold',fontSize:14,color:G900,marginBottom:4}}>{run.icon} {run.name} bearbeiten</div>
      <div style={{padding:'8px 12px',background:TL,borderRadius:8,fontSize:13,color:T,fontWeight:'bold',marginBottom:10}}>{words.length} Vokabeln im Run</div>
      {topLevel.map(function(kap){
        var children=chapters.filter(function(c){return c.parent_id===kap.id;});
        return <div key={kap.id} style={{marginBottom:8,border:'1px solid '+G200,borderRadius:10,overflow:'hidden'}}>
          <div style={{padding:'8px 12px',background:G50,fontWeight:'bold',fontSize:12,color:kap.color||T}}>{kap.icon} {kap.title}</div>
          {children.map(function(ch){
            var allIn=ch.words.every(function(w){return isInRun(w);});
            var someIn=!allIn&&ch.words.some(function(w){return isInRun(w);});
            var open=openCh===ch.id;
            return <div key={ch.id} style={{borderTop:'1px solid '+G100}}>
              <div style={{display:'flex',alignItems:'center',gap:8,padding:'7px 12px',cursor:'pointer'}} onClick={function(){setOpenCh(open?null:ch.id);}}>
                <div onClick={function(e){e.stopPropagation();toggleChapter(ch);}} style={{width:18,height:18,borderRadius:4,border:'2px solid '+(allIn?ch.color:someIn?ch.color:G200),background:allIn?ch.color:'white',display:'flex',alignItems:'center',justifyContent:'center',cursor:'pointer',flexShrink:0}}>
                  {allIn&&<span style={{color:'white',fontSize:10}}>✓</span>}
                  {someIn&&<span style={{color:ch.color,fontSize:12}}>−</span>}
                </div>
                <span style={{fontSize:12,fontWeight:'bold',color:ch.color,flex:1}}>{ch.icon} {ch.title}</span>
                <span style={{fontSize:10,color:G400}}>{ch.words.filter(function(w){return isInRun(w);}).length}/{ch.words.length}</span>
                <span style={{fontSize:10,color:G400,marginLeft:4}}>{open?'▲':'▼'}</span>
              </div>
              {open&&<div style={{padding:'4px 8px 8px 28px',background:'#fafafa',display:'flex',flexWrap:'wrap',gap:4}}>
                {ch.words.map(function(w,i){
                  var inRun=isInRun(w);
                  var runW=inRun?words.find(function(rw){return normWordKey(rw.word)===normWordKey(w.word);}):null;
                  return <div key={i} style={{display:'flex',flexDirection:'column',alignItems:'center',gap:2,padding:'4px 6px',borderRadius:8,border:'1.5px solid '+(inRun?ch.color:G200),background:inRun?ch.color+'12':'white',cursor:'pointer',touchAction:'manipulation'}} onClick={function(){toggle(w);}}>
                    <div style={{display:'flex',alignItems:'center',gap:3}}>
                      {w.important&&<span style={{fontSize:9}}>⭐</span>}
                      <span style={{fontSize:11,fontWeight:w.important?'bold':'normal',color:inRun?ch.color:G600}}>{w.word}</span>
                    </div>
                    {inRun&&<div style={{display:'flex',gap:2}} onClick={function(e){e.stopPropagation();}}>
                      {[1,2,3,4,5].map(function(p){ return <button key={p} onClick={function(){setPot(w.word,p);}} style={{width:16,height:16,borderRadius:3,border:'none',background:runW&&runW.pot===p?POT_COL[p]:G200,color:runW&&runW.pot===p?'white':G400,fontSize:8,cursor:'pointer',padding:0,fontWeight:'bold'}}>{p}</button>; })}
                    </div>}
                  </div>;
                })}
              </div>}
            </div>;
          })}
        </div>;
      })}
      <div style={{display:'flex',gap:8,marginTop:10}}>
        <button onClick={save} disabled={saving} style={BtnStyle(T,'white',{flex:1,padding:'11px'})}>{saving?'…':'💾 Speichern'}</button>
        <button onClick={onCancel} style={BtnStyle(G100,G600,{flex:1,padding:'11px'})}>Abbrechen</button>
      </div>
    </div>
  );
}

        </div>;})}

  var UUID=/^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/i;

  function toggleCh(id){ setExpandedCh(function(prev){var n=Object.assign({},prev);n[id]=!n[id];return n;}); }

  function doSaveWord(chapterId, wordObj, wordIdx) {
    var ch = chapters.find(function(c){return c.id===chapterId;});
    if(!ch) return;
    var newWords = ch.words.slice();
    if(wordIdx!=null) newWords[wordIdx]=wordObj; else newWords=newWords.concat([wordObj]);
    saveChapterWords(ch, newWords, chapters, setChapters, setSaving, setMsg);
    setEditWord(null); setEditCh(null);
  }

  function deleteWord(chapterId, wordIdx) {
    if(!confirm('Wort löschen?')) return;
    var ch = chapters.find(function(c){return c.id===chapterId;});
    if(!ch) return;
    var newWords = ch.words.filter(function(_,i){return i!==wordIdx;});
    saveChapterWords(ch, newWords, chapters, setChapters, setSaving, setMsg);
  }

  function saveChapter(form) {
    setSaving(true);
    var isNew = !form.id || !UUID.test(form.id);
    if(isNew){
      var body={title:form.title,color:form.color,icon:form.icon,parent_id:form.parent_id||null,words:form.words||[],sentences:form.sentences||[]};
      sbPost('chapters',body).then(function(res){
        if(res&&res.id){ setChapters(function(prev){return prev.concat([Object.assign({},body,{id:res.id})]);}) }
        setSaving(false); setMsg('✓ Gespeichert'); setShowNewCh(false); setEditCh(null);
      });
    } else {
      var upd={title:form.title,color:form.color,icon:form.icon};
      sbPatch('chapters',upd,'id=eq.'+form.id).then(function(){
        setChapters(function(prev){return prev.map(function(c){return c.id===form.id?Object.assign({},c,upd):c;});});
        setSaving(false); setMsg('✓ Gespeichert'); setEditCh(null);
      });
    }
  }

  function deleteChapter(ch) {
    if(!confirm('Kapitel und alle Vokabeln löschen?')) return;
    sbDel('chapters','id=eq.'+ch.id).then(function(){
      setChapters(function(prev){return prev.filter(function(c){return c.id!==ch.id;});});
    });
  }

  function handleFileUpload(e) {
    var file=e.target.files&&e.target.files[0];
    if(!file) return;
    var reader=new FileReader();
    reader.onload=function(ev){ setUploadData(ev.target.result); setShowUpload(true); };
    reader.readAsText(file);
  }

  function doImport(chapterId, words, mode) {
    var ch = chapters.find(function(c){return c.id===chapterId;});
    if(!ch) return;
    var base = mode==='replace'?[]:ch.words.slice();
    var existing = base.map(function(w){return normWordKey(w.word);});
    var toAdd = words.filter(function(w){return existing.indexOf(normWordKey(w.word))<0;});
    var newWords = base.concat(toAdd);
    saveChapterWords(ch, newWords, chapters, setChapters, setSaving, setMsg);
    setShowUpload(false);
  }

  function findDuplicates() {
    setDupLoading(true); setShowDup(true);
    var wordMap={};
    chapters.filter(function(c){return c.parent_id;}).forEach(function(ch){
      (ch.words||[]).forEach(function(w){
        var key=normWordKey(w.word);
        if(!wordMap[key]) wordMap[key]=[];
        wordMap[key].push({word:w.word,clue:w.clue,chapId:ch.id,chapTitle:ch.title,chapColor:ch.color});
      });
    });
    var dups=Object.values(wordMap).filter(function(v){return v.length>1;});
    setDupWords(dups); setDupLoading(false);
  }

  function mergeDup(key, keepIdx, entries) {
    var toRemove = entries.filter(function(_,i){return i!==keepIdx;});
    toRemove.forEach(function(entry){
      var ch=chapters.find(function(c){return c.id===entry.chapId;});
      if(!ch) return;
      var newWords=ch.words.filter(function(w){return normWordKey(w.word)!==normWordKey(entry.word);});
      saveChapterWords(ch,newWords,chapters,setChapters,setSaving,setMsg);
    });
    setDupWords(function(prev){return prev?prev.filter(function(v){return normWordKey(v[0].word)!==key;}):prev;});
  }

  var topLevelChapters = chapters.filter(function(c){return !c.parent_id;}).slice().sort(naturalSort);
  var childChapters = chapters.filter(function(c){return c.parent_id;});

  if(showUpload) return <UploadPreview fileData={uploadData} chapters={chapters} onConfirm={doImport} onCancel={function(){setShowUpload(false);}}/>;

  if(showDup) return(

      <div style={{display:'flex',alignItems:'center',gap:8,marginBottom:12}}>

      {!dupLoading&&(dupWords||[]).map(function(entries,di){

            </div>;
          })}
        </div>;
      })}
    </div>
  );

          var open=expandedCh[kap.id];

              {UUID.test(kap.id)&&<button onClick={function(e){e.stopPropagation();if(confirm('Kapitel löschen?'))deleteChapter(kap);}} style={{padding:'2px 8px',fontSize:10,border:'1px solid '+RE,background:'white',color:RE,cursor:'pointer',borderRadius:5}}>🗑</button>}

                        <input value={editCh.color||''} onChange={function(e){setEditCh(function(c){return Object.assign({},c,{color:e.target.value});});}} type="color" style={{width:36,height:30,padding:2,border:'1px solid '+G200,borderRadius:6,cursor:'pointer'}}/>

                        <button onClick={function(){setEditWord({w:Object.assign({},w),chId:ch.id,idx:realIdx});}} style={{padding:'1px 6px',fontSize:9,border:'1px solid '+T,background:'white',color:T,cursor:'pointer',borderRadius:4}}>✏</button>
                        <button onClick={function(){deleteWord(ch.id,realIdx);}} style={{padding:'1px 6px',fontSize:9,border:'1px solid '+RE,background:'white',color:RE,cursor:'pointer',borderRadius:4}}>✕</button>
                      </div>;
                    })}
                    {editWord&&editWord.chId===ch.id&&(<div style={{padding:8,background:'white',borderRadius:8,border:'1px solid '+T,marginTop:6}}>
                      <div style={{display:'flex',gap:5,marginBottom:5}}>
                        <input value={editWord.w.word||''} onChange={function(e){setEditWord(function(ew){return Object.assign({},ew,{w:Object.assign({},ew.w,{word:e.target.value})});});}} style={{flex:1,padding:'5px',fontSize:12,border:'1px solid '+G200,borderRadius:5}} placeholder="EN"/>
                        <input value={editWord.w.clue||''} onChange={function(e){setEditWord(function(ew){return Object.assign({},ew,{w:Object.assign({},ew.w,{clue:e.target.value})});});}} style={{flex:1,padding:'5px',fontSize:12,border:'1px solid '+G200,borderRadius:5}} placeholder="DE"/>
                        <div onClick={function(){setEditWord(function(ew){return Object.assign({},ew,{w:Object.assign({},ew.w,{important:!ew.w.important})});});}} style={{width:28,height:28,borderRadius:6,border:'2px solid '+(editWord.w.important?AM:G200),background:editWord.w.important?AM:'white',display:'flex',alignItems:'center',justifyContent:'center',cursor:'pointer',flexShrink:0}}>
                          <span style={{fontSize:12}}>{editWord.w.important?'⭐':'☆'}</span>

                      </div>
                      <div style={{display:'flex',gap:5}}>
                        <button onClick={function(){doSaveWord(editWord.chId,editWord.w,editWord.idx);}} style={BtnStyle(T,'white',{flex:1,padding:'5px',fontSize:10})}>✓</button>
                        <button onClick={function(){setEditWord(null);}} style={BtnStyle(G100,G600,{flex:1,padding:'5px',fontSize:10})}>✕</button>
                      </div>
                    </div>)}

function LoginScreen({ onLogin }) {
  var [name, setName] = useState('');
  var [pw, setPw] = useState('');
  var [err, setErr] = useState('');
  var [loading, setLoading] = useState(false);
  var KNOWN_USERS = [
    { id: "supabase-emma-d46d1397", name: "Emma", password_hash: "fb_63b25a920b81aad7",
      is_admin: false, total_score: 0, total_correct: 0, total_wrong: 0, puzzles_completed: 0 }
  ];
  function doLogin() {
    if(!name.trim()||!pw.trim()){setErr('Name und Passwort eingeben');return;}
    setLoading(true); setErr('');
    hashPw(pw).then(function(hash){
      var local=KNOWN_USERS.find(function(u){return u.name.toLowerCase()===name.trim().toLowerCase()&&u.password_hash===hash;});
      if(local){ onLogin(local); setLoading(false); return; }
      sbGet('profiles','name=ilike.'+encodeURIComponent(name.trim())).then(function(d){
        var user=Array.isArray(d)&&d[0];
        if(!user){setErr('Nutzer nicht gefunden');setLoading(false);return;}
        if(user.password_hash===hash){
          onLogin(user); setLoading(false);
        } else {
          setErr('Falsches Passwort'); setLoading(false);
        }
      });
    });
  }
  return(
    <div style={{minHeight:'100vh',display:'flex',alignItems:'center',justifyContent:'center',background:'linear-gradient(135deg,#0f766e,#134e4a)',padding:16}}>
      <div style={{background:'white',borderRadius:24,padding:32,width:'100%',maxWidth:380,boxShadow:'0 20px 60px rgba(0,0,0,0.3)'}}>
        <div style={{textAlign:'center',marginBottom:24}}>
          <div style={{fontSize:48,marginBottom:8}}>🎓</div>
          <h1 style={{fontSize:22,fontWeight:'bold',color:G900,margin:0}}>Vokabel-Rätsel</h1>
          <p style={{fontSize:13,color:G400,margin:'4px 0 0'}}>Anmelden</p>

var GRAMMAR_KEYS = { sp:'grammar_exercises_sp', pp:'grammar_exercises_pp' };
var GRAMMAR_VERBS = [
  {word:'to play',clue:'spielen'},{word:'to work',clue:'arbeiten'},
  {word:'to go',clue:'gehen'},{word:'to eat',clue:'essen'},
  {word:'to drink',clue:'trinken'},{word:'to read',clue:'lesen'},
  {word:'to write',clue:'schreiben'},{word:'to run',clue:'laufen'},
  {word:'to sing',clue:'singen'},{word:'to dance',clue:'tanzen'},
  {word:'to cook',clue:'kochen'},{word:'to swim',clue:'schwimmen'},
  {word:'to travel',clue:'reisen'},{word:'to learn',clue:'lernen'},
  {word:'to teach',clue:'lehren, unterrichten'},{word:'to help',clue:'helfen'},
  {word:'to buy',clue:'kaufen'},{word:'to sell',clue:'verkaufen'}
];

function loadGrammarPool(topic) {
  return sbGet('settings','key=eq.'+GRAMMAR_KEYS[topic]).then(function(d){
    if(d&&d[0]){try{return JSON.parse(d[0].value);}catch(e){return [];}}
    return [];
  });
}
function saveGrammarPool(topic, pool) {
  var key=GRAMMAR_KEYS[topic];
  return sbGet('settings','key=eq.'+key).then(function(d){
    var val=JSON.stringify(pool);
    if(d&&d[0]) return sbPatch('settings',{value:val},'key=eq.'+key);
    return sbPost('settings',{key:key,value:val});
  });
}
function grammarPickQuestions(pool, ruleStats, count) {
  if(!pool||pool.length===0) return [];
  var weighted=pool.map(function(q){
    var st=ruleStats[q.rule]||{correct:0,total:0};
    var score=st.total>0?st.correct/st.total:0;
    var weight=1+(1-score)*3;
    return Object.assign({},q,{_weight:weight});
  });
  var picked=[], seen=new Set();
  var attempts=0;
  while(picked.length<count&&attempts<count*10){
    attempts++;
    var totalW=weighted.reduce(function(s,q){return s+q._weight;},0);
    var r=Math.random()*totalW, cum=0, sel=weighted[0];
    for(var i=0;i<weighted.length;i++){cum+=weighted[i]._weight;if(cum>=r){sel=weighted[i];break;}}
    if(!seen.has(sel.id)){seen.add(sel.id);picked.push(sel);}
  }
  return shuffle(picked);
}
