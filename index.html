function getWordType(w) {

  if(clue.match(/(lich|ig|isch|sam|haft|los|voll|bar|reich|arm|frei)$/)) return 'adj';
  var word=(w.word||'').toLowerCase().replace(/^to /,'');
  if(word.match(/(ful|less|ous|ive|ent|ant|al|ic|ble|tic|ary|ory)$/)) return 'adj';

  var corrects = correct.split(/[\/]+/).map(function(s){ return s.trim(); }).filter(Boolean);
  if(corrects.length===1&&corrects[0].indexOf(',')>=0&&!/\([^)]*,[^)]*\)/.test(corrects[0])){
    corrects=corrects[0].split(',').map(function(s){return s.trim();}).filter(Boolean);
  }
  function isToVerb(c){ return /^to\s+/i.test(c.trim()); }
  function stripTo(c){ return c.replace(/^to\s+/i,'').trim(); }
  var allVariants = [];
  corrects.forEach(function(c){ allVariants = allVariants.concat(wordVariants(c)); });
  for (var i=0;i<allVariants.length;i++) { if (allVariants[i] === t) return 'correct'; }
  for (var k=0;k<corrects.length;k++) {
    if (isToVerb(corrects[k])) { if (stripTo(corrects[k]) === t) return 'partial'; }
  }
  return 'wrong';
}

function getWordColor(history) {
  if (!history || history.length===0) return 'new';
  var last = history.slice(-4), correct = last.filter(Boolean).length;
  if (last.length>=4 && correct===4) return 'green';
  if (correct===0) return 'red';
  return 'yellow';
}
var COLOR_BG = { green:'#d1fae5', yellow:'#fef9c3', red:'#fee2e2', new:'#f1f5f9' };
var COLOR_FG = { green:'#065f46', yellow:'#92400e', red:'#991b1b', new:'#475569' };
var COLOR_DOT = { green:'#22c55e', yellow:'#f59e0b', red:'#ef4444', new:'#94a3b8' };

var PROGRESS = {
  key: function(uid, word) { return 'wp:' + uid + ':' + word.toLowerCase(); },
  get: function(uid, word) {
    try {
      if (typeof window.storage === "undefined") return Promise.resolve(null);
      return window.storage.get(PROGRESS.key(uid, word))
        .then(function(r) { return r && r.value ? JSON.parse(r.value) : null; })
        .catch(function() { return null; });
    } catch(e) { return Promise.resolve(null); }
  },
  set: function(uid, word, clue, chapId, correct) {
    PROGRESS.get(uid, word).then(function(existing) {
      var data = existing || {history:[]};
      data.history = data.history.concat([correct]).slice(-10);
      data.word = word; data.clue = clue; data.chapId = chapId; data.lastSeen = Date.now();
      try {
        if (typeof window.storage !== "undefined") {
          window.storage.set(PROGRESS.key(uid, word), JSON.stringify(data)).catch(function(){});
        }
      } catch(e) {}
    });
  },
  getAll: function(uid) {
    try {
      if (typeof window.storage === "undefined") return Promise.resolve({});
      return window.storage.list('wp:' + uid + ':')
        .then(function(keys) {
          var promises = (keys.keys || []).map(function(k) {
            return window.storage.get(k).then(function(r) {
              if (r && r.value) { var d = JSON.parse(r.value); return [d.word, d.history]; }
              return null;
            }).catch(function() { return null; });
          });
          return Promise.all(promises).then(function(arr) {
            var map = {};
            arr.filter(Boolean).forEach(function(pair) { map[pair[0]] = pair[1]; });
            return map;
          });
        })
        .catch(function() { return {}; });
    } catch(e) { return Promise.resolve({}); }
  }
};

function selectWorkoutWords(allWords, progressMap, count) {
  var categorized={red:[],yellow:[],green:[],new:[]};
  allWords.forEach(function(w){
    var hist=progressMap[w.word]||[];
    categorized[getWordColor(hist)].push(w);
  });
  var red=shuffleArr(categorized.red.concat(categorized.new));
  var yellow=shuffleArr(categorized.yellow);
  var green=shuffleArr(categorized.green);
  var nRed=Math.min(Math.ceil(count*0.5), red.length);
  var nYellow=Math.min(Math.ceil(count*0.3), yellow.length);
  var nGreen=Math.min(count-nRed-nYellow, green.length);
  var pool=[].concat(red.slice(0,nRed), yellow.slice(0,nYellow), green.slice(0,nGreen));
  if (pool.length<count) {
    var used=new Set(pool.map(function(w){return w.word;}));
    var rest=shuffleArr(allWords.filter(function(w){return !used.has(w.word);}));
    pool=pool.concat(rest.slice(0,count-pool.length));
  }
  return shuffleArr(pool).slice(0,count);
}

function QuizSolo({ chapters, onDone }) {
  var allRounds = useMemo(function(){ return makeAllRounds(chapters); }, []);
  var [roundIdx, setRoundIdx] = useState(0);
  var [qIdx, setQIdx] = useState(0);
  var [chosen, setChosen] = useState(null);
  var [timeLeft, setTimeLeft] = useState(20);
  var [roundWins, setRoundWins] = useState([]);
  var [roundScore, setRoundScore] = useState(0);
  var [totalScore, setTotalScore] = useState(0);
  var [gameOver, setGameOver] = useState(false);
  var [roundOver, setRoundOver] = useState(false);
  var timerRef = useRef(null);
  var currentRound = allRounds[roundIdx] || [];
  var currentQ = currentRound[qIdx];
  function startTimer() {
    clearInterval(timerRef.current); setTimeLeft(20);
    timerRef.current = setInterval(function() {
      setTimeLeft(function(t) { if (t <= 1) { clearInterval(timerRef.current); handleAnswer(null); return 0; } return t - 1; });
    }, 1000);
  }
  useEffect(function() {
    if (!gameOver && !roundOver && !chosen) startTimer();
    return function() { clearInterval(timerRef.current); };
  }, [roundIdx, qIdx, roundOver, gameOver]);
  function handleAnswer(word) {
    clearInterval(timerRef.current);
    setChosen(word || "__none__");
    var correct = word === currentQ.correct.word;
    var pts = correct ? (timeLeft > 15 ? 15 : timeLeft > 8 ? 10 : 5) : 0;
    var newRoundScore = roundScore + (correct ? 1 : 0);
    setRoundScore(newRoundScore); setTotalScore(function(s) { return s + pts; });
    setTimeout(function() {
      if (qIdx + 1 >= currentRound.length) {
        var newWins = roundWins.concat([newRoundScore]);
        setRoundWins(newWins); setRoundScore(0); setChosen(null);
        if (roundIdx + 1 >= allRounds.length) setGameOver(true);
        else setRoundOver(true);
      } else { setQIdx(function(i) { return i + 1; }); setChosen(null); }
    }, 1200);
  }
  function nextRound() { setRoundIdx(function(i) { return i + 1; }); setQIdx(0); setRoundOver(false); setChosen(null); }
  if (!allRounds.length) return <div style={{textAlign:"center",padding:40,color:G400}}>Zu wenige Vokabeln.</div>;
  if (gameOver) {
    var won = roundWins.filter(function(s){ return s >= 2; }).length;
    return (
      <div style={{padding:"8px"}}>
        <div style={{background:"linear-gradient(135deg,"+T+","+TD+")",borderRadius:16,padding:"24px 20px",color:"white",textAlign:"center",marginBottom:16}}>
          <div style={{fontSize:40,marginBottom:8}}>{won >= 4 ? "🏆" : won >= 3 ? "🥈" : "📚"}</div>
          <div style={{fontSize:28,fontWeight:"bold",marginBottom:4}}>{totalScore} Punkte</div>
          <div style={{fontSize:14,opacity:0.8}}>{won} von 6 Runden gewonnen</div>
        </div>
        <div style={{marginBottom:12}}>
          {roundWins.map(function(s, i) {
            var win = s >= 2;
            return (<div key={i} style={{display:"flex",alignItems:"center",gap:10,padding:"8px 12px",marginBottom:4,borderRadius:8,background:win?"#f0fdf4":"#fef2f2",border:"1px solid "+(win?"#bbf7d0":"#fecaca")}}>
              <span style={{fontSize:16}}>{win ? "✓" : "✗"}</span>
              <span style={{fontSize:13,color:G600}}>Runde {i+1}</span>
              <span style={{marginLeft:"auto",fontWeight:"bold",color:win?T:RE}}>{s}/3 richtig</span>
            </div>);
          })}
        </div>
        <button onClick={onDone} style={BtnStyle(T,"#fff",{width:"100%",fontSize:15,padding:"12px"})}>← Zurück zum Menü</button>
      </div>
    );
  }
  if (roundOver) {
    var lastScore = roundWins[roundWins.length - 1] || 0;
    var roundWon = lastScore >= 2;
    return (
      <div style={{padding:"8px"}}>
        <div style={{textAlign:"center",padding:"32px 20px",background:roundWon?"#f0fdf4":"#fef2f2",borderRadius:16,marginBottom:16,border:"2px solid "+(roundWon?"#22c55e":RE)}}>
          <div style={{fontSize:40,marginBottom:8}}>{roundWon ? "🎉" : "😔"}</div>
          <div style={{fontSize:22,fontWeight:"bold",color:roundWon?T:RE,marginBottom:4}}>Runde {roundIdx+1} {roundWon?"gewonnen!":"verloren"}</div>
          <div style={{fontSize:14,color:G600}}>{lastScore}/3 Fragen richtig</div>
        </div>
        <div style={{display:"flex",gap:6,justifyContent:"center",marginBottom:16}}>
          {roundWins.map(function(s, i) { return <div key={i} style={{width:28,height:28,borderRadius:"50%",background:s>=2?T:RE,display:"flex",alignItems:"center",justifyContent:"center",color:"white",fontSize:12,fontWeight:"bold"}}>{s}</div>; })}
          {Array(6-roundWins.length).fill(0).map(function(_,i){ return <div key={"e"+i} style={{width:28,height:28,borderRadius:"50%",background:G200}}></div>; })}
        </div>
        <button onClick={nextRound} style={BtnStyle(T,"#fff",{width:"100%",fontSize:15,padding:"12px"})}>Runde {roundIdx+2} starten →</button>
      </div>
    );
  }
  var letters = ["A","B","C","D"];
  var isEn2De = currentQ && currentQ.type === "en2de";
  var question = currentQ ? (isEn2De ? currentQ.correct.word : currentQ.correct.clue) : "";
  var questionLabel = isEn2De ? "Was bedeutet dieses englische Wort?" : "Wie heißt das auf Englisch?";
  return (
    <div style={{padding:"8px"}}>
      <div style={{display:"flex",alignItems:"center",gap:8,marginBottom:12}}>
        <div style={{display:"flex",gap:4}}>
          {allRounds.map(function(_, i) {
            var active = i === roundIdx, done = i < roundIdx, win = done && roundWins[i] >= 2;
            return <div key={i} style={{width:24,height:24,borderRadius:"50%",background:active?T:done?(win?GR:RE):G200,display:"flex",alignItems:"center",justifyContent:"center",color:"white",fontSize:10,fontWeight:"bold"}}>{done?(roundWins[i]>=2?"✓":"✗"):(i+1)}</div>;
          })}
        </div>
        <span style={{fontSize:11,color:G400,marginLeft:"auto"}}>Frage {qIdx+1}/3</span>
      </div>
      <div style={{display:"flex",gap:8,marginBottom:12}}>
        <div style={{flex:1,textAlign:"center",padding:"8px",background:TL,borderRadius:8}}><div style={{fontSize:10,color:G400}}>Punkte</div><div style={{fontSize:18,fontWeight:"bold",color:T}}>{totalScore}</div></div>
        <div style={{flex:1,textAlign:"center",padding:"8px",background:roundScore>=2?"#f0fdf4":G100,borderRadius:8}}><div style={{fontSize:10,color:G400}}>Diese Runde</div><div style={{fontSize:18,fontWeight:"bold",color:roundScore>=2?GR:G600}}>{roundScore}/3</div></div>
        <div style={{flex:1,textAlign:"center",padding:"8px",background:timeLeft<=5?"#fef2f2":G100,borderRadius:8}}><div style={{fontSize:10,color:G400}}>Zeit</div><div style={{fontSize:18,fontWeight:"bold",color:timeLeft<=5?RE:G600}}>{timeLeft}s</div></div>
      </div>
      {currentQ && (<div style={{display:"flex",alignItems:"center",gap:6,marginBottom:8}}>
        <span style={{fontSize:14}}>{currentQ.correct.chapIcon}</span>
        <span style={{fontSize:11,fontWeight:"bold",color:currentQ.correct.chapColor}}>{currentQ.correct.chapTitle}</span>
        <span style={{marginLeft:"auto",fontSize:10,color:G400}}>Runde {roundIdx+1} · Frage {qIdx+1}</span>
      </div>)}
      <div style={{textAlign:"center",padding:"28px 20px",background:G50,borderRadius:16,marginBottom:12,border:"2px solid "+G200}}>
        <div style={{fontSize:11,color:G400,marginBottom:8,textTransform:"uppercase",letterSpacing:1}}>{questionLabel}</div>
        <div style={{fontSize:28,fontWeight:"bold",color:G900}}>{question}</div>
      </div>
      <div style={{height:4,background:G200,borderRadius:2,overflow:"hidden",marginBottom:12}}>
        <div style={{height:"100%",width:(timeLeft/20*100)+"%",background:timeLeft<=5?RE:T,borderRadius:2,transition:"width 1s linear"}}></div>
      </div>
      <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:8}}>
        {currentQ && currentQ.answers.map(function(a, i) {
          var answerText = isEn2De ? a.clue : a.word;
          var isCorrect = a.word === currentQ.correct.word, isChosen = chosen && chosen === a.word;
          var bg = G50, border2 = "2px solid "+G200, col = G900;
          if (chosen) {
            if (isCorrect) { bg="#d1fae5"; border2="2px solid "+GR; col="#065f46"; }
            else if (isChosen) { bg="#fee2e2"; border2="2px solid "+RE; col="#991b1b"; }
          }
          return (
            <button key={i} onClick={function(){ if (!chosen) handleAnswer(a.word); }} disabled={!!chosen}
              style={{padding:"14px 10px",background:bg,border:border2,borderRadius:12,cursor:chosen?"default":"pointer",textAlign:"left",transition:"all .2s"}}>
              <div style={{display:"flex",alignItems:"center",gap:8}}>
                <span style={{width:24,height:24,borderRadius:"50%",background:chosen&&isCorrect?GR:chosen&&isChosen?RE:G200,color:chosen&&(isCorrect||isChosen)?"white":G600,display:"flex",alignItems:"center",justifyContent:"center",fontSize:12,fontWeight:"bold",flexShrink:0}}>{letters[i]}</span>
                <span style={{fontSize:13,fontWeight:"bold",color:col,lineHeight:1.3}}>{answerText}</span>
              </div>
            </button>
          );
        })}
      </div>
    </div>
  );
}

function QuizDuel({ chapters, player, onDone, allUsers, allCategories }) {
  var [phase, setPhase] = useState("setup");
  var [selectedKapitel, setSelectedKapitel] = useState([]);
  var [tab, setTab] = useState("users");
  var [gameId, setGameId] = useState(null);
  var [gameData, setGameData] = useState(null);
  var [rounds, setRounds] = useState([]);
  var [currentRoundIdx, setCurrentRoundIdx] = useState(0);
  var [qIdx, setQIdx] = useState(0);
  var [chosen, setChosen] = useState(null);
  var [timeLeft, setTimeLeft] = useState(20);
  var [myAnswers, setMyAnswers] = useState([]);
  var [joinCode, setJoinCode] = useState("");
  var [joinErr, setJoinErr] = useState("");
  var [myCode, setMyCode] = useState("");
  var [roundCat, setRoundCat] = useState(null);
  var [pendingChallenges, setPendingChallenges] = useState([]);
  var timerRef = useRef(null);
  var pollRef = useRef(null);
  var [userSearch,setUserSearch]=useState('');

  useEffect(function(){
    if(!player) return;
    function pollAll(){
      sbGet('quiz_duels','player2_id=eq.'+player.id+'&status=eq.waiting&select=id,code,player1_name,created_at').then(function(d){
        if(Array.isArray(d)) setPendingChallenges(d);
      }).catch(function(){});
      if(gameId){
        sbSingle('quiz_duels','id=eq.'+gameId).then(function(d){ if(d) setGameData(d); }).catch(function(){});
      }
    }
    pollAll();
    pollRef.current = setInterval(pollAll, 3000);
    return function(){ clearInterval(pollRef.current); };
  },[player, gameId]);

  useEffect(function(){
    if(!gameData||!gameId) return;
    var isP1 = gameData.player1_id === player.id;
    var myTurn = (isP1 && gameData.whose_turn==='p1')||((!isP1)&&gameData.whose_turn==='p2');
    if(phase==='waiting'&&myTurn) setPhase('readyToPlay');
    if(gameData.status==='finished'&&phase!=='finalResult') setPhase('finalResult');
  },[gameData]);

  function challengeUser(targetUser){
    var chapSrc = selectedKapitel.length>0 ? chapters.filter(function(c){ return selectedKapitel.indexOf(c.id)>=0 || selectedKapitel.indexOf(c.parent_id)>=0; }) : chapters;
    var generated = makeAllRounds(chapSrc);
    var code = Math.random().toString(36).slice(2,8).toUpperCase();
    sbPost('quiz_duels',{code:code, player1_id:player.id, player1_name:player.name,
      player2_id:targetUser.id, player2_name:targetUser.name,
      rounds:JSON.stringify(generated),
      round_wins_p1:JSON.stringify([]), round_wins_p2:JSON.stringify([]),
      current_round:0, whose_turn:'p2', status:'waiting',
    }).then(function(res){
      if(res&&!res._err){
        sbSingle('quiz_duels','code=eq.'+code).then(function(d){
          if(d){ setGameId(d.id); setRounds(generated); setMyCode(code); setPhase('waitingForChallengee'); }
        });
      }
    });
  }

  function createOpenGame(){
    var chapSrc = selectedKapitel.length>0 ? chapters.filter(function(c){ return selectedKapitel.indexOf(c.id)>=0 || selectedKapitel.indexOf(c.parent_id)>=0; }) : chapters;
    var generated = makeAllRounds(chapSrc);
    var code = Math.random().toString(36).slice(2,8).toUpperCase();
    sbPost('quiz_duels',{code:code, player1_id:player.id, player1_name:player.name,
      rounds:JSON.stringify(generated),
      round_wins_p1:JSON.stringify([]), round_wins_p2:JSON.stringify([]),
      current_round:0, whose_turn:'p2', status:'waiting',
    }).then(function(res){
      if(res&&!res._err){
        sbSingle('quiz_duels','code=eq.'+code).then(function(d){
          if(d){ setGameId(d.id); setRounds(generated); setMyCode(code); setPhase('invite'); }
        });
      }
    });
  }

  function joinByCode(){
    var code = joinCode.trim().toUpperCase();
    if(!code){ setJoinErr('Code eingeben'); return; }
    sbSingle('quiz_duels','code=eq.'+code+'&status=eq.waiting').then(function(d){
      if(!d){ setJoinErr('Spiel nicht gefunden'); return; }
      var parsedRounds = JSON.parse(d.rounds||'[]');
      sbPatch('quiz_duels',{player2_id:player.id, player2_name:player.name, status:'active'},'id=eq.'+d.id).then(function(){
        setRounds(parsedRounds); setGameId(d.id);
        setGameData(Object.assign({},d,{player2_id:player.id,player2_name:player.name,status:'active'}));
        setCurrentRoundIdx(0); setPhase('readyToPlay');
      });
    });
  }

  function acceptChallenge(challenge){
    sbSingle('quiz_duels','id=eq.'+challenge.id).then(function(d){
      if(!d) return;
      var parsedRounds = JSON.parse(d.rounds||'[]');
      sbPatch('quiz_duels',{status:'active'},'id=eq.'+d.id).then(function(){
        setRounds(parsedRounds); setGameId(d.id);
        setGameData(Object.assign({},d,{status:'active'}));
        setCurrentRoundIdx(0); setPhase('readyToPlay');
      });
    });
  }

  function startMyTurn(){
    setQIdx(0); setMyAnswers([]); setChosen(null); setTimeLeft(20);
    if(allCategories&&allCategories.length>0) setPhase('catpick');
    else setPhase('playing');
  }
  function startWithCat(catId){ setRoundCat(catId); setPhase('playing'); }

  function handleDuelAnswer(word){
    clearInterval(timerRef.current);
    if(chosen) return;
    setChosen(word||'__none__');
    var correct = word && currentRoundArr && word===currentRoundArr[qIdx]&&currentRoundArr[qIdx].correct&&word===currentRoundArr[qIdx].correct.word;
    if(currentRoundArr&&currentRoundArr[qIdx]) correct = word===currentRoundArr[qIdx].correct.word;
    var newAnswers = myAnswers.concat([{word:word,correct:!!correct}]);
    setMyAnswers(newAnswers);
    setTimeout(function(){
      if(!currentRoundArr||qIdx+1>=currentRoundArr.length){
        var roundCorrect = newAnswers.filter(function(a){return a.correct;}).length;
        var isP1 = gameData&&gameData.player1_id===player.id;
        var existingWins = JSON.parse((isP1?gameData.round_wins_p1:gameData.round_wins_p2)||'[]');
        var newWins = existingWins.concat([roundCorrect]);
        var otherWins = JSON.parse((isP1?gameData.round_wins_p2:gameData.round_wins_p1)||'[]');
        var update = {};
        if(isP1){ update.round_wins_p1 = JSON.stringify(newWins); update.whose_turn = 'p2'; }
        else { update.round_wins_p2 = JSON.stringify(newWins); update.whose_turn = 'p1'; }
        if(newWins.length>=6&&otherWins.length>=6) update.status='finished';
        sbPatch('quiz_duels',update,'id=eq.'+gameId).then(function(){
          setGameData(function(prev){return Object.assign({},prev,update);});
          setPhase('roundResult');
        });
      } else {
        setQIdx(function(i){return i+1;}); setChosen(null); setTimeLeft(20);
      }
    },1200);
  }

  useEffect(function(){
    if(phase!=='playing'||chosen) return;
    clearInterval(timerRef.current); setTimeLeft(20);
    timerRef.current = setInterval(function(){

function T2LetterField({ word, onCorrect, onWrong }) {
  var wordNoSpaces=word.replace(/ /g,'');
  var initLetters=useMemo(function(){
    var real=word.split('').filter(function(l){return l!==' ';}).map(function(l,i){return{l:l,id:'t2_'+i,dummy:false};});
    return shuffleArr(real);
  },[word]);
  var [tiles, setTiles] = useState(initLetters);
  var [answer, setAnswer] = useState([]);
  var [checked, setChecked] = useState(false);
  var [correct, setCorrect] = useState(false);
  var complete=answer.length===wordNoSpaces.length;
  function addLetter(tile){
    if(checked) return;
    setAnswer(function(a){ return a.concat([tile]); });
    setTiles(function(t){ return t.filter(function(x){ return x.id!==tile.id; }); });
  }
  function removeLast(){
    if(checked||answer.length===0) return;
    var last=answer[answer.length-1];
    setAnswer(function(a){ return a.slice(0,-1); });
    setTiles(function(t){ return t.concat([last]); });
  }
  function check(){
    var typed=answer.map(function(t){return t.l;}).join('');
    var ok=typed.toLowerCase()===wordNoSpaces.toLowerCase();
    setChecked(true); setCorrect(ok);
    setTimeout(function(){ if(ok) onCorrect(); else onWrong(typed); }, ok?600:0);
  }
  function reset(){ setTiles(shuffleArr(initLetters)); setAnswer([]); setChecked(false); setCorrect(false); }
  var displayWord = word;
  var answerDisplay = (function(){
    var res=[]; var ai=0;
    for(var ci=0;ci<displayWord.length;ci++){
      if(displayWord[ci]===' '){ res.push({l:' ',isSpace:true}); }
      else { res.push({l:answer[ai]?answer[ai].l:'',isSpace:false}); ai++; }
    }
    return res;
  })();
  var slotsDisplay = (function(){
    var res=[]; var ai=0;
    for(var ci=0;ci<word.length;ci++){
      if(word[ci]===' '){ res.push({isSpace:true}); }
      else { res.push({isSpace:false,idx:ai}); ai++; }
    }
    return res;
  })();
  var tileBg=checked?(correct?'#d1fae5':'#fee2e2'):'white';
  var tileCol=checked?(correct?'#065f46':'#991b1b'):G900;
  return(
    <div>
      <div style={{display:'flex',flexWrap:'wrap',gap:4,justifyContent:'center',minHeight:44,padding:'8px',background:G50,borderRadius:10,marginBottom:8,border:'2px solid '+(checked?(correct?GR:RE):G200)}}>
        {checked
          ? answerDisplay.map(function(item,i){
              if(item.isSpace) return <span key={'sp'+i} style={{width:12}}/>;
              return <div key={i} style={{width:32,height:36,borderRadius:8,background:tileBg,border:'2px solid '+(correct?GR:RE),display:'flex',alignItems:'center',justifyContent:'center',fontWeight:'bold',fontSize:16,color:tileCol}}>{item.l}</div>;
            })
          : slotsDisplay.map(function(item,i){
            if(item.isSpace) return <span key={'sp'+i} style={{width:12,display:'inline-block'}}/>;
            var filled = answer[item.idx];
            return <div key={i} onClick={filled?function(){removeLast()}:undefined}
              style={{width:32,height:36,borderRadius:8,background:filled?'white':G50,
                border:'2px solid '+(filled?T:G200),display:'flex',alignItems:'center',
                justifyContent:'center',fontWeight:'bold',fontSize:16,
                color:filled?T:G400,cursor:filled?'pointer':'default'}}>
              {filled?filled.l:'–'}
            </div>;
          })
        }
        
      </div>
      {!checked&&(
        <div style={{display:'flex',flexWrap:'wrap',gap:5,justifyContent:'center',marginBottom:10}}>
          {tiles.map(function(t){ return <button key={t.id} onClick={function(){addLetter(t);}} style={{width:36,height:40,borderRadius:8,background:'white',border:'2px solid '+G200,fontWeight:'bold',fontSize:17,color:G900,cursor:'pointer',touchAction:'manipulation'}}>{t.l}</button>; })}
        </div>
      )}
      <div style={{display:'flex',gap:6,justifyContent:'center'}}>
        {!checked&&<button onClick={removeLast} disabled={answer.length===0} style={BtnStyle(G100,G600,{padding:'8px 14px',opacity:answer.length===0?0.4:1})}>← Zurück</button>}
        {!checked&&<button onClick={check} disabled={!complete} style={BtnStyle(T,'white',{padding:'8px 20px',opacity:complete?1:0.4})}>✓ Prüfen</button>}
        {checked&&correct&&<div style={{color:GR,fontWeight:'bold',fontSize:13,padding:'6px'}}>✓ Richtig!</div>}{checked&&!correct&&<div style={{color:RE,fontWeight:'bold',fontSize:13,padding:'6px'}}>✗ Falsch — kommt wieder</div>}
        {checked&&correct&&<div style={{color:GR,fontWeight:'bold',fontSize:14,padding:'8px'}}>✓ Richtig! Weiter…</div>}
      </div>
    </div>
  );
}

function GradeDisplay({ grade, pct }) {
  var gradeBg={A:GR,B:'#3b82f6',C:AM,D:'#f97316',F:RE};
  var bg=gradeBg[grade]||G400;
  return(
    <div style={{display:'inline-flex',flexDirection:'column',alignItems:'center',gap:4,padding:'12px 20px',borderRadius:16,background:bg+'18',border:'2px solid '+bg}}>
      <div style={{fontSize:40,fontWeight:'bold',color:bg}}>{grade}</div>
      <div style={{fontSize:13,color:G600}}>{pct}%</div>
    </div>
  );
}

function CelebrationPopup({ msg, onClose }) {
  return(
    <div style={{position:'fixed',inset:0,zIndex:1000,display:'flex',alignItems:'center',justifyContent:'center',background:'rgba(0,0,0,0.4)'}} onClick={onClose}>
      <div style={{background:'white',borderRadius:24,padding:'40px 32px',textAlign:'center',maxWidth:300,margin:16,boxShadow:'0 20px 60px rgba(0,0,0,0.3)'}}>
        <div style={{fontSize:60,marginBottom:12}}>🎉</div>
        <div style={{fontSize:20,fontWeight:'bold',color:T,marginBottom:8}}>{msg||'Super gemacht!'}</div>
        <button onClick={onClose} style={BtnStyle(T,'white',{marginTop:12,width:'100%',padding:'12px'})}>Weiter</button>
      </div>
    </div>
  );
}

function LeitersSpielSession({ run, player, chapters, onDone, onUpdateScore, streak: streakProp, setPlayer }) {
  var streak = streakProp || DEFAULT_STREAK;
  var [data, setData] = useState(null);
  var [dataLoading, setDataLoading] = useState(true);
  var [phase, setPhase] = useState('pick');
  var [current, setCurrent] = useState(null);
  var [input, setInput] = useState('');
  var [result, setResult] = useState(null);
  var [streakCount, setStreakCount] = useState(0);
  var [celebration, setCelebration] = useState(null);
  var [sessionLog, setSessionLog] = useState([]);
  var [quizOptions, setQuizOptions] = useState([]);
  var [quizChosen, setQuizChosen] = useState(null);
  var inputRef = useRef();

  useEffect(function(){
    if(!player||!run) return;
    var runWords=[]; try{runWords=typeof run.words==='string'?JSON.parse(run.words||'[]'):(run.words||[]);}catch(e){}
    var runSents=[]; try{runSents=typeof run.sentences==='string'?JSON.parse(run.sentences||'[]'):(run.sentences||[]);}catch(e){}
    lsGetProgress(player.id, run.id).then(function(rows){
      if(Array.isArray(rows)&&rows.length>0){
        var row=rows[0];
        var d={}; try{d=JSON.parse(row.data||'{}');}catch(e){}
        if(!d.pots) d=lsInitProgress(runWords, runSents);
        setData(d);
      } else {
        setData(lsInitProgress(runWords, runSents));
      }
      setDataLoading(false);
    }).catch(function(){
      setData(lsInitProgress(runWords, runSents));
      setDataLoading(false);
    });
  },[]);

  useEffect(function(){ if(inputRef.current && (phase==='answer'||phase==='dashes')) inputRef.current.focus(); },[phase]);

  function saveAndUpdate(newData){
    lsSaveProgress(player.id, run.id, newData);
    setData(newData);
  }

  function pickWord(){
    var w = lsPickWord(data, current ? current.word : null);
    if(!w){ setPhase('done'); return; }
    setCurrent(w); setInput(''); setResult(null);
    if(w.pot===1){
      var allWords=[];
      [1,2,3,4,5,6].forEach(function(pot){(data.pots[pot]||[]).forEach(function(ww){allWords.push(ww);});});
      var wType=getWordType(w);
      var sameType=allWords.filter(function(ww){return normWordKey(ww.word)!==normWordKey(w.word)&&getWordType(ww)===wType;});
      var quizPool=sameType.length>=3?sameType:allWords.filter(function(ww){return normWordKey(ww.word)!==normWordKey(w.word);});
      var others=shuffleArr(quizPool).slice(0,3);
      setQuizOptions(shuffleArr([{word:w.word,clue:w.clue}].concat(others.map(function(d){return {word:d.word,clue:d.clue};}))));
      setQuizChosen(null); setPhase('quiz');
    } else if(w.pot===2){
      setPhase('t2');
    } else if(w.pot===3){
      setPhase('dashes');
    } else {
      setPhase('answer');
    }
  }

  function submitDispute(type){
    if(!current||!player) return;
    var UUID=/^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/i;
    if(!UUID.test(player.id)||!UUID.test(run.id)) return;
    var payload={player_id:player.id,player_name:player.name,run_id:run.id,
      word:current.word,clue:current.clue,typed_answer:result?result.typed:'',
      pot:current.pot,chapter_id:'',status:'open',dispute_type:type,
      created_at:new Date().toISOString()};
    sbPost('word_disputes',payload).then(function(res){
      if(!res||res._err) return;
      if(type==='unimportant') alert('✅ Meldung gesendet. Admin prüft die Anfrage.');
      else alert('✅ Anfrage gesendet. Admin prüft deine Antwort.');
    }).catch(function(){});
  }

  function handleQuizAnswer(opt){
    if(quizChosen) return;
    setQuizChosen(opt);
    var correct=normWordKey(opt.word)===normWordKey(current.word);
    var newData=JSON.parse(JSON.stringify(data));
    var reqStreak=((streak.upThresholds||DEFAULT_STREAK.upThresholds)[1])||2;
    var potArr=(newData.pots[1]||[]);
    var wIdx=potArr.findIndex(function(w){return normWordKey(w.word)===normWordKey(current.word);});
    if(wIdx<0)wIdx=potArr.findIndex(function(w){return w.word===current.word;});
    var wObj=wIdx>=0?potArr.splice(wIdx,1)[0]:{word:current.word,clue:current.clue,streak:0};
    var newStreak=correct?(wObj.streak||0)+1:0;
    var moveTo=1;
    if(correct&&newStreak>=reqStreak){moveTo=2;newStreak=0;}
    wObj.streak=newStreak; wObj.correct=(wObj.correct||0)+(correct?1:0); wObj.wrong=(wObj.wrong||0)+(!correct?1:0);
    if(!newData.pots[moveTo])newData.pots[moveTo]=[];
    newData.pots[moveTo].push(wObj);
    if(correct)newData.totalCorrect=(newData.totalCorrect||0)+1;
    else newData.totalWrong=(newData.totalWrong||0)+1;
    saveAndUpdate(newData);
    var pts=correct?5:0;
    if(pts>0&&onUpdateScore)onUpdateScore(pts);
    if(pts>0&&setPlayer)setPlayer(function(p){return Object.assign({},p,{total_score:(p.total_score||0)+pts});});
    var log={word:current.word,clue:current.clue,typed:opt.word,correct:correct,partial:false,fromPot:1,toPot:moveTo,pts:pts};
    setSessionLog(function(l){return l.concat([log]);});
    if(correct&&moveTo===6)setCelebration('🏆 "'+current.word+'" gelernt!');
    setTimeout(function(){
      setResult({correct:correct,word:current.word,clue:current.clue,answer:current.word,typed:opt.word,fromPot:1,toPot:moveTo,pts:pts,newStreak:newStreak,reqStreak:reqStreak});
      setPhase('showResult');
    }, correct?800:1500);
  }

  function submitAnswer(){
    if(!current) return;
    var typed = input.trim();
    var fromPot = current.pot;
    var isPot5 = fromPot === 5;
    var correctAnswer = isPot5 ? current.clue : wordDisplay(current);
    var status = checkAnswer(typed, correctAnswer);
    var correct = status==='correct'||status==='partial';
    var newData = JSON.parse(JSON.stringify(data));
    var reqStreak = ((streak.upThresholds||DEFAULT_STREAK.upThresholds)[fromPot])||2;
    var potArr = (newData.pots[fromPot]||[]);
    var wIdx = potArr.findIndex(function(w){ return normWordKey(w.word)===normWordKey(current.word); });
    if(wIdx<0) wIdx = potArr.findIndex(function(w){ return w.word===current.word; });
    var wObj = wIdx>=0 ? potArr[wIdx] : {word:current.word,clue:current.clue,streak:0};
    if(wIdx>=0) potArr.splice(wIdx,1);
    var newStreak = correct ? (wObj.streak||0)+1 : 0;
    var moveTo = fromPot;
    if(correct && newStreak>=reqStreak){
      moveTo = fromPot<(streak.pots||6) ? fromPot+1 : fromPot;
      newStreak = 0;
    } else if(!correct && fromPot>1){
      moveTo = fromPot-1; newStreak=0;
    }
    wObj.streak = newStreak;
    wObj.correct = (wObj.correct||0) + (correct?1:0);
    wObj.wrong = (wObj.wrong||0) + (!correct?1:0);
    if(!(newData.pots[moveTo])) newData.pots[moveTo]=[];
    newData.pots[moveTo].push(wObj);
    if(correct) newData.totalCorrect=(newData.totalCorrect||0)+1;
    else newData.totalWrong=(newData.totalWrong||0)+1;
    saveAndUpdate(newData);

    var pts = correct ? (fromPot*5+(status==='partial'?1:0)) : 0;
    if(pts>0 && onUpdateScore) onUpdateScore(pts);
    if(pts>0 && setPlayer) setPlayer(function(p){ return Object.assign({},p,{total_score:(p.total_score||0)+pts}); });

    var newSc = correct ? streakCount+1 : 0;
    setStreakCount(newSc);
    var log = {word:current.word,clue:current.clue,typed:typed,correct:correct,partial:status==='partial',fromPot:fromPot,toPot:moveTo,pts:pts};
    setSessionLog(function(l){return l.concat([log]);});
    setResult({correct:correct,partial:status==='partial',answer:correctAnswer,word:current.word,clue:current.clue,typed:typed,fromPot:fromPot,toPot:moveTo,pts:pts,newStreak:newStreak,reqStreak:reqStreak});
    setPhase('showResult');
    if(correct && moveTo===6 && fromPot!==6) setCelebration('🏆 "'+current.word+'" gelernt!');
  }

  function nextWord(){
    setResult(null); setCelebration(null);
    var allDone = (data.pots[6]||[]).length >= Object.values(data.pots).reduce(function(s,a){return s+a.length;},0);
    if(allDone){ setPhase('done'); return; }
    pickWord();
  }

  if(dataLoading||!data) return <div style={{textAlign:'center',padding:40,color:G400}}>Lade Fortschritt…</div>;

  if(phase==='pick'){
    var pct = lsPercent(data);
    var grade = lsGrade(data);
    var totalWords = Object.values(data.pots).reduce(function(s,a){return s+a.length;},0);
    var learned = (data.pots[6]||[]).length;
    return(
      <div style={{padding:8}}>
        <div style={{background:'linear-gradient(135deg,'+T+','+TD+')',borderRadius:16,padding:20,color:'white',textAlign:'center',marginBottom:12}}>
          <div style={{fontSize:32,marginBottom:6}}>{run.icon||'🎯'} {run.name}</div>
          <div style={{display:'flex',gap:16,justifyContent:'center',marginBottom:10}}>
            <div><div style={{fontSize:24,fontWeight:'bold'}}>{pct}%</div><div style={{fontSize:10,opacity:.8}}>Fortschritt</div></div>
            <div><div style={{fontSize:24,fontWeight:'bold'}}>{learned}/{totalWords}</div><div style={{fontSize:10,opacity:.8}}>Gelernt</div></div>
            <div><div style={{fontSize:24,fontWeight:'bold'}}>{grade}</div><div style={{fontSize:10,opacity:.8}}>Note</div></div>
          </div>
          <div style={{height:6,background:'rgba(255,255,255,.3)',borderRadius:3,overflow:'hidden'}}>
            <div style={{height:'100%',width:pct+'%',background:'white',borderRadius:3}}/>
          </div>
        </div>
        <div style={{display:'flex',gap:6,marginBottom:12,flexWrap:'wrap',justifyContent:'center'}}>
          {[1,2,3,4,5].map(function(p){
            var cnt=(data.pots[p]||[]).length;
            return <div key={p} style={{textAlign:'center',padding:'8px 10px',borderRadius:10,background:POT_COL[p]+'18',border:'2px solid '+POT_COL[p]+'44',minWidth:52}}>
              <div style={{fontSize:18}}>{POT_ICON[p]}</div>
              <div style={{fontSize:17,fontWeight:'bold',color:POT_COL[p]}}>{cnt}</div>
              <div style={{fontSize:9,color:G400}}>{POT_LABEL[p]}</div>
            </div>;
          })}
        </div>
        <button onClick={pickWord} style={BtnStyle(T,'white',{width:'100%',padding:'14px',fontSize:16,marginBottom:8})}>▶ Lernen starten</button>
        <button onClick={onDone} style={BtnStyle(G100,G600,{width:'100%',padding:'10px',fontSize:13})}>← Zurück</button>
      </div>
    );
  }

  if(phase==='quiz'){
    return(
      <div style={{padding:8}}>
        {celebration&&<CelebrationPopup msg={celebration} onClose={function(){setCelebration(null);nextWord();}}/>}
        <div style={{textAlign:'center',padding:'16px',background:G50,borderRadius:14,marginBottom:12,border:'2px solid '+G200}}>
          <div style={{fontSize:10,color:G400,marginBottom:4,textTransform:'uppercase',letterSpacing:1}}>Topf 1 — Welche Übersetzung ist richtig?</div>
          <div style={{fontSize:22,fontWeight:'bold',color:G900}}>{current&&current.clue}</div>
        </div>
        <div style={{display:'grid',gridTemplateColumns:'1fr 1fr',gap:8,marginBottom:12}}>
          {quizOptions.map(function(opt){
            var isCorrect=quizChosen&&normWordKey(opt.word)===normWordKey(current.word);
            var isChosen=quizChosen&&normWordKey(opt.word)===normWordKey(quizChosen.word);
            var bg=quizChosen?(isCorrect?'#d1fae5':isChosen&&!isCorrect?'#fee2e2':G50):'white';
            var border=quizChosen?(isCorrect?GR:isChosen&&!isCorrect?RE:G200):G200;
            return <button key={opt.word} onClick={function(){handleQuizAnswer(opt);}} disabled={!!quizChosen}
              style={{padding:'13px 16px',borderRadius:10,border:'2px solid '+border,background:bg,
                textAlign:'left',fontSize:15,fontWeight:'bold',color:G900,cursor:quizChosen?'default':'pointer',touchAction:'manipulation'}}>
              {opt.word}
            </button>;
          })}
        </div>
        <button onClick={function(){setResult({skipped:true,word:current?current.word:'',clue:current?current.clue:'',answer:current?current.word:'',fromPot:1,toPot:1,pts:0});setPhase('showResult');}}
          style={BtnStyle(G100,G600,{width:'100%',padding:'8px',fontSize:12})}>Überspringen / Nicht gewusst</button>
      </div>
    );
  }

  if(phase==='t2'){
    return(
      <div style={{padding:8}}>
        <div style={{textAlign:'center',padding:'18px 16px',background:'#eff6ff',borderRadius:14,marginBottom:12,border:'2px solid #93c5fd'}}>
          <div style={{fontSize:10,color:G400,marginBottom:6,textTransform:'uppercase',letterSpacing:1}}>Topf 2 — Buchstaben sortieren</div>
          <div style={{fontSize:11,color:G600,marginBottom:6}}>Bedeutung: <strong>{current&&current.clue}</strong></div>
          <div style={{fontSize:10,color:G400}}>Tippe die Buchstaben in der richtigen Reihenfolge</div>
        </div>
        {current&&<T2LetterField word={wordDisplay(current)} onCorrect={function(){
          var newData=JSON.parse(JSON.stringify(data));
          var potArr=(newData.pots[2]||[]);
          var wIdx=potArr.findIndex(function(w){return normWordKey(w.word)===normWordKey(current.word);});
          if(wIdx<0) wIdx=potArr.findIndex(function(w){return w.word===current.word;});
          var wObj=wIdx>=0?potArr.splice(wIdx,1)[0]:{word:current.word,clue:current.clue,streak:0};
          var reqStreak=(streak.upThresholds&&streak.upThresholds[2])||2;
          wObj.streak=(wObj.streak||0)+1;
          wObj.correct=(wObj.correct||0)+1;
          var moveTo=2;
          if(wObj.streak>=reqStreak){moveTo=3;wObj.streak=0;}
          if(!newData.pots[moveTo])newData.pots[moveTo]=[];
          newData.pots[moveTo].push(wObj);
          newData.totalCorrect=(newData.totalCorrect||0)+1;
          saveAndUpdate(newData);
          var pts=10;
          if(onUpdateScore)onUpdateScore(pts);
          if(setPlayer)setPlayer(function(p){return Object.assign({},p,{total_score:(p.total_score||0)+pts});});
          if(moveTo===6)setCelebration('🏆 "'+current.word+'" gelernt!');
          setResult({correct:true,partial:false,answer:current.word,word:current.word,clue:current.clue,typed:current.word,fromPot:2,toPot:moveTo,pts:pts,newStreak:wObj.streak,reqStreak:reqStreak});
          setPhase('showResult');
        }} onWrong={function(typed){
          var newData=JSON.parse(JSON.stringify(data));
          var potArr=(newData.pots[2]||[]);
          var wIdx=potArr.findIndex(function(w){return normWordKey(w.word)===normWordKey(current.word);});
          if(wIdx<0) wIdx=potArr.findIndex(function(w){return w.word===current.word;});
          var wObj=wIdx>=0?potArr.splice(wIdx,1)[0]:{word:current.word,clue:current.clue,streak:0};
          wObj.streak=0;
          wObj.wrong=(wObj.wrong||0)+1;
          if(!newData.pots[1])newData.pots[1]=[];
          newData.pots[1].push(wObj);
          newData.totalWrong=(newData.totalWrong||0)+1;
          saveAndUpdate(newData);
          setResult({correct:false,partial:false,answer:current.word,word:current.word,clue:current.clue,typed:typed,fromPot:2,toPot:1,pts:0});
          setPhase('showResult');
        }}/>}
        <button onClick={function(){setResult({skipped:true,answer:current?current.word:'',word:current?current.word:'',clue:current?current.clue:'',fromPot:2,toPot:2,pts:0});setPhase('showResult');}} style={BtnStyle(G100,G600,{width:'100%',padding:'8px',marginTop:10,fontSize:12})}>Überspringen</button>
      </div>
    );
  }

  if(phase==='dashes'){
    var dashWord = wordDisplay(current).replace(/ /g,'');
    return(
      <div style={{padding:8}}>
        {celebration&&<CelebrationPopup msg={celebration} onClose={function(){setCelebration(null);nextWord();}}/>}
        <div style={{textAlign:'center',padding:'18px 16px',background:'#f0fdf4',borderRadius:14,marginBottom:12,border:'2px solid #86efac'}}>
          <div style={{fontSize:10,color:G400,marginBottom:4,textTransform:'uppercase',letterSpacing:1}}>Topf 3 — Wie heißt das auf Englisch?</div>
          <div style={{fontSize:22,fontWeight:'bold',color:G900,marginBottom:10}}>{current&&current.clue}</div>
          <div style={{display:'flex',gap:4,justifyContent:'center',flexWrap:'wrap'}}>
            {dashWord.split('').map(function(_,i){
              var letter = input[i]||'';
              return <div key={i} style={{width:24,textAlign:'center',display:'flex',flexDirection:'column',alignItems:'center',gap:2}}>
                <span style={{fontSize:16,fontWeight:'bold',color:T,minHeight:22,lineHeight:'22px'}}>{letter}</span>
                <div style={{width:24,height:3,background:letter?T:G400,borderRadius:1}}/>
              </div>;
            })}
          </div>
          <div style={{fontSize:11,color:G400,marginTop:6}}>{dashWord.length} Buchstaben</div>
        </div>
        <div style={{display:'flex',gap:8,marginBottom:8}}>
          <input ref={inputRef} value={input} onChange={function(e){setInput(e.target.value);}}
            onKeyDown={function(e){if(e.key==='Enter')submitAnswer();}}
            autoCapitalize='none' autoCorrect='off' autoComplete='off' spellCheck='false'
            placeholder={'Englisch ('+dashWord.length+' Buchstaben)…'}
            style={{flex:1,padding:'12px 14px',fontSize:16,border:'2px solid '+T,borderRadius:10,outline:'none'}}/>
          <button onClick={submitAnswer} style={BtnStyle(T,'white',{padding:'12px 16px',fontSize:15})}>✓</button>
        </div>
        <button onClick={function(){setResult({skipped:true,answer:current?current.word:'',word:current?current.word:'',clue:current?current.clue:'',fromPot:3,toPot:3,pts:0});setPhase('showResult');}} style={BtnStyle(G100,G600,{width:'100%',padding:'8px',fontSize:12})}>Überspringen / Nicht gewusst</button>
      </div>
    );
  }

  if(phase==='showResult'||phase==='answer'){
    if(phase==='answer') return(
      <div style={{padding:8}}>
        {celebration&&<CelebrationPopup msg={celebration} onClose={function(){setCelebration(null);nextWord();}}/>}
        <div style={{textAlign:'center',padding:'18px 16px',background:G50,borderRadius:14,marginBottom:12,border:'2px solid '+G200}}>

    setSelectedWords(function(prev){

            var open=openCh===ch.id;

                  </div>;

            </div>;

      })}
      {msg&&<div style={{padding:'8px 12px',borderRadius:8,background:msg.startsWith('✓')?'#d1fae5':'#fee2e2',color:msg.startsWith('✓')?T:RE,marginBottom:8,fontSize:12}}>{msg}</div>}
      <button onClick={save} disabled={saving} style={BtnStyle(T,'white',{width:'100%',padding:'12px',marginTop:8})}>{saving?'Speichern…':'💾 Run speichern'}</button>
    </div>
  );

  },[chapters]);
  var [openCh, setOpenCh] = useState(null);
  function isInRun(word){ return words.findIndex(function(w){return normWordKey(w.word)===normWordKey(word.word);})>=0; }
  function toggle(wObj){
    setWords(function(prev){
      if(isInRun(wObj)) return prev.filter(function(w){return normWordKey(w.word)!==normWordKey(wObj.word);});
      var existing=prev.find(function(w){return normWordKey(w.word)===normWordKey(wObj.word);});
      return prev.concat([{word:wObj.word,clue:wObj.clue,pot:existing?existing.pot:1}]);
    });
  }
  function toggleChapter(ch){
    var allIn=safeWords(ch.words).every(function(w){return isInRun(w);});
    if(allIn){ setWords(function(prev){return prev.filter(function(w){return !safeWords(ch.words).some(function(cw){return normWordKey(cw.word)===normWordKey(w.word);});}); }); }
    else { var toAdd=safeWords(ch.words).filter(function(w){return !isInRun(w);}).map(function(w){return{word:w.word,clue:w.clue,pot:1};}); setWords(function(prev){return prev.concat(toAdd);}); }
  }
  function setPot(wordStr, pot){
    setWords(function(prev){ return prev.map(function(w){ return normWordKey(w.word)===normWordKey(wordStr)?Object.assign({},w,{pot:pot}):w; }); });
  }
  function getRunPot(wordStr){ var found=words.find(function(w){return normWordKey(w.word)===normWordKey(wordStr);}); return found?found.pot:1; }
  function removeWord(wordStr){ setWords(function(prev){return prev.filter(function(w){return normWordKey(w.word)!==normWordKey(wordStr);});}); }
  function addWord(wObj){ setWords(function(prev){return prev.concat([{word:wObj.word,clue:wObj.clue,pot:1}]);}); }
  function save(){
    setSaving(true);
    var wordsJson = JSON.stringify(words);
    sbPatch('ls_runs',{words:wordsJson,word_count:words.length,name:run.name},'id=eq.'+run.id)
      .then(function(){
        setSaving(false);
        onSave(Object.assign({},run,{words:words,word_count:words.length}));
      })
      .catch(function(){setSaving(false);});
  }
  var topLevel=chapters.filter(function(c){return !c.parent_id;}).slice().sort(naturalSort);
  return(
    <div style={{padding:8}}>
      <div style={{fontWeight:'bold',fontSize:14,color:G900,marginBottom:4}}>{run.icon} {run.name} bearbeiten</div>
      <div style={{padding:'8px 12px',background:TL,borderRadius:8,fontSize:13,color:T,fontWeight:'bold',marginBottom:10}}>{words.length} Vokabeln im Run</div>
      {topLevel.map(function(kap){
        var children=chapters.filter(function(c){return c.parent_id===kap.id;});
        return <div key={kap.id} style={{marginBottom:8,border:'1px solid '+G200,borderRadius:10,overflow:'hidden'}}>
          <div style={{padding:'8px 12px',background:G50,fontWeight:'bold',fontSize:12,color:kap.color||T}}>{kap.icon} {kap.title}</div>
          {children.map(function(ch){
            var allIn=safeWords(ch.words).every(function(w){return isInRun(w);});
            var someIn=!allIn&&safeWords(ch.words).some(function(w){return isInRun(w);});
            var open=openCh===ch.id;
            return <div key={ch.id} style={{borderTop:'1px solid '+G100}}>
              <div style={{display:'flex',alignItems:'center',gap:8,padding:'7px 12px',cursor:'pointer'}} onClick={function(){setOpenCh(open?null:ch.id);}}>
                <div onClick={function(e){e.stopPropagation();toggleChapter(ch);}} style={{width:18,height:18,borderRadius:4,border:'2px solid '+(allIn?ch.color:someIn?ch.color:G200),background:allIn?ch.color:'white',display:'flex',alignItems:'center',justifyContent:'center',cursor:'pointer',flexShrink:0}}>
                  {allIn&&<span style={{color:'white',fontSize:10}}>✓</span>}
                  {someIn&&<span style={{color:ch.color,fontSize:12}}>−</span>}
                </div>
                <span style={{fontSize:12,fontWeight:'bold',color:ch.color,flex:1}}>{ch.icon} {ch.title}</span>
                <span style={{fontSize:10,color:G400}}>{safeWords(ch.words).filter(function(w){return isInRun(w);}).length}/{safeWords(ch.words).length}</span>
                <span style={{fontSize:10,color:G400,marginLeft:4}}>{open?'▲':'▼'}</span>
              </div>
              {open&&<div style={{background:'#fafafa'}}>
                {safeWords(ch.words).map(function(w,i){
                  var inRun=isInRun(w);
                  var pot=inRun?getRunPot(w.word):null;
                  return <div key={i} style={{display:'flex',alignItems:'center',gap:8,
                    padding:'7px 12px 7px 28px',background:i%2===0?'white':G50,
                    borderBottom:'1px solid '+G100}}>
                    <input type='checkbox' checked={inRun}
                      onChange={function(){inRun?removeWord(w.word):addWord(w);}}
                      style={{width:15,height:15,cursor:'pointer',accentColor:T,flexShrink:0}}/>
                    <span style={{fontSize:12,color:AM,flexShrink:0}}>{w.important?'⭐':''}</span>
                    <span style={{flex:1,fontWeight:'bold',color:G900,fontSize:13}}>{w.word}</span>
                    <span style={{color:G400,fontSize:12,marginRight:6}}>{w.clue}</span>
                    {inRun&&<div style={{display:'flex',gap:3,flexShrink:0}}>
                      {[1,2,3,4,5,6].map(function(p){return <button key={p}
                        onClick={function(){setPot(w.word,p);}}
                        style={{width:18,height:18,borderRadius:4,border:'none',
                          background:pot===p?POT_COL[p]:G200,
                          color:pot===p?'white':G600,fontSize:9,cursor:'pointer',padding:0,fontWeight:'bold',touchAction:'manipulation'}}>{p}</button>;})}
                    </div>}
                  </div>;
                })}
              </div>}
            </div>;
          })}
        </div>;
      })}
      <div style={{display:'flex',gap:8,marginTop:10}}>
        <button onClick={save} disabled={saving} style={BtnStyle(T,'white',{flex:1,padding:'11px'})}>{saving?'…':'💾 Speichern'}</button>
        <button onClick={onCancel} style={BtnStyle(G100,G600,{flex:1,padding:'11px'})}>Abbrechen</button>
      </div>
    </div>
  );
}

function VocabSearch({ chapters, onWordClick }) {

    var w=[];
    chapters.filter(function(c){return c.parent_id;}).forEach(function(ch){
      (ch.words||[]).forEach(function(ww){ w.push(Object.assign({},ww,{chapId:ch.id,chapTitle:ch.title,chapColor:ch.color})); });
    });
    return w;
  },[chapters]);
  var results = useMemo(function(){
    if(!query.trim()) return [];

    return allWords.filter(function(w){ return (w.word||'').toLowerCase().includes(q)||(w.clue||'').toLowerCase().includes(q); }).slice(0,20);
  },[query,allWords]);
  return(
    <div>
      <input value={query} onChange={function(e){setQuery(e.target.value);}} placeholder="Vokabel suchen…"
        style={{width:'100%',padding:'10px 12px',fontSize:16,border:'2px solid '+T,borderRadius:10,outline:'none',boxSizing:'border-box',marginBottom:8}}/>
      {results.map(function(w,i){ return <div key={i} onClick={function(){if(onWordClick)onWordClick(w);}} style={{display:'flex',justifyContent:'space-between',alignItems:'center',padding:'7px 10px',marginBottom:3,borderRadius:8,background:'white',border:'1px solid '+G200,cursor:onWordClick?'pointer':'default'}}>
        <span style={{fontWeight:'bold',fontSize:13}}>{w.word}</span>
        <span style={{fontSize:11,color:G400}}>{w.clue}</span>
        <span style={{fontSize:10,color:w.chapColor,fontWeight:'bold'}}>{w.chapTitle}</span>
      </div>; })}
    </div>
  );
}

  var [preview, setPreview] = useState([]);
  var [mode, setMode] = useState('append');
  var [dupReport, setDupReport] = useState(null);
  useEffect(function(){
    if(!fileData) return;
    var lines=(fileData||'').split('\n').filter(function(l){return l.trim();});
    var parsed=lines.map(function(line){
      var parts=line.split(/\t|,/);
      return{word:(parts[0]||'').trim(),clue:(parts[1]||'').trim(),important:parts[2]?parts[2].trim()==='1':false};
    }).filter(function(r){return r.word&&r.clue;});
    setPreview(parsed);
  },[fileData]);
  useEffect(function(){
    if(!chapterId||!preview.length) return;
    var ch=chapters.find(function(c){return c.id===chapterId;});
    if(!ch) return;
    var existing=(ch.words||[]).map(function(w){return normWordKey(w.word);});
    var dups=preview.filter(function(p){return existing.indexOf(normWordKey(p.word))>=0;});
    setDupReport(dups.length>0?dups:null);
  },[chapterId,preview]);
  var childChapters=chapters.filter(function(c){return c.parent_id;});
  return(
    <div style={{padding:8}}>
      <div style={{marginBottom:10}}>
        <label style={{fontSize:12,color:G600,display:'block',marginBottom:4}}>Ziel-Kapitel:</label>
        <select value={chapterId} onChange={function(e){setChapterId(e.target.value);}}
          style={{width:'100%',padding:'8px',fontSize:14,border:'2px solid '+T,borderRadius:8,outline:'none'}}>
          {childChapters.map(function(c){return <option key={c.id} value={c.id}>{c.icon} {c.title}</option>;})}
        </select>
      </div>
      <div style={{marginBottom:10}}>
        <label style={{fontSize:12,color:G600,display:'block',marginBottom:4}}>Import-Modus:</label>
        <div style={{display:'flex',gap:6}}>
          {[['append','Ergänzen'],['replace','Ersetzen']].map(function(m){return <button key={m[0]} onClick={function(){setMode(m[0]);}} style={{flex:1,padding:'6px',borderRadius:6,border:'2px solid '+(mode===m[0]?T:G200),background:mode===m[0]?TL:'white',cursor:'pointer',fontSize:11,fontWeight:'bold',color:mode===m[0]?T:G600}}>{m[1]}</button>;})}
        </div>
      </div>
      {dupReport&&<div style={{padding:'8px 10px',background:'#fff7ed',border:'1px solid #fed7aa',borderRadius:8,marginBottom:8,fontSize:11,color:'#92400e'}}>⚠️ {dupReport.length} Duplikat(e): {dupReport.slice(0,3).map(function(d){return d.word;}).join(', ')}{dupReport.length>3?'…':''}</div>}
      <div style={{fontWeight:'bold',fontSize:12,color:G600,marginBottom:6}}>Vorschau ({preview.length} Einträge):</div>
      <div style={{maxHeight:180,overflowY:'auto',border:'1px solid '+G200,borderRadius:8,padding:'4px 8px',marginBottom:10}}>
        {preview.map(function(r,i){return <div key={i} style={{display:'flex',gap:8,padding:'3px 0',borderBottom:'1px solid '+G100,fontSize:11}}>
          {r.important&&<span>⭐</span>}<span style={{fontWeight:'bold'}}>{r.word}</span><span style={{color:G400}}>{r.clue}</span>
        </div>;})}
      </div>
      <div style={{display:'flex',gap:6}}>
        <button onClick={function(){onConfirm(chapterId,preview,mode);}} style={BtnStyle(T,'white',{flex:1,padding:'10px'})}>✓ Importieren</button>
        <button onClick={onCancel} style={BtnStyle(G100,G600,{flex:1,padding:'10px'})}>Abbrechen</button>
      </div>
    </div>
  );
}

function AdminDash({ player, chapters, setChapters, allUsers, setAllUsers, allCategories, setAllCategories, onDone }) {
  var [tab, setTab] = useState('chapters');
  var [saving, setSaving] = useState(false);
  var [msg, setMsg] = useState('');
  var [editCh, setEditCh] = useState(null);
  var [editWord, setEditWord] = useState(null);
  var [editChIdx, setEditChIdx] = useState(null);
  var [uploadData, setUploadData] = useState(null);
  var [showUpload, setShowUpload] = useState(false);
  var [newChForm, setNewChForm] = useState({title:'',color:T,icon:'📖',parent_id:'',sentences:[]});
  var [showNewCh, setShowNewCh] = useState(false);
  var [expandedCh, setExpandedCh] = useState({});
  var [showApiKey, setShowApiKey] = useState(false);
  var [dupWords, setDupWords] = useState(null);
  var [dupLoading, setDupLoading] = useState(false);
  var [showNewUser, setShowNewUser] = useState(false);
  var [newUserName, setNewUserName] = useState('');
  var [newUserPw, setNewUserPw] = useState('');
  var [newUserErr, setNewUserErr] = useState('');
  var [showDup, setShowDup] = useState(false);
  var fileRef = useRef();
  var imgRef = useRef();
  var [imgLoading, setImgLoading] = useState(false);
  var [imgMsg, setImgMsg] = useState('');
  var [imgDraft, setImgDraft] = useState(null);
  var [imgTargetCh, setImgTargetCh] = useState('');
  var [imgMode, setImgMode] = useState('existing');
  var UUID=/^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/i;

  function toggleCh(id){ setExpandedCh(function(prev){var n=Object.assign({},prev);n[id]=!n[id];return n;}); }

  function doSaveWord(chapterId, wordObj, wordIdx) {
    var ch = chapters.find(function(c){return c.id===chapterId;});
    if(!ch) return;
    var newWords = ch.words.slice();
    if(wordIdx!=null) newWords[wordIdx]=wordObj; else newWords=newWords.concat([wordObj]);
    saveChapterWords(ch, newWords, chapters, setChapters, setSaving, setMsg);
    setEditWord(null); setEditCh(null);
  }

  function deleteWord(chapterId, wordIdx) {
    if(!confirm('Wort löschen?')) return;
    var ch = chapters.find(function(c){return c.id===chapterId;});
    if(!ch) return;
    var newWords = safeWords(ch.words).filter(function(_,i){return i!==wordIdx;});
    saveChapterWords(ch, newWords, chapters, setChapters, setSaving, setMsg);
  }

  function saveChapter(form) {
    setSaving(true);
    var isNew = !form.id || !UUID.test(form.id);
    if(isNew){
      var body={title:form.title,color:form.color,icon:form.icon,parent_id:form.parent_id||null,words:form.words||[],sentences:form.sentences||[]};
      sbPost('chapters',body).then(function(res){
        if(res&&res.id){ setChapters(function(prev){return prev.concat([Object.assign({},body,{id:res.id})]);}) }
        setSaving(false); setMsg('✓ Gespeichert'); setShowNewCh(false); setEditCh(null);
      });
    } else {
      var upd={title:form.title,color:form.color,icon:form.icon};
      sbPatch('chapters',upd,'id=eq.'+form.id).then(function(){
        setChapters(function(prev){return prev.map(function(c){return c.id===form.id?Object.assign({},c,upd):c;});});
        setSaving(false); setMsg('✓ Gespeichert'); setEditCh(null);
      });
    }
  }

  function deleteChapter(ch) {
    if(!confirm('Kapitel und alle Vokabeln löschen?')) return;
    sbDel('chapters','id=eq.'+ch.id).then(function(){
      setChapters(function(prev){return prev.filter(function(c){return c.id!==ch.id;});});
    });
  }

  function handleFileUpload(e) {
    var file=e.target.files&&e.target.files[0];
    if(!file) return;
    var reader=new FileReader();
    reader.onload=function(ev){ setUploadData(ev.target.result); setShowUpload(true); };
    reader.readAsText(file);
  }

  function doImport(chapterId, words, mode) {
    var ch = chapters.find(function(c){return c.id===chapterId;});
    if(!ch) return;
    var base = mode==='replace'?[]:ch.words.slice();
    var existing = base.map(function(w){return normWordKey(w.word);});
    var toAdd = words.filter(function(w){return existing.indexOf(normWordKey(w.word))<0;});
    var newWords = base.concat(toAdd);
    saveChapterWords(ch, newWords, chapters, setChapters, setSaving, setMsg);
    setShowUpload(false);
  }

  function uploadImg(file) {
    if(!file) return;
    setImgLoading(true); setImgMsg('Bild wird analysiert…'); setImgDraft(null);
    var reader=new FileReader();
    reader.onload=function(){
      var b64=reader.result.split(',')[1];
      sbGet('settings','key=eq.anthropic_key').then(function(d){
        var key=(d&&d[0]&&d[0].value)||localStorage.getItem('claude_api_key')||'';
        if(!key){setImgMsg('Kein API-Key hinterlegt. Bitte unter 🔑 API-Key eintragen.');setImgLoading(false);return;}
        fetch('https://api.anthropic.com/v1/messages',{
          method:'POST',
          headers:{'Content-Type':'application/json','x-api-key':key,'anthropic-version':'2023-06-01','anthropic-dangerous-direct-browser-access':'true'},
          body:JSON.stringify({model:'claude-sonnet-4-20250514',max_tokens:4000,messages:[{role:'user',content:[
            {type:'image',source:{type:'base64',media_type:file.type,data:b64}},
            {type:'text',text:'Analysiere diese Schulbuch-Seite fuer einen Englisch-Vokabeltrainer.\n\nVokabeln sind zwischen horizontalen Trennlinien angeordnet. Ein Block ist eine Vokabel wenn er eine Lautschrift /.../ enthaelt.\n\nimportant:true wenn die englische Vokabel FETT gedruckt ist, sonst false.\n\nVerben immer mit "to": "to play", "to sing".\n\nAntworte NUR mit JSON, kein Markdown:\n{"words":[{"word":"to play","clue":"spielen","important":true,"type":"verb"},{"word":"birthday","clue":"Geburtstag","important":false,"type":"noun"}]}\n\nErlaubte Typen: "verb","noun","adjective","phrase","other"'}
          ]}]})
        }).then(function(r){return r.json();}).then(function(d){
          var txt=(d.content||[]).map(function(b){return b.text||'';}).join('').trim().replace(/```json|```/g,'').trim();
          var parsed=JSON.parse(txt);
          setImgDraft(parsed.words||[]);
          setImgMsg('✅ '+(parsed.words||[]).length+' Vokabeln erkannt');
          setImgLoading(false);
        }).catch(function(e){setImgMsg('Fehler: '+e.message);setImgLoading(false);});
      });
    };
    reader.readAsDataURL(file);
  }

  function doImportOcr(words) {
    if(!imgTargetCh){setImgMsg('Bitte Themenbereich auswählen');return;}
    var ch=chapters.find(function(c){return c.id===imgTargetCh;});
    if(!ch) return;
    var existing=safeWords(ch.words).map(function(w){return normWordKey(w.word);});
    var toAdd=words.filter(function(w){return existing.indexOf(normWordKey(w.word))<0;});
    saveChapterWords(ch,safeWords(ch.words).concat(toAdd),chapters,setChapters,setSaving,setMsg);
    setImgDraft(null); setImgMsg('✅ '+toAdd.length+' Vokabeln importiert');
  }

  function findDuplicates() {
    setDupLoading(true); setShowDup(true);
    var wordMap={};
    chapters.filter(function(c){return c.parent_id;}).forEach(function(ch){
      (ch.words||[]).forEach(function(w){
        var key=normWordKey(w.word);
        if(!wordMap[key]) wordMap[key]=[];
        wordMap[key].push({word:w.word,clue:w.clue,chapId:ch.id,chapTitle:ch.title,chapColor:ch.color});
      });
    });
    var dups=Object.values(wordMap).filter(function(v){return v.length>1;});
    setDupWords(dups); setDupLoading(false);
  }

  function mergeDup(key, keepIdx, entries) {
    var toRemove = entries.filter(function(_,i){return i!==keepIdx;});
    toRemove.forEach(function(entry){
      var ch=chapters.find(function(c){return c.id===entry.chapId;});
      if(!ch) return;
      var newWords=safeWords(ch.words).filter(function(w){return normWordKey(w.word)!==normWordKey(entry.word);});
      saveChapterWords(ch,newWords,chapters,setChapters,setSaving,setMsg);
    });
    setDupWords(function(prev){return prev?prev.filter(function(v){return normWordKey(v[0].word)!==key;}):prev;});
  }

  var topLevelChapters = chapters.filter(function(c){return !c.parent_id;}).slice().sort(naturalSort);
  var childChapters = chapters.filter(function(c){return c.parent_id;});

  if(showUpload) return <UploadPreview fileData={uploadData} chapters={chapters} onConfirm={doImport} onCancel={function(){setShowUpload(false);}}/>;

  if(showDup) return(
    <div style={{padding:8}}>
      <div style={{display:'flex',alignItems:'center',gap:8,marginBottom:12}}>
        <button onClick={function(){setShowDup(false);}} style={BtnStyle(G100,G600,{padding:'5px 10px',fontSize:11})}>← Zurück</button>
        <span style={{fontWeight:'bold',fontSize:14,color:G900}}>Duplikate</span>
      </div>
      {dupLoading&&<div style={{textAlign:'center',padding:30,color:G400}}>Suche…</div>}
      {!dupLoading&&dupWords&&dupWords.length===0&&<div style={{textAlign:'center',padding:30,color:GR,fontSize:14}}>✓ Keine Duplikate gefunden!</div>}
      {!dupLoading&&(dupWords||[]).map(function(entries,di){
        var key=normWordKey(entries[0].word);
        return <div key={di} style={{marginBottom:10,padding:'10px 12px',borderRadius:10,border:'1px solid '+AM+'66',background:'#fffbeb'}}>
          <div style={{fontWeight:'bold',fontSize:13,color:AM,marginBottom:6}}>"{entries[0].word}" ({entries.length}x)</div>
          {entries.map(function(entry,ei){
            return <div key={ei} style={{display:'flex',alignItems:'center',gap:6,padding:'4px 0',borderBottom:'1px solid '+G100}}>
              <span style={{fontSize:11,color:entry.chapColor,fontWeight:'bold',flex:1}}>{entry.chapTitle}</span>
              <span style={{fontSize:11,color:G400}}>{entry.clue}</span>
              <button onClick={function(){mergeDup(key,ei,entries);}} style={{padding:'3px 8px',borderRadius:6,border:'none',background:T,color:'white',cursor:'pointer',fontSize:10,flexShrink:0}}>✓ Behalten</button>
            </div>;
          })}
        </div>;
      })}
    </div>
  );

  return(
    <div>
      <div style={{display:'flex',gap:3,marginBottom:12,overflowX:'auto',paddingBottom:2}}>
        {[['chapters','📚 Kap.'],['words','📝 Vok.'],['leiterspiel','🎯 LS'],['users','👥 User'],['grammar','✏️ Gram.']].map(function(t){
          return <button key={t[0]} onClick={function(){setTab(t[0]);}} style={{padding:'7px 10px',borderRadius:8,border:'none',background:tab===t[0]?T:G100,color:tab===t[0]?'white':G600,fontWeight:'bold',fontSize:11,cursor:'pointer',whiteSpace:'nowrap',flexShrink:0}}>{t[1]}</button>;
        })}
      </div>
      {msg&&<div style={{padding:'6px 10px',background:'#d1fae5',borderRadius:7,fontSize:11,color:T,marginBottom:8}}>{msg}</div>}

      {tab==='chapters'&&(<div>
        <div style={{marginBottom:14,padding:12,background:G50,borderRadius:12,border:'2px dashed '+G200}}>
          <div style={{fontWeight:'bold',fontSize:13,color:T,marginBottom:8}}>📷 Schulbuch-Seite per Bild importieren</div>
          <div style={{display:'flex',gap:6,marginBottom:8,flexWrap:'wrap'}}>
            <select value={imgTargetCh} onChange={function(e){setImgTargetCh(e.target.value);}}
              style={{flex:1,minWidth:0,padding:'7px 8px',fontSize:13,border:'1.5px solid '+T,borderRadius:8,outline:'none',background:'white'}}>
              <option value=''>-- Themenbereich auswählen --</option>
              {childChapters.map(function(c){
                var par=topLevelChapters.find(function(p){return p.id===c.parent_id;});
                return <option key={c.id} value={c.id}>{par?par.icon+' '+par.title+' > ':''}{c.icon} {c.title}</option>;
              })}
            </select>
            <input ref={imgRef} type='file' accept='image/*' style={{display:'none'}} onChange={function(e){if(e.target.files[0])uploadImg(e.target.files[0]);e.target.value='';}}/>
            <button onClick={function(){imgRef.current&&imgRef.current.click();}} disabled={imgLoading}
              style={{padding:'7px 14px',borderRadius:8,border:'none',background:T,color:'white',fontWeight:'bold',fontSize:13,cursor:'pointer',opacity:imgLoading?0.6:1,touchAction:'manipulation'}}>
              {imgLoading?'⏳ Analysiere…':'📷 Bild hochladen'}
            </button>
          </div>
          {imgMsg&&<div style={{fontSize:12,padding:'6px 10px',borderRadius:6,marginBottom:8,
            background:imgMsg.startsWith('✅')?'#d1fae5':imgMsg.startsWith('Fehler')||imgMsg.startsWith('Kein')?'#fef2f2':'#eff6ff',
            color:imgMsg.startsWith('✅')?'#065f46':imgMsg.startsWith('Fehler')||imgMsg.startsWith('Kein')?RE:T}}>{imgMsg}</div>}
          {imgDraft&&imgDraft.length>0&&(
            <div>
              <div style={{maxHeight:160,overflowY:'auto',border:'1px solid '+G200,borderRadius:8,marginBottom:8}}>
                {imgDraft.map(function(w,i){return <div key={i} style={{display:'flex',gap:8,padding:'4px 10px',borderBottom:'1px solid '+G100,fontSize:11,background:i%2===0?'white':G50}}>
                  {w.important&&<span>⭐</span>}<span style={{fontWeight:'bold',flex:1}}>{w.word}</span><span style={{color:G400}}>{w.clue}</span>
                </div>;})}
              </div>
              <div style={{display:'flex',gap:6}}>
                <button onClick={function(){doImportOcr(imgDraft);}} style={{flex:1,padding:'8px',borderRadius:8,border:'none',background:T,color:'white',fontWeight:'bold',fontSize:12,cursor:'pointer'}}>✓ Importieren</button>
                <button onClick={function(){setImgDraft(null);setImgMsg('');}} style={{padding:'8px 12px',borderRadius:8,border:'none',background:G100,color:G600,fontSize:12,cursor:'pointer'}}>✕</button>
              </div>
            </div>
          )}
        </div>
        {topLevelChapters.map(function(kap){
          var kids=childChapters.filter(function(c){return c.parent_id===kap.id;}).slice().sort(naturalSort);
          var open=expandedCh[kap.id];
          return <div key={kap.id} style={{marginBottom:8,border:'2px solid '+(open?kap.color||T:G200),borderRadius:12,overflow:'hidden'}}>
            <div onClick={function(){toggleCh(kap.id);}} style={{display:'flex',alignItems:'center',gap:8,padding:'10px 12px',background:open?(kap.color||T)+'15':'white',cursor:'pointer'}}>
              <span style={{fontSize:20}}>{kap.icon}</span>
              <span style={{flex:1,fontWeight:'bold',fontSize:13,color:kap.color||T}}>{kap.title}</span>
              {UUID.test(kap.id)&&<button onClick={function(e){e.stopPropagation();if(confirm('Kapitel löschen?'))deleteChapter(kap);}} style={{padding:'2px 8px',fontSize:10,border:'1px solid '+RE,background:'white',color:RE,cursor:'pointer',borderRadius:5}}>🗑</button>}
              <span style={{color:G400,fontSize:11}}>{open?'▲':'▼'}</span>
            </div>
            {open&&<div style={{borderTop:'1px solid '+G100}}>
              {kids.map(function(ch){
                var chOpen=expandedCh[ch.id];

                    <span style={{flex:1,fontWeight:'bold',fontSize:12,color:ch.color}}>{ch.title}</span>
                    <span style={{fontSize:10,color:G400}}>{(ch.words||[]).length} V</span>
                    <button onClick={function(e){e.stopPropagation();setEditCh(ch);}} style={{padding:'2px 7px',fontSize:10,border:'1px solid '+T,background:'white',color:T,cursor:'pointer',borderRadius:5,marginLeft:4}}>✏️</button>

                    <span style={{color:G400,fontSize:10,marginLeft:2}}>{chOpen?'▲':'▼'}</span>
                  </div>
                  {chOpen&&<div style={{padding:'6px 18px 10px',background:'#f9fafb'}}>

                        <input value={editCh.title||''} onChange={function(e){setEditCh(function(c){return Object.assign({},c,{title:e.target.value});});}} style={{flex:1,padding:'6px',fontSize:13,border:'1px solid '+G200,borderRadius:6}} placeholder="Titel"/>

var GRAMMAR_KEYS = { sp:'grammar_exercises_sp', pp:'grammar_exercises_pp' };
var GRAMMAR_VERBS = [
  {word:'to play',clue:'spielen'},{word:'to work',clue:'arbeiten'},
  {word:'to go',clue:'gehen'},{word:'to eat',clue:'essen'},
  {word:'to drink',clue:'trinken'},{word:'to read',clue:'lesen'},
  {word:'to write',clue:'schreiben'},{word:'to run',clue:'laufen'},
  {word:'to sing',clue:'singen'},{word:'to dance',clue:'tanzen'},
  {word:'to cook',clue:'kochen'},{word:'to swim',clue:'schwimmen'},
  {word:'to travel',clue:'reisen'},{word:'to learn',clue:'lernen'},
  {word:'to teach',clue:'lehren, unterrichten'},{word:'to help',clue:'helfen'},
  {word:'to buy',clue:'kaufen'},{word:'to sell',clue:'verkaufen'}
];

function loadGrammarPool(topic) {
  return sbGet('settings','key=eq.'+GRAMMAR_KEYS[topic]).then(function(d){
    if(d&&d[0]){try{return JSON.parse(d[0].value);}catch(e){return [];}}
    return [];
  });
}
function saveGrammarPool(topic, pool) {
  var key=GRAMMAR_KEYS[topic];
  return sbGet('settings','key=eq.'+key).then(function(d){
    var val=JSON.stringify(pool);
    if(d&&d[0]) return sbPatch('settings',{value:val},'key=eq.'+key);
    return sbPost('settings',{key:key,value:val});
  });
}
function grammarPickQuestions(pool, ruleStats, count) {
  if(!pool||pool.length===0) return [];
  var weighted=pool.map(function(q){
    var st=ruleStats[q.rule]||{correct:0,total:0};
    var score=st.total>0?st.correct/st.total:0;
    var weight=1+(1-score)*3;
    return Object.assign({},q,{_weight:weight});
  });
  var picked=[], seen=new Set();
  var attempts=0;
  while(picked.length<count&&attempts<count*10){
    attempts++;
    var totalW=weighted.reduce(function(s,q){return s+q._weight;},0);
    var r=Math.random()*totalW, cum=0, sel=weighted[0];
    for(var i=0;i<weighted.length;i++){cum+=weighted[i]._weight;if(cum>=r){sel=weighted[i];break;}}
    if(!seen.has(sel.id)){seen.add(sel.id);picked.push(sel);}
  }
  return shuffle(picked);
}

function GrammarAdmin({ player, chapters }) {
  var [topic, setTopic] = useState('sp');
  var [pool, setPool] = useState([]);
  var [loading, setLoading] = useState(false);
  var [generating, setGenerating] = useState(false);
  var [msg, setMsg] = useState('');
  var [batchN, setBatchN] = useState(10);
  var [apiKey, setApiKey] = useState('');
  var [savedKey, setSavedKey] = useState('');

  useEffect(function(){
    var k = localStorage.getItem('claude_api_key') || '';
    setApiKey(k); setSavedKey(k);
  },[]);

  useEffect(function(){
    setLoading(true);
    loadGrammarPool(topic).then(function(p){setPool(p);setLoading(false);}).catch(function(){setLoading(false);});
  },[topic]);

  function saveKey(){
    localStorage.setItem('claude_api_key', apiKey.trim());
    setSavedKey(apiKey.trim());
    setMsg('✓ API-Key gespeichert');
  }

  function generate(){
    var key = savedKey || localStorage.getItem('claude_api_key') || '';
    if(!key){setMsg('Bitte zuerst API-Key eintragen und speichern');return;}
    setGenerating(true); setMsg('');
    var topicLabel = topic==='sp'?'Simple Present':'Past Participle';
    var prompt = 'Erstelle '+batchN+' verschiedene deutsche Beispielsätze mit '+topicLabel+' auf Englisch. Jeder Satz soll kurz (max 10 Wörter), alltagstauglich und für Englischlernende (B1-Niveau) geeignet sein. Antworte NUR mit einem JSON-Array: [{"text":"English sentence","translation":"Deutsche Übersetzung","rule":"'+topicLabel+'","important":true}]. Keine Erklärungen, kein Markdown, nur das JSON-Array.';
    fetch('https://api.anthropic.com/v1/messages',{
      method:'POST',
      headers:{'Content-Type':'application/json','x-api-key':key,'anthropic-version':'2023-06-01','anthropic-dangerous-direct-browser-access':'true'},
      body:JSON.stringify({model:'claude-sonnet-4-20250514',max_tokens:2000,messages:[{role:'user',content:prompt}]})
    }).then(function(r){return r.json();})
    .then(function(d){
      var text = d.content&&d.content[0]&&d.content[0].text||'';
      var clean = text.replace(/```json|```/g,'').trim();
      var arr = JSON.parse(clean);
      return saveGrammarPool(topic, pool.concat(arr)).then(function(){ return arr; });
    })
    .then(function(arr){
      setPool(function(prev){return prev.concat(arr);});
      setMsg('✓ '+arr.length+' Sätze generiert und gespeichert');
      setGenerating(false);
    })
    .catch(function(e){ setMsg('Fehler: '+e.message); setGenerating(false); });
  }

  function deleteQ(id){
    var newPool = pool.filter(function(q){return q.id!==id;});
    saveGrammarPool(topic, newPool).then(function(){ setPool(newPool); });
  }

  return(
    <div style={{padding:8}}>
      <div style={{padding:'10px 12px',background:savedKey?'#d1fae5':'#fef3c7',borderRadius:8,border:'1px solid '+(savedKey?GR:AM),marginBottom:10}}>

        {savedKey
          ? <div style={{fontSize:11,color:T}}>✓ Key hinterlegt ({savedKey.slice(0,8)}…)<button onClick={function(){setSavedKey('');setApiKey('');localStorage.removeItem('claude_api_key');}} style={{marginLeft:8,border:'none',background:'none',color:RE,cursor:'pointer',fontSize:11}}>Ändern</button></div>
          : <div style={{display:'flex',gap:6}}>
              <input value={apiKey} onChange={function(e){setApiKey(e.target.value);}} placeholder="sk-ant-…" type="password"
                style={{flex:1,padding:'6px 10px',fontSize:12,border:'1px solid '+AM,borderRadius:6,outline:'none'}}/>
              <button onClick={saveKey} style={BtnStyle(AM,'white',{padding:'6px 12px',fontSize:11})}>Speichern</button>
            </div>
        }
      </div>
