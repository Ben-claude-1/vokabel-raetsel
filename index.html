// ── App ───────────────────────────────────────────────────────
function App() {
  // Restore API key from session
  (function(){try{var k=sessionStorage.getItem('_ak');if(k)window._ANTHROPIC_KEY=k;}catch(e){}}());
  var [screen, setScreen] = useState('login');
  var [allCategories, setAllCategories] = useState([]);
  var [player, setPlayer] = useState(null);
  var [chapters, setChapters] = useState(BUILTIN);
  // Known users hardcoded - always available without network
  var KNOWN_USERS = [
    { id: "supabase-emma-d46d1397", name: "Emma", password_hash: "fb_63b25a920b81aad7", is_admin: false, total_score: 0, total_correct: 0, total_wrong: 0, puzzles_completed: 0 }
  ];
  var [allUsers, setAllUsers] = useState(KNOWN_USERS);
  var [allRuns, setAllRuns] = useState([]);
  var [gradeSettings, setGradeSettings] = useState(null);
  var [streakSettings, setStreakSettings] = useState(null);
  var [lsRun, setLsRun] = useState(null);
  var [lsCreateMode, setLsCreateMode] = useState(false);
  var [vocab, setVocab] = useState([]);
  var [sessId, setSessId] = useState(null);
  var [tab, setTab] = useState(0);
  var [wordRes, setWordRes] = useState([]);
  var [workoutWords, setWorkoutWords] = useState([]);
  var [workoutProgress, setWorkoutProgress] = useState({});

  // ── Viewport: prevent mobile zoom on input focus ──
  useEffect(function() {
    try {
      var meta = document.querySelector('meta[name="viewport"]');
      if (meta) {
        meta.setAttribute('content', 'width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no');
      } else {
        var m = document.createElement('meta');
        m.name = 'viewport';
        m.content = 'width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no';
        document.head.appendChild(m);
      }
    } catch(e) {}
  }, []);

  // ── Startup: load settings, runs, users ──
  useEffect(function() {
    try {
      var gs = localStorage.getItem('ls_grade_settings');
      setGradeSettings(gs ? JSON.parse(gs) : { testSize:20, grades:[{grade:1,maxErrors:1},{grade:2,maxErrors:3},{grade:3,maxErrors:6},{grade:4,maxErrors:9},{grade:5,maxErrors:13}] });
      var ss = localStorage.getItem('ls_streak_settings');
      setStreakSettings(ss ? JSON.parse(ss) : { upThresholds:{1:2,2:1,3:1,4:1}, downThresholds:{1:0,2:1,3:1,4:1} });
    } catch(e) {}
    lsGetRuns().then(function(runs){ if(Array.isArray(runs)) setAllRuns(runs); });
    sbGet('players', 'select=id,name,password_hash,is_admin,is_active,total_score,total_correct,total_wrong,puzzles_completed&order=created_at.asc')
      .then(function(rows) {
        if (Array.isArray(rows) && rows.length > 0) {
          var sbNames = new Set(rows.map(function(r){ return r.name.toLowerCase(); }));
          var extraKnown = KNOWN_USERS.filter(function(u){ return !sbNames.has(u.name.toLowerCase()); });
          setAllUsers(rows.concat(extraKnown));
        }
      });
  }, []);

  // ── Migration: sync local-only users to Supabase on startup ──
  useEffect(function() {
    STORE.listUsers().then(function(localUsers) {
      localUsers.forEach(function(u) {
        if (!u.id || String(u.id).indexOf('local_') !== 0) return; // only local_ ids
        if (!u.passwordHash) return;
        // Check if already in Supabase
        sbGet('players','name=ilike.'+encodeURIComponent(u.name)+'&select=id').then(function(rows) {
          if (Array.isArray(rows) && rows.length > 0) {
            // Already exists in Supabase - update cache with real ID
            STORE.setUser(Object.assign({}, u, { id: rows[0].id }));
          } else {
            // Not in Supabase yet - try to sync
            sbPost('players', { name: u.name, password_hash: u.passwordHash, is_admin: false,
              total_score: u.total_score||0, total_correct: u.total_correct||0,
              total_wrong: u.total_wrong||0, puzzles_completed: 0 })
              .then(function() {
                setTimeout(function() {
                  sbGet('players','name=ilike.'+encodeURIComponent(u.name)+'&select=id').then(function(rows2) {
                    if (Array.isArray(rows2) && rows2.length > 0) {
                      STORE.setUser(Object.assign({}, u, { id: rows2[0].id }));
                    }
                  });
                }, 600);
              });
          }
        });
      });
    });
  }, []);

  // Load categories from settings DB
  useEffect(function() {
    sbGet('settings','key=eq.word_categories&select=value').then(function(rows){
      if(Array.isArray(rows)&&rows.length>0){
        try{
          var cats=JSON.parse(rows[0].value||'[]');
          if(Array.isArray(cats)&&cats.length>0) setAllCategories(cats);
        }catch(e){}
      }
    });
  },[]);

  useEffect(function() {
    sbGet('chapters','select=id,title,color,icon,is_builtin,parent_id,words,sentences&order=created_at.asc').then(function(rows){
      if (!Array.isArray(rows) || rows.length === 0) return;
      var parsed = rows.map(function(c) {
        var w = c.words, s = c.sentences;
        if (typeof w === 'string') { try { w = JSON.parse(w); } catch(e) { w = []; } }
        if (typeof s === 'string') { try { s = JSON.parse(s); } catch(e) { s = []; } }
        return Object.assign({}, c, { words: Array.isArray(w)?w:[], sentences: Array.isArray(s)?s:[] });
      });
      // Merge BUILTIN words into DB records for c1-c5
      var merged = parsed.map(function(c) {
        var b = BUILTIN.find(function(x){ return x.id === c.id; });
        if (b && (!c.words || c.words.length === 0)) return Object.assign({}, c, { words: b.words, sentences: b.sentences||[] });
        return c;
      });
      setChapters(merged);
    });
  },[]);

  var puzzles=useMemo(function(){
    if(!vocab.length) return [];
    var groups=[];for(var i=0;i<vocab.length;i+=20)groups.push(vocab.slice(i,i+20));
    return groups.map(function(words,i){var sol=SOLS[i%SOLS.length];return{words:words,cw:buildCW(words,sol.phrase),sol:sol};});
  },[vocab]);

  function handleLogin(p){setPlayer(p);setScreen(p.is_admin?'admin':'menu');}
  function handleRegister(p){setPlayer(p);setScreen('menu');}
  function logout(){setPlayer(null);setScreen('login');setWordRes([]);setVocab([]);}
  function goScreen(s){setScreen(s);}

  function handleWord(r){
    if(r.word==='__done__') return;
    setWordRes(function(prev){var ex=prev.find(function(x){return x.word===r.word;});return ex?prev.map(function(x){return x.word===r.word?r:x;}):[].concat(prev,[r]);});
    if(player&&player.id&&sessId){
      sbPost('results',{player_id:player.id,session_id:sessId,word:r.word,clue:r.clue,chapter_id:r.chapId||null,correct:r.correct,typed_answer:r.typedAnswer,attempts:1,check_count:r.checkCount});
      var u={total_score:(player.total_score||0)+(r.correct?10:0)};
      if(r.correct)u.total_correct=(player.total_correct||0)+1;else u.total_wrong=(player.total_wrong||0)+1;
      sbPatch('players',u,'id=eq.'+player.id);
      setPlayer(function(p){return Object.assign({},p,u);});
    }
  }

  function startSolo(words){
    setVocab(words);setWordRes([]);setTab(0);
    if(player&&player.id&&player.id!=='admin-local'){
      sbPost('sessions',{image_name:'Auswahl',vocab_list:words,created_by:player.id}).then(function(res){setSessId(res&&res.id?res.id:null);});
    }
    setScreen('puzzles');
  }

  function remedial(wrong){setVocab(wrong);setWordRes([]);setTab(0);setScreen('puzzles');}

  var hasWordRes=wordRes.filter(function(r){return r.word!=='__done__';}).length>0;
  var logoutBtn=<button onClick={logout} style={BtnStyle(G100,G600,{padding:'6px 10px',fontSize:12})}>Abmelden</button>;

  if(screen==='login') return <LoginScreen onLogin={handleLogin} onGoRegister={function(){setScreen('register');}} users={allUsers}/>;
  if(screen==='register') return <RegisterScreen onRegister={handleRegister} onGoLogin={function(){setScreen('login');}} users={allUsers} onUserAdded={function(u){setAllUsers(function(prev){return prev.concat([u]);}); }}/>;

  if(screen==='admin') return(
    <Shell showBack={false} onBack={function(){}} title='👑 Admin' rightBtn={logoutBtn} player={player}>
      <AdminDash chapters={chapters} setChapters={setChapters} allUsers={allUsers} setAllUsers={setAllUsers} player={player} gradeSettings={gradeSettings} streakSettings={streakSettings} setGradeSettings={setGradeSettings} setStreakSettings={setStreakSettings} allCategories={allCategories} setAllCategories={setAllCategories} allRuns={allRuns}/>
    </Shell>
  );

  if(screen==='quizSolo') return(
    <Shell showBack={true} onBack={function(){goScreen('menu');}} title='🧩 Quiz Solo' player={player}>
      <QuizSolo chapters={chapters} onDone={function(){goScreen('menu');}}/>
    </Shell>
  );
  if(screen==='quizDuel') return(
    <Shell showBack={true} onBack={function(){goScreen('menu');}} title='⚔️ Quiz Duell' player={player}>
      <QuizDuel chapters={chapters} player={player} allUsers={allUsers} onDone={function(){goScreen('menu');}} allCategories={allCategories}/>
    </Shell>
  );

  // Vocabulary trainer - select chapter first
  if(screen==='vocabSelect') return(
    <Shell showBack={true} onBack={function(){goScreen('menu');}} title='✍️ Vokabeln lernen' player={player}>
      <WordSelector chapters={chapters} onStart={function(words){setVocab(words);goScreen('vocabTrain');}} mode='vocab'/>
    </Shell>
  );
  if(screen==='vocabTrain'&&vocab.length) return(
    <Shell showBack={true} onBack={function(){goScreen('vocabSelect');}} title='✍️ Vokabeltrainer' player={player}>
      <VokabelTrainer words={vocab} player={player} onDone={function(){goScreen('menu');}} title='Vokabeltrainer'/>
    </Shell>
  );

  // Workout
  if(screen==='workout') return(
    <Shell showBack={true} onBack={function(){goScreen('menu');}} title='🏋️ Workout' player={player}>
      <WorkoutSetup chapters={chapters} player={player} onStart={function(words,prog){setWorkoutWords(words);setWorkoutProgress(prog);goScreen('workoutSession');}}/>
    </Shell>
  );
  if(screen==='workoutSession'&&workoutWords.length) return(
    <Shell showBack={true} onBack={function(){goScreen('workout');}} title='🏋️ Workout' player={player}>
      <WorkoutSession words={workoutWords} player={player} progressMap={workoutProgress} onDone={function(){goScreen('menu');}}/>
    </Shell>
  );

  // Sentence learner
  if(screen==='sentences') return(
    <Shell showBack={true} onBack={function(){goScreen('menu');}} title='💬 Sätze lernen' player={player}>
      <SentenceLearner chapters={chapters} player={player} onDone={function(){goScreen('menu');}}/>
    </Shell>
  );

  // Progress stats
  if(screen==='progress') return(
    <Shell showBack={true} onBack={function(){goScreen('menu');}} title='📈 Mein Fortschritt' player={player}>
      <ProgressStats chapters={chapters} player={player} allCategories={allCategories}/>
    </Shell>
  );

  if(screen==='leiterspiel') {
    if(lsCreateMode) return (
      <Shell showBack={true} onBack={function(){setLsCreateMode(false);}} title='🎯 Neuer Lauf' player={player}>
        <LeitersSpielCreate player={player} chapters={chapters} isAdmin={false}
          onCreated={function(run){setLsRun(run);setLsCreateMode(false);}}/>
      </Shell>
    );
    if(lsRun) return (
      <Shell showBack={true} onBack={function(){setLsRun(null);}} title={'🎯 '+lsRun.name} player={player}>
        <LeitersSpielSession run={lsRun} player={player} gradeSettings={gradeSettings} streakSettings={streakSettings} onBack={function(){setLsRun(null);}}/>
      </Shell>
    );
    return (
      <Shell showBack={true} onBack={function(){goScreen('menu');}} title='🎯 Leiterspiel' player={player}>
        <LeitersSpielMenu player={player} chapters={chapters} gradeSettings={gradeSettings}
          onStart={function(run){setLsRun(run);}}
          onCreateOwn={function(){setLsCreateMode(true);}}
          onBack={function(){goScreen('menu');}}/>
      </Shell>
    );
  }

  if(screen==='menu') return(
    <Shell showBack={false} onBack={function(){}} rightBtn={logoutBtn} player={player}>
      <p style={{textAlign:'center',color:G400,fontSize:13,margin:'0 0 8px'}}>Willkommen, <strong style={{color:T}}>{player&&player.name}</strong>!</p>
      <KapitelProgress chapters={chapters} player={player} allRuns={allRuns} gradeSettings={gradeSettings}/>
      <div style={{display:'grid',gridTemplateColumns:'1fr 1fr',gap:9}}>
        {[
          {icon:'✍️',label:'Vokabeltrainer',sub:'Tippe die Übersetzung',screen:'vocabSelect'},
          {icon:'🏋️',label:'Workout',sub:'Gewichtet nach Fortschritt',screen:'workout',new2:true},
          {icon:'✏️',label:'Kreuzworträtsel',sub:'Kapitel wählen & lösen',screen:'selectSolo'},
          {icon:'🧩',label:'Quiz Solo',sub:'6 Runden · 4 Antworten',screen:'quizSolo'},
          {icon:'⚔️',label:'Quiz Duell',sub:'Rundenbasiert gegen andere',screen:'quizDuel'},
          {icon:'💬',label:'Sätze lernen',sub:'Fett gedruckte Sätze',screen:'sentences',new2:true},
          {icon:'📈',label:'Mein Fortschritt',sub:'Grün · Gelb · Rot',screen:'progress',new2:true},
          {icon:'🏆',label:'Rangliste',sub:'Punkte & Vergleich',screen:'leaderboard'},
          {icon:'📊',label:'Auswertung',sub:'Fehler & Nachübung',screen:'stats',dis:!hasWordRes},
          {icon:'📖',label:'Alle Kapitel',sub:'Vokabeln & Sätze',screen:'browse'},
          {icon:'🎯',label:'Leiterspiel',sub:'4 Töpfe · Fortschritt sichern',screen:'leiterspiel',highlight:true},
        ].map(function(item){
          return(
            <button key={item.label} onClick={function(){if(!item.dis)goScreen(item.screen);}} disabled={item.dis}
              style={{padding:'13px 10px',background:item.dis?G50:'white',border:'2px solid '+(item.dis?G200:T),borderRadius:10,cursor:item.dis?'not-allowed':'pointer',textAlign:'left',opacity:item.dis?0.5:1,position:'relative'}}>
              <div style={{fontSize:20,marginBottom:2}}>{item.icon}</div>
              <div style={{fontWeight:'bold',fontSize:12,color:T}}>{item.label}</div>
              <div style={{fontSize:10,color:G400,marginTop:1,lineHeight:1.3}}>{item.sub}</div>
              {item.new2&&<span style={{position:'absolute',top:6,right:6,background:AM,color:'white',fontSize:8,padding:'1px 5px',borderRadius:8,fontWeight:'bold'}}>NEU</span>}
            </button>
          );
        })}
      </div>
    </Shell>
  );

  if(screen==='browse') return(
    <Shell showBack={true} onBack={function(){goScreen('menu');}} title='📖 Alle Kapitel' player={player}>
      {chapters.map(function(ch){return <BrowseChapter key={ch.id} ch={ch}/>;} )}
    </Shell>
  );
  if(screen==='selectSolo') return(
    <Shell showBack={true} onBack={function(){goScreen('menu');}} title='✏️ Vokabeln auswählen' player={player}>
      <WordSelector chapters={chapters} onStart={startSolo} mode='solo'/>
    </Shell>
  );
  if(screen==='puzzles'&&puzzles.length) return(
    <Shell showBack={true} onBack={function(){goScreen('menu');}} title='📚 Rätsel' player={player}>
      <div style={{display:'flex',gap:4,justifyContent:'center',flexWrap:'wrap',marginBottom:10}}>
        {puzzles.map(function(_,i){return <button key={i} onClick={function(){setTab(i);}} style={{padding:'4px 12px',borderRadius:20,fontSize:12,fontWeight:'bold',background:tab===i?T:G100,color:tab===i?'white':G600,border:'2px solid '+(tab===i?T:G200),cursor:'pointer'}}>Rätsel {i+1}</button>;})}
        <button onClick={function(){goScreen('stats');}} style={{padding:'4px 12px',borderRadius:20,fontSize:12,fontWeight:'bold',background:AM,color:'white',border:'none',cursor:'pointer'}}>📊</button>
      </div>
      <div style={{background:TL,border:'1px solid #a7f3d0',borderRadius:8,padding:'7px 12px',marginBottom:10,fontSize:12,display:'flex',justifyContent:'space-between'}}>
        <span><strong style={{color:T}}>Rätsel {tab+1}</strong><span style={{color:G400,marginLeft:8}}>({puzzles[tab].cw.placed.length}/{puzzles[tab].cw.total} Wörter)</span></span>
        {wordRes.filter(function(r){return r.word!=='__done__';}).length>0&&<span><span style={{color:GR}}>✓ {wordRes.filter(function(r){return r.correct;}).length}</span> <span style={{color:RE}}>✗ {wordRes.filter(function(r){return !r.correct&&r.word!=='__done__';}).length}</span></span>}
      </div>
      <Puzzle key={'p_'+tab+'_'+vocab.length} data={puzzles[tab].cw} solPhrase={puzzles[tab].sol.phrase} solMsg={puzzles[tab].sol.msg} onWord={handleWord} chapId={vocab[0]&&vocab[0].chapterId}/>
    </Shell>
  );
  if(screen==='leaderboard') return(<Shell showBack={true} onBack={function(){goScreen('menu');}} title='🏆 Rangliste' player={player}><Leaderboard me={player}/></Shell>);
  if(screen==='stats') return(
    <Shell showBack={true} onBack={function(){goScreen('menu');}} title='📊 Auswertung' player={player}>
      {!hasWordRes?<div style={{textAlign:'center',color:G400,padding:30}}>Noch keine Ergebnisse.</div>:<Stats results={wordRes} onRemedial={remedial} name={player&&player.name||''}/>}
    </Shell>
  );
  return <div style={{textAlign:'center',padding:40,color:G400}}>Lade…</div>;
}


ReactDOM.createRoot(document.getElementById("root")).render(React.createElement(App));
  </script>
</body>
</html>
