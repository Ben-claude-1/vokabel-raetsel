            <span style={{fontSize:13,fontWeight:'bold',color:col3,lineHeight:1.3}}>{answerText}</span>
          </div>
        </button>;
      })}
    </div>
  </div>;
}

function Puzzle({ data, solPhrase, solMsg, onWord, chapId }) {
  var grid = data.grid, nums = data.nums, across = data.across, down = data.down, rows = data.rows, cols = data.cols, solCells = data.solCells;
  var [user, setUser] = useState(function(){ var u=[]; for(var r=0;r<rows;r++){u.push([]);for(var c=0;c<cols;c++)u[r].push("");} return u; });
  var [checked, setChecked] = useState(false);
  var [cc, setCC] = useState(0);
  var reported = useRef({});
  var refs = useRef({});
  var order = useMemo(function() { var o=[]; for(var r=0;r<rows;r++) for(var c=0;c<cols;c++) if((grid[r]||[])[c]!=="") o.push(r+","+c); return o; }, [grid,rows,cols]);
  var solMap = useMemo(function(){ var m={}; solCells.forEach(function(s){ m[s.r+","+s.c]=s; }); return m; }, [solCells]);
  var rev = solCells.map(function(s){ return (user[s.r]&&user[s.r][s.c]||"")===s.letter?s.letter:null; });
  var solOk = solCells.length>0 && rev.every(function(l){ return l!==null; });
  function focusNext(r,c){ var i=order.indexOf(r+","+c); if(i<order.length-1&&refs.current[order[i+1]]) refs.current[order[i+1]].focus(); }
  function focusPrev(r,c){ var i=order.indexOf(r+","+c); if(i>0&&refs.current[order[i-1]]) refs.current[order[i-1]].focus(); }
  var setCell = useCallback(function(r,c,v){ var ch=v.replace(/[^A-Za-z]/g,"").slice(-1); setUser(function(u){ var n=u.map(function(row){return row.slice();}); n[r][c]=ch; return n; }); setChecked(false); if(ch) setTimeout(function(){focusNext(r,c);},0); },[]);
  var handleKD = useCallback(function(r,c,e){ if(e.key==="Backspace"&&!(user[r]&&user[r][c])){ e.preventDefault(); focusPrev(r,c); } else if(e.key==="ArrowRight"&&(grid[r]||[])[c+1]!==""){if(refs.current[r+","+(c+1)])refs.current[r+","+(c+1)].focus();} else if(e.key==="ArrowLeft"&&(grid[r]||[])[c-1]!==""){if(refs.current[r+","+(c-1)])refs.current[r+","+(c-1)].focus();} else if(e.key==="ArrowDown"&&(grid[r+1]||[])[c]!==""){if(refs.current[(r+1)+","+c])refs.current[(r+1)+","+c].focus();} else if(e.key==="ArrowUp"&&(grid[r-1]||[])[c]!==""){if(refs.current[(r-1)+","+c])refs.current[(r-1)+","+c].focus();} },[user,grid]);
  function report(word,clue,uGrid,cnt){ if(reported.current[word]) return; var p=data.placed.find(function(pl){return pl.word===word;}); if(!p) return; var typed=""; for(var i=0;i<word.length;i++){var r2=p.dir==="H"?p.row:p.row+i,c2=p.dir==="H"?p.col+i:p.col;typed+=(uGrid[r2]&&uGrid[r2][c2])||"";} reported.current[word]=true; if(onWord) onWord({word:word,clue:clue,correct:typed===word,typedAnswer:typed,checkCount:cnt,chapId:chapId}); }
  function check(){ var n=cc+1; setCC(n); setChecked(true); [].concat(across,down).forEach(function(x){ report(x.word,x.clue,user,n); }); }
  function finish(){ [].concat(across,down).forEach(function(x){ report(x.word,x.clue,user,cc); }); }
  var corr=0,tot=0;
  if(checked) for(var r=0;r<rows;r++) for(var c=0;c<cols;c++) if((grid[r]||[])[c]!==""){tot++;if(user[r]&&user[r][c]===(grid[r]||[])[c])corr++;}
  var CS=26;
  return (
    <div>
      <div style={{fontSize:11,color:G600,textAlign:"center",marginBottom:8,padding:"4px 8px",background:"#f0f9ff",borderRadius:6,border:"1px solid #bae6fd"}}>ℹ️ Monate → <strong>Großbuchstaben</strong> · alle anderen → <strong>Kleinbuchstaben</strong></div>
      <div style={{overflowX:"auto",marginBottom:10}}>
        <table style={{borderCollapse:"collapse",margin:"0 auto"}}>
          <tbody>
            {Array(rows).fill(0).map(function(_,r){
              return (<tr key={r}>{Array(cols).fill(0).map(function(_,c){
                var letter=(grid[r]||[])[c]||"",isB=letter==="",num=nums[r+","+c],sol=solMap[r+","+c],uv=user[r]&&user[r][c]||"";
                var bg="white"; if(!isB&&sol) bg="#fffbeb"; if(checked&&!isB&&uv) bg=uv===letter?"#bbf7d0":"#fecaca";
                return (<td key={c} style={{width:CS,height:CS,padding:0,border:isB?"none":"1px solid #555",background:isB?"#18181b":bg,position:"relative"}}>
                  {!isB&&(<span>
                    {num&&<span style={{position:"absolute",top:1,left:2,fontSize:6,color:"#444",lineHeight:1,pointerEvents:"none",zIndex:3}}>{num}</span>}
                    {sol&&<span style={{position:"absolute",bottom:1,right:1,width:9,height:9,borderRadius:"50%",background:AM,color:"white",fontSize:5,fontWeight:"bold",display:"flex",alignItems:"center",justifyContent:"center",pointerEvents:"none",zIndex:3}}>{sol.pos}</span>}
                    <input ref={function(el){if(el)refs.current[r+","+c]=el;else delete refs.current[r+","+c];}} type="text" inputMode="text" autoCapitalize="none" autoCorrect="off" autoComplete="off" spellCheck="false" value={uv}
                      onChange={function(e){setCell(r,c,e.target.value);}} onKeyDown={function(e){handleKD(r,c,e);}}
                      style={{position:"absolute",inset:0,width:"100%",height:"100%",border:"none",outline:"none",background:"transparent",textAlign:"center",fontSize:12,fontWeight:"bold",color:"#111",paddingTop:num?5:0,boxSizing:"border-box",cursor:"text"}}/>
                  </span>)}
                </td>);
              })}</tr>);
            })}
          </tbody>
        </table>
      </div>
      {solCells.length>0&&(<div style={{margin:"8px 0",padding:"8px 12px",background:solOk?"#fef9c3":"#f8fafc",border:"2px solid "+(solOk?AM:G200),borderRadius:8}}>
        <div style={{fontSize:10,color:G400,marginBottom:5,fontWeight:"bold",textTransform:"uppercase",letterSpacing:1}}>🔑 Lösungswort</div>
        <div style={{display:"flex",gap:3,flexWrap:"wrap"}}>{solCells.map(function(sc,i){ var r2=rev[i]; return (<div key={i} style={{display:"flex",flexDirection:"column",alignItems:"center",gap:1}}><div style={{width:24,height:24,border:"2px solid "+(r2?AM:G200),borderRadius:4,background:r2?"#fef3c7":"#f1f5f9",display:"flex",alignItems:"center",justifyContent:"center",fontSize:13,fontWeight:"bold",color:G900}}>{r2||""}</div><span style={{fontSize:7,color:AM,fontWeight:"bold"}}>{sc.pos}</span></div>); })}</div>
        {solOk&&<div style={{marginTop:8,padding:"6px 10px",background:"#fef08a",borderRadius:6,fontSize:14,fontWeight:"bold",color:"#92400e",textAlign:"center"}}>{solMsg}</div>}
      </div>)}
      <div style={{display:"flex",gap:8,justifyContent:"center",marginBottom:8,flexWrap:"wrap"}}>
        <button onClick={check} style={BtnStyle(T)}>✓ Prüfen</button>
        <button onClick={function(){setUser(function(){var u=[];for(var r=0;r<rows;r++){u.push([]);for(var c=0;c<cols;c++)u[r].push("");}return u;});setChecked(false);}} style={BtnStyle(G400)}>↺ Reset</button>
        <button onClick={finish} style={BtnStyle("#7c3aed")}>✅ Abschließen</button>
      </div>
      {checked&&<div style={{textAlign:"center",marginBottom:8,padding:"6px 10px",borderRadius:6,fontWeight:"bold",fontSize:13,background:corr===tot?"#d1fae5":"#fee2e2",color:corr===tot?"#065f46":"#991b1b"}}>{corr}/{tot} richtig {corr===tot?"🎉 Perfekt!":""} · Prüfen: {cc}×</div>}
      <div style={{display:"flex",gap:12,flexWrap:"wrap",marginTop:4}}>
        {[["→ Waagerecht",across],["↓ Senkrecht",down]].map(function(pair){
          var t2=pair[0],clues=pair[1];
          return (<div key={t2} style={{flex:"1 1 160px",minWidth:0}}>
            <div style={{fontWeight:"bold",fontSize:12,color:T,borderBottom:"2px solid "+T,marginBottom:4,paddingBottom:2}}>{t2}</div>
            {clues.map(function(item){ return (<div key={item.n} style={{fontSize:11,marginBottom:2,display:"flex",gap:4,alignItems:"baseline"}}><strong style={{minWidth:18,color:TD}}>{item.n}.</strong><span style={{color:G600}}>{item.clue}</span><span style={{marginLeft:"auto",fontSize:9,color:G400}}>({item.word.length})</span></div>); })}
          </div>);
        })}
      </div>
    </div>
  );
}

function WordSelector({ chapters, onStart, mode }) {

  var [sel, setSel] = useState({});
  var [filter, setFilter] = useState("all");
  var total = Object.values(sel).reduce(function(s,set){ return s+set.size; }, 0);
  function getFiltered(ch){ return filter==="important" ? safeWords(ch.words).filter(function(w){return w.important;}) : ch.words; }
  function togAll(ch){ setSel(function(prev){ var n=Object.assign({},prev); var fi=getFiltered(ch); var cur=n[ch.id]||new Set(); var allS=fi.every(function(w){return cur.has(ch.words.indexOf(w));}); var next=new Set(cur); if(allS) fi.forEach(function(w){next.delete(ch.words.indexOf(w));}); else fi.forEach(function(w){next.add(ch.words.indexOf(w));}); n[ch.id]=next; return n; }); }

        <button onClick={function(){ if(total>=3) onStart(getWords()); }} disabled={total<3} style={BtnStyle(total>=3?T:G400,"#fff",{padding:"6px 14px",opacity:total<3?0.5:1})}>{mode==="battle"?"⚔️ Rätsel-Duell":"🎯 Lernen starten"}</button>

// ── Tages-Log im Leiterspiel ─────────────────────────────────────────────
// data.days["2026-08-04"] = {a:Antworten, c:richtig, p0:% bei Tagesbeginn,
//   p1:% aktuell, l:[an dem Tag gelernte Wörter], w:{Wort:{c,f,clue,p:Topf}}}
// Damit ist pro Tag sichtbar: wie viel geübt, wie viel besser geworden,
// welche Vokabeln dran waren und wie oft richtig/falsch.
var DAY_LOG_KEEP = 180;   // Tage mit Kennzahlen
var DAY_WORDS_KEEP = 60;  // Tage mit Wort-Detail (spart Platz im Blob)
function lsToday(){ return new Date().toISOString().slice(0,10); }
function lsDayEntry(d, pctBefore){
  var day = lsToday();
  if(!d.days) d.days = {};
  if(!d.days[day]) d.days[day] = {a:0, c:0, p0:Math.round(pctBefore||0), p1:Math.round(pctBefore||0), l:[], w:{}};
  return d.days[day];
}
function lsLogAnswer(d, e){
  var day = lsDayEntry(d, e.pctBefore);
  day.a++; if(e.correct) day.c++;
  day.p1 = Math.round(e.pctAfter||day.p1);
  if(!day.w) day.w = {};
  var rec = day.w[e.word];
  if(!rec) rec = day.w[e.word] = {c:0, f:0, clue:e.clue||'', p:e.toPot};
  if(e.correct) rec.c++; else rec.f++;
  if(e.toPot!=null) rec.p = e.toPot;
  if(e.toPot===6 && e.fromPot!==6){
    if(!day.l) day.l = [];
    if(day.l.indexOf(e.word)<0) day.l.push(e.word);
  }
  // Alte Tage ausdünnen, damit der Fortschritts-Datensatz nicht wächst.
  var keys = Object.keys(d.days).sort();
  if(keys.length > DAY_LOG_KEEP) keys.slice(0, keys.length-DAY_LOG_KEEP).forEach(function(k){ delete d.days[k]; });
  var withWords = Object.keys(d.days).sort();
  if(withWords.length > DAY_WORDS_KEEP){
    withWords.slice(0, withWords.length-DAY_WORDS_KEEP).forEach(function(k){ if(d.days[k]) d.days[k].w = null; });
  }
}
// Tageszahlen eines Runs — bevorzugt das Tages-Log, sonst aus den
// Session-Einträgen (die es auch für die Zeit vor dem Log gibt).
function lsDayStats(data, day){
  var d = data||{};
  var log = d.days && d.days[day];
  if(log) return {ans:log.a||0, cor:log.c||0, p0:log.p0, p1:log.p1, learned:(log.l||[]).slice(), words:log.w||null, exact:true};
  var sess = (d.sessions||[]).filter(function(s){ return s && s.d===day; });
  if(!sess.length) return null;
  var ans=0, cor=0;
  sess.forEach(function(s){ ans+=s.ans||0; cor+=s.cor||0; });
  // % vor dem Tag = Stand der letzten Session davor
  var before = null;
  (d.sessions||[]).forEach(function(s){ if(s && s.d < day && s.pct!=null) before = s.pct; });
  var last = sess[sess.length-1];
  return {ans:ans, cor:cor, p0:before!=null?before:null, p1:last.pct!=null?last.pct:null, learned:null, words:null, exact:false};
}

function lsRunPacing(currentPct, targetPct, targetDate, sessionsSecondsForRun){
  if(!targetDate) return null;
  var tgt = Math.max(1, Math.min(100, targetPct||100));
  var gap = Math.max(0, tgt - (currentPct||0));
  var today = new Date(); today.setHours(0,0,0,0);
  var d = new Date(targetDate+'T00:00:00');
  var daysLeft = Math.ceil((d - today) / 86400000);
  var spentMin = Math.round((sessionsSecondsForRun||0)/60);
  var status, requiredMinPerDay=null, etaMessage='';
  if(gap===0){ status='done'; etaMessage='✅ Ziel erreicht'; }
  else if(daysLeft<=0){ status='overdue'; etaMessage='⚠️ Stichtag verstrichen — '+gap+'% offen'; }
  else if(currentPct<=0 || spentMin<2){
    status='no-data';
    etaMessage='Noch keine Lernzeit gemessen — Schätzung ab nächster Sitzung';
    requiredMinPerDay = Math.ceil((gap * 5) / daysLeft);
  } else {
    var minPerPct = spentMin / currentPct;
    var totalNeeded = gap * minPerPct;
    requiredMinPerDay = Math.ceil(totalNeeded / daysLeft);
    if(requiredMinPerDay<=15) status='easy';
    else if(requiredMinPerDay<=45) status='ok';
    else if(requiredMinPerDay<=90) status='hard';
    else status='unrealistic';
  }
  return { targetPct:tgt, currentPct:currentPct||0, gap:gap, daysLeft:daysLeft, spentMin:spentMin, requiredMinPerDay:requiredMinPerDay, status:status, etaMessage:etaMessage, targetDate:targetDate };
}

// For Topf 2: split a word into renderable items so parens become static labels and only
// the actual letters become fillable slots. e.g. "open (from ... to ...)" →
// items: [slot:o, slot:p, slot:e, slot:n, space, static:"(from ... to ...)"], target: "open".
function buildT2Layout(word){
  var items = []; var target = '';
  var s = String(word||''); var i = 0;
  while(i < s.length){
    if(s[i] === '('){
      var end = s.indexOf(')', i);
      if(end < 0) end = s.length - 1;
      items.push({type:'static', text: s.slice(i, end+1)});
      i = end + 1;
    } else if(s[i] === ' '){
      items.push({type:'space'});
      target += ' ';
      i++;
    } else {
      items.push({type:'slot', letter: s[i]});
      target += s[i];
      i++;
    }
  }
  // Collapse leading/trailing whitespace items so layout doesn't end with floating gaps
  while(items.length && items[0].type==='space'){ items.shift(); target = target.replace(/^ /,''); }
  while(items.length && items[items.length-1].type==='space'){ items.pop(); target = target.replace(/ $/,''); }
  return { items: items, targetNoSpaces: target.replace(/ /g,'') };
}

// Deterministic regex parser for AI-Wunsch.
// Returns {matched, filters, description}. If matched=true, apply filters AND-combined and skip Ollama.
function parseWishStructured(wish, chapters){
  var filters = [];
  var conds = [];
  var w = (wish||'').toLowerCase();

  // 1) important / wichtig / fett / bold
  if(/(\bwichtig\w*|\bimportant\b|\bbold\b|\bfett\w*|⭐)/.test(w)){
    filters.push(function(x){ return !!x.important; });
    conds.push('wichtig');
  }

  // 2) Page range: "seite N bis M", "seiten N-M", "von seite N bis M", "s. N – M"
  var pgRange = w.match(/(?:seiten?|s\.|pages?|p\.)\s*(?:von\s*)?(\d+)\s*(?:bis|to|-|–|—)\s*(?:seite\s*)?(\d+)/);
  var pgSingle = null;
  if(pgRange){
    var lo = +pgRange[1], hi = +pgRange[2];
    if(lo>hi){ var t=lo; lo=hi; hi=t; }
    filters.push(function(x){ return typeof x.book_page==='number' && x.book_page>=lo && x.book_page<=hi; });
    conds.push('Seiten '+lo+'–'+hi);
  } else {
    // 3) Single page: "seite N", "auf seite N", "page N", "s. N"
    pgSingle = w.match(/(?:seiten?|s\.|pages?|p\.)\s*(\d+)/);
    if(pgSingle){
      var pg = +pgSingle[1];
      filters.push(function(x){ return x.book_page===pg; });
      conds.push('Seite '+pg);
    }
  }

  // 4) Theme/Kapitel/Chapter N — match leaf chapter or any ancestor
  var themeMatch = w.match(/(theme|kapitel|chapter)\s*(\d+)/);
  if(themeMatch){
    var num = themeMatch[2];
    var pats = ['theme '+num, 'kapitel '+num, 'chapter '+num];
    filters.push(function(x, chs){
      var cur = (chs||[]).find(function(c){ return c.id===x.chapId; });
      var depth = 0;
      while(cur && depth<6){
        var t = (cur.title||'').toLowerCase();
        for(var i=0;i<pats.length;i++){ if(t.indexOf(pats[i])>=0) return true; }
        if(!cur.parent_id) break;
        cur = (chs||[]).find(function(c){ return c.id===cur.parent_id; });
        depth++;
      }
      return false;
    });
    conds.push('Theme '+num);
  }

  // 5) Alphabetical word range: "von WORT_A bis WORT_B"
  // Skip if we already detected a page range OR if the operands look like numbers/seite.
  if(!pgRange){
    var alpha = (wish||'').match(/von\s+([A-Za-zÄÖÜäöüß][\wÄÖÜäöüß'-]*)\s+bis\s+([A-Za-zÄÖÜäöüß][\wÄÖÜäöüß'-]*)/);
    if(alpha){
      var aRaw = alpha[1].trim().toLowerCase();
      var bRaw = alpha[2].trim().toLowerCase();
      var skipWords = {seite:1,seiten:1,page:1,pages:1,kapitel:1,theme:1,chapter:1};
      if(!skipWords[aRaw] && !skipWords[bRaw] && !/^\d+$/.test(aRaw) && !/^\d+$/.test(bRaw)){
        var aLo = aRaw<bRaw?aRaw:bRaw;
        var bHi = aRaw<bRaw?bRaw:aRaw;
        filters.push(function(x){
          var k = (x.word||'').toLowerCase().replace(/^to\s+/,'').trim();
          return k>=aLo && k<=bHi;
        });
        conds.push('Vokabel '+aLo+'–'+bHi);
      }
    }
  }

  return { matched: filters.length>0, filters: filters, description: conds.join(' UND ') };
}

// T2LetterField: parens are shown as static hints; only actual letters are fillable tiles.
function T2LetterField({ word, onCorrect, onWrong }) {
  var layout = useMemo(function(){ return buildT2Layout(word); }, [word]);
  var initLetters = useMemo(function(){
    var real = layout.targetNoSpaces.split('').map(function(l,i){return{l:l,id:'t2_'+i,dummy:false};});
    return shuffleArr(real);
  },[word]);
  var [tiles, setTiles] = useState(initLetters);
  var [answer, setAnswer] = useState([]);
  var [checked, setChecked] = useState(false);
  var [correct, setCorrect] = useState(false);
  useEffect(function(){ setTiles(initLetters); setAnswer([]); setChecked(false); setCorrect(false); }, [word]);
  var complete = answer.length === layout.targetNoSpaces.length;
  function addLetter(tile){
    if(checked) return;
    setAnswer(function(a){ return a.concat([tile]); });
    setTiles(function(t){ return t.filter(function(x){ return x.id!==tile.id; }); });
  }
  function removeLast(){
    if(checked||answer.length===0) return;
    var last = answer[answer.length-1];
    setAnswer(function(a){ return a.slice(0,-1); });
    setTiles(function(t){ return t.concat([last]); });
  }
  function check(){
    var typed = answer.map(function(t){return t.l;}).join('');
    var ok = typed.toLowerCase() === layout.targetNoSpaces.toLowerCase();
    setChecked(true); setCorrect(ok);
    setTimeout(function(){ if(ok) onCorrect(); else onWrong(typed); }, ok?600:0);
  }
  var slotIdx = 0;
  var displayItems = layout.items.map(function(it,i){
    if(it.type==='space') return <span key={'sp'+i} style={{width:12,display:'inline-block'}}/>;
    if(it.type==='static') return <span key={'st'+i} style={{fontSize:13,color:G600,fontStyle:'italic',padding:'0 4px',whiteSpace:'nowrap'}}>{it.text}</span>;
    var thisIdx = slotIdx++;
    var filled = answer[thisIdx];
    var bg = checked ? (correct?'#d1fae5':'#fee2e2') : (filled?'white':G50);
    var bd = checked ? (correct?GR:RE) : (filled?T:G200);
    var col = checked ? (correct?'#065f46':'#991b1b') : (filled?T:G400);

  });

function LernVerlaufChart({ sessions, todayExtraSec, requiredMinPerDay, targetDate, title }) {
  var today = new Date().toISOString().slice(0,10);
  var byDate = {};
  (sessions||[]).forEach(function(s){
    if(!byDate[s.d]) byDate[s.d]={dur:0};
    byDate[s.d].dur+=(s.dur||0);
  });
  var days = [];
  for(var i=29;i>=0;i--){
    var dt=new Date(); dt.setDate(dt.getDate()-i);
    var k=dt.toISOString().slice(0,10);
    days.push({k:k, dur:byDate[k]?byDate[k].dur:0, isToday:i===0});
  }
  var todayDur=(byDate[today]?byDate[today].dur:0)+(todayExtraSec||0);
  days[days.length-1].dur = todayDur;
  var todayMin = Math.round(todayDur/60);
  var maxMin = days.reduce(function(m,d){return Math.max(m, Math.round(d.dur/60));},0);
  var soll = requiredMinPerDay||0;
  var yMax = Math.max(maxMin, soll, 30);
  var totalMin = days.reduce(function(s,d){return s+Math.round(d.dur/60);},0);
  var avgMin = Math.round(totalMin/30);
  // Anzahl Lerntage / freie Tage + aktuelle Serie (aufeinanderfolgende Lerntage bis heute/gestern)
  var learnedDays = days.filter(function(d){return d.dur>0;}).length;
  var streak = 0;
  for(var si=days.length-1; si>=0; si--){ if(days[si].dur>0){ streak++; } else if(si===days.length-1){ continue; /* heute noch 0 → zählt nicht als Abbruch */ } else { break; } }
  function wdOf(k){ var p=k.split('-'); return new Date(+p[0],+p[1]-1,+p[2]).getDay(); } // 0=So..6=Sa
  var C_NONE='#cbd5e1'; // Grau für Tage ohne Lernen (deutlich sichtbarer Punkt)
  var W=320,H=150,pL=28,pB=30,pR=6,pT=10;
  var cW=W-pL-pR, cH=H-pB-pT;
  var slot=cW/30, bW=Math.max(3,slot-2);
  var baseY=pT+cH;
  var yFor = function(v){ return pT+cH-(v/yMax)*cH; };
  return(
    <div style={{background:G50,borderRadius:10,padding:'8px 8px 4px 8px',marginBottom:8}}>
      <div style={{display:'flex',justifyContent:'space-between',alignItems:'center',marginBottom:4}}>
        <span style={{fontSize:11,fontWeight:'bold',color:G900}}>{title||'Lernverlauf'}</span>
        <span style={{fontSize:10,color:G400}}>letzte 30 Tage · ⌀ {avgMin} Min/Tag</span>
      </div>
      <svg width="100%" viewBox={'0 0 '+W+' '+H} style={{display:'block'}}>
        {/* Wochenend-Tönung + Tages-Slots: jeder Tag ist ein sichtbarer Bereich */}
        {days.map(function(day,i){
          var x=pL+i*slot; var w=wdOf(day.k); var wknd=(w===0||w===6);
          return <g key={'bg'+day.k}>
            {wknd&&<rect x={x} y={pT} width={slot} height={cH} fill="#0f172a" opacity={0.05}/>}
            {w===1&&i>0&&<line x1={x} x2={x} y1={pT} y2={baseY} stroke={G200} strokeWidth={0.5}/>}
          </g>;
        })}
        {[0,0.5,1].map(function(f,i){
          var v=Math.round(yMax*f);
          var y=yFor(v);
          return <g key={i}>
            <text x={pL-3} y={y+3} fontSize={7} fill={G400} textAnchor="end">{v}m</text>
            <line x1={pL} y1={y} x2={W-pR} y2={y} stroke={G200} strokeWidth={0.5}/>
          </g>;
        })}
        <line x1={pL} y1={baseY} x2={W-pR} y2={baseY} stroke={G400} strokeWidth={0.75}/>
        {days.map(function(day,i){
          var x=pL+i*slot, cx=x+slot/2;
          var dMin=Math.round(day.dur/60);
          var w=wdOf(day.k);
          // Datum an jedem Montag + heute; sonst kein Label (sonst zu voll)
          var lbl=day.isToday?'Heute':((w===1&&i<days.length-3)?((+day.k.slice(8))+'.'+(+day.k.slice(5,7))+'.'):null);
          var labelEl=lbl?<text x={cx} y={H-16} fontSize={7} fill={day.isToday?T:G600} textAnchor="middle" fontWeight={day.isToday?'bold':'normal'}>{lbl}</text>:null;
          var wdEl=<text x={cx} y={H-6} fontSize={6} fill={day.isToday?T:G400} textAnchor="middle" fontWeight={day.isToday?'bold':'normal'}>{'MDMDFSS'[(w+6)%7]}</text>;
          if(dMin<=0){
            // Tag OHNE Lernen: klar erkennbarer grauer Punkt an der Grundlinie
            return <g key={day.k}>
              {day.isToday&&<rect x={x} y={pT} width={slot} height={cH} fill={T} opacity={0.10} rx={1}/>}
              <circle cx={cx} cy={baseY-2} r={1.6} fill={C_NONE}/>
              {labelEl}{wdEl}
            </g>;
          }
          var y=yFor(dMin);
          var col=day.dur>=900?GR:day.dur>=300?AM:'#5eead4';
          return <g key={day.k}>
            {day.isToday&&<rect x={x} y={pT} width={slot} height={cH} fill={T} opacity={0.10} rx={1}/>}
            <rect x={cx-bW/2} y={y} width={bW} height={Math.max(3,baseY-y)} fill={col} rx={1}/>
            {labelEl}{wdEl}
          </g>;
        })}
        {soll>0 && <g>
          <line x1={pL} x2={W-pR} y1={yFor(soll)} y2={yFor(soll)} stroke="#dc2626" strokeWidth={1.5} strokeDasharray="4 3"/>
          <text x={W-pR-2} y={yFor(soll)-2} fontSize={8} fill="#dc2626" textAnchor="end" fontWeight="bold">Soll {soll}m{targetDate?' bis '+targetDate.slice(5):''}</text>
        </g>}
      </svg>
      <div style={{marginTop:4,display:'flex',justifyContent:'space-between',fontSize:10,color:G600}}>
        <span>Heute: <span style={{fontWeight:'bold',color:todayMin>=15?GR:todayMin>=5?AM:G600}}>{todayMin} Min</span></span>
        <span>Gelernt: <span style={{fontWeight:'bold',color:G900}}>{learnedDays}</span>/30 Tage{streak>1?<span style={{color:AM}}> · 🔥 {streak}</span>:null}</span>
        <span>Σ 30T: <span style={{fontWeight:'bold'}}>{totalMin} Min</span></span>
      </div>
      <div style={{display:'flex',gap:8,fontSize:9,color:G400,marginTop:4,justifyContent:'center',flexWrap:'wrap'}}>
        <span><span style={{color:GR}}>&#9632;</span> ≥15 Min</span>
        <span><span style={{color:AM}}>&#9632;</span> 5-14 Min</span>
        <span><span style={{color:'#5eead4'}}>&#9632;</span> &lt;5 Min</span>
        <span><span style={{color:C_NONE}}>&#9679;</span> kein Lernen</span>
      </div>
    </div>
  );
}

function LeitersSpielSession({ run, player, chapters, onDone, onUpdateScore, streak: streakProp, setPlayer }) {
  var streak = Object.assign({}, DEFAULT_STREAK, streakProp || {});
  var [data, setData] = useState(null);
  var [dataLoading, setDataLoading] = useState(true);
  var [phase, setPhase] = useState('pick');
  var [current, setCurrent] = useState(null);
  var [input, setInput] = useState('');
  var [result, setResult] = useState(null);
  var [streakCount, setStreakCount] = useState(0);
  var [celebration, setCelebration] = useState(null);
  var [sessionLog, setSessionLog] = useState([]);
  var [quizOptions, setQuizOptions] = useState([]);
  var [quizChosen, setQuizChosen] = useState(null);
  var [sesStart, setSesStart] = useState(null);
  var [sesAns, setSesAns] = useState(0);
  var [sesCor, setSesCor] = useState(0);
  var [testWords, setTestWords] = useState([]);
  var [testIdx, setTestIdx] = useState(0);
  var [testLog, setTestLog] = useState([]);
  var [expandedTestIdx, setExpandedTestIdx] = useState(null);
  var sesLastActive = useRef(null);
  var sesActiveSec = useRef(0);
  var inputRef = useRef();

  useEffect(function(){
    if(!player||!run) return;
    var runWords=[]; try{runWords=typeof run.words==='string'?JSON.parse(run.words||'[]'):(run.words||[]);}catch(e){}
    var runSents=[]; try{runSents=typeof run.sentences==='string'?JSON.parse(run.sentences||'[]'):(run.sentences||[]);}catch(e){}
    function reconcile(d){
      if(!d || !d.pots) return lsInitProgress(runWords, runSents);
      var runKeys = {};
      runWords.forEach(function(w){ runKeys[normWordKey(w.word)] = w; });
      var seen = {};
      var newPots = {1:[],2:[],3:[],4:[],5:[],6:[]};
      [1,2,3,4,5,6].forEach(function(pot){
        (d.pots[pot]||[]).forEach(function(w){
          var k = normWordKey(w.word);
          if(!runKeys[k] || seen[k]) return;
          seen[k] = 1;
          newPots[pot].push(w);
        });
      });
      runWords.forEach(function(w){
        var k = normWordKey(w.word);
        if(!seen[k]) newPots[1].push({word:w.word, clue:w.clue, type:w.type||'noun', chapterId:w.chapterId||'', streak:0, wrongStreak:0});
      });
      return Object.assign({}, d, {pots:newPots});
    }
    lsGetProgress(player.id, run.id).then(function(rows){
      if(Array.isArray(rows)&&rows.length>0){
        var row=rows[0];
        var d=parseData(row.data);
        var reconciled = reconcile(d);
        var beforeCount = [1,2,3,4,5,6].reduce(function(s,p){return s+((d.pots&&d.pots[p])||[]).length;},0);
        var afterCount = [1,2,3,4,5,6].reduce(function(s,p){return s+reconciled.pots[p].length;},0);
        setData(reconciled);
        if(beforeCount !== afterCount){
          lsSaveProgress(player.id, run.id, reconciled);
        }
      } else {
        setData(lsInitProgress(runWords, runSents));
      }
      setDataLoading(false);
    }).catch(function(){
      setData(lsInitProgress(runWords, runSents));
      setDataLoading(false);
    });
  },[]);

  useEffect(function(){ if(inputRef.current && (phase==='answer'||phase==='dashes'||phase==='test_q')) inputRef.current.focus(); },[phase,testIdx]);

  useEffect(function(){
    var active=phase==='test_q'||phase==='test_show'||phase==='satzmeister'||phase==='satzquiz';
    if(!active) return;
    var id=setInterval(trackActiveTime,120000);
    return function(){clearInterval(id);};
  },[phase]);

  function saveAndUpdate(newData){
    lsSaveProgress(player.id, run.id, newData);
    setData(newData);
  }
  function trackActiveTime(){
    var now=Date.now();
    var prev=sesLastActive.current||(sesStart?sesStart:null);
    if(prev){ var gap=(now-prev)/1000; if(gap<=300) sesActiveSec.current+=gap; }
    sesLastActive.current=now;
  }

  function saveSession(currentData) {
    if(!sesStart || sesAns===0) return currentData;
    var dur = Math.round(sesActiveSec.current);
    if(dur < 10) return currentData;
    var pct = lsPercent(currentData);
    var today = new Date().toISOString().slice(0,10);
    var session = {d:today, ts:sesStart, dur:dur, ans:sesAns, cor:sesCor, pct:pct};
    var nd = JSON.parse(JSON.stringify(currentData));
    if(!nd.sessions) nd.sessions=[];
    nd.sessions.push(session);
    if(nd.sessions.length>180) nd.sessions=nd.sessions.slice(-180);
    setSesStart(null); setSesAns(0); setSesCor(0); sesLastActive.current=null; sesActiveSec.current=0;
    return nd;
  }

  function pickWord(){
    if(!sesStart) setSesStart(Date.now());
    var w = lsPickWord(data, current ? current.word : null);
    if(!w){ setPhase('done'); return; }
    setCurrent(w); setInput(''); setResult(null);
    if(w.pot===1){
      var allWords=[];
      [1,2,3,4,5,6].forEach(function(pot){(data.pots[pot]||[]).forEach(function(ww){allWords.push(ww);});});
      var wType=getWordType(w);
      var sameType=allWords.filter(function(ww){return normWordKey(ww.word)!==normWordKey(w.word)&&getWordType(ww)===wType;});
      var quizPool=sameType.length>=3?sameType:allWords.filter(function(ww){return normWordKey(ww.word)!==normWordKey(w.word);});
      var others=shuffleArr(quizPool).slice(0,3);
      setQuizOptions(shuffleArr([{word:w.word,clue:w.clue}].concat(others.map(function(d){return {word:d.word,clue:d.clue};}))));
      setQuizChosen(null); setPhase('quiz');
    } else if(w.pot===2){
      setPhase('t2');
    } else if(w.pot===3){
      setPhase('dashes');
    } else {
      setPhase('answer');
    }
  }

  function submitDispute(type){
    if(!current||!player) return;
    var payload={player_id:player.id,player_name:player.name,run_id:run.id,
      word:current.word,clue:current.clue,typed_answer:result?result.typed:'',
      pot:current.pot,chapter_id:'',status:'open',dispute_type:type,
      created_at:new Date().toISOString()};
    sbPost('word_disputes',payload).then(function(res){
      if(!res||res._err){alert('⚠️ Fehler beim Senden – bitte Admin kontaktieren.');return;}
      if(type==='unimportant') alert('✅ Meldung gesendet. Admin prüft die Anfrage.');
      else alert('✅ Anfrage gesendet. Admin prüft deine Antwort.');
    }).catch(function(){alert('⚠️ Verbindungsfehler beim Senden.');});
  }

  function handleQuizAnswer(opt){
    if(quizChosen) return;
    setQuizChosen(opt);
    var correct=normWordKey(opt.word)===normWordKey(current.word);
    setSesAns(function(n){return n+1;}); if(correct) setSesCor(function(n){return n+1;}); trackActiveTime();
    var newData=JSON.parse(JSON.stringify(data));
    var reqStreak=((streak.upThresholds||DEFAULT_STREAK.upThresholds)[1])||2;
    var potArr=(newData.pots[1]||[]);
    var wIdx=potArr.findIndex(function(w){return normWordKey(w.word)===normWordKey(current.word);});
    if(wIdx<0)wIdx=potArr.findIndex(function(w){return w.word===current.word;});
    var wObj=wIdx>=0?potArr.splice(wIdx,1)[0]:{word:current.word,clue:current.clue,streak:0};
    var newStreak=correct?(wObj.streak||0)+1:0;
    var moveTo=1;
    if(correct&&newStreak>=reqStreak){moveTo=2;newStreak=0;}
    wObj.streak=newStreak; wObj.correct=(wObj.correct||0)+(correct?1:0); wObj.wrong=(wObj.wrong||0)+(!correct?1:0);
    trackPot(wObj,1,correct);
    if(!newData.pots[moveTo])newData.pots[moveTo]=[];
    newData.pots[moveTo].push(wObj);
    if(correct)newData.totalCorrect=(newData.totalCorrect||0)+1;
    else newData.totalWrong=(newData.totalWrong||0)+1;
    tallyAnswer(correct);
    lsLogAnswer(newData,{word:current.word,clue:current.clue,correct:correct,fromPot:1,toPot:moveTo,
      pctBefore:lsPercent(data), pctAfter:lsPercent(newData)});
    saveAndUpdate(newData);
    var pts=correct?5:0;
    if(pts>0&&onUpdateScore)onUpdateScore(pts);
    if(pts>0&&setPlayer)setPlayer(function(p){return Object.assign({},p,{total_score:(p.total_score||0)+pts});});
    var log={word:current.word,clue:current.clue,typed:opt.word,correct:correct,partial:false,fromPot:1,toPot:moveTo,pts:pts};
    setSessionLog(function(l){return l.concat([log]);});
    if(correct&&moveTo===6)setCelebration('🏆 "'+current.word+'" gelernt!');
    setTimeout(function(){
      setResult({correct:correct,word:current.word,clue:current.clue,answer:current.word,typed:opt.word,fromPot:1,toPot:moveTo,pts:pts,newStreak:newStreak,reqStreak:reqStreak});
      setPhase('showResult');
    }, correct?800:1500);
  }

  function submitAnswer(){
    if(!current) return;
    var typed = input.trim();
    var fromPot = current.pot;
    var isPot5 = fromPot === 5;
    var correctAnswer = isPot5 ? current.clue : wordDisplay(current);
    var status = checkAnswer(typed, correctAnswer);
    var correct = status==='correct'||status==='partial';
    setSesAns(function(n){return n+1;}); if(correct) setSesCor(function(n){return n+1;}); trackActiveTime();
    var newData = JSON.parse(JSON.stringify(data));
    var reqStreak = ((streak.upThresholds||DEFAULT_STREAK.upThresholds)[fromPot])||2;
    var potArr = (newData.pots[fromPot]||[]);
    var wIdx = potArr.findIndex(function(w){ return normWordKey(w.word)===normWordKey(current.word); });
    if(wIdx<0) wIdx = potArr.findIndex(function(w){ return w.word===current.word; });
    var wObj = wIdx>=0 ? potArr[wIdx] : {word:current.word,clue:current.clue,streak:0};
    if(wIdx>=0) potArr.splice(wIdx,1);
    var newStreak = correct ? (wObj.streak||0)+1 : 0;
    var moveTo = fromPot;
    if(correct && newStreak>=reqStreak){
      moveTo = fromPot<(streak.pots||6) ? fromPot+1 : fromPot;
      newStreak = 0;
    } else if(!correct && fromPot>1){
      moveTo = fromPot-1; newStreak=0;
    }
    wObj.streak = newStreak;
    wObj.correct = (wObj.correct||0) + (correct?1:0);
    wObj.wrong = (wObj.wrong||0) + (!correct?1:0);
    trackPot(wObj,fromPot,correct);
    if(!(newData.pots[moveTo])) newData.pots[moveTo]=[];
    newData.pots[moveTo].push(wObj);
    if(correct) newData.totalCorrect=(newData.totalCorrect||0)+1;
    else newData.totalWrong=(newData.totalWrong||0)+1;
    tallyAnswer(correct);
    lsLogAnswer(newData,{word:current.word,clue:current.clue,correct:correct,fromPot:fromPot,toPot:moveTo,
      pctBefore:lsPercent(data), pctAfter:lsPercent(newData)});
    saveAndUpdate(newData);

    var pts = correct ? (fromPot*5+(status==='partial'?1:0)) : 0;
    if(pts>0 && onUpdateScore) onUpdateScore(pts);
    if(pts>0 && setPlayer) setPlayer(function(p){ return Object.assign({},p,{total_score:(p.total_score||0)+pts}); });

    var newSc = correct ? streakCount+1 : 0;
    setStreakCount(newSc);
    var log = {word:current.word,clue:current.clue,typed:typed,correct:correct,partial:status==='partial',fromPot:fromPot,toPot:moveTo,pts:pts};
    setSessionLog(function(l){return l.concat([log]);});
    setResult({correct:correct,partial:status==='partial',answer:correctAnswer,word:current.word,clue:current.clue,typed:typed,fromPot:fromPot,toPot:moveTo,pts:pts,newStreak:newStreak,reqStreak:reqStreak});
    setPhase('showResult');
    if(correct && moveTo===6 && fromPot!==6) setCelebration('🏆 "'+current.word+'" gelernt!');
  }

  function nextWord(){
    setResult(null); setCelebration(null);
    var allDone = (data.pots[6]||[]).length >= Object.values(data.pots).reduce(function(s,a){return s+a.length;},0);
    if(allDone){ setPhase('done'); return; }
    pickWord();
  }

  // Notenschlüssel für 10 Vokabeln: 0F→1, 1F→2, 2F→3, 3-4F→4, 5-6F→5, 7+F→6
  function testGradeFor(errors){
    if(errors<=0) return 1;
    if(errors<=1) return 2;
    if(errors<=2) return 3;
    if(errors<=4) return 4;
    if(errors<=6) return 5;
    return 6;
  }
  // Gewichtete Auswahl aus Vokabeln + zugewiesenen Sätzen. Pro Netto-Falsch-Antwort +20% Gewicht.
  function pickTestItems(d, sentences, count){
    var pool = [];
    [1,2,3,4,5,6].forEach(function(pot){
      (d.pots[pot]||[]).forEach(function(w){
        pool.push({item:Object.assign({},w,{pot:pot,kind:'word'}), weight:1+0.2*Math.max(0,(w.wrong||0)-(w.correct||0))});
      });
    });
    (sentences||[]).forEach(function(s){
      pool.push({item:Object.assign({},s,{kind:'sentence'}), weight:1});

      pool.splice(selIdx,1);
    }
    return picked;

            return <div key={i} style={{display:'flex',alignItems:'center',gap:8,padding:'5px 8px',marginBottom:3,borderRadius:7,background:l.correct?'#d1fae5':l.skipped?G50:'#fee2e2',fontSize:11}}>
              <span>{l.correct?'✓':l.skipped?'⏭':'✗'}</span>
              <span style={{fontWeight:'bold',flex:1}}>{l.word}</span>
              <span style={{color:G400}}>{l.clue}</span>

        <button onClick={function(){var nd=saveSession(data);if(nd!==data){lsSaveProgress(player.id,run.id,nd);}onDone();}} style={BtnStyle(T,'white',{width:'100%',padding:'12px'})}>← Zurück</button>
      </div>
    );

  if(phase==='satzmeister'){
    var smW=(function(){
      var rw=[]; try{rw=typeof run.words==='string'?JSON.parse(run.words||'[]'):(run.words||[]);}catch(e){}
      if(rw.length>0) return rw;
      var w=[]; [1,2,3,4,5].forEach(function(p){(data.pots[p]||[]).forEach(function(ww){w.push(ww);});});
      return w;
    })();
    return <div>{liveChip}<SatzmeisterGame words={smW} runId={run.id} runName={run.name} player={player} onUpdateScore={onUpdateScore} setPlayer={setPlayer} onDone={function(){trackActiveTime();setPhase('pick');}}/></div>;
  }
  if(phase==='satzquiz'){
    var sqW=(function(){
      var rw=[]; try{rw=typeof run.words==='string'?JSON.parse(run.words||'[]'):(run.words||[]);}catch(e){}
      if(rw.length>0) return rw;
      var w=[]; [1,2,3,4,5].forEach(function(p){(data.pots[p]||[]).forEach(function(ww){w.push(ww);});});
      return w;
    })();
    return <div>{liveChip}<SatzquizGame words={sqW} runId={run.id} runName={run.name} player={player} onUpdateScore={onUpdateScore} setPlayer={setPlayer} onDone={function(){trackActiveTime();setPhase('pick');}}/></div>;
  }
  return null;
}

function generateSentences(words, runName, forceNew) {
  var picked = shuffleArr(words).slice(0, Math.min(10, words.length));
  var wordList = picked.map(function(w){return '"'+w.word+'" ('+w.clue+')';}).join(', ');
  var prompt = 'Erstelle für jede dieser englischen Vokabeln genau einen kurzen einfachen englischen Satz (max. 10 Wörter) für Schüler (10-12 Jahre). Thema des Lernsets: "'+runName+'".\nVokabeln: '+wordList+'\nErsetze die Vokabel im Satz durch "___".\nAntworte NUR mit einem JSON-Array, ein Objekt pro Vokabel: [{"sentence":"...","answer":"englisches Wort","clue":"deutsche Übersetzung"}]. Kein Markdown, keine Erklärungen.';
  var cacheKey = 'satz_' + runName.replace(/[^a-zA-Z0-9]/g,'_').substring(0,40);
  function callApi(key) {
    return fetch('https://api.anthropic.com/v1/messages',{
      method:'POST',
      headers:{'Content-Type':'application/json','x-api-key':key,'anthropic-version':'2023-06-01','anthropic-dangerous-direct-browser-access':'true'},
      body:JSON.stringify({model:'claude-haiku-4-5-20251001',max_tokens:2000,messages:[{role:'user',content:prompt}]})
    }).then(function(r){return r.json();}).then(function(d){
      if(d.error) throw new Error(d.error.message||'API Fehler');
      var text=d.content&&d.content[0]&&d.content[0].text||'';
      var m=text.match(/\[[\s\S]*\]/);
      if(!m) throw new Error('Kein JSON in Antwort');
      var sents=JSON.parse(m[0]);
      fetch(SB_URL+'/rest/v1/settings',{method:'POST',headers:Object.assign({},HW_POST,{'Prefer':'resolution=merge-duplicates,return=minimal'}),body:JSON.stringify({key:cacheKey,value:JSON.stringify(sents)}),mode:'cors',credentials:'omit'});
      return sents;
    });
  }
  function generate() {
    return fetch(SB_URL+'/rest/v1/rpc/get_claude_key',{method:'POST',headers:HW_POST,body:'{}',mode:'cors',credentials:'omit'})
      .then(function(r){return r.json();})
      .then(function(key){
        if(!key) key=localStorage.getItem('claude_api_key')||'';
        if(!key) return Promise.reject(new Error('Kein API-Key hinterlegt'));
        return callApi(key);
      });
  }
  if(forceNew) return generate();
  return sbGet('settings','key=eq.'+encodeURIComponent(cacheKey)).then(function(cached){
    if(cached&&cached[0]&&cached[0].value){
      try{var p=JSON.parse(cached[0].value);if(Array.isArray(p)&&p.length>0)return p;}catch(e){}
    }
    return generate();
  });
}

function SatzmeisterGame({ words, runId, runName, player, onUpdateScore, setPlayer, onDone }) {
  var [sentences, setSentences] = useState(null);
  var [loadErr, setLoadErr] = useState('');
  var [idx, setIdx] = useState(0);
  var [input, setInput] = useState('');
  var [hints, setHints] = useState(0);
  var [revealed, setRevealed] = useState([]);
  var [gPhase, setGPhase] = useState('q');
  var [lastOk, setLastOk] = useState(false);
  var [lastPts, setLastPts] = useState(0);
  var [lastSkip, setLastSkip] = useState(false);
  var [total, setTotal] = useState(0);
  var [regenKey, setRegenKey] = useState(0);
  var ref = useRef(null);

  useEffect(function(){
    setSentences(null); setLoadErr(''); setIdx(0); setTotal(0); setHints(0); setRevealed([]); setGPhase('q');
    function start(ws) {
      if(!ws||!ws.length){setLoadErr('Keine Vokabeln (v4, words='+JSON.stringify((words||[]).length)+', runId='+runId+')');setSentences([]);return;}
      generateSentences(ws, runName, regenKey>0).then(function(s){setSentences(s);})
        .catch(function(e){setLoadErr(e.message||'Fehler');setSentences([]);});
    }
    if(words&&words.length){start(words);return;}
    if(runId){
      sbGet('ls_runs','id=eq.'+runId+'&select=words').then(function(rows){
        var rw=[]; try{var raw=rows&&rows[0]&&rows[0].words;rw=typeof raw==='string'?JSON.parse(raw||'[]'):(raw||[]);}catch(e){}
        start(rw);
      }).catch(function(){start([]);});
    } else { start([]); }
  },[regenKey]);

  useEffect(function(){if(ref.current&&gPhase==='q')ref.current.focus();},[idx,gPhase]);

  if(!sentences) return <div style={{padding:40,textAlign:'center'}}><div style={{fontSize:28,marginBottom:8}}>🤖</div><div style={{fontSize:13,color:G400}}>Generiere Sätze…</div></div>;
  if(loadErr||!sentences.length) return <div style={{padding:20,textAlign:'center'}}><div style={{color:RE,fontSize:13,marginBottom:12}}>{loadErr||'Keine Sätze generiert.'}</div><button onClick={onDone} style={BtnStyle(G100,G600,{padding:'10px 24px'})}>← Zurück</button></div>;
  if(idx>=sentences.length) return <div style={{padding:24,textAlign:'center'}}><div style={{fontSize:48,marginBottom:8}}>🏆</div><div style={{fontSize:22,fontWeight:'bold',color:T,marginBottom:4}}>Satzmeister!</div><div style={{fontSize:16,color:G600,marginBottom:20}}>{total} Punkte</div><div style={{display:'flex',gap:8,justifyContent:'center'}}><button onClick={function(){setRegenKey(function(k){return k+1;});}} style={BtnStyle('#0ea5e9','white',{padding:'12px 20px',fontSize:14})}>↺ Neue Sätze</button><button onClick={onDone} style={BtnStyle(T,'white',{padding:'12px 20px',fontSize:14})}>← Zurück</button></div></div>;

  var sent = sentences[idx];
  var answer = (sent.answer||'').trim();
  var letters = answer.split('');
  var nonSpace = letters.reduce(function(a,l,i){if(!/\s/.test(l))a.push(i);return a;},[]);
  var parts = sent.sentence.split('___');

  function calcPts(){ return Math.max(0, 10-hints*2); }

  function makeDisplay(){
    if(hints===0) return null;
    return letters.map(function(l,i){
      if(/\s/.test(l)) return ' ';
      if(hints===1) return '_';
      if(i===0) return l;
      return revealed.indexOf(i)>=0?l:'_';
    }).join('');
  }

  function isAllRevealed(){
    if(hints<2) return false;
    return nonSpace.every(function(i){return i===0||revealed.indexOf(i)>=0;});
  }

  function addHint(){
    var nh=hints+1;
    if(nh>=3){
      var hidden=nonSpace.filter(function(i){return i>0&&revealed.indexOf(i)<0;});
      if(hidden.length>0){
        var pick=hidden[Math.floor(Math.random()*hidden.length)];
        setRevealed(function(r){return r.concat([pick]);});
      }
    }
    setHints(nh);
  }

  function submit(){
    var typed=input.trim(); if(!typed) return;
    var res=checkAnswer(typed,answer);
    var ok=res==='correct'||res==='partial';
    tallyAnswer(ok);
    var pts=ok?calcPts():0;
    if(pts>0&&onUpdateScore) onUpdateScore(pts);
    if(pts>0&&setPlayer) setPlayer(function(p){return Object.assign({},p,{total_score:(p.total_score||0)+pts});});
    setTotal(function(t){return t+pts;});
    setLastOk(ok); setLastPts(pts); setLastSkip(false); setGPhase('a');
  }

  function skip(){ setLastOk(false); setLastPts(0); setLastSkip(true); setGPhase('a'); }

  function next(){
    setIdx(function(i){return i+1;});
    setInput(''); setHints(0); setRevealed([]);
    setLastOk(false); setLastPts(0); setLastSkip(false); setGPhase('q');
  }

  var wordDisplay=makeDisplay();

  if(gPhase==='a') return(
    <div style={{padding:16}}>
      <div style={{fontSize:11,color:G400,marginBottom:12}}>Satz {idx+1} / {sentences.length}</div>
      <div style={{borderRadius:14,padding:16,marginBottom:12,background:lastSkip?G50:lastOk?'#d1fae5':'#fee2e2',border:'2px solid '+(lastSkip?G200:lastOk?GR:RE)}}>
        <div style={{fontSize:16,fontWeight:'bold',color:lastSkip?G600:lastOk?'#065f46':'#991b1b',marginBottom:6}}>
          {lastSkip?'⏭ Übersprungen':lastOk?'✓ Richtig':'✗ Falsch'}
          {lastPts>0&&<span style={{marginLeft:8,fontSize:14,color:AM}}>+{lastPts} Pkt</span>}
        </div>
        <div style={{fontSize:14,color:G900,lineHeight:1.6,marginBottom:4}}>
          {parts[0]||''}<strong style={{color:T}}>{answer}</strong>{parts[1]||''}
        </div>
        {!lastOk&&!lastSkip&&<div style={{fontSize:11,color:G400}}>Deine Antwort: {input||'–'}</div>}
        <div style={{fontSize:11,color:G400,marginTop:4}}>{sent.clue}</div>
      </div>
      <div style={{fontSize:12,color:G400,marginBottom:12,textAlign:'right'}}>Gesamt: {total} Pkt</div>
      <button onClick={next} style={BtnStyle(T,'white',{width:'100%',padding:'12px',fontSize:15})}>{idx+1>=sentences.length?'Fertig':'→ Weiter'}</button>
    </div>
  );

  return(
    <div style={{padding:16}}>
      <div style={{display:'flex',justifyContent:'space-between',alignItems:'center',marginBottom:12}}>
        <div style={{fontSize:11,color:G400}}>Satz {idx+1} / {sentences.length}</div>
        <div style={{fontSize:13,fontWeight:'bold',color:AM}}>{total} Pkt</div>
      </div>
      <div style={{background:'#eff6ff',borderRadius:14,padding:16,marginBottom:12,border:'1px solid #bfdbfe',fontSize:16,lineHeight:1.8,color:G900}}>
        <span>{parts[0]||''}</span>
        <span style={{display:'inline-block',minWidth:64,textAlign:'center',background:T+'22',borderRadius:6,padding:'0 6px',color:T,fontWeight:'bold',fontFamily:'monospace',letterSpacing:2}}>{wordDisplay||'___'}</span>
        <span>{parts[1]||''}</span>
      </div>
      <div style={{fontSize:11,color:G400,textAlign:'center',marginBottom:12}}>🇩🇪 {sent.clue}</div>
      <div style={{display:'flex',gap:8,marginBottom:10}}>
        <input ref={ref} value={input} onChange={function(e){setInput(e.target.value);}} onKeyDown={function(e){if(e.key==='Enter')submit();}} placeholder="Englische Antwort…" style={{flex:1,padding:'10px 12px',border:'2px solid '+G200,borderRadius:10,fontSize:14,outline:'none'}}/>
        <button onClick={submit} disabled={!input.trim()} style={BtnStyle(T,'white',{padding:'10px 16px',fontSize:15,opacity:!input.trim()?0.5:1})}>✓</button>
      </div>
      <div style={{display:'flex',gap:8}}>
        <button onClick={addHint} disabled={isAllRevealed()} style={BtnStyle(isAllRevealed()?G100:'#f59e0b','white',{flex:1,padding:'10px',fontSize:13,opacity:isAllRevealed()?0.4:1})}>
          💡 Tipp{hints>0?' ('+calcPts()+'P)':''}
        </button>
        <button onClick={skip} style={BtnStyle(G100,G400,{flex:1,padding:'10px',fontSize:13})}>⏭ Überspringen</button>
      </div>
      <div style={{marginTop:8,fontSize:10,color:G400,textAlign:'center'}}>{calcPts()>0?'Richtig jetzt = '+calcPts()+' Punkte':'0 Punkte (Wort komplett aufgedeckt)'}</div>
    </div>
  );
}

function SatzquizGame({ words, runId, runName, player, onUpdateScore, setPlayer, onDone }) {
  var [sentences, setSentences] = useState(null);
  var [allOpts, setAllOpts] = useState(null);
  var [loadErr, setLoadErr] = useState('');
  var [idx, setIdx] = useState(0);
  var [chosen, setChosen] = useState(null);
  var [total, setTotal] = useState(0);
  var [regenKey, setRegenKey] = useState(0);

      </div>

function sortWords(words){ return words.slice().sort(function(a,b){return (a.word||'').toLowerCase().localeCompare((b.word||'').toLowerCase());}); }
// ── Kapitel-Leiterspiele (automatisch gepflegt) ──────────────────────────
// Zu jedem Themenkapitel gehört ein Leiterspiel-Run, der genau die ⭐-Wörter
// des Kapitels enthält (`ls_runs.auto_chapter_id` = Kapitel-ID). Ändert der
// Admin die ⭐-Markierung, zieht der Run automatisch nach: neue Wörter kommen
// dazu, entfernte fliegen raus. Der Lernfortschritt bleibt erhalten — das
// Leiterspiel gleicht seine Töpfe beim Öffnen mit den Run-Wörtern ab.
var AUTO_RUN_MIN_WORDS = 2; // darunter lohnt sich kein Run (Leiterspiel braucht ≥2)
function autoRunWordsFor(chapter){
  return safeWords(chapter && chapter.words)
    .filter(function(w){ return w && w.important && w.word; })
    .slice()
    .sort(function(a,b){
      var pa=(a.book_page!=null?a.book_page:99999), pb=(b.book_page!=null?b.book_page:99999);
      if(pa!==pb) return pa-pb;
      var sa=(typeof a.seq==='number'?a.seq:99999), sb=(typeof b.seq==='number'?b.seq:99999);
      if(sa!==sb) return sa-sb;
      return (a.word||'').localeCompare(b.word||'');
    })
    .map(function(w){
      return {word:w.word, clue:w.clue, type:w.type||'noun', chapterId:chapter.id,
        important:true, book_page:w.book_page, pot:1};
    });
}
function autoRunName(chapter){ return chapter.title || 'Kapitel'; }
// Hält den Run eines Kapitels aktuell. `allowCreate` legt fehlende Runs an —
// beim normalen Speichern nur dann, wenn die Sprache dieses Kapitels schon
// Kapitel-Leiterspiele nutzt (sonst würden ungewollt überall Runs entstehen).
function syncAutoRun(chapter, opts){
  opts = opts || {};
  if(!chapter || !chapter.id || !chapter.parent_id) return Promise.resolve(null);
  var words = autoRunWordsFor(chapter);
  return sbGet('ls_runs','auto_chapter_id=eq.'+encodeURIComponent(chapter.id)+'&select=id,name,word_count')
    .then(function(rows){
      var existing = Array.isArray(rows) && rows[0];
      if(existing){
        if(words.length < AUTO_RUN_MIN_WORDS){
          // Kapitel hat keine ⭐-Wörter mehr: Run leeren statt löschen, damit
          // der Fortschritt der Kinder nicht verloren geht.
          if((existing.word_count||0)===0) return {action:'none', run:existing};
        }
        return sbPatch('ls_runs',{name:autoRunName(chapter), words:JSON.stringify(words),
          word_count:words.length, grade:chGrade(chapter), language:chLang(chapter)},
          'id=eq.'+existing.id)
          .then(function(ok){ return {action:ok?'updated':'error', run:existing, count:words.length}; });
      }
      if(!opts.allowCreate || words.length < AUTO_RUN_MIN_WORDS) return {action:'none'};
      var run = {name:autoRunName(chapter), icon:chapter.icon||'🪜', player_id:null,
        is_admin_run:true, word_count:words.length, sentence_count:0,
        grade:chGrade(chapter), language:chLang(chapter), auto_chapter_id:chapter.id,
        words:JSON.stringify(words), sentences:'[]', created_at:new Date().toISOString()};
      return sbPost('ls_runs',run).then(function(res){
        if(res&&res._err) return {action:'error', msg:res.msg};
        return {action:'created', run:res, count:words.length};
      });
    })
    .catch(function(){ return {action:'error'}; });
}
// Existiert in dieser Klasse/Sprache schon mindestens ein Kapitel-Leiterspiel?
function scopeUsesAutoRuns(chapter, allChapters){
  var siblings = (allChapters||[]).filter(function(c){
    return c.parent_id && chGrade(c)===chGrade(chapter) && chLang(c)===chLang(chapter);
  }).map(function(c){ return c.id; });
  if(!siblings.length) return Promise.resolve(false);
  return sbGet('ls_runs','auto_chapter_id=in.('+siblings.map(encodeURIComponent).join(',')+')&select=id&limit=1')
    .then(function(rows){ return Array.isArray(rows) && rows.length>0; })
    .catch(function(){ return false; });
}
// Alle Themenkapitel einer Klasse/Sprache: Runs anlegen bzw. aktualisieren.
function syncAutoRunsForScope(allChapters, sc){
  var list = (allChapters||[]).filter(function(c){
    return c.parent_id && inScope(c, sc) && safeWords(c.words).length>0;
  }).sort(naturalSort);
  return list.reduce(function(p, ch){
    return p.then(function(acc){
      return syncAutoRun(ch, {allowCreate:true}).then(function(r){
        if(r&&r.action==='created') acc.created++;
        else if(r&&r.action==='updated') acc.updated++;
        return acc;
      });
    });
  }, Promise.resolve({created:0, updated:0}));
}

function saveChapterWords(chapter, newWords, allChapters, setChapters, setSaving, setMsg) {
  setSaving(true);
  if(!chapter.id){ setChapters(function(prev){ return prev.map(function(c){return c.id===chapter.id?Object.assign({},c,{words:newWords}):c;}); }); setSaving(false); setMsg('✓ (lokal)'); return; }
  sbPatch('chapters',{words:newWords},'id=eq.'+chapter.id).then(function(ok){
    if(ok){ setChapters(function(prev){ return prev.map(function(c){return c.id===chapter.id?Object.assign({},c,{words:newWords}):c;}); }); setMsg('✓ Gespeichert'); }
    else setMsg('Fehler!');
    setSaving(false);
    if(!ok) return;
    // ⭐-Änderungen ins Kapitel-Leiterspiel durchreichen.
    var updated = Object.assign({}, chapter, {words:newWords});
    scopeUsesAutoRuns(updated, allChapters).then(function(uses){
      return syncAutoRun(updated, {allowCreate:uses});
    }).then(function(r){
      if(r && (r.action==='updated'||r.action==='created')){
        setMsg('✓ Gespeichert · Leiterspiel „'+autoRunName(updated)+'": '+r.count+' ⭐-Wörter');
      }
    }).catch(function(){});
  });
}

  sbPatch('chapters',{sentences:newSentences},'id=eq.'+chapter.id).then(function(ok){

    setSaving(false);

}

function DailyLearnChart({ sessions, run, pacing }) {
  var [range, setRange] = useState('14');
  var byDay = {};
  var earliestSec = null;
  (sessions||[]).forEach(function(s){
    var k, sec, t;
    if(s.started_at){ k = String(s.started_at).slice(0,10); sec = s.active_seconds||0; t = new Date(s.started_at).getTime(); }
    else if(s.d){ k = s.d; sec = s.dur||0; t = (s.ts && new Date(s.ts).getTime()) || new Date(k+'T00:00:00').getTime(); }
    else return;
    byDay[k] = (byDay[k]||0) + sec;
    if(earliestSec===null || t<earliestSec) earliestSec = t;
  });
  var today = new Date(); today.setHours(0,0,0,0);
  var nDays;
  var endDate = today;
  if(range==='all'){
    nDays = earliestSec ? Math.max(7, Math.ceil((today-earliestSec)/86400000)+1) : 14;
  } else if(range==='target' && run && run.target_date){
    var td = new Date(run.target_date+'T00:00:00');
    var startMs = earliestSec || (td-86400000*30);
    var startDate = new Date(startMs); startDate.setHours(0,0,0,0);
    nDays = Math.max(7, Math.ceil((td-startDate)/86400000)+1);
    endDate = td;
  } else {
    nDays = parseInt(range,10) || 14;
  }
  var maxBars = 90;
  if(nDays>maxBars) nDays = maxBars;
  var rows = [];
  for(var i=nDays-1; i>=0; i--){
    var d = new Date(endDate); d.setDate(d.getDate()-i);
    var key = d.toISOString().slice(0,10);
    var dayMs = d.getTime();
    rows.push({ key:key, label:d.getDate()+'.'+(d.getMonth()+1), min:Math.round((byDay[key]||0)/60), isToday:dayMs===today.getTime(), isFuture:dayMs>today.getTime() });
  }
  var required = pacing && pacing.requiredMinPerDay || 0;
  var dataMax = rows.reduce(function(m,r){return Math.max(m,r.min);},0);
  var maxMin = Math.max(dataMax, required, 20);
  var W=320, H=140, PAD_L=28, PAD_B=22, PAD_T=10, PAD_R=8;
  var chartW = W-PAD_L-PAD_R, chartH = H-PAD_T-PAD_B;
  var barW = chartW/rows.length;
  var yFor = function(v){ return PAD_T + chartH - (v/maxMin)*chartH; };
  var totalMin = rows.reduce(function(s,r){return s+r.min;},0);
  var pastDays = rows.filter(function(r){return !r.isFuture;}).length || 1;
  var avgMin = Math.round(totalMin/pastDays);
  var targetX = null;
  if(run && run.target_date){
    var ti = rows.findIndex(function(r){return r.key===run.target_date;});
    if(ti>=0) targetX = PAD_L + ti*barW + barW/2;
  }
  var labelEvery = Math.max(1, Math.ceil(nDays/8));
  var rangeBtns = [['7','7T'],['14','14T'],['30','30T'],['60','60T'],['90','90T'],['all','Alle'],['target','→Ziel']];
  return <div style={{padding:'8px 4px',background:'white',borderRadius:8,border:'1px solid '+G200,marginTop:6}}>
    <div style={{display:'flex',gap:3,padding:'0 6px 6px',flexWrap:'wrap'}}>
      {rangeBtns.map(function(b){
        var disabled = b[0]==='target' && !(run&&run.target_date);
        return <button key={b[0]} disabled={disabled} onClick={function(){setRange(b[0]);}}
          style={{padding:'3px 7px',fontSize:9,border:'1px solid '+(range===b[0]?T:G200),background:range===b[0]?T:'white',color:range===b[0]?'white':disabled?G200:G600,borderRadius:5,cursor:disabled?'not-allowed':'pointer',fontWeight:'bold'}}>{b[1]}</button>;
      })}
    </div>
    <div style={{fontSize:10,color:G600,padding:'0 8px 4px',display:'flex',justifyContent:'space-between',gap:8,flexWrap:'wrap'}}>
      <span><span style={{fontWeight:'bold'}}>📊 {nDays} Tage</span> · ⌀ {avgMin} Min/Tag · Σ {totalMin} Min</span>
      {required>0&&<span style={{color:'#9a3412'}}>Soll: {required} Min/Tag</span>}
    </div>
    <svg width={W} height={H} viewBox={'0 0 '+W+' '+H} style={{maxWidth:'100%',display:'block'}}>
      {[0.25,0.5,0.75,1].map(function(f,i){
        var v=Math.round(maxMin*f);
        return <g key={i}>
          <line x1={PAD_L} x2={W-PAD_R} y1={yFor(v)} y2={yFor(v)} stroke={G100} strokeDasharray='2 2'/>
          <text x={PAD_L-3} y={yFor(v)+3} fontSize='8' fill={G400} textAnchor='end'>{v}</text>
        </g>;
      })}
      {rows.map(function(r,i){
        var x = PAD_L + i*barW;
        var y = yFor(r.min);
        var h = chartH - (y-PAD_T);
        var fill = r.isToday?T:r.isFuture?G100:'#5eead4';
        return <g key={r.key}>
          {r.min>0 && <rect x={x+1} y={y} width={Math.max(1,barW-2)} height={Math.max(0,h)} fill={fill} rx='1'/>}
          {(i%labelEvery===0||r.isToday) && <text x={x+barW/2} y={H-PAD_B+10} fontSize='8' fill={r.isToday?T:G400} textAnchor='middle' fontWeight={r.isToday?'bold':'normal'}>{r.label}</text>}
          {r.min>0 && barW>16 && <text x={x+barW/2} y={y-2} fontSize='8' fill={G600} textAnchor='middle'>{r.min}</text>}
        </g>;
      })}
      {required>0 && yFor(required)>=PAD_T && <g>
        <line x1={PAD_L} x2={W-PAD_R} y1={yFor(required)} y2={yFor(required)} stroke='#dc2626' strokeWidth='1.5' strokeDasharray='4 3'/>
        <text x={W-PAD_R-2} y={yFor(required)-2} fontSize='8' fill='#dc2626' textAnchor='end' fontWeight='bold'>Soll {required}</text>
      </g>}
      {targetX!==null && <g>
        <line x1={targetX} x2={targetX} y1={PAD_T} y2={H-PAD_B} stroke='#7c3aed' strokeWidth='1.5' strokeDasharray='3 2'/>
        <text x={targetX} y={PAD_T+8} fontSize='8' fill='#7c3aed' textAnchor='middle' fontWeight='bold'>🎯 Ziel</text>
      </g>}
    </svg>
  </div>;
}

// ── Daily Goal Tracking ─────────────────────────────────────────
var DAILY_GOAL_SEC = 900; // 15 Minuten

function buildByDay(sessions) {
  var byDay = {};
  (sessions||[]).forEach(function(s){
    var k = s.started_at ? String(s.started_at).slice(0,10) : (s.d||'');
    if(!k) return;
    byDay[k] = (byDay[k]||0) + (s.active_seconds||s.dur||0);
  });
  return byDay;
}

function calcStreakFromByDay(byDay) {
  var today = new Date(); today.setHours(0,0,0,0);
  var todayKey = today.toISOString().slice(0,10);
  var streak = (byDay[todayKey]||0) >= DAILY_GOAL_SEC ? 1 : 0;
  var d = new Date(today); d.setDate(d.getDate()-1);
  for(var i=0; i<365; i++){
    var k = d.toISOString().slice(0,10);
    if((byDay[k]||0) >= DAILY_GOAL_SEC){ streak++; d.setDate(d.getDate()-1); }
    else break;
  }
  return streak;
}

function getWeekDays() {
  var d = new Date(); d.setHours(0,0,0,0);
  var mon = new Date(d); mon.setDate(d.getDate()-((d.getDay()+6)%7));
  var days = [];
  for(var i=0; i<7; i++){ var day=new Date(mon); day.setDate(mon.getDate()+i); days.push(day.toISOString().slice(0,10)); }
  return days;
}

function getWeekKey() { return getWeekDays()[0]; }

// ── Leiterspiel-Fortschritt („wie viel besser geworden?") ────────────────
// Prozent-Verlauf eines Runs: aus dem Tages-Log (p1) und aus den Sessions,
// die es auch für die Zeit vor dem Tages-Log gibt.
function lsPctSeries(data){
  var out = [];
  ((data||{}).sessions||[]).forEach(function(s){ if(s&&s.d&&s.pct!=null) out.push({d:s.d, pct:s.pct}); });
  var days = (data||{}).days||{};
  Object.keys(days).forEach(function(k){ if(days[k]&&days[k].p1!=null) out.push({d:k, pct:days[k].p1}); });
  out.sort(function(a,b){ return a.d<b.d?-1:a.d>b.d?1:0; });
  return out;
}
// Zuwachs seit `fromDay`. Ohne Aktivität in dem Zeitraum: 0 — sonst würde ein
// alter, nicht mehr aktualisierter Session-Wert als frischer Fortschritt
// erscheinen. Als Startwert zählt der früheste belegte Stand im Zeitraum
// (Tages-Log: Stand bei Tagesbeginn, sonst der erste Session-Wert des Tages).
function lsDeltaSince(data, fromDay){
  var d = data||{};
  var days = d.days||{};
  var dayKeys = Object.keys(days).filter(function(k){ return k>=fromDay && days[k] && days[k].p0!=null; }).sort();
  var sess = (d.sessions||[]).filter(function(s){ return s && s.d>=fromDay && s.pct!=null; });
  if(!dayKeys.length && !sess.length) return 0;
  var start = null, startDay = null;
  if(dayKeys.length){ start = days[dayKeys[0]].p0; startDay = dayKeys[0]; }
  if(sess.length && (startDay===null || sess[0].d < startDay)) start = sess[0].pct;
  if(start==null) return 0;
  return Math.round(lsPercent(d)) - Math.round(start);
}
function lsAnswersSince(data, fromDay){
  var d = data||{}, n = 0, days = d.days||{}, counted = {};
  Object.keys(days).forEach(function(k){ if(k>=fromDay){ n += (days[k]||{}).a||0; counted[k]=1; } });
  (d.sessions||[]).forEach(function(s){ if(s && s.d>=fromDay && !counted[s.d]) n += s.ans||0; });
  return n;
}
function lsLearnedInRange(data, fromDay){
  var days = (data||{}).days||{}, n = 0;
  Object.keys(days).forEach(function(k){ if(k>=fromDay) n += ((days[k]||{}).l||[]).length; });
  return n;
}
// Fortschritt pro Leiterspiel: aktueller Stand, Zuwachs der letzten 7 Tage,
// gelernte Vokabeln. Wird im Fortschritt-Tab und in der Admin-Ansicht genutzt.
function LeiterspielFortschritt({ progressRows, runs, title }){
  var today = new Date().toISOString().slice(0,10);
  var cutoff = shiftDay(today,-6);
  var list = (progressRows||[]).map(function(r){
    var run = (runs||[]).find(function(x){ return x.id===r.run_id; });
    if(!run) return null;
    var d = parseData(r.data);
    var pots = d.pots||{};
    var total = [1,2,3,4,5,6].reduce(function(s,p){ return s+((pots[p]||[]).length); },0);
    if(total===0) return null;
    var pct = Math.round(lsPercent(d));
    return {run:run, pct:pct, delta:lsDeltaSince(d, cutoff), total:total,
      learned:(pots[6]||[]).length, almost:(pots[5]||[]).length,
      answers:lsAnswersSince(d, cutoff), newLearned:lsLearnedInRange(d, cutoff)};
  }).filter(Boolean);
  if(list.length===0) return null;
  list.sort(function(a,b){ return b.pct-a.pct; });
  var sumLearned = list.reduce(function(s,x){ return s+x.learned; },0);
  var sumTotal = list.reduce(function(s,x){ return s+x.total; },0);
  var avg = Math.round(list.reduce(function(s,x){ return s+x.pct; },0)/list.length);
  // Zuwachs nur über die Runs mitteln, an denen in der Woche gearbeitet wurde.
  var active = list.filter(function(x){ return x.answers>0; });
  var avgDelta = active.length ? Math.round(active.reduce(function(s,x){ return s+x.delta; },0)/active.length) : 0;
  var weekAnswers = list.reduce(function(s,x){ return s+x.answers; },0);
  var newLearned = list.reduce(function(s,x){ return s+x.newLearned; },0);
  var Kpi = function(p){ return <div style={{flex:1,background:'white',borderRadius:10,border:'1px solid '+G200,padding:'10px 6px',textAlign:'center'}}>
    <div style={{fontSize:16,fontWeight:'bold',color:p.color||T}}>{p.value}</div>
    <div style={{fontSize:9,color:G400,marginTop:2}}>{p.label}</div>

  return <div>
    {title&&<div style={{fontSize:10,fontWeight:'bold',color:G600,marginBottom:6,textTransform:'uppercase',letterSpacing:1}}>{title}</div>}
    <div style={{display:'flex',gap:6,marginBottom:8}}>
      <Kpi value={sumLearned+'/'+sumTotal} label="Vokabeln gelernt"/>
      <Kpi value={avg+'%'} label="Ø Fortschritt"/>
      <Kpi value={(avgDelta>0?'+':'')+avgDelta+'%'} label="7 Tage" color={avgDelta>0?T:avgDelta<0?RE:G400}/>
      <Kpi value={weekAnswers} label="Antw. (7 T.)" color={weekAnswers>0?T:G400}/>
    </div>
    <div style={{background:'white',borderRadius:10,border:'1px solid '+G200,padding:'8px 10px'}}>
      {list.map(function(x){
        var col = x.pct>=80?T:x.pct>=40?AM:RE;
        return <div key={x.run.id} style={{marginBottom:9}}>
          <div style={{display:'flex',alignItems:'center',gap:6,fontSize:11,marginBottom:3}}>
            <span style={{fontSize:14}}>{x.run.icon||'🪜'}</span>
            <span style={{fontWeight:'bold',color:G900,flex:1,overflow:'hidden',textOverflow:'ellipsis',whiteSpace:'nowrap'}}>{x.run.name}</span>
            {x.delta!==0&&<span style={{color:x.delta>0?T:RE,fontWeight:'bold',fontSize:10}}>{x.delta>0?'▲ +':'▼ '}{x.delta}%</span>}
            <span style={{color:col,fontWeight:'bold'}}>{x.pct}%</span>
          </div>
          <div style={{height:7,background:G100,borderRadius:4,overflow:'hidden',position:'relative'}}>
            <div style={{height:'100%',width:Math.max(0,x.pct-Math.max(0,x.delta))+'%',background:col,borderRadius:4,position:'absolute',left:0,top:0}}/>
            {x.delta>0&&<div style={{height:'100%',width:x.delta+'%',background:'#5eead4',position:'absolute',left:Math.max(0,x.pct-x.delta)+'%',top:0}}/>}
          </div>
          <div style={{fontSize:9,color:G400,marginTop:2}}>✅ {x.learned} gelernt · fast geschafft {x.almost} · von {x.total} Vokabeln
            {x.answers>0&&<span> · diese Woche {x.answers} Antworten{x.newLearned>0?', '+x.newLearned+' neu gelernt':''}</span>}</div>
        </div>;
      })}
      <div style={{fontSize:9,color:G400,borderTop:'1px solid '+G100,paddingTop:6}}>Heller Balken = Zuwachs der letzten 7 Tage.</div>
    </div>
  </div>;
}

// Was an einem bestimmten Tag im Leiterspiel passiert ist: Antworten,
// Verbesserung und die einzelnen Vokabeln mit richtig/falsch.
function TagesLeiterspiel({ progressRows, runs, day }){
  var [openRun,setOpenRun] = useState(null);
  var list = (progressRows||[]).map(function(r){
    var run = (runs||[]).find(function(x){ return x.id===r.run_id; });
    var d = parseData(r.data);
    var st = lsDayStats(d, day);
    if(!st || (!st.ans && !(st.learned&&st.learned.length))) return null;
    return {run:run, id:r.run_id, st:st};
  }).filter(Boolean);
  if(list.length===0) return null;
  var totAns = list.reduce(function(s,x){ return s+(x.st.ans||0); },0);
  var totCor = list.reduce(function(s,x){ return s+(x.st.cor||0); },0);
  var totLearned = list.reduce(function(s,x){ return s+((x.st.learned||[]).length); },0);
  var anyExact = list.some(function(x){ return x.st.exact; });
  return <div style={{marginTop:10}}>
    <div style={{fontSize:11,fontWeight:'bold',color:G600,marginBottom:6}}>🪜 Leiterspiel an diesem Tag</div>
    <div style={{display:'flex',gap:6,marginBottom:8}}>
      {[[totAns,'Antworten',T],[totCor,'richtig ✓',T],[totAns-totCor,'falsch ✗',RE],[totLearned,'neu gelernt',AM]].map(function(k,i){
        return <div key={i} style={{flex:1,background:'white',borderRadius:8,border:'1px solid '+G200,padding:'7px 4px',textAlign:'center'}}>
          <div style={{fontSize:15,fontWeight:'bold',color:k[2]}}>{k[0]}</div>
          <div style={{fontSize:9,color:G400}}>{k[1]}</div>
        </div>;
      })}
    </div>
    {list.map(function(x){
      var st = x.st;
      var delta = (st.p0!=null&&st.p1!=null) ? Math.round(st.p1-st.p0) : null;
      var words = st.words ? Object.keys(st.words).map(function(w){ return Object.assign({word:w}, st.words[w]); }) : [];
      words.sort(function(a,b){ return (b.f-b.c)-(a.f-a.c) || (b.c+b.f)-(a.c+a.f); });
      var isOpen = openRun===x.id;
      return <div key={x.id} style={{background:'white',borderRadius:8,border:'1px solid '+G200,padding:'8px 10px',marginBottom:6}}>
        <div onClick={words.length?function(){setOpenRun(isOpen?null:x.id);}:undefined}
          style={{display:'flex',alignItems:'center',gap:6,fontSize:11,cursor:words.length?'pointer':'default'}}>
          <span style={{fontSize:14}}>{(x.run&&x.run.icon)||'🪜'}</span>
          <span style={{fontWeight:'bold',color:G900,flex:1,overflow:'hidden',textOverflow:'ellipsis',whiteSpace:'nowrap'}}>{(x.run&&x.run.name)||'Leiterspiel'}</span>
          {delta!=null&&<span style={{color:delta>0?T:delta<0?RE:G400,fontWeight:'bold'}}>{delta>0?'+':''}{delta}%</span>}
          {words.length>0&&<span style={{color:G400,fontSize:11}}>{isOpen?'▲':'▼'}</span>}
        </div>
        <div style={{fontSize:10,color:G400,marginTop:3}}>
          {st.ans} Antworten · ✓ {st.cor} · ✗ {st.ans-st.cor}
          {st.p1!=null&&<span> · Stand {Math.round(st.p1)}%</span>}
          {(st.learned&&st.learned.length>0)&&<span style={{color:AM,fontWeight:'bold'}}> · 🏆 {st.learned.length} neu gelernt</span>}
        </div>
        {(st.learned&&st.learned.length>0)&&<div style={{fontSize:10,color:G600,marginTop:3}}>
          {st.learned.map(function(w,i){ return <span key={i} style={{display:'inline-block',background:TL,color:TD,borderRadius:5,padding:'1px 5px',marginRight:4,marginTop:3}}>{w}</span>; })}
        </div>}
        {isOpen&&words.length>0&&<div style={{marginTop:7,borderTop:'1px solid '+G100,paddingTop:6}}>
          {words.map(function(w,i){
            return <div key={i} style={{display:'flex',alignItems:'center',gap:6,fontSize:11,padding:'3px 0',borderBottom:i<words.length-1?'1px solid '+G100:'none'}}>
              <span style={{fontWeight:'bold',color:G900,flex:1,overflow:'hidden',textOverflow:'ellipsis',whiteSpace:'nowrap'}}>{w.word}</span>
              <span style={{color:G400,flex:1,overflow:'hidden',textOverflow:'ellipsis',whiteSpace:'nowrap'}}>{w.clue}</span>
              {w.c>0&&<span style={{color:T,fontWeight:'bold'}}>✓{w.c}</span>}
              {w.f>0&&<span style={{color:RE,fontWeight:'bold'}}>✗{w.f}</span>}
              {w.p!=null&&<span style={{color:G400,fontSize:9}}>{w.p===6?'gelernt':'Topf '+w.p}</span>}
            </div>;
          })}
        </div>}
      </div>;
    })}
    {!anyExact&&<div style={{fontSize:9,color:G400}}>Für diesen Tag liegen nur Tageszahlen vor — die einzelnen Vokabeln werden seit dem 4.8.2026 mitgeschrieben.</div>}
  </div>;
}

// Datum-Helfer (UTC-basiert, passend zu started_at.slice(0,10))
function shiftDay(k, delta){ var p=k.split('-'); var d=new Date(Date.UTC(+p[0],+p[1]-1,+p[2])); d.setUTCDate(d.getUTCDate()+delta); return d.toISOString().slice(0,10); }
function weekdayOf(k){ var p=k.split('-'); return new Date(Date.UTC(+p[0],+p[1]-1,+p[2])).getUTCDay(); }
function fmtDayShort(k){ var p=k.split('-'); return (+p[2])+'.'+(+p[1])+'.'; }
var WD_LONG=['Sonntag','Montag','Dienstag','Mittwoch','Donnerstag','Freitag','Samstag'];

// Tag-für-Tag durchblättern: Minuten + was an dem Tag gelernt wurde
function TagesDetail({ sessions, progressRows, runs }) {
  var today = new Date().toISOString().slice(0,10);
  var [sel,setSel] = useState(today);
  var withTime = (sessions||[]).filter(function(s){ return s.started_at && (s.active_seconds||0)>0; });
  var earliest = withTime.length
    ? withTime.map(function(s){return String(s.started_at).slice(0,10);}).reduce(function(a,b){return a<b?a:b;})
    : today;
  if(sel>today) sel=today; if(sel<earliest) sel=earliest;
  var daySessions = (sessions||[]).filter(function(s){ return s.started_at && String(s.started_at).slice(0,10)===sel; });
  var daySec = daySessions.reduce(function(a,s){ return a+(s.active_seconds||0); },0);
  // Antworten des Tages: aus learn_sessions (alle Spiele). Für ältere Tage
  // ohne diese Zähler springt der Leiterspiel-Block darunter ein.
  var dayAns = daySessions.reduce(function(a,s){ return a+(s.correct_count||0)+(s.wrong_count||0); },0);
  var dayCor = daySessions.reduce(function(a,s){ return a+(s.correct_count||0); },0);
  var canPrev = sel>earliest, canNext = sel<today;
  var label = sel===today ? 'Heute' : sel===shiftDay(today,-1) ? 'Gestern' : WD_LONG[weekdayOf(sel)];
  var navBtn=function(dir,enabled){
    // Funktionaler Updater + Clamping: auch schnelle Doppel-Taps zählen sauber weiter.
    return <button disabled={!enabled} onClick={function(){ setSel(function(cur){ var n=shiftDay(cur,dir); return n>today?today:n<earliest?earliest:n; }); }}
      style={{width:34,height:34,borderRadius:9,border:'1px solid '+G200,background:enabled?'white':G50,color:enabled?T:G200,fontSize:16,fontWeight:'bold',cursor:enabled?'pointer':'default',touchAction:'manipulation',flexShrink:0}}>{dir<0?'‹':'›'}</button>;
  };
  return <div>
    <div style={{fontSize:10,fontWeight:'bold',color:G600,marginBottom:6,textTransform:'uppercase',letterSpacing:1}}>📅 Einzelne Tage durchblättern</div>
    <div style={{background:'white',borderRadius:10,border:'1px solid '+G200,padding:'10px 12px'}}>
      <div style={{display:'flex',alignItems:'center',gap:8,marginBottom:10}}>
        {navBtn(-1,canPrev)}
        <div style={{flex:1,textAlign:'center'}}>
          <div style={{fontSize:14,fontWeight:'bold',color:G900}}>{label}</div>
          <div style={{fontSize:10,color:G400}}>{WD_LONG[weekdayOf(sel)].slice(0,2)} · {fmtDayShort(sel)}{sel.slice(0,4)!==today.slice(0,4)?' '+sel.slice(0,4):''}</div>
        </div>
        {navBtn(1,canNext)}
      </div>
      <div style={{display:'flex',gap:6,marginBottom:dayAns>0||daySec>0?12:2}}>
        <div style={{flex:1,textAlign:'center'}}>
          <span style={{fontSize:26,fontWeight:'bold',color:daySec>=DAILY_GOAL_SEC?T:daySec>0?'#d97706':G400}}>{Math.round(daySec/60)}</span>
          <span style={{fontSize:12,color:G600,marginLeft:4}}>Min</span>
        </div>
        {dayAns>0&&<div style={{flex:1,textAlign:'center'}}>
          <span style={{fontSize:26,fontWeight:'bold',color:T}}>{dayAns}</span>
          <span style={{fontSize:12,color:G600,marginLeft:4}}>Antworten</span>
          <div style={{fontSize:10,color:G400}}>✓ {dayCor} · ✗ {dayAns-dayCor}</div>
        </div>}
      </div>
      {daySec>0
        ? <GameBreakdown sessions={daySessions} title="Was an diesem Tag gelernt wurde"/>
        : <div style={{textAlign:'center',color:G400,fontSize:12,padding:'6px 0 10px'}}>An diesem Tag wurde nicht gelernt.</div>}
      <TagesLeiterspiel progressRows={progressRows} runs={runs} day={sel}/>
    </div>
  </div>;
}

// Eigene Lernübersicht für den Spieler selbst
function MeineLernuebersicht({ player, chapters, scope }) {
  var [sessions,setSessions]=useState(null);
