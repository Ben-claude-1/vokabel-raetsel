    else setSelectedWords(selectedWords.concat([{ key:key, word:w.word, clue:w.clue, chapterId:ch.id, chapTitle:ch.title }]));
  }
  function toggleSent(ch, s, idx) {
    var key = ch.id + ':s' + idx;
    var exists = selectedSents.find(function(x){ return x.key===key; });
    if (exists) setSelectedSents(selectedSents.filter(function(x){ return x.key!==key; }));
    else setSelectedSents(selectedSents.concat([{ key:key, text:s.text, translation:s.translation, chapId:ch.id }]));
  }
  function toggleAllChWords(ch) {
    var allKeys = ch.words.map(function(w){ return ch.id+':'+w.word; });
    var allSelected = allKeys.every(function(k){ return selectedWords.find(function(x){ return x.key===k; }); });
    if (allSelected) setSelectedWords(selectedWords.filter(function(x){ return !allKeys.includes(x.key); }));
    else {
      var toAdd = ch.words.filter(function(w){ return !selectedWords.find(function(x){ return x.key===ch.id+':'+w.word; }); })
        .map(function(w){ return {key:ch.id+':'+w.word,word:w.word,clue:w.clue,chapterId:ch.id,chapTitle:ch.title}; });
      setSelectedWords(selectedWords.concat(toAdd));
    }
  }

  function createRun() {
    if (!runName.trim()) { setErr('Bitte einen Namen eingeben'); return; }
    if (selectedWords.length < 4) { setErr('Mindestens 4 Vokabeln auswählen'); return; }
    setLoading(true); setErr('');
    // Only pass player_id if it's a real UUID (not "admin-local" or "local_...")
    var isRealUUID = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/i.test(player.id);
    var runData = {
      name: runName.trim(),
      is_admin_run: isAdmin ? true : false,
      word_count: selectedWords.length,
      sentence_count: selectedSents.length,
      words: JSON.stringify(selectedWords),
      sentences: JSON.stringify(selectedSents),
      created_at: new Date().toISOString()
    };
    if (isRealUUID) runData.player_id = player.id;
    sbPost('ls_runs', runData).then(function(res) {
      setLoading(false);
      if (res && res._err) { setErr('Fehler: ' + res.msg); return; }
      onCreated(res && res.id ? res : runData);
    }).catch(function() { setLoading(false); setErr('Verbindungsfehler'); });
  }

  return (
    <div>
      <input value={runName} onChange={function(e){setRunName(e.target.value);}} placeholder="Name des Laufs (z.B. Englisch Test KW 15)…"
        style={{width:'100%',padding:'10px 12px',fontSize:16,border:'2px solid '+T,borderRadius:8,outline:'none',marginBottom:10}}/>
      {isAdmin && <div style={{padding:'6px 10px',background:'#fef3c7',borderRadius:8,fontSize:12,color:'#92400e',marginBottom:10}}>👑 Admin-Lauf: gilt für alle Spieler</div>}

      <div style={{marginBottom:10,padding:'8px 10px',background:G50,borderRadius:8,border:'1px solid '+G200}}>
        <div style={{fontWeight:'bold',fontSize:13,color:G600,marginBottom:6}}>
          Vokabeln wählen: <span style={{color:T,fontSize:14}}>{selectedWords.length}</span>
          <span style={{color:G400,marginLeft:6,fontWeight:'normal',fontSize:12}}> · {selectedSents.length} Sätze</span>
        </div>
        <div style={{display:'flex',gap:6,flexWrap:'wrap'}}>
          <button onClick={function(){
            var allImp=[];
            chapters.forEach(function(ch){
              ch.words.filter(function(w){return w.important;}).forEach(function(w){
                var key=ch.id+':'+w.word;
                if(!selectedWords.find(function(x){return x.key===key;}))
                  allImp.push({key:key,word:w.word,clue:w.clue,chapterId:ch.id,chapTitle:ch.title});
              });
            });
            setSelectedWords(selectedWords.concat(allImp));
          }} style={BtnStyle(T,'white',{padding:'5px 10px',fontSize:11,touchAction:'manipulation'})}>
            ⭐ Alle wichtigen (alle Kapitel)
          </button>
          <button onClick={function(){setSelectedWords([]);setSelectedSents([]);}}
            style={BtnStyle(G100,RE,{padding:'5px 10px',fontSize:11,touchAction:'manipulation'})}>
            ✗ Auswahl leeren
          </button>
        </div>
      </div>

      {chapters.map(function(ch) {
        var isOpen = expandedCh === ch.id;
        var chWords = ch.words || [];
        var chSents = (ch.sentences||[]).filter(function(s){return s.important;});
        var chWordCount = selectedWords.filter(function(w){return w.chapterId===ch.id;}).length;
        var chSentCount = selectedSents.filter(function(s){return s.chapId===ch.id;}).length;
        return (
          <div key={ch.id} style={{marginBottom:6,border:'1.5px solid '+(chWordCount>0?ch.color:G200),borderRadius:10,overflow:'hidden'}}>
            <div style={{display:'flex',alignItems:'center',gap:8,padding:'10px 12px',background:chWordCount>0?ch.color+'15':'white',cursor:'pointer'}}
              onClick={function(){setExpandedCh(isOpen?null:ch.id);}}>
              <span style={{fontSize:18}}>{ch.icon}</span>
              <div style={{flex:1}}>
                <div style={{fontWeight:'bold',fontSize:12,color:ch.color}}>{ch.title}</div>
                <div style={{fontSize:10,color:G400}}>{chWords.length} Vokabeln{chSents.length?' · '+chSents.length+' Sätze':''}</div>
              </div>
              {chWordCount>0&&<span style={{background:ch.color,color:'white',fontSize:11,padding:'2px 7px',borderRadius:10,fontWeight:'bold'}}>{chWordCount}</span>}
              <span style={{color:G400,fontSize:12}}>{isOpen?'▲':'▼'}</span>
            </div>
            {isOpen&&(
              <div style={{padding:'8px 10px',background:'#fafafa',borderTop:'1px solid '+G200}}>
                <div style={{display:'flex',gap:4,marginBottom:8,flexWrap:'wrap'}}>
                  {/* Alle Vokabeln */}
                  <button onClick={function(){toggleAllChWords(ch);}}
                    style={BtnStyle(chWordCount===chWords.length?ch.color:G100,chWordCount===chWords.length?'white':G600,{flex:1,padding:'5px',fontSize:10,minWidth:70})}>
                    {chWordCount===chWords.length?'✗ Alle ab':'✓ Alle'}
                  </button>
                  {/* Nur fett/wichtige Vokabeln */}
                  {(function(){
                    var impWords=chWords.filter(function(w){return w.important;});
                    if(!impWords.length) return null;
                    var impKeys=impWords.map(function(w){return ch.id+':'+w.word;});
                    var allImpSel=impKeys.every(function(k){return selectedWords.find(function(x){return x.key===k;});});
                    return <button onClick={function(){
                      if(allImpSel) setSelectedWords(selectedWords.filter(function(x){return !impKeys.includes(x.key);}));
                      else {
                        var toAdd=impWords.filter(function(w){return !selectedWords.find(function(x){return x.key===ch.id+':'+w.word;});})
                          .map(function(w){return{key:ch.id+':'+w.word,word:w.word,clue:w.clue,chapterId:ch.id,chapTitle:ch.title};});
                        setSelectedWords(selectedWords.concat(toAdd));
                      }
                    }} style={BtnStyle(allImpSel?ch.color:G50,allImpSel?'white':ch.color,{flex:1,padding:'5px',fontSize:10,minWidth:70,border:'1.5px solid '+ch.color})}>
                      {allImpSel?'✗ ⭐ ab':'⭐ Wichtige'}
                    </button>;
                  })()}
                  {/* Alle Sätze */}
                  {chSents.length>0&&<button onClick={function(){
                    var allKeys=chSents.map(function(s,i){return ch.id+':s'+i;});
                    var allSel=allKeys.every(function(k){return selectedSents.find(function(x){return x.key===k;});});
                    if(allSel) setSelectedSents(selectedSents.filter(function(x){return !allKeys.includes(x.key);}));
                    else {
                      var toAdd=chSents.filter(function(s,i){return !selectedSents.find(function(x){return x.key===ch.id+':s'+i;});})
                        .map(function(s,i){return{key:ch.id+':s'+i,text:s.text,translation:s.translation,chapId:ch.id};});
                      setSelectedSents(selectedSents.concat(toAdd));
                    }
                  }} style={BtnStyle(chSentCount>0?'#7c3aed':G100,chSentCount>0?'white':G600,{flex:1,padding:'5px',fontSize:10,minWidth:60})}>
                    {chSentCount>0?'✗ Sätze':'💬 Sätze'}
                  </button>}
                </div>
                {chWords.map(function(w,i){
                  var key=ch.id+':'+w.word;
                  var sel=!!selectedWords.find(function(x){return x.key===key;});
                  return <div key={i} onClick={function(){toggleWord(ch,w);}}
                    style={{display:'flex',alignItems:'center',gap:8,padding:'5px 4px',borderBottom:'1px solid '+G100,cursor:'pointer',background:sel?ch.color+'10':'white'}}>
                    <div style={{width:18,height:18,borderRadius:4,border:'2px solid '+(sel?ch.color:G200),background:sel?ch.color:'white',flexShrink:0,display:'flex',alignItems:'center',justifyContent:'center'}}>
                      {sel&&<span style={{color:'white',fontSize:12}}>✓</span>}
                    </div>
                    <span style={{fontSize:12,fontWeight:w.important?'bold':'normal',flex:1}}>{w.word}</span>
                    <span style={{fontSize:11,color:G400}}>{w.clue}</span>
                  </div>;
                })}
                {chSents.map(function(s,i){
                  var key=ch.id+':s'+i;
                  var sel=!!selectedSents.find(function(x){return x.key===key;});
                  return <div key={'s'+i} onClick={function(){toggleSent(ch,s,i);}}
                    style={{display:'flex',alignItems:'center',gap:8,padding:'5px 4px',cursor:'pointer',background:sel?'#7c3aed15':'white',borderTop:'1px solid '+G100}}>
                    <div style={{width:18,height:18,borderRadius:4,border:'2px solid '+(sel?'#7c3aed':G200),background:sel?'#7c3aed':'white',flexShrink:0,display:'flex',alignItems:'center',justifyContent:'center'}}>
                      {sel&&<span style={{color:'white',fontSize:12}}>✓</span>}
                    </div>
                    <span style={{fontSize:11,flex:1,color:'#7c3aed'}}>💬 {s.text}</span>
                    <span style={{fontSize:10,color:G400}}>{s.translation.slice(0,20)}{s.translation.length>20?'…':''}</span>
                  </div>;
                })}
              </div>
            )}
          </div>
        );
      })}

      {err&&<div style={{color:RE,fontSize:12,padding:'6px 10px',background:'#fef2f2',borderRadius:6,marginTop:8}}>{err}</div>}
      <button onClick={createRun} disabled={loading}
        style={BtnStyle(T,'white',{width:'100%',padding:'12px',marginTop:12,fontSize:15,opacity:loading?0.6:1})}>
        {loading?'…':'🚀 Lauf starten'}
      </button>
    </div>
  );
}

// ── GradeDisplay — Note mit Farbe ────────────────────────────
function GradeDisplay({ grade, size }) {
  var s = size || 28;
  if (!grade) return null;
  var colors = { 1:'#22c55e', 2:'#84cc16', 3:'#f59e0b', 4:'#f97316', 5:'#ef4444', 6:'#dc2626' };
  var color = colors[grade] || G400;
  return <span style={{fontWeight:'bold',fontSize:s,color:color}}>{grade}</span>;
}

// ── CelebrationPopup — Jubel bei Notenverbesserung ───────────
function CelebrationPopup({ newGrade, onClose }) {
  var msgs = {
    1:'🏆 Eins! Perfekt! Ausgezeichnete Leistung!',
    2:'🥈 Sehr gut! Fast perfect!',
    3:'💪 Gut! Weiter so!',
    4:'👍 Befriedigend – du schaffst mehr!',
  };
  return (
    <div style={{position:'fixed',inset:0,background:'rgba(0,0,0,0.7)',display:'flex',alignItems:'center',justifyContent:'center',zIndex:9999,padding:20}}>
      <div style={{background:'white',borderRadius:20,padding:30,textAlign:'center',maxWidth:300,width:'100%',boxShadow:'0 20px 50px rgba(0,0,0,0.3)'}}>
        <div style={{fontSize:60,marginBottom:8}}>🎉</div>
        <div style={{fontSize:18,fontWeight:'bold',color:G900,marginBottom:8}}>Note verbessert!</div>
        <div style={{fontSize:40,fontWeight:'bold',color:'#22c55e',marginBottom:8}}>{newGrade}</div>
        <div style={{fontSize:14,color:G600,marginBottom:16}}>{msgs[newGrade]||'Weiter machen!'}</div>
        <button onClick={onClose} style={BtnStyle(T,'white',{width:'100%',padding:'10px'})}>Weiter lernen →</button>
      </div>
    </div>
  );
}

// ── LeitersSpielSession — aktive Lernsitzung ─────────────────
function LeitersSpielSession({ run, player, gradeSettings, onBack }) {
  var [progress, setProgress] = useState(null);
  var [progressId, setProgressId] = useState(null);
  var [currentItem, setCurrentItem] = useState(null); // {word, pot}
  var [input, setInput] = useState('');
  var [result, setResult] = useState(null); // {correct, typed, status}
  var [loading, setLoading] = useState(true);
  var [saving, setSaving] = useState(false);
  var [celebration, setCelebration] = useState(null);
  var [view, setView] = useState('learn'); // 'learn' | 'pots'
  var [quizAnswers, setQuizAnswers] = useState([]);
  var inputRef = useRef();

  var words = useMemo(function() {
    try { return JSON.parse(run.words||'[]'); } catch(e) { return []; }
  }, [run]);
  var sentences = useMemo(function() {
    try { return JSON.parse(run.sentences||'[]'); } catch(e) { return []; }
  }, [run]);

  // Load or init progress
  useEffect(function() {
    if (!player) return;
    lsGetProgress(player.id, run.id).then(function(rows) {
      if (Array.isArray(rows) && rows.length > 0) {
        var row = rows[0];
        setProgressId(row.id);
        var data = JSON.parse(row.data||'{}');
        setProgress(data);
        setCurrentItem(lsPickWord(data, data.lastWord));
      } else {
        var init = lsInitProgress(words, sentences);
        setProgress(init);
        setCurrentItem(lsPickWord(init, null));
      }
      setLoading(false);
    });
  }, []);

  // Auto-save progress
  function saveProgress(newProgress) {
    if (!player || !run.id) return;
    setSaving(true);
    lsSaveProgress(player.id, run.id, newProgress, progressId).then(function(res) {
      setSaving(false);
      if (res && res.id && !progressId) setProgressId(res.id);
    });
  }

  // Build quiz answers for pot 1
  useEffect(function() {
    if (!currentItem || currentItem.pot !== 1 || !progress) return;
    var allWords = words;
    var correct = currentItem.word;
    var distractors = shuffleArr(allWords.filter(function(w){ return w.word !== correct.word; })).slice(0,3);
    setQuizAnswers(shuffleArr([correct].concat(distractors)));
  }, [currentItem]);

  // Focus input
  useEffect(function() {
    if (currentItem && currentItem.pot > 1 && inputRef.current && !result) {
      setTimeout(function(){ if(inputRef.current) inputRef.current.focus(); }, 100);
    }
  }, [currentItem, result]);

  if (loading) return <div style={{textAlign:'center',padding:40,color:G400}}>Lade Fortschritt…</div>;
  if (!progress) return null;

  var percent = lsPercent(progress, gradeSettings);
  var grade = lsGrade(percent, gradeSettings);
  var allDone = progress.pots[1].length === 0 && progress.pots[2].length === 0 && progress.pots[3].length === 0;
  var bonusAllDone = allDone && progress.sentences.every(function(s){return s.streak>=2;});
  var activeSentence = progress.bonusStarted ? progress.sentences.find(function(s){return s.streak<2;}) : null;

  function handleAnswer(isCorrect) {
    if (!currentItem || result) return;
    var newProgress = JSON.parse(JSON.stringify(progress));
    var pot = currentItem.pot;
    var wordIdx = newProgress.pots[pot].findIndex(function(w){ return w.word === currentItem.word.word; });
    if (wordIdx < 0) return;
    var word = newProgress.pots[pot][wordIdx];

    if (isCorrect) {
      word.streak = (word.streak||0) + 1;
      newProgress.streak = (newProgress.streak||0) + 1;
      if (word.streak >= 2) {
        // Move up
        newProgress.pots[pot].splice(wordIdx, 1);
        word.streak = 0;
        var nextPot = Math.min(pot+1, 4);
        newProgress.pots[nextPot].push(word);
        // Check grade improvement
        var newPercent = lsPercent(newProgress, gradeSettings);
        var newGrade = lsGrade(newPercent, gradeSettings);
        if (newGrade && grade && newGrade < grade) setCelebration(newGrade);
        // Start bonus if pots 1-3 empty
        if (newProgress.pots[1].length===0 && newProgress.pots[2].length===0 && newProgress.pots[3].length===0 && newProgress.sentences.length>0) {
          newProgress.bonusStarted = true;
        }
      }
    } else {
      word.streak = 0;
      newProgress.streak = 0;
      if (pot > 1) {
        // Move down
        newProgress.pots[pot].splice(wordIdx, 1);
        var prevPot = pot - 1;
        newProgress.pots[prevPot].push(word);
      }
      // Pot 1: stays, no action needed
    }

    newProgress.lastWord = currentItem.word.word;
    // Record history
    newProgress.history = (newProgress.history||[]).concat([{
      date: new Date().toISOString(),
      grade: lsGrade(lsPercent(newProgress, gradeSettings), gradeSettings),
      percent: lsPercent(newProgress, gradeSettings)
    }]).slice(-100); // keep last 100

    setProgress(newProgress);
    setResult({ correct: isCorrect });
    saveProgress(newProgress);
  }

  function handleBonusSentence(isCorrect) {
    if (result) return;
    var newProgress = JSON.parse(JSON.stringify(progress));
    var idx = newProgress.sentences.findIndex(function(s){ return s.text === activeSentence.text && s.streak < 2; });
    if (idx < 0) return;
    if (isCorrect) newProgress.sentences[idx].streak = Math.min((newProgress.sentences[idx].streak||0)+1, 2);
    else newProgress.sentences[idx].streak = 0;
    setProgress(newProgress);
    setResult({ correct: isCorrect });
    saveProgress(newProgress);
  }

  function next() {
    setResult(null);
    setInput('');
    var nextItem = lsPickWord(progress, currentItem&&currentItem.word?currentItem.word.word:null);
    setCurrentItem(nextItem);
  }

  // ── POT VIEW ──
  if (view === 'pots') {
    return (
      <div>
        <button onClick={function(){setView('learn');}} style={BtnStyle(G100,G600,{marginBottom:12,fontSize:12})}>← Zurück zum Lernen</button>
        {[1,2,3,4].map(function(pot) {
          var label = pot===1?'Topf 1 — Quiz':pot===2?'Topf 2 — DE→EN Tippen':pot===3?'Topf 3 — EN→DE Tippen':'✅ Gelernt';
          var color = pot===1?RE:pot===2?AM:pot===3?T:GR;
          return (
            <div key={pot} style={{marginBottom:10,border:'2px solid '+color+'40',borderRadius:10,overflow:'hidden'}}>
              <div style={{background:color+'15',padding:'8px 12px',fontWeight:'bold',fontSize:13,color:color,display:'flex',justifyContent:'space-between'}}>
                <span>{label}</span><span style={{fontSize:12}}>{progress.pots[pot].length} Vokabeln</span>
              </div>
              <div style={{padding:'6px 10px'}}>
                {progress.pots[pot].length===0&&<div style={{color:G400,fontSize:11,padding:'4px 0'}}>Leer</div>}
                {progress.pots[pot].map(function(w,i){
                  return <div key={i} style={{display:'flex',justifyContent:'space-between',padding:'3px 0',borderBottom:'1px solid '+G100,fontSize:12}}>
                    <span style={{fontWeight:'bold'}}>{w.word}</span>
                    <span style={{color:G400}}>{w.clue}</span>
                  </div>;
                })}
              </div>
            </div>
          );
        })}
        {progress.bonusStarted&&(
          <div style={{border:'2px solid #7c3aed40',borderRadius:10,overflow:'hidden'}}>
            <div style={{background:'#7c3aed15',padding:'8px 12px',fontWeight:'bold',fontSize:13,color:'#7c3aed'}}>💬 Bonusrunde — Sätze</div>
            <div style={{padding:'6px 10px'}}>
              {progress.sentences.map(function(s,i){
                return <div key={i} style={{padding:'4px 0',borderBottom:'1px solid '+G100,fontSize:11}}>
                  <span style={{color:s.streak>=2?GR:G400}}>{s.streak>=2?'✓ ':''}</span>{s.text}
                </div>;
              })}
            </div>
          </div>
        )}
      </div>
    );
  }

  // ── PROGRESS BAR & HEADER ──
  var pot1c = progress.pots[1].length, pot2c = progress.pots[2].length;
  var pot3c = progress.pots[3].length, pot4c = progress.pots[4].length;
  var totalWords = pot1c+pot2c+pot3c+pot4c;

  var header = (
    <div style={{marginBottom:12}}>
      <div style={{display:'flex',alignItems:'center',gap:8,marginBottom:6}}>
        <div style={{flex:1}}>
          <div style={{display:'flex',justifyContent:'space-between',fontSize:11,color:G400,marginBottom:3}}>
            <span>Fortschritt: {percent}%</span>
            {grade&&<span style={{fontWeight:'bold'}}>Note: <GradeDisplay grade={grade} size={14}/></span>}
          </div>
          <div style={{height:8,background:G200,borderRadius:4,overflow:'hidden'}}>
            <div style={{height:'100%',width:percent+'%',background:'linear-gradient(90deg,'+AM+','+GR+')',borderRadius:4,transition:'width 0.5s'}}/>
          </div>
        </div>
        <button onClick={function(){setView('pots');}} style={{fontSize:11,padding:'4px 8px',borderRadius:6,border:'1px solid '+G200,background:'white',cursor:'pointer',color:G600,flexShrink:0}}>📊 Töpfe</button>
      </div>
      <div style={{display:'flex',gap:4,justifyContent:'center'}}>
        {[{n:pot1c,c:RE,l:'T1'},{n:pot2c,c:AM,l:'T2'},{n:pot3c,c:T,l:'T3'},{n:pot4c,c:GR,l:'✓'}].map(function(x,i){
          return <div key={i} style={{textAlign:'center',padding:'3px 8px',borderRadius:6,background:x.c+'15',minWidth:40}}>
            <div style={{fontSize:14,fontWeight:'bold',color:x.c}}>{x.n}</div>
            <div style={{fontSize:9,color:G400}}>{x.l}</div>
          </div>;
        })}
        {progress.streak>1&&<div style={{textAlign:'center',padding:'3px 8px',borderRadius:6,background:'#fef3c7',minWidth:40}}>
          <div style={{fontSize:14,fontWeight:'bold',color:AM}}>🔥{progress.streak}</div>
          <div style={{fontSize:9,color:G400}}>Streak</div>
        </div>}
      </div>
    </div>
  );

  // ── COMPLETE ──
  if (allDone && !progress.bonusStarted && progress.sentences.length > 0) {
    return <div style={{padding:8}}>
      {header}
      <div style={{textAlign:'center',padding:24,background:'#d1fae5',borderRadius:14}}>
        <div style={{fontSize:40,marginBottom:8}}>🎯</div>
        <div style={{fontWeight:'bold',fontSize:16,color:'#065f46'}}>Alle Vokabeln gelernt!</div>
        <div style={{fontSize:13,color:'#047857',marginTop:4}}>Bereit für die Bonusrunde mit {progress.sentences.length} Sätzen?</div>
        <button onClick={function(){
          var newProg = JSON.parse(JSON.stringify(progress));
          newProg.bonusStarted=true;
          setProgress(newProg);
          saveProgress(newProg);
        }} style={BtnStyle(T,'white',{marginTop:14,padding:'12px 24px'})}>💬 Bonusrunde starten</button>
      </div>
    </div>;
  }

  if (bonusAllDone) {
    return <div style={{padding:8}}>
      {header}
      <div style={{textAlign:'center',padding:24,background:'#d1fae5',borderRadius:14}}>
        <div style={{fontSize:50,marginBottom:8}}>🏆</div>
        <div style={{fontWeight:'bold',fontSize:18,color:'#065f46'}}>100% geschafft!</div>
        <div style={{fontSize:14,color:'#047857',marginTop:4}}>Du bist bereit für den Test!</div>
        {grade&&<div style={{marginTop:8}}>Aktuelle Note: <GradeDisplay grade={grade} size={32}/></div>}
      </div>
    </div>;
  }

  // ── BONUS ROUND — Sentences ──
  if (progress.bonusStarted && activeSentence) {
    return (
      <div style={{padding:8}}>
        {celebration&&<CelebrationPopup newGrade={celebration} onClose={function(){setCelebration(null);}}/>}
        {header}
        <div style={{background:'#7c3aed15',borderRadius:14,padding:'16px 14px',marginBottom:12,textAlign:'center',border:'2px solid '+(result?result.correct?GR:RE:'#7c3aed')}}>
          <div style={{fontSize:11,color:'#7c3aed',marginBottom:6,textTransform:'uppercase',letterSpacing:1}}>💬 Bonusrunde — übersetze ins Deutsche:</div>
          <div style={{fontSize:18,fontWeight:'bold',color:G900,lineHeight:1.4}}>{activeSentence.text}</div>
          {result&&<div style={{marginTop:10,fontSize:13,color:result.correct?GR:RE}}>{result.correct?'✓ Richtig!':'✗ Falsch'}</div>}
          {result&&!result.correct&&<div style={{fontSize:12,color:G600,marginTop:4}}>Richtig: <strong>{activeSentence.translation}</strong></div>}
        </div>
        {!result&&<div style={{display:'flex',gap:8,marginBottom:10}}>
          <input ref={inputRef} value={input} onChange={function(e){setInput(e.target.value);}}
            onKeyDown={function(e){if(e.key==='Enter'){var ok=checkAnswer(input,activeSentence.translation)==='correct';handleBonusSentence(ok);}}}
            placeholder="Deutsche Übersetzung…"
            style={{flex:1,padding:'10px 12px',fontSize:16,border:'2px solid #7c3aed',borderRadius:8,outline:'none'}}/>
          <button onClick={function(){var ok=checkAnswer(input,activeSentence.translation)==='correct';handleBonusSentence(ok);}}
            style={BtnStyle('#7c3aed','white',{padding:'10px 16px'})}>✓</button>
        </div>}
        {result&&<button onClick={next} style={BtnStyle(T,'white',{width:'100%',padding:'12px'})}>→ Weiter</button>}
      </div>
    );
  }

  if (!currentItem) {
    return <div style={{padding:8}}>{header}<div style={{textAlign:'center',color:G400,padding:20}}>Keine Vokabeln zum Üben.</div></div>;
  }

  var word = currentItem.word;
  var pot = currentItem.pot;
  var question = pot===2 ? word.clue : word.word; // T2: DE shown→EN typed; T3: EN shown→DE typed
  var answer   = pot===2 ? word.word  : word.clue;
  var qLabel   = pot===2 ? 'Schreibe auf Englisch:' : pot===3 ? 'Schreibe auf Deutsch:' : '';
  var potColor = pot===1?RE:pot===2?AM:T;
  var potLabel = pot===1?'Topf 1 — Quiz':pot===2?'Topf 2 — DE→EN':pot===3?'Topf 3 — EN→DE':'';

  // ── POT 1: Multiple Choice ──
  if (pot === 1) {
    return (
      <div style={{padding:8}}>
        {celebration&&<CelebrationPopup newGrade={celebration} onClose={function(){setCelebration(null);}}/>}
        {header}
        <div style={{textAlign:'center',fontSize:10,color:RE,textTransform:'uppercase',letterSpacing:1,marginBottom:6}}>{potLabel}</div>
        <div style={{textAlign:'center',padding:'20px 16px',background:result?(result.correct?'#d1fae5':'#fef2f2'):'white',borderRadius:14,marginBottom:10,border:'2px solid '+(result?result.correct?GR:RE:G200)}}>
          <div style={{fontSize:11,color:G400,marginBottom:4}}>Was bedeutet:</div>
          <div style={{fontSize:26,fontWeight:'bold',color:G900}}>{word.word}</div>
          {result&&<div style={{marginTop:8,fontSize:14,fontWeight:'bold',color:result.correct?GR:RE}}>{result.correct?'✓ Richtig!':'✗ Falsch — '+word.clue}</div>}
        </div>
        {!result&&<div style={{display:'grid',gridTemplateColumns:'1fr 1fr',gap:8}}>
          {quizAnswers.map(function(a,i){
            return <button key={i} onClick={function(){handleAnswer(a.word===word.word);}}
              style={BtnStyle(G50,G900,{padding:'10px',fontSize:13,border:'2px solid '+G200,textAlign:'center',touchAction:'manipulation'})}>
              {a.clue}
            </button>;
          })}
        </div>}
        {result&&<button onClick={next} style={BtnStyle(T,'white',{width:'100%',padding:'12px',marginTop:8})}>→ Weiter</button>}
      </div>
    );
  }

  // ── POT 2+3: Type Answer ──
  return (
    <div style={{padding:8}}>
      {celebration&&<CelebrationPopup newGrade={celebration} onClose={function(){setCelebration(null);}}/>}
      {header}
      <div style={{textAlign:'center',fontSize:10,color:potColor,textTransform:'uppercase',letterSpacing:1,marginBottom:6}}>{potLabel}</div>
      <div style={{textAlign:'center',padding:'20px 16px',background:result?(result.correct?'#d1fae5':'#fef2f2'):'white',borderRadius:14,marginBottom:10,border:'2px solid '+(result?result.correct?GR:RE:G200)}}>
        <div style={{fontSize:11,color:G400,marginBottom:4}}>{qLabel}</div>
        <div style={{fontSize:26,fontWeight:'bold',color:G900}}>{question}</div>
        {result&&<div style={{marginTop:8,fontSize:14,fontWeight:'bold',color:result.correct?GR:RE}}>{result.correct?'✓ Richtig!':'✗ Falsch'}</div>}
        {result&&!result.correct&&<div style={{fontSize:13,color:G600,marginTop:4}}>Richtig: <strong>{answer}</strong>{result.typed?' · du: '+result.typed:''}</div>}
      </div>
      {!result&&<div style={{display:'flex',gap:8,marginBottom:10}}>
        <input ref={inputRef} value={input} onChange={function(e){setInput(e.target.value);}}
          onKeyDown={function(e){if(e.key==='Enter'){var s=checkAnswer(input,answer);var ok=s==='correct';var r={correct:ok,typed:input};setResult(r);handleAnswer(ok);}}}
          autoCapitalize="none" autoCorrect="off" spellCheck="false"
          placeholder="Antwort…"
          style={{flex:1,padding:'12px 14px',fontSize:16,border:'2px solid '+potColor,borderRadius:8,outline:'none'}}/>
        <button onClick={function(){var s=checkAnswer(input,answer);var ok=s==='correct';handleAnswer(ok);setResult({correct:ok,typed:input});}}
          style={BtnStyle(potColor,'white',{padding:'12px 16px'})}>✓</button>
      </div>}
      {result&&<button onClick={next} style={BtnStyle(T,'white',{width:'100%',padding:'12px'})}>→ Weiter</button>}
    </div>
  );
}

// ── LeitersSpielAdminOverview — Admin sieht alle Läufe ───────
function LeitersSpielAdminOverview({ allUsers, gradeSettings }) {
  var [runs, setRuns] = useState([]);
  var [allProgress, setAllProgress] = useState([]);
  var [loading, setLoading] = useState(true);

  useEffect(function() {
    Promise.all([
      lsGetRuns(),
      sbGet('ls_progress', 'select=player_id,run_id,data,updated_at&order=updated_at.desc')
    ]).then(function(res) {
      setRuns(Array.isArray(res[0])?res[0]:[]);
      setAllProgress(Array.isArray(res[1])?res[1]:[]);
      setLoading(false);
    });
  }, []);

  if (loading) return <div style={{textAlign:'center',padding:20,color:G400}}>Lade…</div>;

  return (
    <div>
      <div style={{fontWeight:'bold',fontSize:14,color:G900,marginBottom:10}}>📋 Alle Läufe ({runs.length})</div>
      {runs.map(function(run) {
        var progForRun = allProgress.filter(function(p){ return p.run_id === run.id; });
        return (
          <div key={run.id} style={{marginBottom:10,border:'1.5px solid '+G200,borderRadius:12,overflow:'hidden'}}>
            <div style={{padding:'10px 12px',background:G50,fontWeight:'bold',fontSize:13,color:T,display:'flex',justifyContent:'space-between'}}>
              <span>{run.is_admin_run?'📋 ':''}{run.name}</span>
              <span style={{fontSize:11,color:G400,fontWeight:'normal'}}>{run.word_count}V · {run.sentence_count||0}S</span>
            </div>
            {progForRun.length===0&&<div style={{padding:'8px 12px',fontSize:12,color:G400}}>Noch kein Spieler gestartet</div>}
            {progForRun.map(function(p) {
              var user = (allUsers||[]).find(function(u){ return u.id===p.player_id || String(u.id)===String(p.player_id); });
              var data = {}; try { data=JSON.parse(p.data||'{}'); } catch(e){}
              var pct = lsPercent(data, gradeSettings);
              var gr = lsGrade(pct, gradeSettings);
              return (
                <div key={p.player_id} style={{display:'flex',alignItems:'center',gap:8,padding:'8px 12px',borderTop:'1px solid '+G100}}>
                  <div style={{flex:1}}>
                    <div style={{fontSize:12,fontWeight:'bold',color:G900}}>{user?user.name:p.player_id.slice(0,8)}</div>
                    <div style={{height:4,background:G200,borderRadius:2,marginTop:3,overflow:'hidden'}}>
                      <div style={{height:'100%',width:pct+'%',background:'linear-gradient(90deg,'+AM+','+GR+')',borderRadius:2}}/>
                    </div>
                  </div>
                  <div style={{textAlign:'right'}}>
                    <div style={{fontSize:11,color:G400}}>{pct}%</div>
                    {gr&&<GradeDisplay grade={gr} size={14}/>}
                  </div>
                </div>
              );
            })}
          </div>
        );
      })}
    </div>
  );
}

// ── LeitersSpielGradeSettings — Admin Noten-Einstellungen ────
function LeitersSpielGradeSettings({ settings, onSave }) {
  var [testSize, setTestSize] = useState((settings&&settings.testSize)||20);
  var DEFAULT_GRADES = [
    {grade:1,maxErrors:1},{grade:2,maxErrors:3},{grade:3,maxErrors:6},
    {grade:4,maxErrors:9},{grade:5,maxErrors:13}
  ];
  var [grades, setGrades] = useState((settings&&settings.grades)||DEFAULT_GRADES);

  function updateGrade(i, field, val) {
    var newG = grades.slice();
    newG[i] = Object.assign({},newG[i]);
    newG[i][field] = parseInt(val)||0;
    setGrades(newG);
  }

  return (
    <div style={{padding:14,background:G50,borderRadius:12,border:'1px solid '+G200}}>
      <div style={{fontWeight:'bold',fontSize:14,color:G900,marginBottom:12}}>⚙️ Noteneinstellungen</div>
      <div style={{marginBottom:12}}>
        <div style={{fontSize:12,color:G600,marginBottom:4}}>Anzahl Vokabeln im echten Test:</div>
        <div style={{display:'flex',gap:6}}>
          {[10,15,20,25,30].map(function(n){
            return <button key={n} onClick={function(){setTestSize(n);}}
              style={{flex:1,padding:'6px',borderRadius:6,border:'2px solid '+(testSize===n?T:G200),background:testSize===n?TL:'white',cursor:'pointer',fontSize:13,fontWeight:'bold',color:testSize===n?T:G600}}>{n}</button>;
          })}
        </div>
      </div>
      <div style={{fontSize:12,color:G600,marginBottom:6}}>Fehler pro Note (max. Fehler für diese Note):</div>
      {grades.map(function(g,i){
        return (
          <div key={i} style={{display:'flex',alignItems:'center',gap:8,marginBottom:6}}>
            <div style={{fontSize:14,fontWeight:'bold',color:[null,'#22c55e','#84cc16','#f59e0b','#f97316','#ef4444'][g.grade]||G400,minWidth:60}}>Note {g.grade}</div>
            <span style={{fontSize:12,color:G400}}>max.</span>
            <input type="number" value={g.maxErrors} min={0} max={testSize}
              onChange={function(e){updateGrade(i,'maxErrors',e.target.value);}}
              style={{width:60,padding:'4px 8px',fontSize:14,border:'1.5px solid '+G200,borderRadius:6,outline:'none',textAlign:'center'}}/>
            <span style={{fontSize:12,color:G400}}>Fehler</span>
          </div>
        );
      })}
      <button onClick={function(){onSave({testSize:testSize,grades:grades});}}
        style={BtnStyle(T,'white',{width:'100%',padding:'10px',marginTop:8})}>💾 Einstellungen speichern</button>
    </div>
  );
}


// ── Admin ─────────────────────────────────────────────────────
function AdminDash({ chapters, setChapters, allUsers, setAllUsers, player, gradeSettings }) {
  var [tab, setTab] = useState('users');
  var [players, setPlayers] = useState([]);
  var pendingCount = players.filter(function(p){ return p.is_active === false; }).length;
  var [selP, setSelP] = useState(null);
  var [results, setResults] = useState([]);
  var [loading, setLoading] = useState(false);
  var [imgLoading, setImgLoading] = useState(false);
  var [imgMsg, setImgMsg] = useState('');
  var [draft, setDraft] = useState(null); // {words:[], sentences:[], src:''}
  var [dTitle, setDTitle] = useState('');
  var [dColor, setDColor] = useState('#0f766e');
  var [dIcon, setDIcon] = useState('📚');
  var [chapterMode, setChapterMode] = useState('new'); // 'new' | 'existing'
  var [targetChapter, setTargetChapter] = useState('');
  var fileRef = useRef();

  // Use allUsers from App state (loaded from Supabase on startup)
  useEffect(function(){
    var nonAdmins = Array.isArray(allUsers) ? allUsers.filter(function(u){ return !u.is_admin && u.name !== 'admin'; }) : [];
    setPlayers(nonAdmins);
  }, [allUsers]);

  function loadP(p) {
    setSelP(p); setLoading(true);
    sbGet('results','player_id=eq.'+p.id+'&order=completed_at.desc').then(function(r){
      setResults(Array.isArray(r)?r:[]); setLoading(false);
    });
  }

  var wStats = useMemo(function(){
    var m={};
    results.forEach(function(r){ if(!m[r.word])m[r.word]={word:r.word,clue:r.clue,c:0,w:0}; if(r.correct)m[r.word].c++;else m[r.word].w++; });
    return Object.values(m).sort(function(a,b){return b.w-a.w;});
  },[results]);

  var chStats = useMemo(function(){
    return chapters.map(function(ch){
      var total=ch.words.length;
      var corrSet=new Set(results.filter(function(r){return r.chapter_id===ch.id&&r.correct;}).map(function(r){return r.word;}));
      var wrong=results.filter(function(r){return r.chapter_id===ch.id&&!r.correct;}).length;
      var pct=total>0?Math.round(corrSet.size/total*100):0;
      return Object.assign({},ch,{total:total,correct:corrSet.size,wrong:wrong,pct:pct});
    });
  },[chapters,results]);

  var totalW=chapters.reduce(function(s,ch){return s+ch.words.length;},0);
  var learnedW=selP?new Set(results.filter(function(r){return r.correct;}).map(function(r){return r.word;})).size:0;
  var overallPct=selP?Math.round(learnedW/totalW*100):0;

  function uploadImg(file) {
    if(!file) return;
    setImgLoading(true); setImgMsg('Bild wird analysiert…'); setDraft(null);
    var reader=new FileReader();
    reader.onload=function(){
      var b64=reader.result.split(',')[1];
      fetch('https://api.anthropic.com/v1/messages',{
        method:'POST',headers:{'Content-Type':'application/json'},
        body:JSON.stringify({model:'claude-sonnet-4-20250514',max_tokens:4000,messages:[{role:'user',content:[
          {type:'image',source:{type:'base64',media_type:file.type,data:b64}},
          {type:'text',text:`Analysiere diese Schulbuch-Seite. Extrahiere GETRENNT:
1. VOKABELN: Einzelne Wörter mit Übersetzung
2. SÄTZE: Vollständige Beispielsätze (nicht einzelne Vokabeln)

Regeln:
- "important": true wenn das Wort/der Satz im Bild FETT gedruckt ist
- Englische Wörter/Sätze in "text", deutsche Übersetzung in "translation"  
- Monate großgeschrieben (January etc.), alles andere klein
- Sätze haben subject+verb und sind vollständige Aussagen
- Ignoriere Aussprache in /.../ und Seitenangaben

NUR JSON antworten (kein Markdown):
{"title":"Kurzer Seitentitel","words":[{"word":"birthday","clue":"Geburtstag","important":true}],"sentences":[{"text":"I want to buy a bag.","translation":"Ich möchte eine Tasche kaufen.","important":true}]}`}
        ]}]})
      }).then(function(resp){return resp.json();}).then(function(d){
        var txt=d.content.map(function(b){return b.text||'';}).join('').trim().replace(/```json|```/g,'').trim();
        var parsed=JSON.parse(txt);
        setDraft({words:parsed.words||[],sentences:parsed.sentences||[],src:file.name});
        setDTitle(parsed.title||file.name.replace(/\.[^.]+$/,''));
        setImgMsg('✅ '+(parsed.words||[]).length+' Vokabeln · '+(parsed.sentences||[]).length+' Sätze erkannt · '+(parsed.words||[]).filter(function(w){return w.important;}).length+' ⭐ fett');
      }).catch(function(e){setImgMsg('❌ '+e.message);}).finally(function(){setImgLoading(false);});
    };
    reader.readAsDataURL(file);
  }

  function saveDraft() {
    if(!draft) return;
    if(chapterMode==='new') {
      var id='ch_'+Date.now();
      var ch={id:id,title:dTitle,color:dColor,icon:dIcon,words:draft.words,sentences:draft.sentences,is_builtin:false};
      sbPost('chapters',Object.assign({},ch,{words:JSON.stringify(draft.words),sentences:JSON.stringify(draft.sentences)})).then(function(){
        setChapters(function(prev){return prev.concat([ch]);});
        setDraft(null); setImgMsg('✅ Neues Kapitel "'+dTitle+'" gespeichert!');
      });
    } else {
      // Add to existing chapter - with dedup
      var existingCh = chapters.find(function(c){return c.id===targetChapter;});
      if(!existingCh){setImgMsg('❌ Kapitel nicht gefunden');return;}
      var existingWords = new Set(existingCh.words.map(function(w){return w.word.toLowerCase();}));
      var existingSentences = new Set((existingCh.sentences||[]).map(function(s){return s.text.toLowerCase().trim();}));
      var newWords = draft.words.filter(function(w){return !existingWords.has(w.word.toLowerCase());});
      var newSentences = draft.sentences.filter(function(s){return !existingSentences.has(s.text.toLowerCase().trim());});
      var updatedWords = existingCh.words.concat(newWords);
      var updatedSentences = (existingCh.sentences||[]).concat(newSentences);
      sbPatch('chapters',{words:JSON.stringify(updatedWords),sentences:JSON.stringify(updatedSentences)},'id=eq.'+targetChapter).then(function(){
        setChapters(function(prev){return prev.map(function(c){
          return c.id===targetChapter?Object.assign({},c,{words:updatedWords,sentences:updatedSentences}):c;
        });});
        setDraft(null);
        setImgMsg('✅ Hinzugefügt: '+newWords.length+' neue Vokabeln, '+newSentences.length+' neue Sätze ('+
          (draft.words.length-newWords.length)+' Duplikate übersprungen)');
      });
    }
  }

  function delCh(ch) {
    if(ch.is_builtin) return;
    if(!confirm('"'+ch.title+'" löschen?')) return;
    sbDel('chapters','id=eq.'+ch.id).then(function(){
      setChapters(function(prev){return prev.filter(function(c){return c.id!==ch.id;});});
    });
  }

  return(
    <div>
      <div style={{display:'flex',gap:6,marginBottom:14,flexWrap:'wrap'}}>
        {[['users', pendingCount > 0 ? '👤 Benutzer (' + pendingCount + ' ⏳)' : '👤 Benutzer'],['chapters','📚 Kapitel & Upload'],['leiterspiel','🎯 Leiterspiel']].map(function(pair){
          return <button key={pair[0]} onClick={function(){setTab(pair[0]);}} style={BtnStyle(tab===pair[0]?T:G100,tab===pair[0]?'white':G600,{padding:'7px 16px'})}>{pair[1]}</button>;
        })}
      </div>

      {/* USERS TAB */}
      {tab==='users'&&(
        <div>
          <div style={{display:'flex',flexWrap:'wrap',gap:8,marginBottom:14}}>
            {players.map(function(p){
              var isPending = p.is_active === false;
              return (
                <div key={p.id} style={{display:'flex',alignItems:'center',gap:6,padding:'8px 10px',borderRadius:10,
                  border:'2px solid '+(isPending?AM:selP&&selP.id===p.id?T:G200),
                  background:isPending?'#fffbeb':selP&&selP.id===p.id?TL:'white',marginBottom:4}}>
                  <button onClick={function(){if(!isPending)loadP(p);}}
                    style={{flex:1,textAlign:'left',background:'none',border:'none',cursor:isPending?'default':'pointer',padding:0}}>
                    <span style={{fontSize:13,fontWeight:'bold',color:isPending?AM:T}}>{p.name}</span>
                    {isPending&&<span style={{fontSize:10,color:AM,marginLeft:6,background:'#fef3c7',padding:'1px 5px',borderRadius:8}}>⏳ Ausstehend</span>}
                    {!isPending&&<span style={{fontSize:11,color:G400,marginLeft:6}}>{p.total_score||0}P</span>}
                  </button>
                  {isPending&&(
                    <button onClick={function(){
                      if(!confirm('Account von '+p.name+' freischalten?')) return;
                      sbPatch('players',{is_active:true},'id=eq.'+p.id).then(function(){
                        var updated=Object.assign({},p,{is_active:true});
                        setPlayers(function(prev){return prev.map(function(u){return u.id===p.id?updated:u;});});
                        if(setAllUsers) setAllUsers(function(prev){return prev.map(function(u){return u.id===p.id?updated:u;});});
                      });
                    }} style={{padding:'4px 10px',borderRadius:7,border:'none',background:GR,color:'white',cursor:'pointer',fontSize:11,fontWeight:'bold',touchAction:'manipulation'}}>
                      ✓ Freischalten
                    </button>
                  )}
                  <button onClick={function(){
                    if(!confirm(p.name+' wirklich löschen?')) return;
                    sbDel('players','id=eq.'+p.id).then(function(){
                      setPlayers(function(prev){return prev.filter(function(u){return u.id!==p.id;});});
                      if(setAllUsers) setAllUsers(function(prev){return prev.filter(function(u){return u.id!==p.id;});});
                      if(selP&&selP.id===p.id){setSelP(null);setResults([]);}
                    });
                  }} style={{padding:'4px 8px',borderRadius:7,border:'none',background:'#fee2e2',color:RE,cursor:'pointer',fontSize:11,fontWeight:'bold',touchAction:'manipulation'}}>
                    🗑
                  </button>
                </div>
              );
            })}
            {!players.length&&<div style={{color:G400,fontSize:13}}>
            Keine Spieler gefunden.
            <button onClick={function(){
              sbGet('players','is_admin=eq.false&order=is_active.asc,created_at.asc').then(function(rows){
                if(Array.isArray(rows) && rows.length>0 && setAllUsers) setAllUsers(function(prev){
                  var prevAdmins=prev.filter(function(u){return u.is_admin;});
                  return prevAdmins.concat(rows);
                });
                setPlayers(Array.isArray(rows)?rows:[]);
              });
            }} style={{marginLeft:8,fontSize:11,padding:'3px 8px',borderRadius:6,border:'1px solid '+T,background:TL,cursor:'pointer',color:T}}>🔄 Neu laden</button>
          </div>}
          </div>
          {loading&&<div style={{textAlign:'center',color:G400,padding:20}}>Lade…</div>}
          {selP&&!loading&&(
            <div>
              <div style={{background:'linear-gradient(135deg,'+T+','+TD+')',borderRadius:14,padding:'16px 18px',marginBottom:14,color:'white'}}>
                <div style={{fontWeight:'bold',fontSize:16,marginBottom:6}}>{selP.name}</div>
                <div style={{display:'flex',gap:10,flexWrap:'wrap',marginBottom:8}}>
                  {[['Punkte',selP.total_score||0],['Gelernt',learnedW+'/'+totalW],['Fortschritt',overallPct+'%']].map(function(x){

function Leaderboard({ me }) {
  var [rows, setRows] = useState([]);
  var load = useCallback(function() {
    sbGet("players","is_admin=eq.false&order=total_score.desc&limit=20").then(function(d){
      if(Array.isArray(d)) setRows(d.map(function(p,i){
        var acc = p.total_correct+p.total_wrong > 0 ? Math.round(p.total_correct/(p.total_correct+p.total_wrong)*100) : 0;
        return Object.assign({},p,{rank:i+1,acc:acc});
      }));
    });
  }, []);
  useEffect(function(){ load(); var t=setInterval(load,5000); return function(){clearInterval(t);}; }, [load]);
  return (
    <div>
      <h3 style={{color:T,margin:"0 0 12px",fontSize:16}}>🏆 Rangliste</h3>
      {rows.map(function(r,i){
        var medalBg = i===0?"#fbbf24":i===1?"#9ca3af":i===2?"#cd7f32":G200;
        var isCurrent = me && r.id===me.id;
        return (
          <div key={r.id} style={{display:"flex",alignItems:"center",gap:10,padding:"10px 12px",marginBottom:6,background:isCurrent?TL:G50,borderRadius:10,border:"1px solid "+(isCurrent?T:G200)}}>
            <div style={{width:28,height:28,borderRadius:"50%",background:medalBg,display:"flex",alignItems:"center",justifyContent:"center",fontSize:13,fontWeight:"bold",color:"white",flexShrink:0}}>{i+1}</div>
            <div style={{flex:1}}>
              <div style={{fontWeight:"bold",fontSize:13,color:G900}}>{r.name}{isCurrent?" (Du)":""}</div>
              <div style={{fontSize:11,color:G400}}>{r.acc}% korrekt</div>
            </div>
            <div style={{textAlign:"right"}}>
              <div style={{fontSize:18,fontWeight:"bold",color:T}}>{r.total_score||0}</div>
              <div style={{fontSize:10,color:G400}}>Punkte</div>
            </div>
          </div>
        );
      })}
    </div>
  );
}

function Stats({ results, onRemedial, name }) {
  var real = results.filter(function(r){return r.word!=="__done__";});
  var wrong = real.filter(function(r){return !r.correct;});
  var corr = real.filter(function(r){return r.correct;});
  var tc = real.reduce(function(s,r){return s+(r.checkCount||0);},0);
  var mail = encodeURIComponent("Auswertung – "+name+"\n"+new Date().toLocaleDateString("de-DE")+"\n\nRichtig: "+corr.length+"/"+real.length+"\nPrüfen: "+tc+"×\n\n"+(wrong.length?"Falsch:\n"+wrong.map(function(r){return "  "+r.clue+" → "+r.word;}).join("\n")+"\n\n":"Alle richtig! 🎉\n\n")+"Richtig:\n"+corr.map(function(r){return "  "+r.clue+" → "+r.word;}).join("\n"));
  return (
    <div>
      <div style={{display:"flex",gap:8,marginBottom:16}}>
        {[["Richtig",corr.length,GR,"#d1fae5"],["Falsch",wrong.length,RE,"#fee2e2"],["Prüfen",tc+"×",AM,"#fffbeb"]].map(function(x){
          return <div key={x[0]} style={{flex:1,textAlign:"center",padding:"10px 6px",background:x[3],borderRadius:10}}><div style={{fontSize:22,fontWeight:"bold",color:x[2]}}>{x[1]}</div><div style={{fontSize:10,color:G400}}>{x[0]}</div></div>;
        })}
      </div>
      {wrong.length > 0 && (
        <div>
          <div style={{fontWeight:"bold",fontSize:13,color:RE,marginBottom:6}}>❌ Falsch</div>
          {wrong.map(function(r,i){
            return <div key={i} style={{display:"flex",gap:8,padding:"8px 10px",background:"#fef2f2",borderRadius:8,marginBottom:4,fontSize:12,alignItems:"center"}}><span style={{color:G400,minWidth:100,flexShrink:0}}>{r.clue}</span><span style={{color:RE,textDecoration:"line-through"}}>{r.typedAnswer||"—"}</span><span style={{color:"#065f46",fontWeight:"bold",marginLeft:"auto"}}>→ {r.word}</span></div>;
          })}
          <button onClick={function(){onRemedial(wrong);}} style={BtnStyle(AM,"#92400e",{width:"100%",marginTop:12})}>🔁 Nachübungs-Rätsel</button>
        </div>
      )}
      {!wrong.length && <div style={{textAlign:"center",padding:20,background:"#d1fae5",borderRadius:10,color:"#065f46",fontWeight:"bold",marginBottom:12}}>🎉 Alle richtig!</div>}
      <a href={"mailto:?subject=Vokabel-Rätsel – "+name+"&body="+mail} style={Object.assign(BtnStyle(T,"#fff"),{display:"block",textAlign:"center",textDecoration:"none",marginTop:8})}>📬 Per E-Mail</a>
    </div>
  );
}

// ── Login / Register ──────────────────────────────────────────
function LoginScreen({ onLogin, onGoRegister, users }) {
  var [name, setName] = useState("");
  var [pw, setPw] = useState("");
  var [err, setErr] = useState("");
  var [loading, setLoading] = useState(false);

  function doLogin() {
    var n = name.trim();
    if (!n) { setErr("Bitte Namen eingeben"); return; }
    if (!pw) { setErr("Bitte Passwort eingeben"); return; }
    setLoading(true); setErr("");

    // ADMIN SHORTCUT — always works, no Supabase needed
    if (n.toLowerCase() === "admin" && pw === "Magda1982") {
      setLoading(false);
      onLogin({ id: "admin-local", name: "admin", is_admin: true, total_score: 0, total_correct: 0, total_wrong: 0 });
      return;
    }

    var _hash = simpleHash(pw); // synchronous, never hangs

    // Step 1: check in-memory users list (loaded from Supabase on startup)
    var found = null;
    if (Array.isArray(users)) {
      found = users.find(function(u) { return u.name && u.name.toLowerCase() === n.toLowerCase(); });
    }
    if (found) {
      if (found.password_hash !== _hash) { setLoading(false); setErr("Falsches Passwort"); return; }
      if (found.is_active === false) { setLoading(false); setErr("Account noch nicht freigeschalten. Bitte warte auf Admin-Genehmigung."); return; }
      setLoading(false);
      onLogin(found);
      return;
    }

    // Step 2: Supabase GET fallback
    sbGet("players", "name=ilike." + encodeURIComponent(n) + "&select=*").then(function(rows) {
      var sbFound = Array.isArray(rows) && rows.length > 0 ? rows[0] : null;
      if (sbFound) {
        if (sbFound.password_hash !== _hash) { setLoading(false); setErr("Falsches Passwort"); return; }
        if (sbFound.is_active === false) { setLoading(false); setErr("Account noch nicht freigeschalten. Bitte warte auf Admin-Genehmigung."); return; }
        setLoading(false); onLogin(sbFound); return;
      }
      // Step 3: Last resort — check KNOWN_USERS directly (works fully offline)
      var knownFound = KNOWN_USERS.find(function(u){ return u.name.toLowerCase() === n.toLowerCase(); });
      if (knownFound) {
        if (knownFound.password_hash !== _hash) { setLoading(false); setErr("Falsches Passwort"); return; }
        if (knownFound.is_active === false) { setLoading(false); setErr("Account noch nicht freigeschalten."); return; }
        setLoading(false); onLogin(knownFound); return;
      }
      setLoading(false); setErr("Kein Account gefunden. Bitte zuerst registrieren.");
    }).catch(function() {
      // Network completely down — try KNOWN_USERS as last resort
      var knownFound = KNOWN_USERS.find(function(u){ return u.name.toLowerCase() === n.toLowerCase(); });
      if (knownFound) {
        if (knownFound.password_hash !== _hash) { setLoading(false); setErr("Falsches Passwort"); return; }
        setLoading(false); onLogin(knownFound); return;
      }
      setLoading(false); setErr("Verbindungsfehler – bitte nochmal versuchen");
    });
  }

  var INP = {padding:"10px 14px",fontSize:16,border:"2px solid "+T,borderRadius:8,outline:"none",boxSizing:"border-box",width:"100%",marginBottom:8,display:"block"};
  return (
    <div style={{minHeight:"100vh",background:"linear-gradient(135deg,"+T+","+TD+")",display:"flex",alignItems:"center",justifyContent:"center",padding:"16px",fontFamily:"system-ui,sans-serif",boxSizing:"border-box"}}>
      <div style={{background:"white",borderRadius:20,padding:"28px 24px",maxWidth:360,width:"100%",boxShadow:"0 20px 50px rgba(0,0,0,.3)",textAlign:"center"}}>
        <div style={{fontSize:40,marginBottom:6}}>📚</div>
        <h1 style={{fontSize:20,color:T,margin:"0 0 3px"}}>Vokabel-Rätsel</h1>
        <p style={{color:G400,fontSize:13,margin:"0 0 16px"}}>Anmelden</p>
        <input value={name} onChange={function(e){setName(e.target.value);}} placeholder="Name…" style={INP} />
        <input type="password" value={pw} onChange={function(e){setPw(e.target.value);}} placeholder="Passwort…" onKeyDown={function(e){if(e.key==="Enter")doLogin();}} style={INP} />
        {err && <div style={{color:RE,fontSize:12,marginBottom:8,padding:"6px 10px",background:"#fef2f2",borderRadius:6}}>{err}</div>}
        <button onClick={doLogin} disabled={loading} style={BtnStyle(T,"#fff",{width:"100%",fontSize:15,padding:"10px",marginBottom:12,opacity:loading?0.7:1})}>{loading?"…":"Anmelden →"}</button>
        <div style={{borderTop:"1px solid "+G200,paddingTop:12}}>
          <p style={{fontSize:12,color:G400,margin:"0 0 8px"}}>Noch kein Account?</p>
          <button onClick={onGoRegister} style={BtnStyle(G100,T,{width:"100%",fontSize:13,border:"1px solid "+T})}>Neuen Account erstellen</button>
        </div>
      </div>
    </div>
  );
}

function RegisterScreen({ onRegister, onGoLogin, users, onUserAdded }) {
  var [name, setName] = useState("");
  var [pw, setPw] = useState("");
  var [pw2, setPw2] = useState("");
  var [err, setErr] = useState("");
  var [loading, setLoading] = useState(false);
  var [pending, setPending] = useState(false);

  function doReg() {
    var n = name.trim();
    if (!n) { setErr("Bitte Namen eingeben"); return; }
    if (!pw) { setErr("Bitte Passwort eingeben"); return; }
    if (pw !== pw2) { setErr("Passwörter stimmen nicht überein"); return; }
    if (pw.length < 4) { setErr("Passwort mind. 4 Zeichen"); return; }
    setLoading(true); setErr("");

    var _hash = simpleHash(pw);

    // Check in-memory list for name collision
    var alreadyExists = Array.isArray(users) && users.some(function(u) {
      return u.name && u.name.toLowerCase() === n.toLowerCase();
    });
    if (alreadyExists) { setLoading(false); setErr("Name bereits vergeben"); return; }

    sbGet("players", "name=ilike." + encodeURIComponent(n) + "&select=id").then(function(rows) {
      if (Array.isArray(rows) && rows.length > 0) {
        setLoading(false); setErr("Name bereits vergeben"); return;
      }

      // Register with is_active=false — must be approved by admin before login
      var newUser = { name: n, password_hash: _hash, is_admin: false, is_active: false,
        total_score: 0, total_correct: 0, total_wrong: 0, puzzles_completed: 0 };

      sbPost("players", newUser).then(function(res) {
        var created = (res && res.id) ? res : null;
        var finalUser = created
          ? Object.assign({}, created, { is_active: false })
          : Object.assign({ id: "local_" + Date.now() }, newUser);

        // Add to in-memory list (visible in Admin as pending)
        if (onUserAdded) onUserAdded(finalUser);
        setLoading(false);
        // Show pending message — do NOT log in yet
        setErr(""); setName(""); setPw(""); setPw2("");
        setPending(true);
      }).catch(function() {
        // Supabase unavailable — store locally as pending
        var localUser = Object.assign({ id: "local_" + Date.now() }, newUser);
        if (onUserAdded) onUserAdded(localUser);
        setLoading(false);
        setPending(true);
      });
    }).catch(function() {
      var localUser2 = { id: "local_" + Date.now(), name: n, password_hash: _hash,
        is_admin: false, is_active: false, total_score: 0, total_correct: 0, total_wrong: 0 };
      if (onUserAdded) onUserAdded(localUser2);
      setLoading(false);
      setPending(true);
    });
  }

  var INP = {padding:"10px 14px",fontSize:16,border:"2px solid "+T,borderRadius:8,outline:"none",boxSizing:"border-box",width:"100%",marginBottom:8,display:"block"};
  return (
    <div style={{minHeight:"100vh",background:"linear-gradient(135deg,"+T+","+TD+")",display:"flex",alignItems:"center",justifyContent:"center",padding:"16px",fontFamily:"system-ui,sans-serif",boxSizing:"border-box"}}>
      <div style={{background:"white",borderRadius:20,padding:"28px 24px",maxWidth:360,width:"100%",boxShadow:"0 20px 50px rgba(0,0,0,.3)",textAlign:"center"}}>
        <div style={{fontSize:40,marginBottom:6}}>📚</div>
        <h1 style={{fontSize:20,color:T,margin:"0 0 3px"}}>Vokabel-Rätsel</h1>
        <p style={{color:G400,fontSize:13,margin:"0 0 16px"}}>Neuen Account erstellen</p>
        <input value={name} onChange={function(e){setName(e.target.value);}} placeholder="Name…" style={INP} />
        <input type="password" value={pw} onChange={function(e){setPw(e.target.value);}} placeholder="Passwort wählen…" style={INP} />
        <input type="password" value={pw2} onChange={function(e){setPw2(e.target.value);}} placeholder="Passwort bestätigen…" onKeyDown={function(e){if(e.key==="Enter")doReg();}} style={Object.assign({},INP,{border:"2px solid "+AM})} />
        {err && <div style={{color:RE,fontSize:12,marginBottom:8,padding:"6px 10px",background:"#fef2f2",borderRadius:6}}>{err}</div>}
        {pending ? (
          <div style={{background:"#d1fae5",border:"1px solid #6ee7b7",borderRadius:10,padding:"14px 16px",marginBottom:12,textAlign:"center"}}>
            <div style={{fontSize:20,marginBottom:4}}>⏳</div>
            <div style={{fontWeight:"bold",color:"#065f46",fontSize:14}}>Registrierung eingegangen!</div>
            <div style={{color:"#047857",fontSize:12,marginTop:4}}>Der Admin muss deinen Account noch freischalten.<br/>Danach kannst du dich anmelden.</div>
            <button onClick={onGoLogin} style={BtnStyle(T,"#fff",{width:"100%",marginTop:12,fontSize:13})}>Zum Login</button>
          </div>
        ) : (
          <button onClick={doReg} disabled={loading} style={BtnStyle(T,"#fff",{width:"100%",fontSize:15,padding:"10px",marginBottom:12,opacity:loading?0.7:1})}>{loading?"…":"Account erstellen →"}</button>
        )}
        <div style={{borderTop:"1px solid "+G200,paddingTop:12}}>
          <button onClick={onGoLogin} style={BtnStyle(G100,T,{width:"100%",fontSize:13,border:"1px solid "+T})}>Bereits registriert? Zum Login</button>
        </div>
      </div>
    </div>
  );
}

// ── Shell ─────────────────────────────────────────────────────
function Shell({ children, showBack, onBack, title, rightBtn, player }) {
  return (
    <div style={{maxWidth:700,margin:"0 auto",padding:"12px 8px",fontFamily:"system-ui,sans-serif",overflowX:"hidden",WebkitTextSizeAdjust:"100%",MsTextSizeAdjust:"100%"}}>
      <div style={{display:"flex",alignItems:"center",gap:10,marginBottom:14}}>
        {showBack && <button onClick={onBack} style={BtnStyle(G100,G600,{padding:"6px 10px"})}>←</button>}
        <h2 style={{color:T,fontSize:17,margin:0,flex:1}}>{title||"📚 Vokabel-Rätsel"}</h2>
        {rightBtn}
        {player && <div style={{fontSize:12,color:G400,textAlign:"right",lineHeight:1.4}}>{player.name}{player.is_admin?" 👑":""}<br/><strong style={{color:T}}>{player.total_score||0} Pkt</strong></div>}
      </div>
      {children}
    </div>
  );
}


// ── App ───────────────────────────────────────────────────────
function App() {
  var [screen, setScreen] = useState('login');
  var [player, setPlayer] = useState(null);
  var [chapters, setChapters] = useState(BUILTIN);
  // Known users hardcoded — always available without network
  var KNOWN_USERS = [
    { id: "supabase-emma-d46d1397", name: "Emma", password_hash: "fb_63b25a920b81aad7", is_admin: false, is_active: true, total_score: 0, total_correct: 0, total_wrong: 0, puzzles_completed: 0 }
  ];
  var [allUsers, setAllUsers] = useState(KNOWN_USERS);
  var [gradeSettings, setGradeSettings] = useState(null); // loaded from localStorage
  var [lsRun, setLsRun] = useState(null); // active Leiterspiel run
  var [lsCreateMode, setLsCreateMode] = useState(false);
  var [vocab, setVocab] = useState([]);
  var [sessId, setSessId] = useState(null);
  var [tab, setTab] = useState(0);
  var [wordRes, setWordRes] = useState([]);
  var [workoutWords, setWorkoutWords] = useState([]);
  var [workoutProgress, setWorkoutProgress] = useState({});

  // ── Load gradeSettings from localStorage ──
  useEffect(function() {
    try {
      var gs = localStorage.getItem('ls_grade_settings');
      if (gs) setGradeSettings(JSON.parse(gs));
      else setGradeSettings({ testSize:20, grades:[
        {grade:1,maxErrors:1},{grade:2,maxErrors:3},{grade:3,maxErrors:6},
        {grade:4,maxErrors:9},{grade:5,maxErrors:13}
      ]});
    } catch(e) {}
  }, []);

  // ── Viewport: prevent mobile zoom on input focus ──
  useEffect(function() {
    try {
      var meta = document.querySelector('meta[name="viewport"]');
      if (meta) {
        meta.setAttribute('content', 'width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no');
      } else {
        var m = document.createElement('meta');
        m.name = 'viewport';
        m.content = 'width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no';
        document.head.appendChild(m);
      }
    } catch(e) {}
  }, []);

  // ── Load users from Supabase and merge with hardcoded known users ──
  useEffect(function() {
    sbGet('players', 'select=id,name,password_hash,is_admin,is_active,total_score,total_correct,total_wrong,puzzles_completed&order=created_at.asc')
      .then(function(rows) {
        if (Array.isArray(rows) && rows.length > 0) {
          // Merge: Supabase rows take precedence, keep hardcoded users not in Supabase
          var sbNames = new Set(rows.map(function(r){ return r.name.toLowerCase(); }));
          var extraKnown = KNOWN_USERS.filter(function(u){ return !sbNames.has(u.name.toLowerCase()); });
          setAllUsers(rows.concat(extraKnown));
        }
        // If sbGet returns empty (CORS/network fail), KNOWN_USERS are already in state
      });
  }, []);

  // ── Migration: sync local-only users to Supabase on startup ──
  useEffect(function() {
    STORE.listUsers().then(function(localUsers) {
      localUsers.forEach(function(u) {
        if (!u.id || String(u.id).indexOf('local_') !== 0) return; // only local_ ids
        if (!u.passwordHash) return;
        // Check if already in Supabase
        sbGet('players','name=ilike.'+encodeURIComponent(u.name)+'&select=id').then(function(rows) {
          if (Array.isArray(rows) && rows.length > 0) {
            // Already exists in Supabase — update cache with real ID
            STORE.setUser(Object.assign({}, u, { id: rows[0].id }));
          } else {
            // Not in Supabase yet — try to sync
            sbPost('players', { name: u.name, password_hash: u.passwordHash, is_admin: false,
              total_score: u.total_score||0, total_correct: u.total_correct||0,
              total_wrong: u.total_wrong||0, puzzles_completed: 0 })
              .then(function() {
                setTimeout(function() {
                  sbGet('players','name=ilike.'+encodeURIComponent(u.name)+'&select=id').then(function(rows2) {
                    if (Array.isArray(rows2) && rows2.length > 0) {
                      STORE.setUser(Object.assign({}, u, { id: rows2[0].id }));
                    }
                  });
                }, 600);
              });
          }
        });
      });
    });
  }, []);

  useEffect(function() {
    sbGet('chapters','order=created_at.asc').then(function(d){
      if(Array.isArray(d)&&d.length>0){
        var ext=d.filter(function(c){return !c.is_builtin;}).map(function(c){
          var w=c.words, s=c.sentences;
          if(typeof w==='string'){try{w=JSON.parse(w);}catch(e){w=[];}}
          if(typeof s==='string'){try{s=JSON.parse(s);}catch(e){s=[];}}
          return Object.assign({},c,{words:Array.isArray(w)?w:[],sentences:Array.isArray(s)?s:[]});
        });
        if(ext.length) setChapters(BUILTIN.concat(ext));
      }
    });
  },[]);

  var puzzles=useMemo(function(){
    if(!vocab.length) return [];
    var groups=[];for(var i=0;i<vocab.length;i+=20)groups.push(vocab.slice(i,i+20));
    return groups.map(function(words,i){var sol=SOLS[i%SOLS.length];return{words:words,cw:buildCW(words,sol.phrase),sol:sol};});
  },[vocab]);

  function handleLogin(p){setPlayer(p);setScreen(p.is_admin?'admin':'menu');}
  function handleRegister(p){setPlayer(p);setScreen('menu');}
  function logout(){setPlayer(null);setScreen('login');setWordRes([]);setVocab([]);}
  function goScreen(s){setScreen(s);}

  function handleWord(r){
    if(r.word==='__done__') return;
    setWordRes(function(prev){var ex=prev.find(function(x){return x.word===r.word;});return ex?prev.map(function(x){return x.word===r.word?r:x;}):[].concat(prev,[r]);});
    if(player&&player.id&&sessId){
      sbPost('results',{player_id:player.id,session_id:sessId,word:r.word,clue:r.clue,chapter_id:r.chapId||null,correct:r.correct,typed_answer:r.typedAnswer,attempts:1,check_count:r.checkCount});
      var u={total_score:(player.total_score||0)+(r.correct?10:0)};
      if(r.correct)u.total_correct=(player.total_correct||0)+1;else u.total_wrong=(player.total_wrong||0)+1;
      sbPatch('players',u,'id=eq.'+player.id);
      setPlayer(function(p){return Object.assign({},p,u);});
    }
  }

  function startSolo(words){
    setVocab(words);setWordRes([]);setTab(0);
    if(player&&player.id&&player.id!=='admin-local'){
      sbPost('sessions',{image_name:'Auswahl',vocab_list:words,created_by:player.id}).then(function(res){setSessId(res&&res.id?res.id:null);});
    }
    setScreen('puzzles');
  }

  function remedial(wrong){setVocab(wrong);setWordRes([]);setTab(0);setScreen('puzzles');}

  var hasWordRes=wordRes.filter(function(r){return r.word!=='__done__';}).length>0;
  var logoutBtn=<button onClick={logout} style={BtnStyle(G100,G600,{padding:'6px 10px',fontSize:12})}>Abmelden</button>;

  if(screen==='login') return <LoginScreen onLogin={handleLogin} onGoRegister={function(){setScreen('register');}} users={allUsers}/>;
  if(screen==='register') return <RegisterScreen onRegister={handleRegister} onGoLogin={function(){setScreen('login');}} users={allUsers} onUserAdded={function(u){setAllUsers(function(prev){return prev.concat([u]);}); }}/>;

  if(screen==='admin') return(
    <Shell showBack={false} onBack={function(){}} title='👑 Admin' rightBtn={logoutBtn} player={player}>
      <AdminDash chapters={chapters} setChapters={setChapters} allUsers={allUsers} setAllUsers={setAllUsers} player={player} gradeSettings={gradeSettings}/>
    </Shell>
  );

  if(screen==='quizSolo') return(
    <Shell showBack={true} onBack={function(){goScreen('menu');}} title='🧩 Quiz Solo' player={player}>
      <QuizSolo chapters={chapters} onDone={function(){goScreen('menu');}}/>
    </Shell>
  );
  if(screen==='quizDuel') return(
    <Shell showBack={true} onBack={function(){goScreen('menu');}} title='⚔️ Quiz Duell' player={player}>
      <QuizDuel chapters={chapters} player={player} onDone={function(){goScreen('menu');}}/>
    </Shell>
  );

  // Vocabulary trainer — select chapter first
  if(screen==='vocabSelect') return(
    <Shell showBack={true} onBack={function(){goScreen('menu');}} title='✍️ Vokabeln lernen' player={player}>
      <WordSelector chapters={chapters} onStart={function(words){setVocab(words);goScreen('vocabTrain');}} mode='vocab'/>
    </Shell>
  );
  if(screen==='vocabTrain'&&vocab.length) return(
    <Shell showBack={true} onBack={function(){goScreen('vocabSelect');}} title='✍️ Vokabeltrainer' player={player}>
      <VokabelTrainer words={vocab} player={player} onDone={function(){goScreen('menu');}} title='Vokabeltrainer'/>
    </Shell>
  );

  // Workout
  if(screen==='workout') return(
    <Shell showBack={true} onBack={function(){goScreen('menu');}} title='🏋️ Workout' player={player}>
      <WorkoutSetup chapters={chapters} player={player} onStart={function(words,prog){setWorkoutWords(words);setWorkoutProgress(prog);goScreen('workoutSession');}}/>
    </Shell>
  );
  if(screen==='workoutSession'&&workoutWords.length) return(
    <Shell showBack={true} onBack={function(){goScreen('workout');}} title='🏋️ Workout' player={player}>
      <WorkoutSession words={workoutWords} player={player} progressMap={workoutProgress} onDone={function(){goScreen('menu');}}/>
    </Shell>
  );

  // Sentence learner
  if(screen==='sentences') return(
    <Shell showBack={true} onBack={function(){goScreen('menu');}} title='💬 Sätze lernen' player={player}>
      <SentenceLearner chapters={chapters} player={player} onDone={function(){goScreen('menu');}}/>
    </Shell>
  );

  // Progress stats
  if(screen==='progress') return(
    <Shell showBack={true} onBack={function(){goScreen('menu');}} title='📈 Mein Fortschritt' player={player}>
      <ProgressStats chapters={chapters} player={player}/>
    </Shell>
  );

  if(screen==='leiterspiel') {
    if (lsCreateMode) return (
      <Shell showBack={true} onBack={function(){setLsCreateMode(false);}} title='🎯 Neuer Lauf' player={player}>
        <LeitersSpielCreate player={player} chapters={chapters} isAdmin={false}
          onCreated={function(run){setLsRun(run);setLsCreateMode(false);}}
          onBack={function(){setLsCreateMode(false);}}/>
      </Shell>
    );
    if (lsRun) return (
      <Shell showBack={true} onBack={function(){setLsRun(null);}} title={'🎯 '+lsRun.name} player={player}>
        <LeitersSpielSession run={lsRun} player={player} gradeSettings={gradeSettings} onBack={function(){setLsRun(null);}}/>
      </Shell>
    );
    return (
      <Shell showBack={true} onBack={function(){goScreen('menu');}} title='🎯 Leiterspiel' player={player}>
        <LeitersSpielMenu player={player} chapters={chapters}
          onStart={function(run){setLsRun(run);}}
          onCreateOwn={function(){setLsCreateMode(true);}}
          onBack={function(){goScreen('menu');}}/>
      </Shell>
    );
  }

  if(screen==='menu') return(
    <Shell showBack={false} onBack={function(){}} rightBtn={logoutBtn} player={player}>
      <p style={{textAlign:'center',color:G400,fontSize:13,margin:'0 0 16px'}}>Willkommen, <strong style={{color:T}}>{player&&player.name}</strong>!</p>
      <div style={{display:'grid',gridTemplateColumns:'1fr 1fr',gap:9}}>
        {[
          {icon:'✍️',label:'Vokabeltrainer',sub:'Tippe die Übersetzung',screen:'vocabSelect'},
          {icon:'🏋️',label:'Workout',sub:'Gewichtet nach Fortschritt',screen:'workout',new2:true},
          {icon:'✏️',label:'Kreuzworträtsel',sub:'Kapitel wählen & lösen',screen:'selectSolo'},
          {icon:'🧩',label:'Quiz Solo',sub:'6 Runden · 4 Antworten',screen:'quizSolo'},
          {icon:'⚔️',label:'Quiz Duell',sub:'Rundenbasiert gegen andere',screen:'quizDuel'},
          {icon:'💬',label:'Sätze lernen',sub:'Fett gedruckte Sätze',screen:'sentences',new2:true},
          {icon:'📈',label:'Mein Fortschritt',sub:'Grün · Gelb · Rot',screen:'progress',new2:true},
          {icon:'🏆',label:'Rangliste',sub:'Punkte & Vergleich',screen:'leaderboard'},
          {icon:'📊',label:'Auswertung',sub:'Fehler & Nachübung',screen:'stats',dis:!hasWordRes},
          {icon:'📖',label:'Alle Kapitel',sub:'Vokabeln & Sätze',screen:'browse'},
          {icon:'🎯',label:'Leiterspiel',sub:'4 Töpfe · Fortschritt sichern',screen:'leiterspiel',highlight:true},
        ].map(function(item){
          return(
            <button key={item.label} onClick={function(){if(!item.dis)goScreen(item.screen);}} disabled={item.dis}
              style={{padding:'13px 10px',background:item.dis?G50:item.highlight?'#0f766e15':'white',border:'2px solid '+(item.dis?G200:item.highlight?T:T),borderRadius:10,cursor:item.dis?'not-allowed':'pointer',textAlign:'left',opacity:item.dis?0.5:1,position:'relative'}}>
              <div style={{fontSize:20,marginBottom:2}}>{item.icon}</div>
              <div style={{fontWeight:'bold',fontSize:12,color:T}}>{item.label}</div>
              <div style={{fontSize:10,color:G400,marginTop:1,lineHeight:1.3}}>{item.sub}</div>
              {item.new2&&<span style={{position:'absolute',top:6,right:6,background:AM,color:'white',fontSize:8,padding:'1px 5px',borderRadius:8,fontWeight:'bold'}}>NEU</span>}
            </button>
          );
        })}
      </div>
    </Shell>
  );

  if(screen==='browse') return(
    <Shell showBack={true} onBack={function(){goScreen('menu');}} title='📖 Alle Kapitel' player={player}>
      {chapters.map(function(ch){return <BrowseChapter key={ch.id} ch={ch}/>;} )}
    </Shell>
  );
  if(screen==='selectSolo') return(
    <Shell showBack={true} onBack={function(){goScreen('menu');}} title='✏️ Vokabeln auswählen' player={player}>
      <WordSelector chapters={chapters} onStart={startSolo} mode='solo'/>
    </Shell>
  );
  if(screen==='puzzles'&&puzzles.length) return(
    <Shell showBack={true} onBack={function(){goScreen('menu');}} title='📚 Rätsel' player={player}>
      <div style={{display:'flex',gap:4,justifyContent:'center',flexWrap:'wrap',marginBottom:10}}>
        {puzzles.map(function(_,i){return <button key={i} onClick={function(){setTab(i);}} style={{padding:'4px 12px',borderRadius:20,fontSize:12,fontWeight:'bold',background:tab===i?T:G100,color:tab===i?'white':G600,border:'2px solid '+(tab===i?T:G200),cursor:'pointer'}}>Rätsel {i+1}</button>;})}
        <button onClick={function(){goScreen('stats');}} style={{padding:'4px 12px',borderRadius:20,fontSize:12,fontWeight:'bold',background:AM,color:'white',border:'none',cursor:'pointer'}}>📊</button>
      </div>
      <div style={{background:TL,border:'1px solid #a7f3d0',borderRadius:8,padding:'7px 12px',marginBottom:10,fontSize:12,display:'flex',justifyContent:'space-between'}}>
        <span><strong style={{color:T}}>Rätsel {tab+1}</strong><span style={{color:G400,marginLeft:8}}>({puzzles[tab].cw.placed.length}/{puzzles[tab].cw.total} Wörter)</span></span>
        {wordRes.filter(function(r){return r.word!=='__done__';}).length>0&&<span><span style={{color:GR}}>✓ {wordRes.filter(function(r){return r.correct;}).length}</span> <span style={{color:RE}}>✗ {wordRes.filter(function(r){return !r.correct&&r.word!=='__done__';}).length}</span></span>}
      </div>
      <Puzzle key={'p_'+tab+'_'+vocab.length} data={puzzles[tab].cw} solPhrase={puzzles[tab].sol.phrase} solMsg={puzzles[tab].sol.msg} onWord={handleWord} chapId={vocab[0]&&vocab[0].chapterId}/>
    </Shell>
  );
  if(screen==='leaderboard') return(<Shell showBack={true} onBack={function(){goScreen('menu');}} title='🏆 Rangliste' player={player}><Leaderboard me={player}/></Shell>);
  if(screen==='stats') return(
    <Shell showBack={true} onBack={function(){goScreen('menu');}} title='📊 Auswertung' player={player}>
      {!hasWordRes?<div style={{textAlign:'center',color:G400,padding:30}}>Noch keine Ergebnisse.</div>:<Stats results={wordRes} onRemedial={remedial} name={player&&player.name||''}/>}
    </Shell>
  );
  return <div style={{textAlign:'center',padding:40,color:G400}}>Lade…</div>;
}


ReactDOM.createRoot(document.getElementById("root")).render(React.createElement(App));
  </script>
</body>
</html>
